  arrows: e.arrows,
  width: e.width,
  font: {{ size: 10, color: '#7f8c8d', align: 'middle', background: 'rgba(255,255,255,0.8)', strokeWidth: 0 }},
  smooth: {{ type: 'cubicBezier', forceDirection: 'vertical', roundness: 0.4 }}
}})));

let hierarchical = true;
let physics = false;

const options = {{
  layout: {{
    hierarchical: {{
      enabled: hierarchical,
      direction: 'UD',
      sortMethod: 'directed',
      levelSeparation: 140,
      nodeSpacing: 180,
      treeSpacing: 240,
      blockShifting: true,
      edgeMinimization: true,
      parentCentralization: true
    }}
  }},
  physics: {{
    enabled: physics,
    hierarchicalRepulsion: {{
      centralGravity: 0.0,
      springLength: 140,
      springConstant: 0.01,
      nodeDistance: 160,
      damping: 0.09
    }},
    solver: 'hierarchicalRepulsion'
  }},
  interaction: {{
    hover: true,
    tooltipDelay: 200,
    dragNodes: true,
    dragView: true,
    zoomView: true
  }}
}};

const network = new vis.Network(container, {{ nodes, edges }}, options);

function fitNetwork() {{ network.fit({{ animation: {{ duration: 500, easingFunction: 'easeInOutQuad' }} }}); }}
function togglePhysics() {{
  physics = !physics;
  network.setOptions({{ physics: {{ enabled: physics }} }});
}}
function toggleHierarchical() {{
  hierarchical = !hierarchical;
  network.setOptions({{ layout: {{ hierarchical: {{ enabled: hierarchical }} }} }});
}}

// tooltip on hover
network.on("hoverNode", function (params) {{
  const node = nodes.get(params.node);
  const tooltip = document.getElementById('tooltip');
  tooltip.innerHTML = node.title;
  tooltip.style.display = 'block';
}});
network.on("blurNode", function () {{
  document.getElementById('tooltip').style.display = 'none';
}});

// fit once loaded
network.once("afterDrawing", fitNetwork);
</script>

</body>
</html>
