ed\", \"specific_judgment\": \"驳回腾某科技公司的诉讼请求。\", \"reasoning\": \"一审法院认为，基于现有证据，可以认定证据1所涉对比技术1的公开日早于本专利申请日，可以作为现有技术，本专利不具备创造性，故维持被诉决定。\", \"case_number\": \"(2017)京73行初7256号\", \"cost_allocation\": \"\"}, {\"result_type\": \"dismissed\", \"specific_judgment\": \"驳回上诉，维持原判。\", \"reasoning\": \"法院认为，百某网讯科技公司提交的软件安装包数字签名、网页快照及其他公开信息可相互印证，证明该软件于2009年8月20日已公开使用；腾某科技公司作为软件开发者有能力提供反证而未提供，应承担不利后果。因此，可以认定该软件在本专利申请日前已为公众所知，构成现有技术，本专利权利要求不具备创造性。一审判决认定事实清楚，适用法律正确，应予维持。\", \"case_number\": \"(2020)最高法知行终205号\", \"cost_allocation\": \"\"}], \"case_summary\": {\"key_facts\": \"本专利系一种支持图片输入的方法和设备的发明专利，申请日为2009年9月10日，专利权人为腾某科技公司。无效请求人百某网讯科技公司提交证据，证明腾某科技公司于2009年8月20日已通过官网公开了具有相关功能的拼音输入法软件。国家知识产权局据此宣告专利权全部无效。腾某科技公司不服，提起行政诉讼，一审法院驳回其诉讼请求，腾某科技公司上诉。\", \"disputed_issues\": \"证据1所涉下载软件能否作为腾某科技公司使用公开的现有技术，以及如何确定其所公开的技术内容。\", \"conclusion\": \"最高人民法院终审认为，在案证据可以相互印证且专利权人未提供反证的情况下，应当认定该软件在2009年8月20日已公开，可作为现有技术；本专利相对于该现有技术与公知常识的结合不具备创造性，故驳回上诉，维持原判。\", \"amount_involved\": \"\", \"guiding_points\": \"\", \"claim_amount\": \"\", \"judgment_amount\": \"\"}, \"legal_provision_elements\": [{\"provision_index\": 0, \"statute\": \"中华人民共和国专利法\", \"article\": \"22\", \"element_type\": \"act_element\", \"content\": \"技术内容在专利申请日以前为公众所知。\", \"applicable_fact_pattern\": \"软件在专利申请日前已通过官网下载或其他方式为不特定公众所知悉。\"}, {\"provision_index\": 0, \"statute\": \"中华人民共和国专利法\", \"article\": \"22\", \"element_type\": \"legal_consequence\", \"content\": \"该技术内容构成现有技术，不能授予专利权。\", \"applicable_fact_pattern\": \"任何在申请日前已公开的技术方案，在专利审查中应被视为现有技术，用于评价新颖性和创造性。\"}]}, \"eval\": {\"row_id\": \"496\", \"score\": 95.0, \"issues\": [\"guiding_case_number 为空\", \"judges 为空\", \"attorneys 为空\", \"trial_organizations 为空\"], \"court_case_count\": 2, \"judge_count\": 0, \"attorney_count\": 0, \"provision_count\": 1, \"evidence_count\": 2}}", "4017__v1": "{\"row_id\": \"4017\", \"input\": {\"id\": \"4017\", \"web_name\": \"人民法院案例库\", \"case_type\": \"行政-行政赔偿\", \"storage_no\": \"2023-12-3-020-004\"}, \"output\": {\"guiding_case\": {\"guiding_case_number\": \"\", \"guiding_case_name\": \"徐某等4人诉杭州市上城区人民政府行政强制及行政赔偿案\", \"publication_date\": \"2018-06-13\", \"binding_force\": \"persuasive\", \"guiding_points\": \"街道办事处在有关人民政府未进行委托的情况下，其以自己的名义单独作出相应的行政行为，街道办事处是适格被告并独立承担法律责任，而不宜以相应的人民政府为被告。街道办事处作为房屋征收实施单位在委托范围内所从事的行为，由委托人房屋征收部门承担其后果，由此引发的诉讼，亦由房屋征收部门作为适格被告并承担相应责任。街道办事处超出房屋征收部门委托范围，违法以拆除危房名义实施的房屋拆除行为，应当由其自己承担法律责任。\", \"key_words\": [\"行政诉讼\", \"行政赔偿\", \"强制拆除房屋\", \"起诉条件\", \"适格被告\"], \"case_level\": \"typical_case\", \"trial_procedure\": \"再审\", \"storage_no\": \"2023-12-3-020-004\", \"source_url\": \"https://rmfyalk.court.gov.cn\", \"judgment_mean\": \"\"}, \"case_type\": {\"category\": \"administrative\", \"level1\": \"行政\", \"level2\": \"行政赔偿\"}, \"court_cases\": [{\"case_number\": \"(2017)浙01行初260号\", \"filing_date\": \"2017-01-01\", \"judgment_date\": \"2017-10-11\", \"trial_level\": \"first_instance\", \"trial_procedure\": \"一审\", \"court\": {\"name\": \"浙江省杭州市中级人民法院\", \"court_level\": \"intermediate\"}, \"status\": \"appealed\", \"cause_of_action\": \"行政赔偿（强制拆除房屋及赔偿）\", \"dispute_resolution_type\": \"litigation\", \"party_count\": null}, {\"case_number\": \"(2017)浙行终1470号\", \"filing_date\": \"2017-11-01\", \"judgment_date\": \"2017-12-27\", \"trial_level\": \"second_instance\", \"trial_procedure\": \"二审\", \"court\": {\"name\": \"浙江省高级人民法院\", \"court_level\": \"high\"}, \"status\": \"effective\", \"cause_of_action\": \"行政赔偿（强制拆除房屋及赔偿）\", \"dispute_resolution_type\": \"litigation\", \"party_count\": null}, {\"case_number\": \"(2018)最高法行申1954号\", \"filing_date\": \"2018-01-01\", \"judgment_date\": \"2018-06-13\", \"trial_level\": \"retrial\", \"trial_procedure\": \"再审\", \"court\": {\"name\": \"最高人民法院\", \"court_level\": \"supreme\"}, \"status\": \"judged\", \"cause_of_action\": \"行政赔偿（强制拆除房屋及赔偿）\", \"dispute_resolution_type\": \"litigation\", \"party_count\": null}], \"legal_subjects\": [{\"name\": \"陆某娣\", \"subject_type\": \"natural_person\", \"org_type\": null, \"credit_code\": null, \"roles\": [{\"role_code\": \"plaintiff\", \"role_name\": \"原告\", \"case_number\": \"(2017)浙01行初260号\"}, {\"role_code\": \"appellant\", \"role_name\": \"上诉人\", \"case_number\": \"(2017)浙行终1470号\"}, {\"role_code\": \"retrial_applicant\", \"role_name\": \"再审申请人\", \"case_number\": \"(2018)最高法行申1954号\"}]}, {\"name\": \"姚某程\", \"subject_type\": \"natural_person\", \"org_type\": null, \"credit_code\": null, \"roles\": [{\"role_code\": \"plaintiff\", \"role_name\": \"原告\", \"case_number\": \"(2017)浙01行初260号\"}, {\"role_code\": \"appellant\", \"role_name\": \"上诉人\", \"case_number\": \"(2017)浙行终1470号\"}, {\"role_code\": \"retrial_applicant\", \"role_name\": \"再审申请人\", \"case_number\": \"(2018)最高法行申1954号\"}]}, {\"name\": \"徐某\", \"subject_type\": \"natural_person\", \"org_type\": null, \"credit_code\": null, \"roles\": [{\"role_code\": \"plaintiff\", \"role_name\": \"原告\", \"case_number\": \"(2017)浙01行初260号\"}, {\"role_code\": \"appellant\", \"role_name\": \"上诉人\", \"case_number\": \"(2017)浙行终1470号\"}, {\"role_code\": \"retrial_applicant\", \"role_name\": \"再审申请人\", \"case_number\": \"(2018)最高法行申1954号\"}]}, {\"name\": \"徐某\", \"subject_type\": \"natural_person\", \"org_type\": null, \"credit_code\": null, \"roles\": [{\"role_code\": \"plaintiff\", \"role_name\": \"原告\", \"case_number\": \"(2017)浙01行初260号\"}, {\"role_code\": \"appellant\", \"role_name\": \"上诉人\", \"case_number\": \"(2017)浙行终1470号\"}, {\"role_code\": \"retrial_applicant\", \"role_name\": \"再审申请人\", \"case_number\": \"(2018)最高法行申1954号\"}]}, {\"name\": \"杭州市上城区人民政府\", \"subject_type\": \"organization\", \"org_type\": \"government_agency\", \"credit_code\": null, \"roles\": [{\"role_code\": \"defendant\", \"role_name\": \"被告\", \"case_number\": \"(2017)浙01行初260号\"}, {\"role_code\": \"appellee\", \"role_name\": \"被上诉人\", \"case_number\": \"(2017)浙行终1470号\"}, {\"role_code\": \"retrial_respondent\", \"role_name\": \"再审被申请人\", \"case_number\": \"(2018)最高法行申1954号\"}]}], \"attorneys\": [], \"judges\": [], \"prosecutors\": [], \"trial_organizations\": [], \"legal_provisions\": [{\"case_number\": \"(2018)最高法行申1954号\", \"statute\": \"中华人民共和国地方各级人民代表大会和地方各级人民政府组织法\", \"article\": \"68\", \"paragraph\": \"\", \"item\": \"\", \"content\": \"省、自治区人民政府可以设立行署，县、自治县的人民政府可以设立区公所，市辖区、不设区的市的人民政府可以设立街道办事处，分别作为同级人民政府的派出机关。\", \"citation_position\": \"judgment_reason\", \"citation_purpose\": \"说理依据\"}, {\"case_number\": \"(2018)最高法行申1954号\", \"statute\": \"中华人民共和国行政诉讼法\", \"article\": \"26\", \"paragraph\": \"1\", \"item\": \"\", \"content\": \"公民、法人或者其他组织直接向人民法院提起诉讼的，作出行政行为的行政机关是被告。\", \"citation_position\": \"judgment_reason\", \"citation_purpose\": \"说理依据\"}, {\"case_number\": \"(2018)最高法行申1954号\", \"statute\": \"中华人民共和国行政诉讼法\", \"article\": \"26\", \"paragraph\": \"5\", \"item\": \"\", \"content\": \"行政机关委托的组织所作的行政行为，委托的行政机关是被告。\", \"citation_position\": \"related_info\", \"citation_purpose\": \"适用依据\"}, {\"case_number\": \"(2018)最高法行申1954号\", \"statute\": \"最高人民法院关于适用《中华人民共和国行政诉讼法》的解释\", \"article\": \"20\", \"paragraph\": \"1\", \"item\": \"\", \"content\": \"行政机关组建并赋予行政管理职能但不具有独立承担法律责任能力的机构，以自己的名义作出行政行为，当事人不服提起诉讼的，应当以组建该机构的行政机关为被告。\", \"citation_position\": \"judgment_reason\", \"citation_purpose\": \"说理依据\"}, {\"case_number\": \"(2018)最高法行申1954号\", \"statute\": \"最高人民法院关于适用《中华人民共和国行政诉讼法》的解释\", \"article\": \"20\", \"paragraph\": \"2\", \"item\": \"\", \"content\": \"法律、法规或者规章授权行使行政职权的行政机关内设机构、派出机构或者其他组织，超出法定授权范围实施行政行为，当事人不服提起诉讼的，应当以实施该行为的机构或者组织为被告。\", \"citation_position\": \"judgment_reason\", \"citation_purpose\": \"说理依据\"}, {\"case_number\": \"(2018)最高法行申1954号\", \"statute\": \"国有土地上房屋征收与补偿条例\", \"article\": \"4\", \"paragraph\": \"\", \"item\": \"\", \"content\": \"市、县级人民政府负责本行政区域的房屋征收与补偿工作。市、县级人民政府确定的房屋征收部门组织实施本行政区域的房屋征收与补偿工作。\", \"citation_position\": \"judgment_reason\", \"citation_purpose\": \"说理依据\"}, {\"case_number\": \"(2018)最高法行申1954号\", \"statute\": \"国有土地上房屋征收与补偿条例\", \"article\": \"5\", \"paragraph\": \"\", \"item\": \"\", \"content\": \"房屋征收部门可以委托房屋征收实施单位，承担房屋征收与补偿的具体工作。房屋征收部门对房屋征收实施单位在委托范围内实施的房屋征收与补偿行为负责监督，并对其行为后果承担法律责任。\", \"citation_position\": \"judgment_reason\", \"citation_purpose\": \"说理依据\"}, {\"case_number\": \"(2018)最高法行申1954号\", \"statute\": \"最高人民法院关于适用《中华人民共和国行政诉讼法》的解释\", \"article\": \"25\", \"paragraph\": \"\", \"item\": \"\", \"content\": \"市、县级人民政府确定的房屋征收部门组织实施房屋征收与补偿工作过程中作出行政行为，被征收人不服提起诉讼的，以房屋征收部门为被告。征收实施单位受房屋征收部门委托，在委托范围内从事的行为，被征收人不服提起诉讼的，应当以房屋征收部门为被告。\", \"citation_position\": \"judgment_reason\", \"citation_purpose\": \"说理依据\"}], \"evidence\": [], \"judgment_results\": [{\"result_type\": \"dismissed\", \"specific_judgment\": \"驳回起诉\", \"reasoning\": \"法院认为涉案强制拆除行为系紫阳街道办事处以其名义实施，上城区政府并非适格被告，经释明原告拒绝变更被告，故裁定驳回起诉。\", \"case_number\": \"(2017)浙01行初260号\", \"cost_allocation\": \"\"}, {\"result_type\": \"dismissed\", \"specific_judgment\": \"驳回上诉，维持一审裁定\", \"reasoning\": \"二审法院认为一审裁定认定事实清楚，适用法律正确，上诉理由不能成立，故驳回上诉。\", \"case_number\": \"(2017)浙行终1470号\", \"cost_allocation\": \"\"}, {\"result_type\": \"dismissed\", \"specific_judgment\": \"驳回再审申请\", \"reasoning\": \"最高人民法院认为，街道办事处作为派出机关可以独立作出行政行为并承担责任，紫阳街道办事处超出委托范围以拆危名义实施拆除，应由其自己承担法律责任，再审申请人坚持以区级政府为被告，拒绝变更，故再审申请不符合法律规定。\", \"case_number\": \"(2018)最高法行申1954号\", \"cost_allocation\": \"\"}], \"case_summary\": {\"key_facts\": \"徐某等4人的房屋位于杭州地铁5号线一期工程征收红线内，2015年12月29日，紫阳街道办事处以拆除危房名义拆除涉案房屋部分屋顶及墙体。徐某等4人以上城区政府为被告提起行政赔偿诉讼，一审、二审裁定驳回起诉，再审申请亦被驳回。\", \"disputed_issues\": \"街道办事处实施强制拆除行为时，如何确定适格被告？上城区政府是否应为本案被告？\", \"conclusion\": \"法院认为街道办事处系独立行政主体，其超出房屋征收部门委托范围独立实施的拆除行为应由自己承担责任，经释明后原告坚持起诉区级政府被告不适格，故驳回起诉。\", \"amount_involved\": \"约1419.73万元\", \"guiding_points\": \"\", \"claim_amount\": \"1419.73万元\", \"judgment_amount\": \"\"}, \"legal_provision_elements\": [{\"provision_index\": 0, \"statute\": \"中华人民共和国地方各级人民代表大会和地方各级人民政府组织法\", \"article\": \"68\", \"element_type\": \"subject_element\", \"content\": \"街道办事处为市辖区、不设区的市的人民政府派出的机关，是独立的行政主体。\", \"applicable_fact_pattern\": \"涉案行政行为由街道办事处以自己的名义作出。\"}, {\"provision_index\": 1, \"statute\": \"中华人民共和国行政诉讼法\", \"article\": \"26\", \"element_type\": \"act_element\", \"content\": \"直接提起诉讼的，以作出行政行为的行政机关为被告。\", \"applicable_fact_pattern\": \"街道办事处自行作出拆除决定并实施。\"}, {\"provision_index\": 2, \"statute\": \"中华人民共和国行政诉讼法\", \"article\": \"26\", \"element_type\": \"act_element\", \"content\": \"委托行政时，以委托的行政机关为被告。\", \"applicable_fact_pattern\": \"无证据证明街道办事处受政府委托行为。\"}, {\"provision_index\": 3, \"statute\": \"最高人民法院关于适用《中华人民共和国行政诉讼法》的解释\", \"article\": \"20\", \"element_type\": \"subject_element\", \"content\": \"内设机构、派出机构或其他组织超出法定授权范围实施行政行为，以该机构或组织为被告。\", \"applicable_fact_pattern\": \"街道办事处超出征收部门委托范围，以拆危名义独立实施拆除。\"}, {\"provision_index\": 5, \"statute\": \"国有土地上房屋征收与补偿条例\", \"article\": \"4\", \"element_type\": \"subject_element\", \"content\": \"市、县级人民政府确定的房屋征收部门组织实施征收与补偿工作。\", \"applicable_fact_pattern\": \"街道办事处非征收部门，仅可能为受委托实施单位。\"}, {\"provision_index\": 6, \"statute\": \"国有土地上房屋征收与补偿条例\", \"article\": \"5\", \"element_type\": \"legal_consequence\", \"content\": \"房屋征收部门对委托范围内实施单位的行为后果承担法律责任。\", \"applicable_fact_pattern\": \"若街道办事处受委托，则房屋征收部门为责任主体。\"}]}, \"eval\": {\"row_id\": \"4017\", \"score\": 93.0, \"issues\": [\"guiding_case_number 为空\", \"judges 为空\", \"attorneys 为空\", \"trial_organizations 为空\", \"evidence 为空\"], \"court_case_count\": 3, \"judge_count\": 0, \"attorney_count\": 0, \"provision_count\": 8, \"evidence_count\": 0}}", "4017__v2": "{\"row_id\": \"4017\", \"input\": {\"id\": \"4017\", \"web_name\": \"人民法院案例库\", \"case_type\": \"行政-行政赔偿\", \"storage_no\": \"2023-12-3-020-004\"}, \"output\": {\"guiding_case\": {\"guiding_case_number\": \"\", \"guiding_case_name\": \"徐某等4人诉杭州市上城区人民政府行政赔偿案\", \"publication_date\": \"2018-06-13\", \"binding_force\": \"persuasive\", \"guiding_points\": \"街道办事处在有关人民政府未进行委托的情况下，其以自己的名义单独作出相应的行政行为，街道办事处是适格被告并独立承担法律责任，而不宜以相应的人民政府为被告。街道办事处作为房屋征收实施单位在委托范围内所从事的行为，由委托人房屋征收部门承担其后果，由此引发的诉讼，亦由房屋征收部门作为适格被告并承担相应责任。街道办事处超出房屋征收部门委托范围，违法以拆除危房名义实施的房屋拆除行为，应当由其自己承担法律责任。\", \"key_words\": [\"行政诉讼\", \"行政赔偿\", \"强制拆除房屋\", \"起诉条件\", \"适格被告\"], \"case_level\": \"typical_case\", \"trial_procedure\": \"再审\ : \"20\", \"paragraph\": \"1\", \"item\": \"\", \"content\": \"行政机关组建并赋予行政管理职能但不具有独立承担法律责任能力的机构，以自己的名义作出行政行为，当事人不服提起诉讼的，应当以组建该机构的行政机关为被告。\", \"citation_position\": \"judgment_reason\", \"citation_purpose\": \"说理依据\"}, {\"case_number\": \"(2018)最高法行申1954号\", \"statute\": \"国有土地上房屋征收与补偿条例\", \"article\": \"4\", \"paragraph\": \"\", \"item\": \"\", \"content\": \"市、县级人民政府负责本行政区域的房屋征收与补偿工作。市、县级人民政府确定的房屋征收部门组织实施本行政区域的房屋征收与补偿工作。\", \"citation_position\": \"judgment_reason\", \"citation_purpose\": \"说理依据\"}, {\"case_number\": \"(2018)最高法行申1954号\", \"statute\": \"国有土地上房屋征收与补偿条例\", \"article\": \"5\", \"paragraph\": \"\", \"item\": \"\", \"content\": \"房屋征收部门可以委托房屋征收实施单位，承担房屋征收与补偿的具体工作。房屋征收部门对房屋征收实施单位在委托范围内实施的房屋征收与补偿行为负责监督，并对其行为后果承担法律责任。\", \"citation_position\": \"judgment_reason\", \"citation_purpose\": \"说理依据\"}, {\"case_number\": \"(2018)最高法行申1954号\", \"statute\": \"最高人民法院关于适用〈中华人民共和国行政诉讼法〉的解释\", \"article\": \"25\", \"paragraph\": \"\", \"item\": \"\", \"content\": \"市、县级人民政府确定的房屋征收部门组织实施房屋征收与补偿工作过程中作出行政行为，被征收人不服提起诉讼的，以房屋征收部门为被告。征收实施单位受房屋征收部门委托，在委托范围内从事的行为，被征收人不服提起诉讼的，应当以房屋征收部门为被告。\", \"citation_position\": \"judgment_reason\", \"citation_purpose\": \"说理依据\"}, {\"case_number\": \"(2018)最高法行申1954号\", \"statute\": \"最高人民法院关于适用〈中华人民共和国行政诉讼法〉的解释\", \"article\": \"20\", \"paragraph\": \"2\", \"item\": \"\", \"content\": \"法律、法规或者规章授权行使行政职权的行政机关内设机构、派出机构或者其他组织，超出法定授权范围实施行政行为，当事人不服提起诉讼的，应当以实施该行为的机构或者组织为被告。\", \"citation_position\": \"judgment_reason\", \"citation_purpose\": \"说理依据\"}], \"evidence\": [], \"judgment_results\": [{\"result_type\": \"dismissed\", \"specific_judgment\": \"驳回徐某等4人的起诉。\", \"reasoning\": \"被告不适格，经法庭释明后原告拒绝变更被告，不符合法定起诉条件，裁定驳回起诉。\", \"case_number\": \"(2017)浙01行初260号\", \"cost_allocation\": \"\"}, {\"result_type\": \"dismissed\", \"specific_judgment\": \"驳回上诉，维持一审裁定。\", \"reasoning\": \"一审裁定认定事实清楚，适用法律正确，应予维持。\", \"case_number\": \"(2017)浙行终1470号\", \"cost_allocation\": \"\"}, {\"result_type\": \"dismissed\", \"specific_judgment\": \"驳回再审申请人徐某等4人的再审申请。\", \"reasoning\": \"街道办事处作为派出机关，具有独立被告资格；涉案强制拆除系紫阳街道办事处以拆除危房名义独立实施，并非受房屋征收部门委托，故应由办事处自行承担责任；再审申请人坚持以区政府为被告，经一审释明后拒绝变更，不符合法定起诉条件，原审裁定驳回起诉并无不当。\", \"case_number\": \"(2018)最高法行申1954号\", \"cost_allocation\": \"\"}], \"case_summary\": {\"key_facts\": \"徐某等4人的房屋被纳入杭州地铁征收红线，2015年12月29日，紫阳街道办事处以拆除危房名义拆除涉案房屋部分屋顶、墙等。徐某等4人提起行政诉讼，请求确认强拆违法并赔偿各项损失共计1400余万元。\", \"disputed_issues\": \"被告是否适格；街道办事处实施的强制拆除行为的责任主体认定。\", \"conclusion\": \"再审法院裁定驳回再审申请，认为街道办事处超出委托范围自行实施的拆除行为应由其自行承担责任，原告以区政府为被告不适格，经释明后拒绝变更，应驳回起诉。\", \"amount_involved\": \"\", \"guiding_points\": \"\", \"claim_amount\": \"1419.73万元\", \"judgment_amount\": \"0\"}, \"legal_provision_elements\": [{\"provision_index\": 0, \"statute\": \"中华人民共和国地方各级人民代表大会和地方各级人民政府组织法\", \"article\": \"68\", \"element_type\": \"subject_element\", \"content\": \"街道办事处是市辖区、不设区的市的人民政府的派出机关，具有独立的行政主体资格。\", \"applicable_fact_pattern\": \"行政机关以自己名义作出行政行为，需确定其是否具有独立被告资格。\"}, {\"provision_index\": 1, \"statute\": \"中华人民共和国行政诉讼法\", \"article\": \"26\", \"element_type\": \"legal_consequence\", \"content\": \"作出行政行为的行政机关是被告。\", \"applicable_fact_pattern\": \"公民、法人或者其他组织直接向人民法院提起诉讼时，以作出行政行为的行政机关为被告。\"}, {\"provision_index\": 2, \"statute\": \"中华人民共和国行政诉讼法\", \"article\": \"26\", \"element_type\": \"legal_consequence\", \"content\": \"行政机关委托的组织所作的行政行为，委托的行政机关是被告。\", \"applicable_fact_pattern\": \"行政机关委托其他组织实施行政行为的，以委托机关为被告。\"}, {\"provision_index\": 3, \"statute\": \"最高人民法院关于适用〈中华人民共和国行政诉讼法〉的解释\", \"article\": \"20\", \"element_type\": \"exception_clause\", \"content\": \"行政机关组建并赋予行政管理职能但不具有独立承担法律责任能力的机构，以该机构为被告不当，应以组建该机构的行政机关为被告。\", \"applicable_fact_pattern\": \"内设机构或临时机构不具有独立责任能力时，不能以其为被告，而应以组建机关为被告。\"}, {\"provision_index\": 4, \"statute\": \"国有土地上房屋征收与补偿条例\", \"article\": \"4\", \"element_type\": \"subject_element\", \"content\": \"市、县级人民政府负责本行政区域的房屋征收与补偿工作，房屋征收部门组织实施具体工作。\", \"applicable_fact_pattern\": \"国有土地上房屋征收补偿中，确定市、县级人民政府及房屋征收部门的职责分工。\"}, {\"provision_index\": 5, \"statute\": \"国有土地上房屋征收与补偿条例\", \"article\": \"5\", \"element_type\": \"act_element\", \"content\": \"房屋征收部门可以委托房屋征收实施单位承担具体工作，并对其实施的行为负责监督和承担法律后果。\", \"applicable_fact_pattern\": \"房屋征收实施单位在委托范围内实施的行为，由房屋征收部门承担法律责任。\"}, {\"provision_index\": 6, \"statute\": \"最高人民法院关于适用〈中华人民共和国行政诉讼法〉的解释\", \"article\": \"25\", \"element_type\": \"legal_consequence\", \"content\": \"房屋征收部门作为被告，或者受委托的征收实施单位在委托范围内行为的，以房屋征收部门为被告。\", \"applicable_fact_pattern\": \"被征收人对征收过程中的行政行为不服，应正确列明被告。\"}, {\"provision_index\": 7, \"statute\": \"最高人民法院关于适用〈中华人民共和国行政诉讼法〉的解释\", \"article\": \"20\", \"element_type\": \"legal_consequence\", \"content\": \"派出机构等超出法定授权范围实施行政行为，当事人不服的，以实施该行为的机构或组织为被告。\", \"applicable_fact_pattern\": \"派出机构或内设机构越权实施行政行为，应以其自己为被告，体现“谁行为，谁负责”原则。\"}]}, \"eval\": {\"row_id\": \"4017\", \"score\": 93.0, \"issues\": [\"guiding_case_number 为空\", \"judges 为空\", \"attorneys 为空\", \"trial_organizations 为空\", \"evidence 为空\"], \"court_case_count\": 3, \"judge_count\": 0, \"attorney_count\": 0, \"provision_count\": 8, \"evidence_count\": 0}}", "3169__v1": "{\"row_id\": \"3169\", \"input\": {\"id\": \"3169\", \"web_name\": \"人民法院案例库\", \"case_type\": \"行政-不履行XX职责\", \"storage_no\": \"2023-12-3-021-011\"}, \"output\": {\"guiding_case\": {\"guiding_case_number\": \"\", \"guiding_case_name\": \"程某诉某卫生健康委员会、某妇幼保健计划生育服务中心不履行法定职责案\", \"publication_date\": \"2021-11-15\", \"binding_force\": \"persuasive\", \"guiding_points\": \"医疗保健机构出具《出生医学证明》的行为，是法律授权实施的行政确认行为，属于行政诉讼的受案范围。医疗保健机构未依法出具《出生医学证明》不仅仅侵犯公民个人合法权益，同时还侵犯《出生医学证明》申领、签发和管理的行政管理制度，影响公民取得中国国籍、户籍登记、血亲关系认定和母婴保健服务等相关权益。本案新生儿的父亲向某妇幼保健计划生育服务中心申请办理《出生医学证明》，提供的申领材料符合医疗保健机构出具《出生医学证明》的法定条件要求，某妇幼保健计划生育服务中心应当予以办理。\", \"key_words\": [\"行政诉讼\", \"不履行法定职责\", \"出具出生医学证明\", \"血缘关系\", \"受案范围\"], \"case_level\": \"typical_case\", \"trial_procedure\": \"一审\", \"storage_no\": \"2023-12-3-021-011\", \"source_url\": \"https://rmfyalk.court.gov.cn\", \"judgment_mean\": \"\"}, \"case_type\": {\"category\": \"administrative\", \"level1\": \"行政\", \"level2\": \"不履行法定职责\"}, \"court_cases\": [{\"case_number\": \"(2021)豫0724行初6号\", \"filing_date\" e, \"admission_status\": \"admitted\", \"examination_status\": \"examined\", \"expert_institution\": \"\", \"expert_conclusion\": \"\"}, {\"content\": \"河南某司法鉴定所出具的司法鉴定意见书，结论为支持程某鸣与程某之间存在亲生血缘关系\", \"evidence_type\": \"expert_opinion\", \"submitted_by\": \"程某鸣\", \"is_key_evidence\": true, \"admission_status\": \"admitted\", \"examination_status\": \"examined\", \"expert_institution\": \"河南某司法鉴定所\", \"expert_conclusion\": \"依据现有资料和DNA分析结果，支持程某鸣与程某之间存在亲生血缘关系\"}, {\"content\": \"卜某静诊断证明书、出院证等相关住院材料\", \"evidence_type\": \"documentary\", \"submitted_by\": \"程某鸣\", \"is_key_evidence\": true, \"admission_status\": \"admitted\", \"examination_status\": \"examined\", \"expert_institution\": \"\", \"expert_conclusion\": \"\"}], \"judgment_results\": [{\"result_type\": \"administrative_decision\", \"specific_judgment\": \"某妇幼保健计划生育服务中心应自本判决生效之日起30日内为程某办理《出生医学证明》。\", \"reasoning\": \"根据《母婴保健法》第23条，出具出生医学证明属于医疗保健机构的法定职责。原告父亲提供的材料（亲子鉴定、村委会证明、住院病历等）足以证明程某系卜某静与程某鸣的非婚生女，符合签发出生医学证明的实质条件，被告以材料不全为由拒绝履行法定职责理由不成立。\", \"case_number\": \"(2021)豫0724行初6号\", \"cost_allocation\": \"\"}, {\"result_type\": \"dismissed\", \"specific_judgment\": \"驳回程某要求某卫生健康委员会出具《出生医学证明》的诉讼请求。\", \"reasoning\": \"出具《出生医学证明》的法定职责主体是医疗保健机构，而非卫生健康委员会，故原告对卫生健康委员会的诉讼请求不能成立。\", \"case_number\": \"(2021)豫0724行初6号\", \"cost_allocation\": \"\"}], \"case_summary\": {\"key_facts\": \"程某于2019年9月29日出生，母亲卜某静产后出走下落不明。父亲程某鸣持亲子鉴定意见书、村委会证明、身份证复印件等材料向某妇幼保健计划生育服务中心申领出生医学证明，该中心以材料不全无法确认为由拒绝出具。程某遂起诉请求判令二被告履行法定职责。\", \"disputed_issues\": \"1.出具《出生医学证明》的行为是否属于行政诉讼受案范围；2.某妇幼保健计划生育服务中心应否为程某出具《出生医学证明》；3.某卫生健康委员会是否负有出具《出生医学证明》的法定职责。\", \"conclusion\": \"某妇幼保健计划生育服务中心应当为程某办理《出生医学证明》，驳回程某对某卫生健康委员会的诉讼请求。\", \"amount_involved\": \"\", \"guiding_points\": \"医疗保健机构出具《出生医学证明》的行为，是法律授权实施的行政确认行为，属于行政诉讼的受案范围。医疗保健机构未依法出具《出生医学证明》不仅仅侵犯公民个人合法权益，同时还侵犯《出生医学证明》申领、签发和管理的行政管理制度，影响公民取得中国国籍、户籍登记、血亲关系认定和母婴保健服务等相关权益。\", \"claim_amount\": \"\", \"judgment_amount\": \"\"}, \"legal_provision_elements\": [{\"provision_index\": 0, \"statute\": \"中华人民共和国母婴保健法\", \"ar let network = null;
let nodesDataset = null;
let edgesDataset = null;
let currentFilter = 'all';
let isPanelLocked = false;

// ===== Color scheme from ontology (matched by entity type → root class) =====
const ROOT_COLORS = {
  'LegalNorm':      { bg: '#2980b9', border: '#1a5276' },
  'JudicialEntity': { bg: '#d35400', border: '#a04000' },
  'LegalSubject':   { bg: '#27ae60', border: '#1e8449' },
  'Person':         { bg: '#16a085', border: '#0e6655' },
};

// Admin entity type → ontology root class
const ADMIN_TYPE_ROOT = {
  'GuidingCase':    'LegalNorm',
  'LegalProvision': 'LegalNorm',
  'CourtCase':      'JudicialEntity',
  'CaseSummary':    'JudicialEntity',
  'Evidence':       'JudicialEntity',
  'JudgmentResult': 'JudicialEntity',
  'LegalSubject':   'LegalSubject',
};

// Node shapes by type (keep distinguishing)
const ADMIN_SHAPES = {
  'GuidingCase':    'hexagon',
  'CourtCase':      'box',
  'CaseSummary':    'ellipse',
  'JudgmentResult': 'diamond',
  'Evidence':       'ellipse',
  'LegalSubject':   'ellipse',
  'LegalProvision': 'ellipse',
};

function getAdminColor(typeName) {
  const root = ADMIN_TYPE_ROOT[typeName];
  const c = ROOT_COLORS[root];
  return c || { bg: '#7f8c8d', border: '#5d6d7e' };
}

function lightenColor(hex, percent) {
  const num = parseInt(hex.slice(1), 16);
  const amt = Math.round(2.55 * percent);
  const R = Math.min(255, (num >> 16) + amt);
  const G = Math.min(255, ((num >> 8) & 0x00FF) + amt);
  const B = Math.min(255, (num & 0x0000FF) + amt);
  return '#' + ((1 << 24) + (R << 16) + (G << 8) + B).toString(16).slice(1);
}

// Build vis data
function buildVisData(filterCaseId) {
  const visNodes = [];
  const visEdges = [];
  const nodeSet = new Set();
  const edgeSet = new Set();

  let filtered = ALL_GRAPHS;
  if (filterCaseId && filterCaseId !== 'all') {
    filtered = ALL_GRAPHS.filter(g => {
      const key = g.version ? g.row_id + '__v' + g.version : g.row_id;
      return key === filterCaseId || g.row_id === filterCaseId;
    });
  }

  for (const g of filtered) {
    for (const n of g.nodes) {
      if (nodeSet.has(n.id)) continue;
      nodeSet.add(n.id);
      const c = getAdminColor(n.type);
      const isLawGroup = n.group === 'law';
      const bg = isLawGroup ? c.bg : lightenColor(c.bg, (n.level || 0) >= 2 ? 40 : 0);
      visNodes.push({
        id: n.id,
        label: n.label,
        title: n.title,
        shape: ADMIN_SHAPES[n.type] || 'ellipse',
        size: n.level === 0 ? 35 : n.level === 1 ? 26 : 20,
        color: { background: bg, border: c.border },
        font: { color: '#fff', size: n.level === 0 ? 14 : 12, face: 'Microsoft YaHei, PingFang SC, sans-serif' },
        borderWidth: 2,
        group: n.group,
        nodeType: n.type,
      });
    }
    for (const e of g.edges) {
      const key = e.from + '|' + e.to + '|' + e.label;
      if (edgeSet.has(key)) continue;
      edgeSet.add(key);
      const ec = '#7f8c8d';
      visEdges.push({
        from: e.from, to: e.to, label: e.label,
        color: { color: ec, highlight: '#333', hover: '#333', opacity: 0.7 },
        font: { size: 10, color: '#555', strokeWidth: 2, strokeColor: '#fff' },
        width: 1.5, smooth: { type: 'continuous' },
        arrows: { to: { enabled: true, scaleFactor: 0.6 } },
      });
    }
  }
  return { nodes: visNodes, edges: visEdges, filteredCount: filtered.length };
}

function initNetwork(filterCaseId) {
  const container = document.getElementById('mynetwork');
  container.innerHTML = '';

  const data = buildVisData(filterCaseId);
  if (data.nodes.length === 0) {
    container.innerHTML = '<div class="loading">&#x274C; 无数据</div>';
    document.getElementById('stats').textContent = '0 nodes, 0 edges';
    return;
  }
  nodesDataset = new vis.DataSet(data.nodes);
  edgesDataset = new vis.DataSet(data.edges);
  const networkData = { nodes: nodesDataset, edges: edgesDataset };

  const options = {
    physics: {
      enabled: true, solver: 'forceAtlas2Based',
      forceAtlas2Based: { gravitationalConstant: -40, centralGravity: 0.005, springLength: 180, springConstant: 0.08, damping: 0.4 },
      stabilization: { iterations: 150, fit: true },
      minVelocity: 0.5,
    },
    interaction: { hover: true, tooltipDelay: 100, navigationButtons: true, keyboard: true, zoomView: true, dragView: true },
    edges: { smooth: { type: 'continuous' }, font: { size: 10, color: '#555', face: 'Microsoft YaHei' } },
    nodes: { font: { face: 'Microsoft YaHei, PingFang SC, sans-serif' }, borderWidth: 2, shadow: { enabled: true, size: 3, x: 0, y: 0 } },
    layout: { improvedLayout: false, randomSeed: 42 },
  };

  network = new vis.Network(container, networkData, options);

  // Freeze physics after stabilization
  network.on('stabilizationIterationsDone', function() {
    network.setOptions({ physics: { enabled: false } });
    network.fit({ animation: true });
  });

  document.getElementById('stats').textContent = data.nodes.length + ' nodes, ' + data.edges.length + ' edges';
  document.getElementById('totalCases').textContent = data.filteredCount;
  updateCaseListHighlight(filterCaseId);

  // Register event handlers on the new network instance
  network.on('hoverNode', function(params) {
    if (isPanelLocked) return;
    if (currentSelection === 'node:' + params.node) return;
    showAdminEntityDetail(params.node, params.pointer.DOM);
  });

  network.on('hoverEdge', function(params) {
    if (isPanelLocked) return;
    if (currentSelection === 'edge:' + params.edge) return;
    showAdminEdgeDetail(params.edge);
  });

  network.on('click', function(params) {
    if (params.nodes.length > 0) {
      showAdminEntityDetail(params.nodes[0], null);
    } else if (params.edges.length > 0) {
      showAdminEdgeDetail(params.edges[0]);
    } else {
      if (isPanelLocked) hideAdminPanel();
    }
  });
}

// ===== Detail Panel =====
var detailPanel = document.getElementById('detailPanel');
var panelTitle = document.getElementById('panelTitle');
var panelBody = document.getElementById('panelBody');
var panelClose = document.getElementById('panelClose');

panelClose.addEventListener('click', function(e) { e.stopPropagation(); hideAdminPanel(); });
document.addEventListener('click', function(e) {
  if (isPanelLocked && !detailPanel.contains(e.target) && e.target !== panelClose) hideAdminPanel();
});
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape' && detailPanel.classList.contains('open')) hideAdminPanel();
});
detailPanel.addEventListener('mousedown', function(e) { e.stopPropagation(); });

function showAdminEntityDetail(nodeId, pointer) {
  // Find the ALL_GRAPHS entry for this node
  var nodeData = null;
  var caseInfo = null;
  for (var i = 0; i < ALL_GRAPHS.length; i++) {
    var g = ALL_GRAPHS[i];
    for (var j = 0; j < g.nodes.length; j++) {
      if (g.nodes[j].id === nodeId) {
        nodeData = g.nodes[j];
        caseInfo = g;
        break;
      }
    }
    if (nodeData) break;
  }
  if (!nodeData) {
    panelBody.innerHTML = '<div class="empty-hint">节点信息不可用</div>';
    return;
  }

  detailPanel.classList.remove('edge-mode');
  panelTitle.textContent = '📋 ' + (nodeData.type || '节点');
  var html = '';
  html += '<div class="panel-section"><div class="panel-section-title">📌 类型</div>';
  html += '<div class="desc-text">' + (nodeData.type || '未知') + '</div></div>';

  html += '<div class="panel-section"><div class="panel-section-title">📌 标签</div>';
  html += '<div class="desc-text">' + (nodeData.label || '') + '</div></div>';

  if (caseInfo) {
    html += '<div class="panel-section"><div class="panel-section-title">📌 所属案例</div>';
    html += '<div class="desc-text">' + (caseInfo.case_name || '') + ' (#' + caseInfo.row_id + ')</div></div>';
  }

  // Show title content (rich HTML tooltip)
  if (nodeData.title) {
    var plainTitle = nodeData.title.replace(/<[^>]*>/g, '');
    html += '<div class="panel-section"><div class="panel-section-title">📌 详细信息</div>';
    html += '<div class="desc-text" style="font-size:12px;white-space:pre-wrap;">' + plainTitle + '</div></div>';
  }

  panelBody.innerHTML = html;
  detailPanel.classList.add('open');
  isPanelLocked = true;
  currentSelection = 'node:' + nodeId;
}

function showAdminEdgeDetail(edgeId) {
  var allEdges = edgesDataset ? edgesDataset.get(edgeId) : null;
  if (!allEdges) return;
  detailPanel.classList.add('edge-mode');
  panelTitle.textContent = '🔗 ' + (allEdges.label || '关系边');
  var html = '';
  html += '<div class="panel-section"><div class="panel-section-title">📌 关系</div>';
  html += '<div class="desc-text">' + (allEdges.label || '') + '</div></div>';

  html += '<div class="panel-section"><div class="panel-section-title">📌 方向</div>';
  html += '<div class="field-row"><span style="font-weight:500;">' + allEdges.from + '</span> → <span style="font-weight:500;">' + allEdges.to + '</span></div></div>';

  panelBody.innerHTML = html;
  detailPanel.classList.add('open');
  isPanelLocked = true;
  currentSelection = 'edge:' + edgeId;
}

function hideAdminPanel() {
  detailPanel.classList.remove('open');
  isPanelLocked = false;
  currentSelection = null;
}

// ===== Version-aware filter =====
function filterByCase(value) {
  currentFilter = value;
  document.getElementById('caseSelect').value = value;
  // Extract row_id from compound key
  var rid = value.split('__')[0];
  initNetwork(value === 'all' ? null : value);

  // Show/hide version selector
  var verWrapper = document.getElementById('versionWrapper');
  if (verWrapper) {
    verWrapper.style.display = 'none';
  }
  if (value && value !== 'all') {
    // Count versions for this row_id
    var versions = [];
    for (var i = 0; i < ALL_GRAPHS.length; i++) {
      if (ALL_GRAPHS[i].row_id === rid) versions.push(ALL_GRAPHS[i]);
    }
    if (versions.length > 1 && verWrapper) {
      verWrapper.style.display = 'inline-flex';
      var verSelect = document.getElementById('versionSelect');
      versionSelect.innerHTML = '';
      for (var v = 0; v < versions.length; v++) {
        var opt = document.createElement('option');
        opt.value = rid + '__v' + (v + 1);
        opt.textContent = 'v' + (v + 1);
        if (opt.value === value) opt.selected = true;
        verSelect.appendChild(opt);
      }
    }
  }

  // Show raw data
  showRawData(value);
}

function switchVersion(val) {
  filterByCase(val);
}

// ===== Legend (tree style, matching ontology) =====
function buildAdminLegend() {
  var roots = ['LegalNorm', 'JudicialEntity', 'LegalSubject'];
  var rootNames = {'LegalNorm':'规范层', 'JudicialEntity':'司法实体层', 'LegalSubject':'主体层'};
  var rootColors = {'LegalNorm':'#2980b9', 'JudicialEntity':'#d35400', 'LegalSubject':'#27ae60'};
  var children = {
    'LegalNorm': ['GuidingCase', 'LegalProvision'],
    'JudicialEntity': ['CourtCase', 'CaseSummary', 'Evidence', 'JudgmentResult'],
    'LegalSubject': ['LegalSubject'],
  };
  var html = '';
  roots.forEach(function(root) {
    var c = rootColors[root];
    var label = root + ' (' + (rootNames[root] || '') + ')';
    html += '<div class="legend-root">';
    html += '<span class="dot" style="background:' + c + ';"></span>';
    html += '<span>' + label + '</span></div>';
    html += '<div class="legend-children">';
    var kids = children[root] || [];
    kids.sort();
    kids.forEach(function(k) {
      var kc = ROOT_COLORS[root] || {bg:'#7f8c8d'};
      var shape = ADMIN_SHAPES[k] || 'ellipse';
      var shapeIcon = shape === 'hexagon' ? '⬡' : shape === 'box' ? '▢' : shape === 'diamond' ? '◇' : '○';
      html += '<div class="legend-child">';
      html += '<span class="cdot" style="background:' + kc.bg + ';"></span>';
      html += '<span>' + shapeIcon + ' ' + k + '</span>';
      html += '</div>';
    });
    html += '</div>';
  });
  document.querySelector('.legend').innerHTML = '<div class="legend-title">📋 实体类型</div>' + html;
}

// ===== Raw Data Panel =====
var rawDataOpen = true;
function toggleRawData() {
  rawDataOpen = !rawDataOpen;
  var panel = document.getElementById('rawDataPanel');
  panel.classList.toggle('open', rawDataOpen);
  document.getElementById('rawDataLabel').textContent = rawDataOpen ? '收起' : '展开';
}
function showRawData(filterVal) {
  var content = document.getElementById('rawContent');
  if (!filterVal || filterVal === 'all') {
    content.textContent = '选择单个案例后显示原始JSON数据';
    return;
  }
  var raw = RAW_DATA[filterVal];
  if (raw) {
    try {
      var parsed = JSON.parse(raw);
      content.textContent = JSON.stringify(parsed, null, 2);
    } catch(e) {
      content.textContent = raw;
    }
  } else {
    content.textContent = '未找到该版本的原始数据';
  }
}

// ===== Legacy UI functions =====
function setLayout(btn, mode) {
  document.querySelectorAll('.btn-group .btn').forEach(function(b) { b.classList.remove('active'); });
  btn.classList.add('active');
  if (!network) return;
  if (mode === 'force') {
    network.setOptions({ physics: { enabled: true, solver: 'forceAtlas2Based' }, layout: { improvedLayout: true, hierarchical: { enabled: false } } });
  } else {
    network.setOptions({ physics: { enabled: false }, layout: { improvedLayout: true, hierarchical: { enabled: true, direction: 'LR', sortMethod: 'directed', nodeSpacing: 150, levelSeparation: 200 } } });
  }
}
function fitView() { if (network) network.fit({ animation: true }); }
function toggleCaseList() { document.getElementById('caseListPanel').classList.toggle('open'); }
function updateCaseListHighlight(filterCaseId) {
  document.querySelectorAll('.case-list-item').forEach(function(el) {
    el.classList.toggle('active', el.dataset.rowId === filterCaseId || (!filterCaseId || filterCaseId === 'all'));
  });
}
function selectFromList(rowId) { filterByCase(rowId); if (rowId !== 'all') document.getElementById('caseListPanel').classList.remove('open'); }

// Populate
function populateSelectors() {
  const select = document.getElementById('caseSelect');
  const listScroll = document.getElementById('caseListScroll');
  let listHtml = '<div class="case-list-item" data-row-id="all" onclick="selectFromList(\'all\')"><div class="case-name">&#x1F4CC; 全部案例</div><div class="case-meta">显示所有行政案例</div></div>';

  const sorted = ALL_GRAPHS.slice().sort(function(a, b) { return parseInt(a.row_id) - parseInt(b.row_id); });

  // Track seen row_ids to avoid duplicate names in list (but keep versioned compound keys)
  var seen = {};
  for (let i = 0; i < sorted.length; i++) {
    const g = sorted[i];
    const valKey = g.version ? g.row_id + '__v' + g.version : g.row_id;
    const displayName = g.version ? '[' + g.row_id + '] ' + g.case_name + ' (v' + g.version + ')' : '[' + g.row_id + '] ' + g.case_name;
    
    const opt = document.createElement('option');
    opt.value = valKey;
    opt.textContent = displayName;
    select.appendChild(opt);

    // Only add to list if we haven't seen this row_id before (dedup list display)
    if (!seen[g.row_id]) {
      seen[g.row_id] = true;
      listHtml += '<div class="case-list-item" data-row-id="' + g.row_id + '" onclick="selectFromList(\'' + g.row_id + '\')">' +
        '<div class="case-name">' + g.case_name + '</div>' +
        '<div class="case-meta">#' + g.row_id + ' &middot; ' + (g.case_type || '') + '</div></div>';
    }
  }
  listScroll.innerHTML = listHtml;
}

buildAdminLegend();
populateSelectors();
initNetwork(null);

window.addEventListener('resize', function() { if (network) network.fit({ animation: false }); });

</script>
