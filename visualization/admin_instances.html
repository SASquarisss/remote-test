", \"statute\": \"最高人民法院、最高人民检察院关于检察公益诉讼案件适用法律若干问题的解释\", \"article\": \"24\", \"paragraph\": \"\", \"item\": \"\", \"content\": \"在行政公益诉讼案件审理过程中，被告纠正违法行为或者依法履行职责而使人民检察院的诉讼请求全部实现的，人民检察院可以撤回起诉，人民法院应当裁定准许。\", \"citation_position\": \"judgment_reason\", \"citation_purpose\": \"适用依据\"}], \"evidence\": [], \"judgment_results\": [{\"result_type\": \"withdrawn\", \"specific_judgment\": \"准许公益诉讼起诉人长沙市岳麓区人民检察院撤回起诉。\", \"reasoning\": \"被告宁乡市财政局已将违法支出给某辰置业公司的国有土地使用权出让收入2.9亿余元全额追缴上缴国库，国家利益得到有效保护，公益诉讼起诉人提出的诉讼请求已经全部实现，其撤诉申请符合法律规定，依法准予。\", \"case_number\": \"(2020)湘8601行初454号\", \"cost_allocation\": \"\"}], \"case_summary\": {\"key_facts\": \"2017年12月27日，某地产集团有限公司竞得五宗地块的国有建设用地使用权，以其子公司湖南某辰置业有限公司名义签订出让合同，出让金总价42.98亿余元。合同签订后，保证金15.24亿余元转入宁乡市财政局非税账户。2018年，宁乡市财政局以“退保证金”名义将已进入非税账户的国有土地出让收入支出给某辰置业公司2.9亿余元。某辰置业公司用该笔资金缴清相关税费及土地价款，办理不动产权证并申请抵押贷款。截至2019年9月4日，宁乡市财政局未追回违法支出款项。长沙市人民检察院发出检察建议，宁乡市财政局回复启动追缴，但未全面履职。长沙市岳麓区人民检察院于2020年4月3日提起行政公益诉讼。审理中，某辰置业公司通过商业承兑汇票方式于2020年5月27日退缴2.9亿余元至非税账户并缴入国库，款项全额追回，检察院撤回起诉。\", \"disputed_issues\": \"被告宁乡市财政局是否已依法全面履行追缴违法支出国有土地出让收入的职责；公益诉讼起诉人撤回起诉是否符合法律规定。\", \"conclusion\": \"法院裁定准许撤回起诉。\", \"amount_involved\": \"2.9亿余元\", \"guiding_points\": \"检察机关为防止因土地出让收入不当滞留、坐支、挪用造成的国有财产损失依法提起行政公益诉讼的，如果行政机关主动纠错、依法履职，积极追回违法支出国有土地使用权出让收入，有效挽回国有财产损失，公益诉讼起诉人以诉讼请求已全部实现为由申请撤回起诉的，人民法院依法予以准许。\", \"claim_amount\": \"\", \"judgment_amount\": \"\"}, \"legal_provision_elements\": [{\"provision_index\": 0, \"statute\": \"中华人民共和国行政诉讼法\", \"article\": \"62\", \"element_type\": \"act_element\", \"content\": \"原告申请撤诉\", \"applicable_fact_pattern\": \"行政案件审理中原告主动撤回起诉\"}, {\"provision_index\": 0, \"statute\": \"中华人民共和国行政诉讼法\", \"article\": \"62\", \"element_type\": \"legal_consequence\", \"content\": \"人民法院裁定是否准许撤诉\", \"applicable_fact_pattern\": \"法院审查撤诉是否损害国家利益、社会公共利益或他人合法权益\"}, {\"provision_index\": 1, \"statute\": \"最高人民法院、最高人民检察院关于检察公益诉讼案件适用法律若干问题的解释\", \"article\": \"24\", \"element_type\": \"act_element\", \"content\": \"被告纠正违法行为或者依法履行职责使诉讼请求全部实现\", \"applicable_fact_pattern\": \"行政机关在公益诉讼中主动追回违法支出、恢复受损公益\"}, {\"provision_index\": 1, \"statute\": \"最高人民法院、最高人民检察院关于检察公益诉讼案件适用法律若干问题的解释\", \"article\": \"24\", \"element_type\": \"legal_consequence\", \"content\": \"人民检察院可以撤回起诉，人民法院应当裁定准许\", \"applicable_fact_pattern\": \"公益诉讼起诉人因诉讼请求全部实现而申请撤诉\"}]}, \"eval\": {\"row_id\": \"888\", \"score\": 93.0, \"issues\": [\"guiding_case_number 为空\", \"judges 为空\", \"attorneys 为空\", \"trial_organizations 为空\", \"evidence 为空\"], \"court_case_count\": 1, \"judge_count\": 0, \"attorney_count\": 0, \"provision_count\": 2, \"evidence_count\": 0}}", "1611__v1": "{\"row_id\": \"1611\", \"input\": {\"id\": \"1611\", \"web_name\": \"人民法院案例库\", \"case_type\": \"行政-行政确认\", \"storage_no\": \"2024-12-3-007-008\"}, \"output\": {\"guiding_case\": {\"guiding_case_number\": \"\", \"guiding_case_name\": \"西乌珠穆沁旗某车床加工部诉西乌珠穆沁旗人力资源和社会保障局工伤保险资格认定案\", \"publication_date\": \"2023-12-29\", \"binding_force\": \"persuasive\", \"guiding_points\": \"根据《工伤保险条例》相关规定，职工在工作时间和工作场所内，因工作原因受到事故伤害的，应当认定为工伤。此处的“工作原因”应当根据实际情况作出合理判断。对于职工在工作时间、工作地点为本单位利益从事非本人固定岗位（或所分配工种）的其他相关工作（例如协助他人搬运货物等）所受伤害，应当属于“工作原因”，也应当理解为“与履行工作职责相关”的工作。在符合法定情形下，社会保险行政部门根据《工伤保险条例》认定为工伤，符合最大限度保障职工权益的立法本意，人民法院应予支持。对“工作原因”和职工是否从事与本职相关的工作认定，不宜作片面理解和不合理的限定。\", \"key_words\": [\"行政\", \"行政确认\", \"工伤保险资格认定\", \"认定工伤\", \"工作原因\", \"维护单位利益\", \"社会主义核心价值观\"], \"case_level\": \"typical_case\", \"trial_procedure\": \"再审审查\", \"storage_no\": \"2024-12-3-007-008\", \"source_url\": \"https://rmfyalk.court.gov.cn\", \"judgment_mean\": \"\"}, \"case_type\": {\"category\": \"administrative\", \"level1\": \"行政\", \"level2\": \"行政确认\"}, \"court_cases\": [{\"case_number\": \"(2023)内2526行初10号\", \"filing_date\": \"2023-01-01\", \"judgment_date\": \"2023-06-30\", \"trial_level\": \"first_instance\", \"trial_procedure\": \"一审\", \"court\": {\"name\": \"内蒙古自治区西乌珠穆沁旗人民法院\", \"court_level\": \"basic\"}, \"status\": \"appealed\", \"cause_of_action\": \"工伤保险资格认定\", \"dispute_resolution_type\": \"litigation\", \"party_count\": null}, {\"case_number\": \"(2023)内25行终55号\", \"filing_date\": \"2023-07-01\", \"judgment_date\": \"2023-08-28\", \"trial_level\": \"second_instance\", \"trial_procedure\": \"二审\", \"court\": {\"name\": \"内蒙古自治区锡林郭勒盟中级人民法院\", \"court_level\": \"intermediate\"}, \"status\": \"effective\", \"cause_of_action\": \"工伤保险资格认定\", \"dispute_resolution_type\": \"litigation\", \"party_count\": null}, {\"case_number\": \"(2023)内行申871号\", \"filing_date\": \"2023-10-01\", \"judgment_date\": \"2023-12-29\", \"trial_level\": \"retrial\", \"trial_procedure\": \"再审审查\", \"court\": {\"name\": \"内蒙古自治区高级人民法院\", \"court_level\": \"high\"}, \"status\": \"judged\", \"cause_of_action\": \"工伤保险资格认定\", \"dispute_resolution_type\": \"litigation\", \"party_count\": null}], \"legal_subjects\": [{\"name\": \"西乌珠穆沁旗某车床加工部\", \"subject_type\": \"organization\", \"org_type\": \"individual_business\", \"credit_code\": null, \"roles\": [{\"role_code\": \"plaintiff\", \"role_name\": \"原告\", \"case_number\": \"(2023)内2526行初10号\"}, {\"role_code\": \"appellant\", \"role_name\": \"上诉人\", \"case_number\": \"(2023)内25行终55号\"}, {\"role_code\": \"retrial_applicant\", \"role_name\": \"再审申请人\", \"case_number\": \"(2023)内行申871号\"}]}, {\"name\": \"西乌珠穆沁旗人力资源和社会保障局\", \"subject_type\": \"organization\", \"org_type\": \"government_agency\", \"credit_code\": null, \"roles\": [{\"role_code\": \"defendant\", \"role_name\": \"被告\", \"case_number\": \"(2023)内2526行初10号\"}, {\"role_code\": \"appellee\", \"role_name\": \"被上诉人\", \"case_number\": \"(2023)内25行终55号\"}, {\"role_code\": \"retrial_respondent\", \"role_name\": \"再审被申请人\", \"case_number\": \"(2023)内行申871号\"}]}], \"attorneys\": [], \"judges\": [], \"prosecutors\": [], \"trial_organizations\": [{\"case_number\": \"(2023)内2526行初10号\", \"members\": [], \"summary\": \"合议庭成员未知\"}, {\"case_number\": \"(2023)内25行终55号\", \"members\": [], \"summary\": \"合议庭成员未知\"}, {\"case_number\": \"(2023)内行申871号\", \"members\": [], \"summary\": \"合议庭成员未知\"}], \"legal_provisions\": [{\"case_number\": \"(2023)内行申871号\", \"statute\": \"工伤保险条例\", \"article\": \"14\", \"paragraph\": \"\", \"item\": \"1\", \"content\": \"职工有下列情形之一的，应当认定为工伤：（一）在工作时间和工作场所内，因工作原因受到事故伤害的……\", \"citation_position\": \"judgment_reason\", \"citation_purpose\": \"适用依据\"}, {\"case_number\": \"(2023)内行申871号\", \"statute\": \"最高人民法院关于审理工伤保险行政案件若干问题的规定\", \"article\": \"4\", \"paragraph\": \"\", \"item\": \"4\", \"content\": \"社会保险行政部门认定下列情形为工伤的，人民法院应予支持：……（四）其他与履行工作职责相关，在工作时间及合理区域内受到伤害的。\", \"citation_position\": \"judgment_reason\", \"citation_purpose\": \"适用依据\"}], \"evidence\": [{\"content\": \"西乌旗某车床加工部提交《证明》，拟证明李某岗与客户之间形成义务帮工关系，应当由被帮工人承担赔偿责任。\", \"evidence_type\": \"documentary\", \"submitted_by\": \"西乌珠穆沁旗某车床加工部\", \"is_key_evidence\": true, \"admission_status\": \"not_admitted\", \"examination_status\": \"examined\", \"expert_institution\": \"\", \"expert_conclusion\": \"\"}], \"judgment_results\": [{\"result_type\": \"dismissed\", \"specific_judgment\": \"驳回西乌旗某车床加工部的诉讼请求。\", \"reasoning\": \"法院认为，李某岗在协助客户搬货装车时受伤，虽然其固有工作职责是车床工，但该行为系基于维护单位利益，与其工作职责具有一定的关联性，属于因工作原因受到事故伤害，符合《工伤保险条例》第十四条第（一）项的规定。西乌旗某车床加工部提交的《证明》将协助行为狭义理解为义务帮工关系，不符合社会主义核心价值观要求。西乌旗人社局认定工伤符合立法本意，应予维持。\", \"case_number\": \"(2023)内2526行初10号\", \"cost_allocation\": \"\"}, {\"result_type\": \"dismissed\", \"specific_judgment\": \"驳回上诉，维持原判。\", \"reasoning\": \"二审法院认为，一审判决认定事实清楚，适用法律正确，应予维持。李某岗为单位利益从事相关工作所受伤害属于工作原因，工伤认定合法。\", \"case_number\": \"(2023)内25行终55号\", \"cost_allocation\": \"\"}, {\"result_type\": \"dismissed\", \"specific_judgment\": \"驳回再审申请。\", \"reasoning\": \"再审法院认为，原审判决对“工作原因”的理解符合工伤保险制度最大限度保障职工权益的立法本意，协助客户搬运货物是基于单位利益的行为，应当认定为与履行工作职责相关，属于工伤。再审申请理由不能成立。\", \"case_number\": \"(2023)内行申871号\", \"cost_allocation\": \"\"}], \"case_summary\": {\"key_facts\": \"2019年10月17日，西乌旗某车床加工部职工李某岗在协助客户搬货装车过程中，左脚被砸致使趾骨粉碎性骨折。西乌旗人社局认定工伤。西乌旗某车床加工部不服，认为李某岗工作职责不包含搬运，其受伤系义务帮工，不应认定工伤，遂提起行政诉讼。一审法院判决驳回其诉讼请求，二审维持原判，再审申请亦被驳回。\", \"disputed_issues\": \"李某岗协助客户搬货装车受伤是否属于因工作原因受到事故伤害，应否认定为工伤。\", \"conclusion\": \"法院认为，李某岗为单位利益从事相关工作所受伤害属于因工作原因，符合工伤认定条件，维持西乌旗人社局作出的工伤认定决定。\", \"amount_involved\": \"\", \"guiding_points\": \"根据《工伤保险条例》相关规定，职工在工作时间和工作场所内，因工作原因受到事故伤害的，应当认定为工伤。此处的“工作原因”应当根据实际情况作出合理判断。对于职工在工作时间、工作地点为本单位利益从事非本人固定岗位（或所分配工种）的其他相关工作（例如协助他人搬运货物等）所受伤害，应当属于“工作原因”，也应当理解为“与履行工作职责相关”的工作。在符合法定情形下，社会保险行政部门根据《工伤保险条例》认定为工伤，符合最大限度保障职工权益的立法本意，人民法院应予支持。对“工作原因”和职工是否从事与本职相关的工作认定，不宜作片面理解和不合理的限定。\", \"claim_amount\": \"\", \"judgment_amount\": \"\"}, \"legal_provision_elements\": [{\"provision_index\": 0, \"statute\": \"工伤保险条例\", \"article\": \"14\", \"element_type\": \"subject_element\", \"content\": \"职工\", \"applicable_fact_pattern\": \"劳动者与用人单位存在劳动关系，且在工作时间内、工作场所中受到事故伤害。\"}, {\"provision_index\": 0, \"statute\": \"工伤保险条例\", \"article\": \"14\", \"element_type\": \"act_element\", \"content\": \"在工作时间和工作场所内，因工作原因受到事故伤害\", \"applicable_fact_pattern\": \"伤害发生于工作时间和工作场所，且伤害与工作原因存在关联。\"}, {\"provision_index\": 0, \"statute\": \"工伤保险条例\", \"article\": \"14\", \"element_type\": \"result_element\", \"content\": \"受到事故伤害\", \"applicable_fact_pattern\": \"职工身体受到实际伤害。\"}, {\"provision_index\": 0, \"statute\": \"工伤保险条例\", \"article\": \"14\", \"element_type\": \"causality_element\", \"content\": \"因工作原因\", \"applicable_fact_pattern\": \"伤害与工作原因之间存在因果关系，包括为维护单位利益而从事的非固定岗位工作。\"}, {\"provision_index\": 1, \"statute\": \"最高人民法院关于审理工伤保险行政案件若干问题的规定\", \"article\": \"4\", \"element_type\": \"subject_element\", \"content\": \"职工\", \"applicable_fact_pattern\": \"与用人单位建立劳动关系的劳动者。\"}, {\"provision_index\": 1, \"statute\": \"最高人民法院关于审理工伤保险行政案件若干问题的规定\", \"article\": \"4\", \"element_type\": \"act_element\", \"content\": \"其他与履行工作职责相关，在工作时间及合理区域内受到伤害\", \"applicable_fact_pattern\": \"伤害行为虽非本职固定工作，但与履行工作职责相关，发生在工作时间及合理区域内。\"}, {\"provision_index\": 1, \"statute\": \"最高人民法院关于审理工伤保险行政案件若干问题的规定\", \"article\": \"4\", \"element_type\": \"result_element\", \"content\": \"受到伤害\", \"applicable_fact_pattern\": \"职工身体受到伤害。\"}, {\"provision_index\": 1, \"statute\": \"最高人民法院关于审理工伤保险行政案件若干问题的规定\", \"article\": \"4\", \"element_type\": \"causality_element\", \"content\": \"与 : \"社会保险行政部门认定下列情形为工伤的，人民法院应予支持：……（四）其他与履行工作职责相关，在工作时间及合理区域内受到伤害的。\", \"citation_position\": \"judgment_reason\", \"citation_purpose\": \"适用依据\"}], \"evidence\": [{\"content\": \"客户出具的《证明》，描述事故发生过程，拟证明李某与客户之间形成义务帮工关系。\", \"evidence_type\": \"documentary\", \"submitted_by\": \"西乌珠穆沁旗某车床加工部\", \"is_key_evidence\": true, \"admission_status\": \"not_admitted\", \"examination_status\": \"examined\", \"expert_institution\": \"\", \"expert_conclusion\": \"\"}], \"judgment_results\": [{\"result_type\": \"dismissed\", \"specific_judgment\": \"驳回西乌珠穆沁旗某车床加工部的诉讼请求。\", \"reasoning\": \"李某岗在协助客户搬货装车时受伤，属于在工作时间和工作场所内因工作原因受到事故伤害，被告认定工伤正确。\", \"case_number\": \"(2023)内2526行初10号\", \"cost_allocation\": \"\"}, {\"result_type\": \"dismissed\", \"specific_judgment\": \"驳回上诉，维持原判。\", \"reasoning\": \"原审认定事实清楚，适用法律正确，上诉理由不成立。\", \"case_number\": \"(2023)内25行终55号\", \"cost_allocation\": \"\"}, {\"result_type\": \"dismissed\", \"specific_judgment\": \"驳回西乌珠穆沁旗某车床加工部的再审申请。\", \"reasoning\": \"李某岗基于单位利益协助客户搬运，属于与履行工作职责相关的工作，符合《工伤保险条例》第十四条的规定，工伤认定正确。原审判决应予维持。\", \"case_number\": \"(2023)内行申871号\", \"cost_allocation\": \"\"}], \"case_summary\": {\"key_facts\": \"2019年10月17日，西乌珠穆沁旗某车床加工部职工李某岗在协助客户搬货装车时左脚被砸伤致趾骨粉碎性骨折。西乌旗人社局认定其为工伤。加工部提出，李某岗本职工作为车床工，不包含搬运货物，其受伤不应认定为工伤，诉请撤销工伤认定。\", \"disputed_issues\": \"李某岗协助客户搬货装车的行为是否属于因工作原因受到事故伤害，应否认定为工伤。\", \"conclusion\": \"法院认为，李某岗在工作时间和工作场所内，为了单位利益协助客户搬运，与履行工作职责相关，属于工伤。人社局认定正确，判决驳回加工部诉讼请求，并维持工伤认定。\", \"amount_involved\": \"\", \"guiding_points\": \"根据《工伤保险条例》第十四条，认定工伤的“工作原因”应合理判断，包括职工在维护单位利益从事非固定岗位的与本职工作相关的工作中受伤。对“工作原因”不宜作片面理解和不合理限定。\", \"claim_amount\": \"\", \"judgment_amount\": \"\"}, \"legal_provision_elements\": [{\"provision_index\": 0, \"statute\": \"工伤保险条例\", \"article\": \"14\", \"element_type\": \"subject_element\", \"content\": \"职工\", \"applicable_fact_pattern\": \"与用人单位存在劳动关系的职工\"}, {\"provision_index\": 0, \"statute\": \"工伤保险条例\", \"article\": \"14\", \"element_type\": \"act_element\", \"content\": \"在工作时间和工作场所内，因工作原因受到事故伤害\", \"applicable_fact \"item\": \"\", \"content\": \"营业性歌舞娱乐场所、酒吧、互联网上网服务营业场所等不适宜未成年人活动场所的经营者，不得允许未成年人进入\", \"citation_position\": \"judgment_reason\", \"citation_purpose\": \"适用依据\"}, {\"case_number\": \"(2022)皖0822行初75号\", \"statute\": \"文化和旅游部关于进一步优化营商环境推动互联网上网服务行业规范发展的通知\", \"article\": \"\", \"paragraph\": \"\", \"item\": \"\", \"content\": \"以提供互联网上网服务为主营业务或主要招揽手段的综合性上网服务场所，应当依照《互联网上网服务营业场所管理条例》申请取得《网络文化经营许可证》，实施经营管理技术措施和未成年人保护措施\", \"citation_position\": \"judgment_reason\", \"citation_purpose\": \"说理依据\"}, {\"case_number\": \"(2022)皖0822行初75号\", \"statute\": \"中华人民共和国行政诉讼法\", \"article\": \"72\", \"paragraph\": \"\", \"item\": \"\", \"content\": \"被告不履行法定职责的，判决其在一定期限内履行\", \"citation_position\": \"related_law\", \"citation_purpose\": \"适用依据\"}, {\"case_number\": \"(2022)皖0822行初75号\", \"statute\": \"最高人民法院、最高人民检察院关于检察公益诉讼案件适用法律若干问题的解释\", \"article\": \"25\", \"paragraph\": \"\", \"item\": \"\", \"content\": \"被诉行政机关不履行法定职责的，判决在一定期限内履行\", \"citation_position\": \"related_law\", \"citation_purpose\": \"适用依据\"}], \"evidence\": [{\"content\": \"某克斯电竞酒店入住登记簿，显示入住人员大部分为未满十八周岁的未成年人\", \"evidence_type\": \"documentary\", \"submitted_by\": \"安徽省某县人民检察院\", \"is_key_evidence\": true, \"admission_status\": \"admitted\", \"examination_status\": \"examined\", \"expert_institution\": \"\", \"expert_conclusion\": \"\"}], \"judgment_results\": [{\"result_type\": \"liable\", \"specific_judgment\": \"责令被告某县文化旅游体育局在本判决生效后六十日内依法履行对某克斯电竞酒店等“电竞酒店”提供互联网上网服务活动的监督管理职责\", \"reasoning\": \"法院认为，某克斯电竞酒店以网络服务为主要营利手段，属于互联网上网服务营业场所；被告作为文化行政部门具有监管职责；电竞酒店接纳不特定未成年人上网，侵害了未成年人公共利益；被告不履行监管职责违法，应依法判决其限期履行。\", \"case_number\": \"(2022)皖0822行初75号\", \"cost_allocation\": \"\"}], \"case_summary\": {\"key_facts\": \"安徽省某县人民检察院发现某克斯电竞酒店以提供互联网上网服务为主要招揽手段，接待未成年人上网，可能损害未成年人身心健康。2021年10月18日向某县文化旅游体育局发出检察建议要求监管，该局回复认为无权监管。检察院遂提起行政公益诉讼，请求判令被告履行监管职责。怀宁县人民法院判决责令被告六十日内履行监管职责，判决已生效。\", \"disputed_issues\": \"电竞酒店是否属于互联网上网服务营业场所，被告是否具有监管职责；电竞酒店接待未成年人是否损害社会公共利益。\", \"conclusion\": \"法院认定电竞酒店属于互联网上网服务营业场所，被告具有监管职责，其不作为导致未成年人公共利益受损，判决被告限期履行监管职责。\", \"amount_involved\": \"\", \"guiding_points\": \"\", \"claim_amount\": \"\", \"judgment_amount\": \"\"}, \"legal_provision_elements\": [{\"provision_index\": 0, \"statute\": \"互联网上网服务营业场所管理条例\", \"article\": \"2\", \"element_type\": \"object_element\", \"content\": \"互联网上网服务营业场所是指通过计算机等装置向公众提供互联网上网服务的网吧、电脑休闲室等营业性场所\", \"applicable_fact_pattern\": \"电竞酒店以高端电脑、网络游戏吸引消费者，提供上网服务，向不特定公众开放\"}, {\"provision_index\": 1, \"statute\": \"互联网上网服务营业场所管理条例\", \"article\": \"4\", \"element_type\": \"subject_element\", \"content\": \"县级以上人民政府文化行政部门负责互联网上网服务营业场所经营单位的设立审批和经营活动监督管理\", \"applicable_fact_pattern\": \"被告某县文化旅游体育局作为县级文化行政部门，对电竞酒店的互联网上网服务活动具有法定监管职责\"}, {\"provision_index\": 2, \"statute\": \"互联网上网服务营业场所管理条例\", \"article\": \"21\", \"element_type\": \"act_element\", \"content\": \"互联网上网服务营业场所经营单位不得接纳未成年人进入营业场所\", \"applicable_fact_pattern\": \"某克斯电竞酒店在经营中允许未成年人入住并上网\"}, {\"provision_index\": 3, \"statute\": \"中华人民共和国未成年人保护法\", \"article\": \"58\", \"element_type\": \"act_element\", \"content\": \"营业性互联网上网服务营业场所不得允许未成年人进入\", \"applicable_fact_pattern\": \"某克斯电竞酒店作为营业性上网服务场所，接纳未成年人进入\"}, {\"provision_index\": 5, \"statute\": \"中华人民共和国行政诉讼法\", \"article\": \"72\", \"element_type\": \"legal_consequence\", \"content\": \"被告不履行法定职责的，判决其在一定期限内履行\", \"applicable_fact_pattern\": \"被告某县文化旅游体育局对电竞酒店的互联网上网服务活动不履行监管职责\"}, {\"provision_index\": 6, \"statute\": \"最高人民法院、最高人民检察院关于检察公益诉讼案件适用法律若干问题的解释\", \"article\": \"25\", \"element_type\": \"legal_consequence\", \"content\": \"被诉行政机关不履行法定职责的，判决在一定期限内履行\", \"applicable_fact_pattern\": \"被告某县文化旅游体育局在检察建议后仍不履行监管职责\"}]}, \"eval\": {\"row_id\": \"1593\", \"score\": 90.0, \"issues\": [\"guiding_case_number 为空\", \"judges 为空\", \"attorneys 为空\", \"trial_organizations 为空\", \"legal_provisions[4].article 为空\"], \"court_case_count\": 1, \"judge_count\": 0, \"attorney_count\": 0, \"provision_count\": 7, \"evidence_count\": 1}}", "1593__v2": "{\"row_id\": \"1593\", \"input\": {\"id\": \"1593\", \"web_name\": \"人民法院案例库\", \"case_type\": \"行 elated_info\", \"citation_purpose\": \"适用依据\"}], \"evidence\": [{\"content\": \"某克斯电竞酒店以高端配置电脑、畅玩网络游戏为宣传要点，部分房间电脑配置高达4-5台，而住宿以高低床配置，按房间收取住宿费，但实际是以网络服务为主要营利手段，上网费隐含在住宿费中。\", \"evidence_type\": \"documentary\", \"submitted_by\": \"安徽省某县人民检察院\", \"is_key_evidence\": true, \"admission_status\": \"admitted\", \"examination_status\": \"examined\", \"expert_institution\": \"\", \"expert_conclusion\": \"\"}, {\"content\": \"某克斯电竞酒店入住登记簿显示入住人员大部分为未满十八周岁的未成年人。\", \"evidence_type\": \"documentary\", \"submitted_by\": \"安徽省某县人民检察院\", \"is_key_evidence\": true, \"admission_status\": \"admitted\", \"examination_status\": \"examined\", \"expert_institution\": \"\", \"expert_conclusion\": \"\"}], \"judgment_results\": [{\"result_type\": \"liable\", \"specific_judgment\": \"责令被告某县文化旅游体育局在本判决生效后六十日内依法履行对某克斯电竞酒店等“电竞酒店”提供互联网上网服务活动的监督管理职责。\", \"reasoning\": \"法院认为，电竞酒店以网络服务为主要营利手段，应为综合性上网服务场所，属于《互联网上网服务营业场所管理条例》规定的互联网上网服务营业场所。被告某县文化旅游体育局对辖区内互联网上网服务营业场所负有监督管理职责。某克斯电竞酒店向不特定未成年人提供上网服务，放任未成年人进入，侵害未成年人公共利益。因此，被告不履行监管职责违法，应判决其履行职责。\", \"case_number\": \"(2022)皖0822行初75号\", \"cost_allocation\": \"\"}], \"case_summary\": {\"key_facts\": \"安徽省某县人民检察院发现某克斯电竞酒店以高端配置电脑、畅玩网络游戏为宣传点，提供互联网上网服务，接待未成年人，遂向某县文化旅游体育局发出诉前检察建议，要求监管。某县文化旅游体育局回复称无权监管。检察院提起行政公益诉讼，怀宁县人民法院判决被告在六十日内履行对电竞酒店上网服务的监管职责。被告未上诉。\", \"disputed_issues\": \"某县文化旅游体育局是否对电竞酒店提供互联网上网服务活动负有监督管理职责；某克斯电竞酒店是否属于互联网上网服务营业场所，其接纳未成年人上网是否损害社会公共利益。\", \"conclusion\": \"法院判决责令被告某县文化旅游体育局在六十日内依法履行对电竞酒店互联网上网服务活动的监督管理职责。\", \"amount_involved\": \"\", \"guiding_points\": \"1.电竞酒店以高端配置电脑、畅玩网络游戏为宣传要点，虽按房间收取住宿费，但实际是以网络服务为主要营利手段，上网费隐含在住宿费中，消费者为不特定人群，系综合性上网服务场所，属于《互联网上网服务营业场所管理条例》所规定的互联网上网服务营业场所的范畴。电竞酒店作为兼具住宿与上网双重功能，应当同时遵守酒店与互联网上网服务营业场所的经营规定，受文化执法部门及公安部门的双重管理。2.电竞酒店随意接纳未成年人上网行为属于损害社会公共利益行为。\", \"claim_amount\": \"\", \"judgment_amount\": \"\"}, \"legal_provision_elements\": [{\"provision_index\": 0, \"statute\": \"互联网上网服务营业场所管理条例\", \"article\": \"2\", \"element_type\": \"object_element\", \"content\": \"通过计算机等装置向公众提供互联网上网服务的网吧、电脑休闲室等营业性场所\", \"applicable_fact_pattern\": \"提供互联网上网服务且具有营业性的场所\"}, {\"provision_index\": 1, \"statute\": \"互联网上网服务营业场所管理条例\", \"article\": \"4\", \"element_type\": \"legal_consequence\", \"content\": \"县级以上人民政府文化行政部门负责互联网上网服务营业场所经营活动的监督管理\", \"applicable_fact_pattern\": \"对互联网上网服务营业场所的监管职责归属文化行政部门\"}, {\"provision_index\": 2, \"statute\": \"中华人民共和国未成年人保护法\", \"article\": \"58\", \"element_type\": \"act_element\", \"content\": \"互联网上网服务营业场所等不适宜未成年人活动场所的经营者，不得允许未成年人进入\", \"applicable_fact_pattern\": \"经营者允许未成年人进入上网服务场所\"}, {\"provision_index\": 3, \"statute\": \"互联网上网服务营业场所管理条例\", \"article\": \"21\", \"element_type\": \"act_element\", \"content\": \"互联网上网服务营业场所经营单位不得接纳未成年人进入营业场所\", \"applicable_fact_pattern\": \"接纳未成年人进入上网营业场所\"}, {\"provision_index\": 5, \"statute\": \"中华人民共和国行政诉讼法\", \"article\": \"72\", \"element_type\": \"legal_consequence\", \"content\": \"被告不履行法定职责的，人民法院判决其在一定期限内履行\", \"applicable_fact_pattern\": \"行政机关不履行法定职责的情形\"}]}, \"eval\": {\"row_id\": \"1593\", \"score\": 90.0, \"issues\": [\"guiding_case_number 为空\", \"judges 为空\", \"attorneys 为空\", \"trial_organizations 为空\", \"legal_provisions[4].article 为空\"], \"court_case_count\": 1, \"judge_count\": 0, \"attorney_count\": 0, \"provision_count\": 7, \"evidence_count\": 2}}", "3960__v1": "{\"row_id\": \"3960\", \"input\": {\"id\": \"3960\", \"web_name\": \"人民法院案例库\", \"case_type\": \"行政-行政赔偿\", \"storage_no\": \"2023-12-3-020-009\"}, \"output\": {\"guiding_case\": {\"guiding_case_number\": \"\", \"guiding_case_name\": \"周某某等四人诉桐梓县人民政府行政赔偿案\", \"publication_date\": \"2022-06-29\", \"binding_force\": \"persuasive\", \"guiding_points\": \"1.《最高人民法院关于审理行政赔偿案件若干问题的规定》第二十七条第二款规定，“违法征收征用土地、房屋，人民法院判决给予被征收人的行政赔偿，不得少于被征收人依法应当获得的安置补偿权益。”征收土地已被用于相关项目建设，土地及地上附着物无法返还的情况下，基于填平补齐损害原则，应参照土地征收补偿标准予以赔偿，并确保被征收人因违法行政强制行为造成损失获得的行政赔偿，不低于行政机关合法征收给予被征收人的行政补偿。\\n2.对于依法应当获得的安置补偿权益的确定，应当考量以下因素：已经制定补偿安置方案并实施的，参照已实施补偿安置方案确定的补偿标准计算赔偿的具体数额；综合考量当地其他被征收人的补偿情况，全面考虑征收法律法规以及当地相关政策规定的贯彻实施情况，同一征收范围内的征收在同等情况下应当遵循相同的征收补偿标准，以体现征收的公平公正；赔偿应体现对违法征收行为的惩戒，在未批先征的情形下，已经制定补偿安置方案并实施的，综合考虑占地行为发生至征地批复作出期间原告不能用地的损失及征地批复作出至赔偿款支付期间的利息损失等因素，酌情上浮赔偿金额；同时，根据损益相抵原则，赔偿和补偿不应重复，对于已经通过补偿方式获得相应救济的，应予扣除，不应在赔偿中重复支持。\", \"key_words\": [\"行政\", \"行政赔偿\", \"行政赔偿标准\", \"全面赔偿\"], \"case_level\": \"typical_case\", \"trial_procedure\": \"再审\", \"storage_no\": \"2023-12-3-020-009\", \"source_url\": \"https://rmfyalk.court.gov.cn\", \"judgment_mean\": \"\"}, \"case_type\": {\"category\": \"administrative\", \"level1\": \"行政\", \"level2\": \"行政赔偿\"}, \"court_cases\": [{\"case_number\": \"(2018)黔03行赔初129号\", \"filing_date\": \"2018-10-29\", \"judgment_date\": \"2018-12-06\", \"trial_level\": \"first_instance\", \"trial_procedure\": \"一审\", \"court\": {\"name\": \"贵州省遵义市中级人民法院\", \"court_level\": \"intermediate\"}, \"status\": \"effective\", \"cause_of_action\": \"行政赔偿\", \"dispute_resolution_type\": \"litigation\", \"party_count\": null}, {\"case_number\": \"(2019)黔行赔终121号\", \"filing_date\": \"2019-01-01\", \"judgment_date\": \"2019-12-13\", \"trial_level\": \"second_instance\", \"trial_procedure\": \"二审\", \"court\": {\"name\": \"贵州省高级人民法院\", \"court_level\": \"high\"}, \"status\": \"effective\", \"cause_of_action\": \"行政赔偿\", \"dispute_resolution_type\": \"litigation\", \"party_count\": null}, {\"case_number\": \"(2022)最高法行赔再1号\", \"filing_date\": \"2022-01-01\", \"judgment_date\": \"2022-06-29\", \"trial_level\": \"retrial\", \"trial_procedure\": \"再审\", \"court\": {\"name\": \"最高人民法院\", \"court_level\": \"supreme\"}, \"status\": \"effective\", \"cause_of_action\": \"行政赔偿\", \"dispute_resolution_type\": \"litigation\", \"party_count\": null}], \"legal_subjects\": [{\"name\": \"刘某某\", \"subject_type\": \"natural_person\", \"org_type\": null, \"credit_code\": null, \"roles\": [{\"role_code\": \"plaintiff\", \"role_name\": \"原告\", \"case_number\": \"(2018)黔03行赔初129号\"}, {\"role_code\": \"appellant\", \"role_name\": \"上诉人\", \"case_number\": \"(2019)黔行赔终121号\"}]}, {\"name\": \"周某某等四人\", \"subject_type\": \"natural_person\", \"org_type\": null, \"credit_code\": null, \"roles\": [{\"role_code\": \"retrial_applicant\", \"role_name\": \"再审申请人\", \"case_number\": \"(2022)最高法行赔再1号\"}]}, {\"name\": \"桐梓县人民政府\", \"subject_type\": \"organization\", \"org_type\": \"government_agency\", \"credit_code\": null, \"roles\": [{\"role_code\": \"defendant\", \"role_name\": \"被告\", \"case_number\": \"(2018)黔03行赔初129号\"}, {\"role_code\": \"appellee\", \"role_name\": \"被上诉人\", \"case_number\": \"(2019)黔行赔终121号\"}, {\"role_code\": \"retrial_respondent\", \"role_name\": \"再审被申请人\", \"case_number\": \"(2022)最高法行赔再1号\"}]}], \"attorneys\": [], \"judges\": [], \"prosecutors\": [], \"trial_organizations\": [], \"legal_provisions\": [{\"case_number\": \"(2022)最高法行赔再1号\", \"statute\": \"中华人民共和国国家赔偿法\", \"article\": \"2\", \"paragraph\": \"1\", \"item\": \"\", \"content\": \"国家机关和国家机关工作人员行使职权，有本法规定的侵犯公民、法人和其他组织合法权益的情形，造成损害的，受害人有依照本法取得国家赔偿的权利。\", \"citation_position\": \"judgment_reason\", \"citation_purpose\": \"适用依据\"}, {\"case_number\": \"(2022)最高法行赔再1号\", \"statute\": \"中华人民共和国国家赔偿法\", \"article\": \"4\", \"paragraph\": \"\", \"item\": \"4\", \"content\": \"行政机关及其工作人员在行使行政职权时有下列侵犯财产权情形之一的，受害人有取得赔偿的权利：（四）违法征收、征用财产的。\", \"citation_position\": \"judgment_reason\", \"citation_purpose\": \"适用依据\"}, {\"case_number\": \"(2022)最高法行赔再1号\", \"statute\": \"最高人民法院关于审理行政赔偿案件若干问题的规定\", \"article\": \"27\", \"paragraph\": \"2\", \"item\": \"\", \"content\": \"违法征收征用土地、房屋，人民法院判决给予被征收人的行政赔偿，不得少于被征收人依法应当获得的安置补偿权益。\", \"citation_position\": \"judgment_reason\", \"citation_purpose\": \"适用依据\"}, {\"case_number\": \"(2022)最高法行赔再1号\", \"statute\": \"最高人民法院关于审理行政赔偿案件若干问题的规定\", \"article\": \"11\", \"paragraph\": \"\", \"item\": \"\", \"content\": \"行政赔偿诉讼中，原告应当对行政行为造成的损害提供证据；因被告的原因导致原告无法举证的，由被告承担举证责任。\", \"citation_position\": \"judgment_reason\", \"citation_purpose\": \"适用依据\"}, {\"case_number\": \"(2019)黔行赔终121号\", \"statute\": \"中华人民共和国行政诉讼法\", \"article\": \"89\", \"paragraph\": \"\", \"item\": \"\", \"content\": \"人民法院审理上诉案件，按照下列情形，分别处理：……（一）原判决、裁定认定事实清楚，适用法律、法规正确的，判决或者裁定驳回上诉，维持原判决、裁定……\", \"citation_position\": \"related_law\", \"citation_purpose\": \"适用依据\"}, {\"case_number\": \"(2022)最高法行赔再1号\", \"statute\": \"贵州省征收征用林地补偿费用管理办法\", \"article\": \"\", \"paragraph\": \"\", \"item\": \"\", \"content\": \"支付给林地权利人的补偿费用应包括林地补偿费、林木补偿费和安置补助费。\", \"citation_position\": \"judgment_reason\", \"citation_purpose\": \"说理依据\"}], \"evidence\": [{\"content\": \"桐府林证字（2017）第17030046*号林权证，载明“羊角老”林地一幅，面积26.06亩及四至界限。\", \"evidence_type\": \"documentary\", \"submitted_by\": \"刘某某\", \"is_key_evidence\": true, \"admission_status\": \"admitted\", \"examination_status\": \"examined\", \"expert_institution\": \"\", \"expert_conclusion\": \"\"}, {\"content\": \"桐梓县人民政府桐府征决字〔2016〕16号《关于对X380桐梓县鞍山至太平公路改扩建工程建设项目规划范围内的土地和房屋进行征收与补偿的决定》及附件《X380桐梓县鞍山至太平公路改扩建工程建设项目土地房屋征收补偿安置方案》。\", \"evidence_type\": \"documentary\", \"submitted_by\": \"桐梓县人民政府\", \"is_key_evidence\": true, \"admission_status\": \"admitted\", \"examination_status\": \"examined\", \"expert_institution\": \"\", \"expert_conclusion\": \"\"}, {\"content\": \"《X380桐梓县鞍山至太平公路改扩建工程建设项目燎原田坝段土地及附着物补偿清册（第六批）》，附着物补偿栏无数据。\", \"evidence_type\": \"documentary\", \"submitted_by\": \"桐梓县人民政府\", \"is_key_evidence\": true, \"admission_status\": \"admitted\", \"examination_status\": \"examined\", \"expert_institution\": \"\", \"expert_conclusion\": \"\"}, {\"content\": \"燎原镇人民政府向刘某松银行账户打款176597元的凭证及刘某松当庭承认收款的陈述。\", \"evidence_type\": \"documentary\", \"submitted_by\": \"桐梓县人民政府\", \"is_key_evidence\": true, \"admission_status\": \"admitted\", \"examination_status\": \"examined\", \"expert_institution\": \"\", \"expert_conclusion\": \"\"}], \"judgment_results\": [{\"result_type\": \"liable\", \"specific_judgment\": \"桐梓县人民政府在判决生效之日起二个月内向刘某某支付赔偿金17416元。\", \"reasoning\": \"被告强制征收涉案林地行为已被确认程序违法，应承担赔偿责任。基于填平补齐损害原则，参照土地征收补偿标准，以涉案补偿方案标准上浮15%计算赔偿数额，客观弥补原告实际损失。\", \"case_number\": \"(2018)黔03行赔初129号\", \"cost_allocation\": \"\"}, {\"result_type\": \"dismissed\", \"specific_judgment\": \"驳回上诉，维持原判。\", \"reasoning\": \"一审判决认定事实清楚，适用法律正确，赔偿数额确定合理，应予维持。\", \"case_number\": \"(2019)黔行赔终121号\", \"cost_allocation\": \"\"}, {\"result_type\": \"dismissed\", \"specific_judgment\": \"维持贵州省高级人民法院（2019）黔行赔终121号行政赔偿判决。\", \"reasoning\": \"一、二审参照已实施的补偿安置方案标准并上浮赔偿数额，既体现对违法征收的惩戒，又遵循同等情况同等对待的公平原则；再审申请人未能就林木损失举证，且已获得充分救济，其再审请求不能成立。\", \"case_number\": \"(2022)最高法行赔再1号\", \"cost_allocation\": \"\"}], \"case_summary\": {\"key_facts\": \"2016年，桐梓县人民政府因公路改扩建作出征收补偿决定，刘某某林权证项下“羊角老”林地被纳入征收范围。征收程序后被确认违法。桐梓县人民政府已按原补偿标准向刘某某之子支付补偿款176597元。刘某某提起行政赔偿诉讼，一审判决桐梓县人民政府再支付赔偿金17416元，二审维持。刘某某去世后，其继承人周某某等四人申请再审。\", \"disputed_issues\": \"1. 赔偿标准应适用征收决定作出时的旧标准还是2017年提高后的新标准；2. 是否应对涉案林地上的林木予以赔偿。\", \"conclusion\": \"最高人民法院再审维持原判，认为一、二审参照已实施的补偿方案标准并上浮赔偿金额合理合法，再审申请人已获充分救济。\", \"amount_involved\": \"17416元\", \"guiding_points\": \"1.《最高人民法院关于审理行政赔偿案件若干问题的规定》第二十七条第二款规定，“违法征收征用土地、房屋，人民法院判决给予被征收人的行政赔偿，不得少于被征收人依法应当获得的安置补偿权益。”征收土地已被用于相关项目建设，土地及地上附着物无法返还的情况下，基于填平补齐损害原则，应参照土地征收补偿标准予以赔偿，并确保被征收人因违法行政强制行为造成损失获得的行政赔偿，不低于行政机关合法征收给予被征收人的行政补偿。\\n2.对于依法应当获得的安置补偿权益的确定，应当考量以下因素：已经制定补偿安置方案并实施的，参照已实施补偿安置方案确定的补偿标准计算赔偿的具体数额；综合考量当地其他被征收人的补偿情况，全面考虑征收法律法规以及当地相关政策规定的贯彻实施情况，同一征收范围内的征收在同等情况下应当遵循相同的征收补偿标准，以体现征收的公平公正；赔偿应体现对违法征收行为的惩戒，在未批先征的情形下，已经制定补偿安置方案并实施的，综合考虑占地行为发生至征地批复作出期间原告不能用地的损失及征地批复作出至赔偿款支付期间的利息损失等因素，酌情上浮赔偿金额；同时，根据损益相抵原则，赔偿和补偿不应重复，对于已经通过补偿方式获得相应救济的，应予扣除，不应在赔偿中重复支持。\", \"claim_amount\": \"\", \"judgment_amount\": \"17416元\"}, \"legal_provision_elements\": [{\"provision_index\": 0, \"statute\": \"中华人民共和国国家赔偿法\", \"article\": \"2\", \"element_type\": \"legal_consequence\", \"content\": \"受害人有权依法取得国家赔偿。\", \"applicable_fact_pattern\": \"国家机关及其工作人员行使职权时侵犯合法权益并造成损害。\"}, {\"provision_index\": 1, \"statute\": \"中华人民共和国国家赔偿法\", \"article\": \"4\", \"element_type\": \"act_element\", \"content\": \"违法征收、征用财产。\", \"applicable_fact_pattern\": \"行政机关未经合法审批或违反法定程序实施征收、征用。\"}, {\"provision_index\": 2, \"statute\": \"最高人民法院关于审理行政赔偿案件若干问题的规定\", \"article\": \"27\", \"element_type\": \"legal_consequence\", \"content\": \"不得少于被征收人依法应当获得的安置补偿权益。\", \"applicable_fact_pattern\": \"违法征收土地、房屋且已无法返还，需确定行政赔偿数额。\"}]}, \"eval\": {\"row_id\": \"3960\", \"score\": 90.0, \"issues\": [\"guiding_case_number 为空\", \"judges 为空\", \"attorneys 为空\", \"trial_organizations 为空\", \"legal_provisions[5].article 为空\"], \"court_case_count\": 3, \"judge_count\": 0, \"attorney_count\": 0, \"provision_count\": 6, \"evidence_count\": 4}}", "3960__v2": "{\"row_id\": \"3960\", \"input\": {\"id\": \"3960\", \"web_name\": \"人民法院案例库\", \"case_type\": \"行政-行政赔偿\", \"storage_no\": \"2023-12-3-020-009\"}, \"output\": {\"guiding_case\": {\"guiding_case_number\": \"\", \"guiding_case_name\": \"周某某等四人诉桐梓县人民政府行政赔偿案\", \"publication_date\": \"2022-06-29\", \"binding_force\": \"persuasive\", \"guiding_points\": \"1.《最高人民法院关于审理行政赔偿案件若干问题的规定》第二十七条第二款规定，“违法征收征用土地、房屋，人民法院判决给予被征收人的行政赔偿，不得少于被征收人依法应当获得的安置补偿权益。”征收土地已被用于相关项目建设，土地及地上附着物无法返还的情况下，基于填平补齐损害原则，应参照土地征收补偿标准予以赔偿，并确保被征收人因违法行政强制行为造成损失获得的行政赔偿，不低于行政机关合法征收给予被征收人的行政补偿。　　2.对于依法应当获得的安置补偿权益的确定，应当考量以下因素：已经制定补偿安置方案并实施的，参照已实施补偿安置方案确定的补偿标准计算赔偿的具体数额；综合考量当地其他被征收人的补偿情况，全面考虑征收法律法规以及当地相关政策规定的贯彻实施情况，同一征收范围内的征收在同等情况下应当遵循相同的征收补偿标准，以体现征收的公平公正；赔偿应体现对违法征收行为的惩戒，在未批先征的情形下，已经制定补偿安置方案并实施的，综合考虑占地行为发生至征地批复作出期间原告不能用地的损失及征地批复作出至赔偿款支付期间的利息损失等因素，酌情上浮赔偿金额；同时，根据损益相抵原则，赔偿和补偿不应重复，对于已经通过补偿方式获得相应救济的，应予扣除，不应在赔偿中重复支持。\", \"key_words\": [\"行政\", \"行政赔偿\", \"行政赔偿标准\", \"全面赔偿\"], \"case_level\": \"typical_case\", \"trial_procedure\": \"再审\", \"storage_no\": \"2023-12-3-020-009\", \"source_url\": \"https://rmfyalk.court.gov.cn\", \"judgment_mean\": \"\"}, \"case_type\": {\"category\": \"administrative\", \"level1\": \"行政\", \"level2\": \"行政赔偿\"}, \"court_cases\": [{\"case_number\": \"(2018)黔03行赔初129号\", \"filing_date\": \"2018-10-29\", \"judgment_date\": \"2018-12-06\", \"trial_level\": \"first_instance\", \"trial_procedure\": \"一审\", \"court\": {\"name\": \"贵州省遵义市中级人民法院\", \"court_level\": \"intermediate\"}, \"status\": \"appealed\", \"cause_of_action\": \"行政赔偿\", \"dispute_resolution_type\": \"litigation\", \"party_count\": null}, {\"case_number\": \"(2019)黔行赔终121号\", \"fil 条第一款及第四条第四项之规定，就涉案强制征收行为造成的损失，再审申请人周某某等四人有依法获得国家赔偿的权利。\", \"citation_position\": \"judgment_reason\", \"citation_purpose\": \"适用依据\"}, {\"case_number\": \"(2022)最高法行赔再1号\", \"statute\": \"中华人民共和国国家赔偿法\", \"article\": \"4\", \"paragraph\": \"\", \"item\": \"4\", \"content\": \"依据《中华人民共和国国家赔偿法》第二条第一款及第四条第四项之规定，就涉案强制征收行为造成的损失，再审申请人周某某等四人有依法获得国家赔偿的权利。\", \"citation_position\": \"judgment_reason\", \"citation_purpose\": \"适用依据\"}, {\"case_number\": \"(2022)最高法行赔再1号\", \"statute\": \"最高人民法院关于审理行政赔偿案件若干问题的规定\", \"article\": \"27\", \"paragraph\": \"2\", \"item\": \"\", \"content\": \"违法征收征用土地、房屋，人民法院判决给予被征收人的行政赔偿，不得少于被征收人依法应当获得的安置补偿权益。\", \"citation_position\": \"judgment_reason\", \"citation_purpose\": \"适用依据\"}, {\"case_number\": \"(2022)最高法行赔再1号\", \"statute\": \"最高人民法院关于审理行政赔偿案件若干问题的规定\", \"article\": \"11\", \"paragraph\": \"\", \"item\": \"\", \"content\": \"行政赔偿诉讼中，原告应当对行政行为造成的损害提供证据；因被告的原因导致原告无法举证的，由被告承担举证责任。\", \"citation_position\": \"judgment_reason\", \"citation_purpose\": \"说理依据\"}, {\"case_number\": \"(2019)黔行赔终121号\", \"statute\": \"中华人民共和国行政诉讼法\", \"article\": \"89\", \"paragraph\": \"\", \"item\": \"\", \"content\": \"二审法院判决驳回上诉，维持原判。\", \"citation_position\": \"related_info\", \"citation_purpose\": \"适用依据\"}, {\"case_number\": \"(2022)最高法行赔再1号\", \"statute\": \"贵州省征收征用林地补偿费用管理办法\", \"article\": \"\", \"paragraph\": \"\", \"item\": \"\", \"content\": \"根据《贵州省征收征用林地补偿费用管理办法》的规定，支付给林地权利人的补偿费用应包括林地补偿费、林木补偿费和安置补助费。\", \"citation_position\": \"judgment_reason\", \"citation_purpose\": \"说理依据\"}], \"evidence\": [{\"content\": \"林权证（桐府林证字（2017）第17030046*号），记载林地“羊角老”面积26.06亩，四至清楚。\", \"evidence_type\": \"documentary\", \"submitted_by\": \"刘某某\", \"is_key_evidence\": true, \"admission_status\": \"admitted\", \"examination_status\": \"examined\", \"expert_institution\": \"\", \"expert_conclusion\": \"\"}, {\"content\": \"测绘公司测绘表，显示“羊角老”有2697.03平方米林地涉及征收。\", \"evidence_type\": \"documentary\", \"submitted_by\": \"桐梓县人民政府\", \"is_key_evidence\": true, \"admission_status\": \"admitted\", \"examination_status\": \"examined\", \"expert_institution\": \"\", \"expert_conclusion\": \"\"}, {\"content\": \"打款凭证，证明燎原镇人民政府已分两次向刘某某之子刘某松账户打款176597元。\", \"evidence_type\": \"documentary\", \"submitted_by\": \"桐梓县人民政府\", \"is_key_evidence\": true, \"admission_status\": \"admitted\", \"examination_status\": \"examined\", \"expert_institution\": \"\", \"expert_conclusion\": \"\"}, {\"content\": \"《X380桐梓县鞍山至太平公路改扩建工程建设项目燎原田坝段土地及附着物补偿清册（第六批）》，附着物补偿一栏没有填写数据。\", \"evidence_type\": \"documentary\", \"submitted_by\": \"桐梓县人民政府\", \"is_key_evidence\": true, \"admission_status\": \"admitted\", \"examination_status\": \"examined\", \"expert_institution\": \"\", \"expert_conclusion\": \"\"}], \"judgment_results\": [{\"result_type\": \"liable\", \"specific_judgment\": \"桐梓县人民政府在判决生效之日起二个月内向刘某某支付赔偿金17416元。\", \"reasoning\": \"法院认为，桐梓县人民政府征收程序违法，应承担赔偿责任。根据涉案补偿安置方案标准（16700元/亩+12000元/亩社保统筹），结合该标准上浮15%，扣除已支付补偿款后，尚应支付17416元。\", \"case_number\": \"(2018)黔03行赔初129号\", \"cost_allocation\": \"\"}, {\"result_type\": \"dismissed\", \"specific_judgment\": \"驳回上诉，维持原判。\", \"reasoning\": \"二审法院认为一审判决认定事实清楚，适用法律正确，赔偿数额计算合理，应予维持。\", \"case_number\": \"(2019)黔行赔终121号\", \"cost_allocation\": \"\"}, {\"result_type\": \"dismissed\", \"specific_judgment\": \"维持贵州省高级人民法院（2019）黔行赔终121号行政赔偿判决。\", \"reasoning\": \"法院认为，一、二审判决确定的赔偿范围与标准合法适当。已支付补偿款与社保统筹标准的适用符合当地政策，赔偿已上浮并体现填平原则和惩戒；林木赔偿请求因无充分证据不予支持。综上，一、二审判决应予维持。\", \"case_number\": \"(2022)最高法行赔再1号\", \"cost_allocation\": \"\"}], \"case_summary\": {\"key_facts\": \"刘某某林权证项下“羊角老”林地被桐梓县人民政府违法征收，已生效判决确认程序违法。刘某某起诉行政赔偿，一审判决桐梓县人民政府支付赔偿金17416元，二审维持。刘某某去世后其继承人周某某等四人申请再审，最高人民法院再审维持原判。\", \"disputed_issues\": \"一、二审行政赔偿判决中确定的赔偿范围和标准是否正当；是否应当对涉案林地上的林木予以赔偿。\", \"conclusion\": \"最高人民法院再审认为，一、二审判决确定的赔偿标准适当，已对违法征收行为有所惩戒并填平损失，林木赔偿请求缺乏证据，故驳回再审申请，维持原判。\", \"amount_involved\": \"17416元\", \"guiding_points\": \"\", \"claim_amount\": \"\", \"judgment_amount\": \"17416元\"}, \"legal_provision_elements\": [{\"provision_index\": 0, \"statute\": \"中华人民共和国国家赔偿法\", \"article\": \"2\", \"element_type\": \"act_element\", \"content\": \"国家机关和国家机关工作人员行使职权，有本法规定的侵犯公民、法人和其他组织合法权益的情形，造成损害的，受害人有依照本法取得国家赔偿的权利。\", \"applicable_fact_pattern\": \"行政机关违法征收集体土地，造成权利人财产损失。\"}, {\"provision_index\": 1, \"statute\": \"中华人民共和国国家赔偿法\", \"article\": \"4\", \"element_type\": \"legal_consequence\", \"content\": \"行政机关及其工作人员在行使行政职权时有下列侵犯财产权情形之一的，受害人有取得赔偿的权利：（四）造成财产损害的其他违法行为。\", \"applicable_fact_pattern\": \"违法征收土地导致财产损害。\"}, {\"provision_index\": 2, \"statute\": \"最高人民法院关于审理行政赔偿案件若干问题的规定\", \"article\": \"27\", \"element_type\": \"legal_consequence\", \"content\": \"违法征收征用土地、房屋，人民法院判决给予被征收人的行政赔偿，不得少于被征收人依法应当获得的安置补偿权益。\", \"applicable_fact_pattern\": \"被征收人因违法征收获得的赔偿不得低于合法征收补偿标准。\"}]}, \"eval\": {\"row_id\": \"3960\", \"score\": 90.0, \"issues\": [\"guiding_case_number 为空\", \"judges 为空\", \"attorneys 为空\", \"legal_provisions[5].article 为空\"], \"court_case_count\": 3, \"judge_count\": 0, \"attorney_count\": 0, \"provision_count\": 6, \"evidence_count\": 4}}", "2847__v1": "{\"row_id\": \"2847\", \"input\": {\"id\": \"2847\", \"web_name\": \"人民法院案例库\", \"case_type\": \"行政-专利相关行政案件\", \"storage_no\": \"2024-13-3-024-005\"}, \"output\": {\"guiding_case\": {\"guiding_case_number\": \"\", \"guiding_case_name\": \"日本某株式会社诉国家知识产权局发明专利权无效行政纠纷案\", \"publication_date\": \"2023-12-11\", \"binding_force\": \"persuasive\", \"guiding_points\": \"判断优先权是否成立，应当审查在后申请的权利要求限定的内容能否从在先申请的专利文件中直接、毫无疑义地得出。权利要求中限定的某些内容如给药特征，虽然在新颖性、创造性判断中可能因不具有实质限定作用而不予考虑，但在优先权审查中应予考虑。\", \"key_words\": [\"行政\", \"发明专利权无效\", \"优先权\", \"相同主题\", \"给药特征\"], \"case_level\": \"typical_case\", \"trial_procedure\": \"二审\", \"storage_no\": \"2024-13-3-024-005\", \"source_url\": \"https://rmfyalk.court.gov.cn\", \"judgment_mean\": \"\"}, \"case_type\": {\"category\": \"administrative\", \"level1\": \"行政\", \"level2\": \"专利相关行政案件\"}, \"court_cases\": [{\"case_number\": \"(2019)京73行初9748号\", \"filing_date\": \"2019-01-01\", \"judgment_date\": \"2020-10-26\", \"trial_level\": \"first_instance\", \"t , \"roles\": [{\"role_code\": \"defendant\", \"role_name\": \"被告\", \"case_number\": \"(2019)京73行初9748号\"}, {\"role_code\": \"defendant\", \"role_name\": \"被告\", \"case_number\": \"(2019)京73行初9751号\"}, {\"role_code\": \"appellee\", \"role_name\": \"被上诉人\", \"case_number\": \"(2021)最高法知行终344号\"}, {\"role_code\": \"appellee\", \"role_name\": \"被上诉人\", \"case_number\": \"(2021)最高法知行终371号\"}]}, {\"name\": \"某药业公司\", \"subject_type\": \"organization\", \"org_type\": \"company\", \"credit_code\": null, \"roles\": [{\"role_code\": \"third_party\", \"role_name\": \"第三人\", \"case_number\": \"(2019)京73行初9748号\"}, {\"role_code\": \"third_party\", \"role_name\": \"第三人\", \"case_number\": \"(2019)京73行初9751号\"}, {\"role_code\": \"third_party\", \"role_name\": \"第三人\", \"case_number\": \"(2021)最高法知行终344号\"}, {\"role_code\": \"third_party\", \"role_name\": \"第三人\", \"case_number\": \"(2021)最高法知行终371号\"}]}], \"attorneys\": [], \"judges\": [], \"prosecutors\": [], \"trial_organizations\": [], \"legal_provisions\": [{\"case_number\": \"(2021)最高法知行终344号\", \"statute\": \"中华人民共和国专利法\", \"article\": \"29\", \"paragraph\": \"1\", \"item\": \"\", \"content\": \"申请人自发明或者实用新型在外国第一次提出专利申请之日起十二个月内，或者自外观设计在外国第一次提出专利申请之日起六个月内，又在中国就相同主题提出专利申请的，依照该外国同中国签订的协议或者共同参加的国际条约，或者依照相互承认优先权的原则，可以享有优先权。\", \"citation_position\": \"judgment_reason\", \"citation_purpose\": \"适用依据\"}, {\"case_number\": \"(2021)最高法知行终344号\", \"statute\": \"中华人民共和国专利法\", \"article\": \"22\", \"paragraph\": \"2\", \"item\": \"\", \"content\": \"新颖性，是指该发明或者实用新型不属于现有技术；也没有任何单位或者个人就同样的发明或者实用新型在申请日以前向国务院专利行政部门提出过申请，并记载在申请日以后公布的专利申请文件或者公告的专利文件中。\", \"citation_position\": \"judgment_reason\", \"citation_purpose\": \"说理依据\"}], \"evidence\": [], \"judgment_results\": [{\"result_type\": \"liable\", \"specific_judgment\": \"一、撤销北京知识产权法院（2019）京73行初9748、9751号行政判决；\\n二、撤销国家知识产权局第38951、38952号无效宣告请求审查决定；\\n三、国家知识产权局就某药业公司针对专利号为201210399309.3、201210332271.8，名称为“用于治疗糖尿病的二肽基肽酶抑制剂”的发明专利提出的无效宣告请求重新作出审查决定。\", \"reasoning\": \"法院认为，优先权核实应以在后申请权利要求限定的全部内容能否从在先申请直接毫无疑义得出为标准，不应引入新颖性创造性判断中不考虑实质限定作用的审查方式。给药特征虽通常不影响新颖性评价，但在优先权核实中必须予以考虑。证据4未记载日剂量特征，故不能构成相同主题的首次申请，该专利优先权成立，被诉决定因此应予撤销。\", \"case_number\": \"(2021)最高法知行终344号\", \"cost_allocation\": \"\"}, {\"result_type\": \"liable\", \"specific_judgment\": \"一、撤销北京知识产权法院（2019）京73行初9748、9751号行政判决；\\n二、撤销国家知识产权局第38951、38952号无效宣告请求审查决定；\\n三、国家知识产权局就某药业公司针对专利号为201210399309.3、201210332271.8，名称为“用于治疗糖尿病的二肽基肽酶抑制剂”的发明专利提出的无效宣告请求重新作出审查决定。\", \"reasoning\": \"法院认为，优先权核实应以在后申请权利要求限定的全部内容能否从在先申请直接毫无疑义得出为标准，不应引入新颖性创造性判断中不考虑实质限定作用的审查方式。给药特征虽通常不影响新颖性评价，但在优先权核实中必须予以考虑。证据4未记载日剂量特征，故不能构成相同主题的首次申请，该专利优先权成立，被诉决定因此应予撤销。\", \"case_number\": \"(2021)最高法知行终371号\", \"cost_allocation\": \"\"}], \"case_summary\": {\"key_facts\": \"日本某株式会社是两件发明专利的专利权人，某药业公司请求宣告无效。国家知识产权局认定该专利不能享有优先权，故权利要求1不具备新颖性，宣告无效。日本某株式会社起诉，一审驳回，二审上诉至最高人民法院。\", \"disputed_issues\": \"在优先权核实中，判断在后申请与在先申请是否为相同主题时，应否考虑权利要求中限定的给药特征；带有给药特征的权利要求，其优先权核实是否适用新颖性、创造性判断中不考察实质限定作用的审查方式。\", \"conclusion\": \"最高人民法院判决撤销一审判决和被诉决定，责令国家知识产权局重新审查。判决明确，优先权核实应以在后申请权利要求限定的全部内容能否从在先申请直接毫无疑义得出为标准，给药特征应予考虑，不可照搬新颖性、创造性判断中忽略实质限定作用的做法。\", \"amount_involved\": \"\", \"guiding_points\": \"判断优先权是否成立，应当审查在后申请的权利要求限定的内容能否从在先申请的专利文件中直接、毫无疑义地得出。权利要求中限定的某些内容如给药特征，虽然在新颖性、创造性判断中可能因不具有实质限定作用而不予考虑，但在优先权审查中应予考虑。\", \"claim_amount\": \"\", \"judgment_amount\": \"\"}, \"legal_provision_elements\": [{\"provision_index\": 0, \"statute\": \"中华人民共和国专利法\", \"article\": \"29\", \"element_type\": \"subject_element\", \"content\": \"申请人自在外国第一次提出专利申请之日起十二个月内\", \"applicable_fact_pattern\": \"在后申请与在先申请为相同主题的专利申请\"}, {\"provision_index\": 0, \"statute\": \"中华人民共和国专利法\", \"article\": \"29\", \"element_type\": \"act_element\", \"content\": \"在中国就相同主题提出专利申请\", \"applicable_fact_pattern\": \"在后申请的权利要求限定的技术方案已记载在符合时间要求的外国首次申请中\"}, {\"provision_index\": 0, \"statute\": \"中华人民共和国专利法\", \"article\": \"29\", \"element_type\": \"legal_consequence\", \"content\": \"可以享有优先权\", \"applicable_fact_pattern\": \"在后申请符合条件，可将首次申请日作为优先权日\"}]}, \"eval\": {\"row_id\": \"2847\", \"score\": 93.0, \"issues\": [\"guiding_case_number 为空\", \"judges 为空\", \"attorneys 为空\", \"trial_organizations 为空\", \"evidence 为空\"], \"court_case_count\": 4, \"judge_count\": 0, \"attorney_count\": 0, \"provision_count\": 2, \"evidence_count\": 0}}", "2847__v2": "{\"row_id\": \"2847\", \"input\": {\"id\": \"2847\", \"web_name\": \"人民法院案例库\", \"case_type\": \"行政-专利相关行政案件\", \"storage_no\": \"2024-13-3-024-005\"}, \"output\": {\"guiding_case\": {\"guiding_case_number\": \"\", \"guiding_case_name\": \"日本某株式会社与国家知识产权局发明专利无效宣告请求行政纠纷案\", \"publication_date\": \"2023-12-11\", \"binding_force\": \"persuasive\", \"guiding_points\": \"判断优先权是否成立，应当审查在后申请的权利要求限定的内容能否从在先申请的专利文件中直接、毫无疑义地得出。权利要求中限定的某些内容如给药特征，虽然在新颖性、创造性判断中可能因不具有实质限定作用而不予考虑，但在优先权审查中应予考虑。\", \"key_words\": [\"行政\", \"发明专利权无效\", \"优先权\", \"相同主题\", \"给药特征\"], \"case_level\": \"typical_case\", \"trial_procedure\": \"二审\", \"storage_no\": \"2024-13-3-024-005\", \"source_url\": \"https://rmfyalk.court.gov.cn\", \"judgment_mean\": \"\"}, \"case_type\": {\"category\": \"administrative\", \"level1\": \"行政\", \"level2\": \"专利相关行政案件\"}, \"court_cases\": [{\"case_number\": \"(2019)京73行初9748\", \"filing_date\": \"2019-01-01\", \"judgment_date\": \"2020-10-26\", \"trial_level\": \"first_instance\", \"trial_procedure\": \"一审\", \"court\": {\"name\": \"北京知识产权法院\", \"court_level\": \"intermediate\"}, \"status\": \"appealed\", \"cause_of_action\": \"专利无效宣告行政纠纷\", \"dispute_resolution_type\": \"litigation\", \"party_count\": null}, {\"case_number\": \"(2021)最高法知行终344\", \"filing_date\": \"2021-01-01\", \"judgment_date\": \"2023-12-11\", \"trial_level\": \"second_instance\", \"trial_procedure\": \"二审\", \"court\": {\"name\": \"最高人民法院\", \"court_level\": \"supreme\"}, \"status\": \"effective\", \"cause_of_action\": \"专利无效宣告行政纠纷\", \"dispute_resolution_type\": \"litigation\", \"party_count\": null}], \"legal_subjects\": [{\"name\": \"日本某株式会社\", \"subject_type\": \"organization\", \"org_type\": \"company\", \"credit_code\": null, \"roles\": [{\"role_code\": \"plaintiff\", \"role_name\": \"原告\", \"case_number\": \"(2019)京73行初9748\"}, {\"role_code\": \"appellant\", \"role_name\": \"上诉人\", \"case_number\": \"(2021)最高法知行终344\"}]}, {\"name\": \"国家知识产权局\", \"subject_type\": \"organization\", \"org_type\": \"government_agency\", \"credit_code\": null, \"roles\": [{\"role_code\": \"defendant\", \"role_name\": \"被告\", \"case_number\": \"(2019)京73行初9748\"}, {\"role_code\": \"appellee\", \"role_name\": \"被上诉人\", \"case_number\": \"(2021)最高法知行终344\"}]}, {\"name\": \"某药业公司\", \"subject_type\": \"organization\", \"org_type\": \"company\", \"credit_code\": null, \"roles\": [{\"role_code\": \"third_party\", \"role_name\": \"第三人\", \"case_number\": \"(2019)京73行初9748\"}, {\"role_code\": \"third_party\", \"role_name\": \"第三人\", \"case_number\": \"(2021)最高法知行终344\"}]}], \"attorneys\": [], \"judges\": [], \"prosecutors\": [], \"trial_organizations\": [], \"legal_provisions\": [{\"case_number\": \"(2021)最高法知行终344\", \"statute\": \"中华人民共和国专利法\", \"article\": \"29\", \"paragraph\": \"1\", \"item\": \"\", \"content\": \"申请人自发明或者实用新型在外国第一次提出专利申请之日起十二个月内，或者自外观设计在外国第一次提出专利申请之日起六个月内，又在中国就相同主题提出专利申请的，依照该外国同中国签订的协议或者共同参加的国际条约，或者依照相互承认优先权的原则，可以享有优先权。\", \"citation_position\": \"judgment_reason\", \"citation_purpose\": \"适用依据\"}, {\"case_number\": \"(2021)最高法知行终344\", \"statute\": \"专利审查指南\", \"article\": \"\", \"paragraph\": \"\", \"item\": \"\", \"content\": \"所属领域的技术人员认为该技术方案不能从在先申请中直接和毫无疑义地得出，则该在先申请不能作为在后申请要求优先权的基础。\", \"citation_position\": \"judgment_reason\", \"citation_purpose\": \"说理依据\"}, {\"case_number\": \"(2021)最高法知行终344\", \"statute\": \"专利审查指南\", \"article\": \"\", \"paragraph\": \"\", \"item\": \"\", \"content\": \"专利法第二十九条所述相同主题的发明或者实用新型，是指技术领域、所解决的技术问题、技术方案和预期的效果相同的发明或者实用新型。\", \"citation_position\": \"judgment_reason\", \"citation_purpose\": \"说理依据\"}, {\"case_number\": \"(2021)最高法知行终344\", \"statute\": \"中华人民共和国专利法\", \"article\": \"22\", \"paragraph\": \"2\", \"item\": \"\", \"content\": \"新颖性，是指该发明或者实用新型不属于现有技术；也没有任何单位或者个人就同样的发明或者实用新型在申请日以前向国务院专利行政部门提出过申请，并记载在申请日以后公布的专利申请文件或者公告的专利文件中。\", \"citation_position\": \"judgment_reason\", \"citation_purpose\": \"说理依据\"}], \"evidence\": [{\"content\": \"证据4为一份专利文件，其中未记载权利要求1中的日剂量特征。\", \"evidence_type\": \"documentary\", \"submitted_by\": \"某药业公司\", \"is_key_evidence\": true, \"admission_status\": \"not_admitted\", \"examination_status\": \"examined\", \"expert_institution\": \"\", \"expert_conclusion\": \"\"}], \"judgment_results\": [{\"result_type\": \"remanded\", \"specific_judgment\": \"撤销北京知识产权法院（2019）京73行初9748号行政判决；撤销国家知识产权局第38951号无效宣告请求审查决定；国家知识产权局就某药业公司针对专利号为201210399309.3、名称为“用于治疗糖尿病的二肽基肽酶抑制剂”的发明专利提出的无效宣告请求重新作出审查决定。\", \"reasoning\": \"专利优先权核实中应审查在后申请权利要求限定的全部内容能否从在先申请直接、毫无疑义地得出，给药特征不能因其在新颖性审查中可能不予考虑而忽视。证据4未记载该专利权利要求1中的日剂量特征，故不能作为相同主题的首次申请，优先权成立。因此，证据4不构成现有技术或抵触申请，被诉决定错误，应撤销并责令重作。\", \"case_number\": \"(2021)最高法知行终344\", \"cost_allocation\": \"\"}], \"case_summary\": {\"key_facts\": \"日本某株式会社拥有两项发明专利，涉及二肽基肽酶抑制剂。某药业公司提出无效宣告请求，国家知识产权局以证据4为依据宣告无效。日本某株式会社不服，向北京知识产权法院起诉，一审驳回诉讼请求。日本某株式会社上诉至最高人民法院。\", \"disputed_issues\": \"在专利优先权核实中，是否应考虑权利要求限定的给药特征；该专利的优先权是否成立；证据4是否构成现有技术。\", \"conclusion\": \"最高人民法院认为，优先权核实应审查权利要求限定的全部内容，包括给药特征，并以“直接、毫无疑义地得出”为标准。本案证据4未记载给药特征，故优先权成立，证据4不构成现有技术。据此撤销一审判决和被诉决定，责令国家知识产权局重新作出审查决定。\", \"amount_involved\": \"\", \"guiding_points\": \"判断优先权是否成立，应当审查在后申请的权利要求限定的内容能否从在先申请的专利文件中直接、毫无疑义地得出。权利要求中限定的某些内容如给药特征，虽然在新颖性、创造性判断中可能因不具有实质限定作用而不予考虑，但在优先权审查中应予考虑。\", \"claim_amount\": \"\", \"judgment_amount\": \"\"}, \"legal_provision_elements\": [{\"provision_index\": 0, \"statute\": \"中华人民共和国专利法\", \"article\": \"29\", \"element_type\": \"act_element\", \"content\": \"在外国第一次提出专利申请之日起十二个月内，又在中国就相同主题提出专利申请\", \"applicable_fact_pattern\": \"主张外国优先权的时间与内容条件\"}, {\"provision_index\": 0, \"statute\": \"中华人民共和国专利法\", \"article\": \"29\", \"element_type\": \"legal_consequence\", \"content\": \"可以享有优先权\", \"applicable_fact_pattern\": \"满足时间与主题要求时，专利申请日可提前至优先权日\"}, {\"provision_index\": 3, \"statute\": \"中华人民共和国专利法\", \"article\": \"22\", \"element_type\": \"result_element\", \"content\": \"没有在申请日以前向国务院专利行政部门提出过申请并记载在后续公开文件中的同样发明\", \"applicable_fact_pattern\": \"用于判断抵触申请\"}]}, \"eval\": {\"row_id\": \"2847\", \"score\": 85.0, \"issues\": [\"guiding_case_number 为空\", \"judges 为空\", \"attorneys 为空\", \"trial_organizations 为空\", \"legal_provisions[1].article 为空\", \"legal_provisions[2].article 为空\"], \"court_case_count\": 2, \"judge_count\": 0, \"attorney_count\": 0, \"provision_count\": 4, \"evidence_count\": 1}}", "3982__v1": "{\"row_id\": \"3982\", \"input\": {\"id\": \"3982\", \"web_name\": \"人民法院案例库\", \"case_type\": \"行政-专利相关行政案件\", \"storage_no\": \"2023-09-3-024-005\"}, \"output\": {\"guiding_case\": {\"guiding_case_number\": \"\", \"guiding_case_name\": \"某控股公司诉专利复审委员会专利无效宣告行政纠纷案\", \"publication_date\": \"2018-11-28\", \"binding_force\": \"persuasive\", \"guiding_points\": \"判断涉案专利与对比设计是否具有明显区别，必须结合涉案专利产品所属的种类，将一般消费者这一抽象概念具体化为与该产品相关的消费者群体。设计空间的大小是一个相对的概念，一般受限于产品的技术功能、采用该类产品常见特征的必要性、现有设计的拥挤程度等因素，在权衡相关设计特征的设计空间时，尤其要注意考察现有设计的状况。“整体观察、综合判断”是外观设计专利确权以及侵权判断的基本方法，“整体观察”是从外观设计的整体出发，对其全部设计特征进行整体观察，而不能仅从外观设计的局部出发；“综合判断”是在考察各设计特征对外观设计整体视觉效果影响程度的基础上，对能够影响整体视觉效果的所有因素进行综合考量，而不能把外观设计的不同部分割裂开来予以判断。\", \"key_words\": [\"行政\", \"外观设计专利权无效行政纠纷\", \"整体视觉效果\", \"设计特征\"], \"case_level\": \"typical_case\", \"trial_procedure\": \"二审\", \"storage_no\": \"2023-09-3-024-005\", \"source_url\": \"https://rmfyalk.court.gov.cn\", \"judgment_mean\": \"\"}, \"case_type\": {\"category\": \"administrative\", \"level1\": \"行政\", \"level2\": \"专利相关行政案件\"}, \"court_cases\": [{\"case_number\": \"(2016)京73行初4497号\", \"filing_date\": \"2016-01-01\", \"judgment_date\": \"2018-03-26\", \"trial_level\": \"first_instance\", \"trial_procedure\": \"一审\", \"court\": {\"name\": \"北京知识产权法院\", \"court_level\": \"special\"}, \"status\": \"appealed\", \"cause_of_action\": \"外观设计专利权无效行政纠纷\", \"dispute_resolution_type\": \"litigation\", \"party_count\": null}, {\"case_number\": \"(2018)京行终4169号\", \"filing_date\": \"2018-01-01\", \"judgment_date\": \"2018-11-28\", \"trial_level\": \"second_instance\", \"trial_procedure\": \"二审\", \"court\": {\"name\": \"北京市高级人民法院\", \"court_level\": \"high\"}, \"status\": \"effective\", \"cause_of_action\": \"外观设计专利权无效行政纠纷\", \"dispute_resolution_type\": \"litigation\", \"party_count\": null}], \"legal_subjects\": [{\"name\": \"某控股公司\", \"subject_type\": \"organization\", \"org_type\": \"company\", \"credit_code\": null, \"roles\": [{\"role_code\": \"plaintiff\", \"role_name\": \"原告\", \"case_number\": \"(2016)京73行初4497号\"}, {\"role_code\": \"appellee\", \"role_name\": \"被上诉人\", \"case_number\": \"(2018)京行终4169号\"}]}, {\"name\": \"专利复审委员会\", \"subject_type\": \"organization\", \"org_type\": \"government_agency\", \"credit_code\": null, \"roles\": [{\"role_code\": \"defendant\", \"role_name\": \"被告\", \"case_number\": \"(2016)京73行初4497号\"}, {\"role_code\": \"appellant\", \"role_name\": \"上诉人\", \"case_number\": \"(2018)京行终4169号\"}]}, {\"name\": \"某有限公司\", \"subject_type\": \"organization\", \"org_type\": \"company\", \"credit_code\": null, \"roles\": [{\"role_code\": \"third_party\", \"role_name\": \"第三人\", \"case_number\": \"(2016)京73行初4497号\"}, {\"role_code\": \"appellant\", \"role_name\": \"上诉人\", \"case_number\": \"(2018)京行终4169号\"}]}, {\"name\": \"杰某\", \"subject_type\": \"natural_person\", \"org_type\": null, \"credit_code\": null, \"roles\": [{\"role_code\": \"third_party\", \"role_name\": \"第三人\", \"case_number\": \"(2016)京73行初4497号\"}, {\"role_code\": \"appellant\", \"role_name\": \"上诉人\", \"case_number\": \"(2018)京行终4169号\"}]}], \"attorneys\": [], \"judges\": [], \"prosecutors\": [], \"trial_organizations\": [], \"legal_provisions\": [{\"case_number\": \"(2018)京行终4169号\", \"statute\": \"中华人民共和国专利法\", \"article\": \"23\", \"paragraph\": \"2\", \"item\": \"\", \"content\": \"授予专利权的外观设计与现有设计或者现有设计特征的组合相比，应当具有明显区别。\", \"citation_position\": \"judgment_reason\", \"citation_purpose\": \"适用依据\"}], \"evidence\": [{\"content\": \"现有设计公开了在前脸下部设置贯通槽的设计手法\", \"evidence_type\": \"documentary\", \"submitted_by\": \"某有限公司\", \"is_key_evidence\": true, \"admission_status\": \"admitted\", \"examination_status\": \"examined\", \"expert_institution\": \"\", \"expert_conclusion\": \"\"}, {\"content\": \"现有设计公开了贯通槽下方设有辅助进气口和倒U形护板的设计\", \"evidence_type\": \"documentary\", \"submitted_by\": \"某有限公司\", \"is_key_evidence\": true, \"admission_status\": \"admitted\", \"examination_status\": \"examined\", \"expert_institution\": \"\", \"expert_conclusion\": \"\"}, {\"content\": \"现有设计公开了本专利车牌区域为六边形、车牌区域上方设置装饰板以及后车灯和中间装饰板左右贯通的设计\", \"evidence_type\": \"documentary\", \"submitted_by\": \"某有限公司\", \"is_key_evidence\": true, \"admission_status\": \"admitted\", \"examination_status\": \"examined\", \"expert_institution\": \"\", \"expert_conclusion\": \"\"}], \"judgment_results\": [{\"result_type\": \"administrative_decision\", \"specific_judgment\": \"撤销专利复审委员会作出的第29146号无效宣告请求审查决定；专利复审委员会就无效宣告请求重新作出决定。\", \"reasoning\": \"一审法院认为被诉决定在一般消费者的界定、设计空间认定以及整体观察综合判断方法的适用上存在错误，本专利与对比设计具有明显区别，不符合2008年专利法第二十三条第二款的规定，故撤销被诉决定。\", \"case_number\": \"(2016)京73行初4497号\", \"cost_allocation\": \"\"}, {\"result_type\": \"dismissed\", \"specific_judgment\": \"撤销北京知识产权法院（2016）京73行初4497号行政判决；驳回某控股公司的诉讼请求。\", \"reasoning\": \"法院认为，本专利与对比设计在整体造型和三维立体轮廓、侧面悬浮式车顶设计、主要装饰件布局等方面的相同点对整体视觉效果具有显著影响，而不同点多为惯常设计或已为现有设计所公开，影响权重较小，整体视觉效果未产生明显区别，不符合2008年专利法第二十三条第二款规定。一审法院对“整体观察、综合判断”方法适用不当，故撤销一审判决，驳回诉讼请求。\", \"case_number\": \"(2018)京行终4169号\", \"cost_allocation\": \"\"}], \"case_summary\": {\"key_facts\": \"某控股公司是专利号为20133052822X.X、名称为“越野车（陆风E32车型）”的外观设计专利权人。针对本专利，某有限公司和杰某以不符合2008年专利法第二十三条为由申请宣告无效。专利复审委员会作出被诉决定，认定本专利与对比设计（揽胜极光汽车）无明显区别，宣告专利权全部无效。某控股公司不服，提起行政诉讼。北京知识产权法院一审判决撤销被诉决定；专利复审委员会、某有限公司、杰某提起上诉。\", \"disputed_issues\": \"1. 本专利与对比设计是否具有明显区别；2. 一般消费者的知识水平和认知能力如何界定；3. 设计空间的大小对判断是否具有明显区别的影响；4. “整体观察、综合判断”方法的正确适用。\", \"conclusion\": \"北京市高级人民法院二审认为，本专利与对比设计在整体视觉效果上没有明显区别，不符合2008年专利法第二十三条第二款的授权条件，故撤销一审判决，驳回某控股公司的诉讼请求。\", \"amount_involved\": \"\", \"guiding_points\": \"\", \"claim_amount\": \"\", \"ju rnment_agency\", \"credit_code\": null, \"roles\": [{\"role_code\": \"plaintiff\", \"role_name\": \"原告\", \"case_number\": \"(2023)桂1029行初1号\"}, {\"role_code\": \"appellee\", \"role_name\": \"被上诉人\", \"case_number\": \"(2023)桂10行终254号\"}]}, {\"name\": \"田林县人力资源和社会保障局\", \"subject_type\": \"organization\", \"org_type\": \"government_agency\", \"credit_code\": null, \"roles\": [{\"role_code\": \"defendant\", \"role_name\": \"被告\", \"case_number\": \"(2023)桂1029行初1号\"}, {\"role_code\": \"appellant\", \"role_name\": \"上诉人\", \"case_number\": \"(2023)桂10行终254号\"}]}], \"attorneys\": [], \"judges\": [], \"prosecutors\": [], \"trial_organizations\": [], \"legal_provisions\": [{\"case_number\": \"(2023)桂1029行初1号\", \"statute\": \"工伤保险条例\", \"article\": \"15\", \"paragraph\": \"1\", \"item\": \"1\", \"content\": \"职工有下列情形之一的，视同工伤：（一）在工作时间和工作岗位，突发疾病死亡或者在48小时之内经抢救无效死亡的。\", \"citation_position\": \"judgment_reason\", \"citation_purpose\": \"适用依据\"}, {\"case_number\": \"(2023)桂1029行初1号\", \"statute\": \"工伤保险条例\", \"article\": \"14\", \"paragraph\": \"\", \"item\": \"\", \"content\": \"职工有下列情形之一的，应当认定为工伤：……\", \"citation_position\": \"basic_facts\", \"citation_purpose\": \"反驳依据\"}, {\"case_number\": \"(2023)桂1029行初1号\", \"statute\": \"工伤保险条例\", \"article\": \"5\", \"paragraph\": \"\", \"item\": \"\", \"content\": \"国务院社会保险行政部门负责全国的工伤保险工作。县级以上地方各级人民政府社会保险行政部门负责本行政区域内的工伤保险工作。\", \"citation_position\": \"related_info\", \"citation_purpose\": \"适用依据\"}, {\"case_number\": \"(2023)桂1029行初1号\", \"statute\": \"工伤保险条例\", \"article\": \"17\", \"paragraph\": \"\", \"item\": \"\", \"content\": \"职工发生事故伤害或者按照职业病防治法规定被诊断、鉴定为职业病，所在单位应当自事故伤害发生之日或者被诊断、鉴定为职业病之日起30日内，向统筹地区社会保险行政部门提出工伤认定申请。\", \"citation_position\": \"related_info\", \"citation_purpose\": \"适用依据\"}], \"evidence\": [{\"content\": \"田林县公安局提交的关于黄某某发病经过的证人证言\", \"evidence_type\": \"witness_testimony\", \"submitted_by\": \"田林县公安局\", \"is_key_evidence\": true, \"admission_status\": \"admitted\", \"examination_status\": \"examined\", \"expert_institution\": \"\", \"expert_conclusion\": \"\"}, {\"content\": \"黄某某在田林县人民医院和百色市人民医院的病案材料\", \"evidence_type\": \"documentary\", \"submitted_by\": \"田林县公安局\", \"is_key_evidence\": true, \"admission_status\": \"admitted\", \"examination_status\": \"examined\", \"expert_institution\": \"\", \"expert_conclusion\": \"\"}, {\"content\": \"田林县公安局的工作会议记录\", \"evidence_type\": \"documentary\", \"submitted_by\": \"田林县公安局\", \"is_key_evidence\": false, \"admission_status\": \"admitted\", \"examination_status\": \"examined\", \"expert_institution\": \"\", \"expert_conclusion\": \"\"}, {\"content\": \"黄某某的工资查询单\", \"evidence_type\": \"documentary\", \"submitted_by\": \"田林县公安局\", \"is_key_evidence\": false, \"admission_status\": \"admitted\", \"examination_status\": \"examined\", \"expert_institution\": \"\", \"expert_conclusion\": \"\"}], \"judgment_results\": [{\"result_type\": \"administrative_decision\", \"specific_judgment\": \"一、撤销被告田林县人力资源和社会保障局于2022年9月28日作出的田人社工不认字〔2022〕03号《认定工伤决定书》；二、责令田林县人力资源和社会保障局在判决生效后60日内重新作出相关工伤认定的行政行为。\", \"reasoning\": \"黄某某在工作时间和工作岗位突发疾病，具有持续性，从发病至死亡未超过48小时，且回家换衣、吃饭等事由具有正当性，并非有意延误治疗，综合证据可认定符合《工伤保险条例》第十五条第一款第（一）项视同工伤的情形。被告不予认定工伤的决定事实不清、证据不足，处理结果不当，应予撤销。\", \"case_number\": \"(2023)桂1029行初1号\", \"cost_allocation\": \"\"}, {\"result_type\": \"dismissed\", \"specific_judgment\": \"驳回上诉，维持原判。\", \"reasoning\": \"一审判决认定事实清楚，适用法律正确，审判程序合法，田林县人力资源和社会保障局的上诉理由不能成立，依法驳回。\", \"case_number\": \"(2023)桂10行终254号\", \"cost_allocation\": \"\"}], \"case_summary\": {\"key_facts\": \"黄某某系田林县公安局辅警，2022年7月8日6时30分受单位指派执行安保任务，期间出现身体不适，11时许任务结束后回家休息，因病情加重于15时48分要求同事送医，先后在田林县人民医院和百色市人民医院抢救，7月9日15时38分死亡。田林县公安局申请工伤认定，田林县人力资源和社会保障局作出不予认定决定。\", \"disputed_issues\": \"职工在工作时间和工作岗位突发疾病后未径直就医，而是先回家再就医并在48小时内死亡，是否符合《工伤保险条例》第十五条第一款第（一）项视同工伤的认定条件。\", \"conclusion\": \"法院认定黄某某突发疾病具有持续性，回家有正当理由，从发病到死亡未超48小时，属于在工作时间和工作岗位突发疾病在48小时内经抢救无效死亡，撤销不予认定工伤决定，责令重新认定。\", \"amount_involved\": \"\", \"guiding_points\": \"\", \"claim_amount\": \"\", \"judgment_amount\": \"\"}, \"legal_provisio \": [{\"case_number\": \"(2022)渝0235行初56号\", \"filing_date\": \"2022-01-01\", \"judgment_date\": \"2022-10-18\", \"trial_level\": \"first_instance\", \"trial_procedure\": \"一审\", \"court\": {\"name\": \"云阳县人民法院\", \"court_level\": \"basic\"}, \"status\": \"effective\", \"cause_of_action\": \"工伤保险待遇行政给付纠纷\", \"dispute_resolution_type\": \"litigation\", \"party_count\": null}], \"legal_subjects\": [{\"name\": \"谭某华\", \"subject_type\": \"natural_person\", \"org_type\": null, \"credit_code\": null, \"roles\": [{\"role_code\": \"plaintiff\", \"role_name\": \"原告\", \"case_number\": \"(2022)渝0235行初56号\"}]}, {\"name\": \"云阳县社会保险事务中心\", \"subject_type\": \"organization\", \"org_type\": \"government_agency\", \"credit_code\": null, \"roles\": [{\"role_code\": \"defendant\", \"role_name\": \"被告\", \"case_number\": \"(2022)渝0235行初56号\"}]}], \"attorneys\": [], \"judges\": [], \"prosecutors\": [], \"trial_organizations\": [], \"legal_provisions\": [{\"case_number\": \"(2022)渝0235行初56号\", \"statute\": \"中华人民共和国社会保险法\", \"article\": \"36\", \"paragraph\": \"1\", \"item\": \"\", \"content\": \"职工因工作原因受到事故伤害或者患职业病，且经工伤认定的，享受工伤保险待遇；其中，经劳动能力鉴定丧失劳动能力的，享受伤残待遇。\", \"citation_position\": \"judgment_reason\", \"citation_purpose\": \"适用依据\"}, {\"case_number\": \"(2022)渝0235行初56号\", \"statute\": \"中华人民共和国社会保险法\", \"article\": \"63\", \"paragraph\": \"\", \"item\": \"\", \"content\": \"用人单位未按时足额缴纳社会保险费的，由社会保险费征收机构责令其限期缴纳或者补足。\", \"citation_position\": \"judgment_reason\", \"citation_purpose\": \"说理依据\"}, {\"case_number\": \"(2022)渝0235行初56号\", \"statute\": \"中华人民共和国社会保险法\", \"article\": \"86\", \"paragraph\": \"\", \"item\": \"\", \"content\": \"用人单位未按时足额缴纳社会保险费的，由社会保险费征收机构责令限期缴纳或者补足，并自欠缴之日起，按日加收万分之五的滞纳金；逾期仍不缴纳的，由有关行政部门处欠缴数额一倍以上三倍以下的罚款。\", \"citation_position\": \"judgment_reason\", \"citation_purpose\": \"说理依据\"}, {\"case_number\": \"(2022)渝0235行初56号\", \"statute\": \"中华人民共和国行政诉讼法\", \"article\": \"70\", \"paragraph\": \"\", \"item\": \"2\", \"content\": \"行政行为有下列情形之一的，人民法院判决撤销或者部分撤销，并可以判决被告重新作出行政行为：……（二）适用法律、法规错误的；……\", \"citation_position\": \"related_info\", \"citation_purpose\": \"适用依据\"}], \"evidence\": [{\"content\": \"工伤认定决定书，证明谭某华所受伤害为工伤\", \"evidence_type\": \"documentary\", \"submitted_by\": \"谭某华\", \"is_key_evidence\": true, \"admission_status\": \"admitted\", \"examination_status\": \"examined\", \"expert_institution\": \"\", \"expert_conclusion\": \"\"}, {\"content\": \"劳动能力鉴定结论，证明谭某华伤残玖级，无生活自理障碍\", \"evidence_type\": \"documentary\", \"submitted_by\": \"谭某华\", \"is_key_evidence\": true, \"admission_status\": \"admitted\", \"examination_status\": \"examined\", \"expert_institution\": \"\", \"expert_conclusion\": \"\"}, {\"content\": \"劳动人事争议仲裁裁决书，裁决工伤保险待遇应由工伤保险基金支付\", \"evidence_type\": \"documentary\", \"submitted_by\": \"谭某华\", \"is_key_evidence\": true, \"admission_status\": \"admitted\", \"examination_status\": \"examined\", \"expert_institution\": \"\", \"expert_conclusion\": \"\"}], \"judgment_results\": [{\"result_type\": \"dismissed\", \"specific_judgment\": \"撤销被告云阳县社会保险事务中心于2022年7月28日对原告谭某华作出（云社险函〔2022〕10号）《关于谭某华申请工伤待遇的复函》；责令被告云阳社保中心于本判决生效后30日内就原告谭某华申请的工伤保险待遇依法予以审核支付。\", \"reasoning\": \"社保中心以项目存在工伤保险费率浮动欠费为由暂停支付工伤保险待遇，该做法将用人单位未足额缴纳保费的后果转嫁给工伤职工，违反社会保险法第三十六条第一款的规定。社保中心应履行监管职责依法征缴欠费，但不能以未征缴到保费或怠于履行职责而损害原告利益。故撤销复函并责令依法审核支付。\", \"case_number\": \"(2022)渝0235行初56号\", \"cost_allocation\": \"\"}], \"case_summary\": {\"key_facts\": \"原告谭某华系云阳建设项目工人，2021年7月4日在工地受伤，被认定为工伤并鉴定为伤残玖级。该建设项目以项目参保，保险期覆盖受伤日。原告申请工伤保险待遇，被告云阳社保中心以项目存在工伤保险费率浮动欠费为由暂停支付。原告不服提起诉讼。\", \"disputed_issues\": \"被告暂停支付工伤保险待遇的复函是否合法。\", \"conclusion\": \"法院判决撤销被告作出的复函，责令其在30日内依法审核支付原告工伤保险待遇。\", \"amount_involved\": \"\", \"guiding_points\": \"在建筑业按项目参保中，社会保险经办机构依据未公开的规范性文件，将用人单位未缴纳上浮的工伤保险费作为暂停给付职工工伤保险金的前提条件，不仅违反了行政公开原则，也违反了职权法定原则，人民法院应当按照社会保险法第三十六条第一款判决社保机构依法及时核发工伤职工的工伤保险金。\", \"claim_amount\": \"\", \"judgment_amount\": \"\"}, \"legal_provision_elements\": [{\"provision_index\": 0, \"statute\": \"中华人民共和国社会保险法\", \"article\": \"36\", \"element_type\": \"subject_element\", \"co ion_position\": \"judgment_reason\", \"citation_purpose\": \"说理依据\"}, {\"case_number\": \"(2022)渝0235行初56号\", \"statute\": \"中华人民共和国行政诉讼法\", \"article\": \"70\", \"paragraph\": \"\", \"item\": \"2\", \"content\": \"行政行为适用法律、法规错误的，人民法院判决撤销或者部分撤销，并可以判决被告重新作出行政行为。\", \"citation_position\": \"related_info\", \"citation_purpose\": \"适用依据\"}, {\"case_number\": \"(2022)渝0235行初56号\", \"statute\": \"重庆市人力资源和社会保障局办公室关于工伤保险费率浮动有关问题的政策解答（一）的通知\", \"article\": \"6\", \"paragraph\": \"\", \"item\": \"\", \"content\": \"对未按时足额缴纳上浮工伤保险费的建设项目，暂停其工伤人员的待遇支付，补缴费用后的待遇按照渝府发〔2012〕22号文件有关规定执行。\", \"citation_position\": \"judgment_reason\", \"citation_purpose\": \"反驳依据\"}], \"evidence\": [{\"content\": \"行政机关作出的工伤认定决定书，认定谭某华于2021年7月4日在云阳建设项目工地清理渣土时受伤为工伤。\", \"evidence_type\": \"documentary\", \"submitted_by\": \"原告谭某华\", \"is_key_evidence\": true, \"admission_status\": \"admitted\", \"examination_status\": \"examined\", \"expert_institution\": \"\", \"expert_conclusion\": \"\"}, {\"content\": \"劳动能力鉴定结论，鉴定谭某华为伤残玖级，无生活自理障碍。\", \"evidence_type\": \"expert_opinion\", \"submitted_by\": \"原告谭某华\", \"is_key_evidence\": true, \"admission_status\": \"admitted\", \"examination_status\": \"examined\", \"expert_institution\": \"劳动能力鉴定委员会\", \"expert_conclusion\": \"谭某华伤残玖级，无生活自理障碍\"}, {\"content\": \"劳动人事争议仲裁委员会裁决书，裁决谭某华已参加工伤保险，一次性伤残补助金、一次性工伤医疗补助金、住院伙食补助费、医疗费、鉴定费属于工伤保险基金支付的范畴。\", \"evidence_type\": \"documentary\", \"submitted_by\": \"原告谭某华\", \"is_key_evidence\": true, \"admission_status\": \"admitted\", \"examination_status\": \"examined\", \"expert_institution\": \"\", \"expert_conclusion\": \"\"}], \"judgment_results\": [{\"result_type\": \"administrative_decision\", \"specific_judgment\": \"撤销被告云阳社保中心于2022年7月28日对原告谭某华作出（云社险函〔2022〕10号）《关于谭某华申请工伤待遇的复函》；责令被告云阳社保中心于本判决生效后30日内就原告谭某华申请的工伤保险待遇依法予以审核支付。\", \"reasoning\": \"法院认为，谭某华被认定为工伤，依法应享受工伤保险待遇。云阳社保中心以用人单位欠缴上浮工伤保险费为由暂停支付，但工伤保险是强制性保险，欠费应由社保中心依法征收，不能以此损害职工合法权益。且所依据的规范性文件未公开发布，对外不应产生效力，违反行政公开与职权法定原则。根据社会保险法第三十六条第一款，应撤销被诉复函并责令审核支付。\", \"case_number\": \"(2022)渝0235行初56号\", \"cost_allocation\": \"\"}], \"case_summary\": {\"key_facts\": \"重庆缔某建筑劳务有限公司承包云阳建设项目劳务，重庆某建设集团有限公司以项目形式参加工伤保险。谭某华系该项目工人，于2021年7月4日受伤，被认定为工伤，伤残玖级。劳动仲裁裁决工伤保险待遇由基金支付。谭某华申请待遇支付，云阳社保中心以该项目欠缴上浮工伤保险费54366.85元为由，依据内部通知暂停支付。谭某华起诉请求撤销该暂停支付行为。\", \"disputed_issues\": \"云阳社保中心暂停支付谭某华工伤保险待遇是否合法，即能否以用人单位未缴纳上浮工伤保险费为由拒绝向工伤职工支付工伤保险金。\", \"conclusion\": \"法院判决撤销云阳社保中心的暂停支付复函，并责令其在30日内依法审核支付谭某华的工伤保险待遇，确认社会保险法第三十六条第一款对工伤职工的直接保护，否定以未公开规范性文件限制待遇的做法。\", \"amount_involved\": \"\", \"guiding_points\": \"在建筑业按项目参保中，社会保险经办机构依据未公开的规范性文件，将用人单位未缴纳上浮的工伤保险费作为暂停给付职工工伤保险金的前提条件，不仅违反了行政公开原则，也违反了职权法定原则，人民法院应当按照社会保险法第三十六条第一款判决社保机构依法及时核发工伤职工的工伤保险金。\", \"claim_amount\": \"\", \"judgment_amount\": \"\"}, \"legal_provision_elements\": [{\"provision_index\": 0, \"statute\": \"中华人民共和国社会保险法\", \"article\": \"36\", \"element_type\": \"subject_element\", \"content\": \"职工因工作原因受到事故伤害或者患职业病，且经工伤认定的。\", \"applicable_fact_pattern\": \"谭某华在工地清理渣土时受伤，经行政机关确认为工伤。\"}, {\"provision_index\": 0, \"statute\": \"中华人民共和国社会保险法\", \"article\": \"36\", \"element_type\": \"legal_consequence\", \"content\": \"享受工伤保险待遇；经劳动能力鉴定丧失劳动能力的，享受伤残待遇。\", \"applicable_fact_pattern\": \"谭某华被鉴定为伤残玖级，应当享受一次性伤残补助金等工伤保险待遇。\"}, {\"provision_index\": 3, \"statute\": \"中华人民共和国行政诉讼法\", \"article\": \"70\", \"element_type\": \"act_element\", \"content\": \"行政行为适用法律、法规错误的。\", \"applicable_fact_pattern\": \"云阳社保中心依据未公开的内部通知暂停支付待遇，属适用法律错误。\"}, {\"provision_index\": 3, \"statute\": \"中华人民共和国行政诉讼法\", \"article\": \"70\", \"element_type\": \"legal_consequence\", \"content\": \"人民法院判决撤销或者部分撤销，并可以判决被告重新作出行政行为。\", \"applicable_fact_pattern\": \"法院撤销云阳社保中心的复函并责令其重新审核支付。\"}]}, \"eval\": {\"row_id\": \"700\", \"score\": 95.0, \"issues\": [\"guiding_case_number 为空\", \"judges 为空\", \"attorneys 为空\", \"trial_organizations 为空\"], \"court_case_count\": 1, \"judge_count\": 0, \"attorney_count\": 0, \"provision_count\": 5, \"evidence_count\": 3}}", "1422__v1": "{\"row_id\": \"1422\", \"input\": {\"id\": \"1422\", \"web_name\": \"人民法院案例库\", \"case_type\": \"行政-行政登记\", \"storage_no\": \"2024-12-3-006-006\"}, \"output\": {\"guiding_case\": {\"guiding_case_number\": \"\", \"guiding_case_name\": \"安徽某汽车销售服务有限公司诉蒙城县市场监督管理局工商登记案\", \"publication_date\": \"2021-09-01\", \"binding_force\": \"persuasive\", \"guiding_points\": \"行政机关设定和实施行政许可，应当依照法定的权限、范围、条件和程序，不得随意增设条件。根据《中华人民共和国公司登记管理条例》的规定，申请设立公司应当提交的公司住所证明是指能够证明公司对其住所享有使用权的文件，并由公司登记机关依法对材料的真实性进行审核。至于该住所是否符合从事特定经营活动的要求，不属于公司登记机关在设立登记时应当审查的内容。公司登记机关以申请人未能提交住所符合从事特定经营活动要求的材料为由不予登记的，属于增设许可条件，依法应予撤销。\", \"key_words\": [\"行政\", \"行政登记\", \"工商登记\", \"增设登记条件\", \"住所地\"], \"case_level\": \"typical_case\", \"trial_procedure\": \"一审\", \"storage_no\": \"2024-12-3-006-006\", \"source_url\": \"https://rmfyalk.court.gov.cn\", \"judgment_mean\": \"\"}, \"case_type\": {\"category\": \"administrative\", \"level1\": \"行政\", \"level2\": \"行政登记\"}, \"court_cases\": [{\"case_number\": \"(2021)皖1622行初32号\", \"filing_date\": \"2021-04-01\", \"judgment_date\": \"2021-09-01\", \"trial_level\": \"first_instance\", \"trial_procedure\": \"一审\", \"court\": {\"name\": \"蒙城县人民法院\", \"court_level\": \"basic\"}, \"status\": \"effective\", \"cause_of_action\": \"行政登记纠纷\", \"dispute_resolution_type\": \"litigation\", \"party_count\": null}], \"legal_subjects\": [{\"name\": \"安徽某汽车销售服务有限公司\", \"subject_type\": \"organization\", \"org_type\": \"company\", \"credit_code\": null, \"roles\": [{\"role_code\": \"plaintiff\", \"role_name\": \"原告\", \"case_number\": \"(2021)皖1622行初32号\"}]}, {\"name\": \"蒙城县市场监督管理局\", \"subject_type\": \"organization\", \"org_type\": \"government_agency\", \"credit_code\": null, \"roles\": [{\"role_code\": \"defendant\", \"role_name\": \"被告\", \"case_number\": \"(2021)皖1622行初32号\"}]}], \"attorneys\": [], \"judges\": [], \"prosecutors\": [], \"trial_organizations\": [{\"case_number\": \"(2021)皖1622行初32号\", \"members\": [], \"summary\": \"合议庭组成人员信息未在文本中披露。\"}], \"legal_provisions\": [{\"case_number\": \"(2021)皖1622行初32号\", \"statute\": \"中华人民共和国公司登记管理条例\", \"article\": \"20\", \"paragraph\": \"2\", \"item\": \"8\", \"content\": \"申请设立有限责任公司，应当向公司登记机关提交公司住所证明。\", \"citation_position\": \"judgment_reason\", \"citation_purpose\": \"适用依据\"}, {\"case_number\": \"(2021)皖1622行初32号\", \"statute\": \"中华人民共和国公司登记管理条例\", \"article\": \"10\", \"paragraph\": \"\", \"item\": \"\", \"content\": \"公司的登记事项应当符合法律、行政法规的规定。不符合法律、行政法规规定的，公司登记机关不予登记。\", \"citation_position\": \"basic_facts\", \"citation_purpose\": \"说理依据\"}, {\"case_number\": \"(2021)皖1622行初32号\", \"statute\": \"中华人民共和国行政诉讼法\", \"article\": \"70\", \"paragraph\": \"\", \"item\": \"1\", \"content\": \"行政行为有下列情形之一的，人民法院判决撤销或者部分撤销，并可以判决被告重新作出行政行为：（一）主要证据不足的；\", \"citation_position\": \"related_law\", \"citation_purpose\": \"适用依据\"}, {\"case_number\": \"(2021)皖1622行初32号\", \"statute\": \"中华人民共和国行政诉讼法\", \"article\": \"70\", \"paragraph\": \"\", \"item\": \"2\", \"content\": \"行政行为有下列情形之一的，人民法院判决撤销或者部分撤销，并可以判决被告重新作出行政行为：（二）适用法律、法规错误的；\", \"citation_position\": \"related_law\", \"citation_purpose\": \"适用依据\"}, {\"case_number\": \"(2021)皖1622行初32号\", \"statute\": \"中华人民共和国公司法\", \"article\": \"\", \"paragraph\": \"\", \"item\": \"\", \"content\": \"公司登记机关依法对公司设立申请进行审查。\", \"citation_position\": \"judgment_reason\", \"citation_purpose\": \"说理依据\"}], \"evidence\": [{\"content\": \"原告向被告提交的设立登记申请材料，包括公司住所证明等\", \"evidence_type\": \"documentary\", \"submitted_by\": \"安徽某汽车销售服务有限公司\", \"is_key_evidence\": true, \"admission_status\": \"admitted\", \"examination_status\": \"examined\", \"expert_institution\": \"\", \"expert_conclusion\": \"\"}], \"judgment_results\": [{\"result_type\": \"dismissed\", \"specific_judgment\": \"一、撤销蒙城县市场监督管理局2021年4月15日作出的（蒙市监）登记内驳字〔2021〕第0415-01号《登记驳回通知书》；二、责令蒙城县市场监督管理局于本判决生效之日起三十个工作日内对安徽某汽车销售公司的申请重新作出决定。\", \"reasoning\": \"法院认为，原告申请材料齐全、符合法定形式，被告以未提交土地和规划证明材料为由不予登记，没有事实和法律依据。根据《公司登记管理条例》第20条第2款第8项，公司住所证明仅需证明使用权，住所是否适合特定经营活动不属于设立登记时应审查内容。被告增设许可条件，违反行政许可法精神。故依法撤销不予登记决定并责令重作。\", \"case_number\": \"(2021)皖1622行初32号\", \"cost_allocation\": \"\"}], \"case_summary\": {\"key_facts\": \"2021年4月1日，安徽某汽车销售公司申请设立蒙城某机动车检测公司，蒙城县市场监督管理局受理后，以拟设立公司住所不符合规定为由，通知补交土地和规划证明材料，后以未提交为由决定不予登记。安徽某汽车销售公司起诉请求撤销该决定。\", \"disputed_issues\": \"市场监督管理局以申请人未提交住所符合特定经营活动的材料为由不予登记，是否属于增设许可条件，不予登记决定是否合法。\", \"conclusion\": \"法院判决撤销不予登记决定，责令重新作出决定，认为申请材料齐全、符合法定形式，住所用途审查不属于设立登记时应当审查的内容，被告增设许可条件违法。\", \"amount_involved\": \"\", \"guiding_points\": \"行政机关设定和实施行政许可，应当依照法定的权限、范围、条件和程序，不得随意增设条件。申请设立公司应当提交的公司住所证明是指能够证明公司对其住所享有使用权的文件，至于该住所是否符合从事特定经营活动的要求，不属于公司登记机关在设立登记时应当审查的内容。公司登记机关以申请人未能提交住所符合从事特定经营活动要求的材料为由不予登记的，属于增设许可条件，依法应予撤销。\", \"claim_amount\": \"\", \"judgment_amount\": \"\"}, \"legal_provision_elements\": [{\"provision_index\": 0, \"statute\": \"中华人民共和国公司登记管理条例\", \"article\": \"20\", \"element_type\": \"act_element\", \"content\": \"申请设立有限责任公司，应当向公司登记机关提交公司住所证明。\", \"applicable_fact_pattern\": \"申请人提交的材料中包含能够证明公司对其住所享有使用权的文件。\"}, {\"provision_index\": 0, \"statute\": \"中华人民共和国公司登记管理条例\", \"article\": \"20\", \"element_type\": \"legal_consequence\", \"content\": \"材料齐全、符合法定形式的，应当予以登记。\", \"applicable_fact_pattern\": \"申请人已提交全部法定材料且符合要求。\"}, {\"provision_index\": 1, \"statute\": \"中华人民共和国公司登记管理条例\", \"article\": \"10\", \"element_type\": \"act_element\", \"content\": \"公司的登记事项应当符合法律、行政法规的规定。\", \"applicable_fact_pattern\": \"拟登记事项存在违反法律、行政法规的禁止性规定。\"}, {\"provision_index\": 1, \"statute\": \"中华人民共和国公司登记管理条例\", \"article\": \"10\", \"element_type\": \"legal_consequence\", \"content\": \"不符合法律、行政法规规定的，不予登记。\", \"applicable_fact_pattern\": \"登记事项实质违法。\"}]}, \"eval\": {\"row_id\": \"1422\", \"score\": 90.0, \"issues\": [\"guiding_case_number 为空\", \"judges 为空\", \"attorneys 为空\", \"legal_provisions[4].article 为空\"], \"court_case_count\": 1, \"judge_count\": 0, \"attorney_count\": 0, \"provision_count\": 5, \"evidence_count\": 1}}", "1422__v2": "{\"row_id\": \"1422\", \"input\": {\"id\": \"1422\", \"web_name\": \"人民法院案例库\", \"case_type\": \"行政-行政登记\", \"storage_no\": \"2024-12-3-006-006\"}, \"output\": {\"guiding_case\": {\"guiding_case_number\": \"\", \"guiding_case_name\": \ 据\"}, {\"case_number\": \"(2021)皖1622行初32号\", \"statute\": \"中华人民共和国行政诉讼法\", \"article\": \"70\", \"paragraph\": \"\", \"item\": \"1\", \"content\": \"行政行为主要证据不足的，人民法院判决撤销或者部分撤销，并可以判决被告重新作出行政行为。\", \"citation_position\": \"related_law\", \"citation_purpose\": \"适用依据\"}, {\"case_number\": \"(2021)皖1622行初32号\", \"statute\": \"中华人民共和国行政诉讼法\", \"article\": \"70\", \"paragraph\": \"\", \"item\": \"2\", \"content\": \"行政行为适用法律、法规错误的，人民法院判决撤销或者部分撤销，并可以判决被告重新作出行政行为。\", \"citation_position\": \"related_law\", \"citation_purpose\": \"适用依据\"}], \"evidence\": [{\"content\": \"安徽某汽车销售公司提交的设立登记申请材料，包括公司住所证明等文件\", \"evidence_type\": \"documentary\", \"submitted_by\": \"安徽某汽车销售服务有限公司\", \"is_key_evidence\": true, \"admission_status\": \"admitted\", \"examination_status\": \"examined\", \"expert_institution\": \"\", \"expert_conclusion\": \"\"}], \"judgment_results\": [{\"result_type\": \"administrative_decision\", \"specific_judgment\": \"一、撤销蒙城县市场监督管理局2021年4月15日作出的（蒙市监）登记内驳字〔2021〕第0415-01号《登记驳回通知书》；二、责令蒙城县市场监督管理局于本判决生效之日起三十个工作日内对安徽某汽车销售公司的申请重新作出决定。\", \"reasoning\": \"蒙城县市场监督管理局认为安徽某汽车销售公司未提交土地和规划证明材料，不能证明拟设立公司的住所能够从事机动车检测，对该公司申请设立登记蒙城某机动车检测公司决定不予登记，没有事实和法律依据。《公司登记管理条例》规定的住所证明是能够证明公司对其住所享有使用权的文件，至于该住所是否符合特定经营活动要求，不属于设立登记审查范围。被告增设许可条件，依法应予撤销。\", \"case_number\": \"(2021)皖1622行初32号\", \"cost_allocation\": \"\"}], \"case_summary\": {\"key_facts\": \"2021年4月1日，安徽某汽车销售公司向蒙城县市场监督管理局申请设立蒙城某机动车检测公司，并提交了相关材料。该局受理后要求补正土地和规划证明材料，后以未提供为由，于4月15日作出不予登记决定。安徽某汽车销售公司不服，提起诉讼。\", \"disputed_issues\": \"公司登记机关以申请材料中住所不符合特定经营活动要求为由不予设立登记，是否增设了许可条件，是否合法。\", \"conclusion\": \"法院判决撤销不予登记决定，并责令重新作出决定，认定申请材料齐全，公司住所证明系证明使用权的文件，住所是否适合特定经营活动不属于登记审查范围，被告增设条件违法。\", \"amount_involved\": \"\", \"guiding_points\": \"行政机关设定和实施行政许可，应当依照法定的权限、范围、条件和程序，不得随意增设条件。根据《中华人民共和国公司登记管理条例》的规定，申请设立公司应当提交的公司住所证明是指能够证明公司对其住所享有使用权的文件，并由公司登记机关依法对材料的真实性进行审核。至于该住所是否符合从事特定经营活动的要求，不属于公司登记机关在设立登记时应当审查的内容。公司登记机关以申请人未能提交住所符合从事特定经营活动要求的材料为由不予登记的，属于增设许可条件，依法应予撤销。\", \"claim_amount\": \"\", \"judgment_amount\": \"\"}, \"legal_provision_eleme t\": \"郑某提供的证明杭绍台高速公路临海段建设指挥部和括苍镇人民政府共同实施了涉案强制清理苗木行为的证据\", \"evidence_type\": \"documentary\", \"submitted_by\": \"郑某\", \"is_key_evidence\": true, \"admission_status\": \"admitted\", \"examination_status\": \"examined\", \"expert_institution\": \"\", \"expert_conclusion\": \"\"}, {\"content\": \"某工造价咨询公司出具的《工程造价咨询报告书》，确定郑某苗木定案造价为1615061元\", \"evidence_type\": \"expert_opinion\", \"submitted_by\": \"临海市人民政府、临海市括苍镇人民政府\", \"is_key_evidence\": true, \"admission_status\": \"not_admitted\", \"examination_status\": \"examined\", \"expert_institution\": \"某工造价咨询公司\", \"expert_conclusion\": \"确定郑某苗木定案造价为1615061元\"}, {\"content\": \"某房地产评估有限公司出具的《估价报告》，确定郑某所属的苗木大棚在价值时点2017年6月10日用于征收的评估价值为235795元\", \"evidence_type\": \"expert_opinion\", \"submitted_by\": \"临海市人民政府、临海市括苍镇人民政府\", \"is_key_evidence\": true, \"admission_status\": \"not_admitted\", \"examination_status\": \"examined\", \"expert_institution\": \"某房地产评估有限公司\", \"expert_conclusion\": \"确定郑某所属的苗木大棚在价值时点2017年6月10日用于征收的评估价值为235795元\"}], \"judgment_results\": [{\"result_type\": \"liable\", \"specific_judgment\": \"一、撤销台州市中级人民法院（2017）浙10赔初10号行政赔偿判决；二、临海市人民政府、临海市括苍镇人民政府赔偿郑某人民币二百四十万元，限于判决发生法律效力之日起一个月内付清；三、驳回郑某的其他赔偿请求。\", \"reasoning\": \"法院生效裁判认为，郑某的举证能证明杭绍台高速公路临海段建设指挥部和括苍镇人民政府共同实施了涉案强制清理苗木的行为，临海市人民政府作为组建机关应对指挥部的行为承担法律责任。两被告在未进行补偿的情况下，违反法定程序实施强制清理行为违法，应承担国家赔偿责任。郑某主张恢复原状不予支持，应给付赔偿金。被告提供的工程造价咨询报告书和估价报告因单方委托、未送达、资质不明等原因不能作为定案依据。由于强制清理时苗木品种、数量和附属物等具体情况未经公证或双方认可，已无法重新评估。各方当事人均未能进一步提供证据，法院结合各方主张、在案证据，遵循法官职业道德，运用逻辑推理和生活经验，酌情确定赔偿数额为240万元。原审判决适用法律有误，应予纠正。\", \"case_number\": \"(2018)浙行赔终8号\", \"cost_allocation\": \"\"}], \"case_summary\": {\"key_facts\": \"郑某与浙江省临海市括苍镇某村等村民签订土地承包经营权转包合同，承租近35亩土地用于种植苗木，约定种植时间6年。因杭绍台高速公路临海段括苍枢纽落地匝道延长工程项目建设的需要，郑某的苗木基地被划为建设用地。因补偿问题未能达成一致，2017年6月29日，杭绍台高速公路临海段建设指挥部和括苍镇人民政府组织人员对苗木基地强行清理。此前，指挥部委托某房地产评估有限公司和某工造价咨询公司分别出具估价报告和工程造价咨询报告书，确定苗木大棚价值235795元，苗木造价1615061元。郑某提起行政赔偿诉讼。\", \"disputed_issues\": \"单方委托的评估报告能否作为赔偿依据；因客观原因无法鉴定时，赔偿数额如何确定。\", \"conclusion\": \"二审法院撤销一审判决，酌情确定赔偿总额240万元，驳回其他请求。\", \"amount_in smissed\", \"specific_judgment\": \"驳回原告屈某洪的起诉。\", \"reasoning\": \"一审法院认为屈某洪与被诉行政行为无利害关系，裁定驳回起诉。\", \"case_number\": \"(2017)渝0117行初234号\", \"cost_allocation\": \"\"}, {\"result_type\": \"remanded\", \"specific_judgment\": \"撤销重庆市合川区人民法院(2017)渝0117行初234号行政裁定；本案指令重庆市合川区人民法院继续审理。\", \"reasoning\": \"法院生效裁判认为，屈某洪作为债权人，已申请人民法院查封涉案采矿权，北碚区国土局在明知查封的情况下仍将采矿权变更登记至某海公司名下，该行政行为可能影响屈某洪债权的实现，屈某洪与被诉行政行为之间具有利害关系，其具备原告主体资格。一审裁定驳回起诉错误，应予撤销并指令继续审理。\", \"case_number\": \"(2018)渝01行终435号\", \"cost_allocation\": \"\"}], \"case_summary\": {\"key_facts\": \"黄某以后某公司名义与富某公司签订采矿权转让合同，后某公司未成立。屈某洪因与黄某民间借贷纠纷申请财产保全，北碚区法院裁定查封黄某以后某公司名义受让的采矿权合同权益及设备，并将相关文书送达北碚区国土局。后北碚区国土局仍将采矿权变更登记至某海公司名下并颁发采矿许可证。屈某洪提起行政诉讼请求确认颁证行为违法。\", \"disputed_issues\": \"债权人屈某洪是否与被诉颁证行政行为有利害关系，从而具备原告主体资格。\", \"conclusion\": \"二审法院认为，屈某洪的债权因法院查封而与涉案采矿权产生特定联系，行政机关在明知查封的情况下变更登记可能损害债权实现，故屈某洪与原行政行为有利害关系，符合起诉条件。二审撤销一审驳回起诉的裁定，指令一审继续审理。\", \"amount_involved\": \"\", \"guiding_points\": \"\", \"claim_amount\": \"\", \"judgment_amount\": \"\"}, \"legal_provision_elements\": [{\"provision_index\": 0, \"statute\": \"中华人民共和国行政诉讼法\", \"article\": \"25\", \"element_type\": \"subject_element\", \"content\": \"行政行为的相对人以及其他与行政行为有利害关系的公民、法人或者其他组织。\", \"applicable_fact_pattern\": \"起诉人主张其合法权益受行政行为影响，并与行政行为存在利害关系。\"}, {\"provision_index\": 0, \"statute\": \"中华人民共和国行政诉讼法\", \"article\": \"25\", \"element_type\": \"act_element\", \"content\": \"有权提起诉讼。\", \"applicable_fact_pattern\": \"起诉人认为行政行为侵犯其合法权益。\"}, {\"provision_index\": 1, \"statute\": \"中华人民共和国行政诉讼法\", \"article\": \"12\", \"element_type\": \"subject_element\", \"content\": \"认为行政机关侵犯其他人身权、财产权等合法权益的公民、法人或者其他组织。\", \"applicable_fact_pattern\": \"起诉人主张财产权等合法权益受侵犯。\"}, {\"provision_index\": 5, \"statute\": \"最高人民法院关于适用《中华人民共和国行政诉讼法》的解释\", \"article\": \"13\", \"element_type\": \"act_element\", \"content\": \"债权人以行政机关对债务人所作的行政行为损害债权实现为由提起行政诉讼。\", \"applicable_fact_pattern\": \"债权人已申请法院查封债务人财产，行政机关仍对该财产作出变更登记，影响债权实现。\"}, {\"provision_index\": 5, \"statute\": \"最高人民法院关于适用《中华人民共和国行政诉讼法》的解释\", \"a 系，具备原告主体资格。一审裁定驳回起诉错误，应予撤销。\", \"case_number\": \"(2018)渝01行终435号\", \"cost_allocation\": \"\"}], \"case_summary\": {\"key_facts\": \"2014年10月，黄某以后某公司名义与富某公司签订采矿权转让合同，后某公司未能成立。屈某洪因与黄某民间借贷纠纷向北碚区法院申请财产保全，法院于2016年6月14日裁定查封黄某以后某公司名义受让的采矿权受让合同权益及设备。2016年8月，北碚区国土局将采矿权变更登记至某海公司名下并颁发许可证。屈某洪认为该变更登记致使其债权无法执行，遂提起行政诉讼，请求确认颁证行为违法。\", \"disputed_issues\": \"屈某洪是否具备原告主体资格，即其与被诉行政行为是否具有利害关系。\", \"conclusion\": \"二审法院裁定撤销一审驳回起诉的裁定，指令继续审理，认定屈某洪因法院查封而与被诉行政行为产生利害关系，具有原告资格。\", \"amount_involved\": \"\", \"guiding_points\": \"\", \"claim_amount\": \"\", \"judgment_amount\": \"\"}, \"legal_provision_elements\": [{\"provision_index\": 0, \"statute\": \"中华人民共和国行政诉讼法\", \"article\": \"25\", \"element_type\": \"subject_element\", \"content\": \"行政行为的相对人以及其他与行政行为有利害关系的公民、法人或者其他组织，有权提起诉讼。\", \"applicable_fact_pattern\": \"起诉人与被诉行政行为存在法律上的利害关系，其合法权益可能受到该行政行为的影响。\"}, {\"provision_index\": 1, \"statute\": \"中华人民共和国行政诉讼法\", \"article\": \"12\", \"element_type\": \"object_element\", \"content\": \"认为行政机关侵犯其他人身权、财产权等合法权益的，属于行政诉讼受案范围。\", \"applicable_fact_pattern\": \"债权人因行政机关变更登记行为可能导致其债权无法实现，属于财产权益受损。\"}, {\"provision_index\": 4, \"statute\": \"最高人民法院关于适用《中华人民共和国行政诉讼法》的解释\", \"article\": \"13\", \"element_type\": \"act_element\", \"content\": \"债权人以行政机关对债务人所作的行政行为损害债权实现为由提起行政诉讼，需满足行政行为作出时依法应予保护或考虑的情形。\", \"applicable_fact_pattern\": \"行政机关在已知法院对债务人财产采取强制执行措施并通知登记机构后，仍为债务人办理转移登记，可能影响债权实现。\"}]}, \"eval\": {\"row_id\": \"2843\", \"score\": 95.0, \"issues\": [\"guiding_case_number 为空\", \"judges 为空\", \"attorneys 为空\", \"trial_organizations 为空\"], \"court_case_count\": 2, \"judge_count\": 0, \"attorney_count\": 0, \"provision_count\": 5, \"evidence_count\": 4}}", "3940__v1": "{\"row_id\": \"3940\", \"input\": {\"id\": \"3940\", \"web_name\": \"人民法院案例库\", \"case_type\": \"行政-XX（行政行为）公益诉讼\", \"storage_no\": \"2023-12-3-022-003\"}, \"output\": {\"guiding_case\": {\"guiding_case_number\": \"\", \"guiding_case_name\": \"景东彝族自治县人民检察院诉景东县文井镇人民政府不履行传统村落保护职责行政公益诉讼案\", \"publication_date\": \"2022-06-14\", \"bind 。一审驳回诉讼请求，二审维持。\", \"disputed_issues\": \"本专利权利要求是否具备创造性，即材料特征（滴眼剂瓶材质与药物相容性）是否对产品的形状、构造或者其结合产生影响，从而为实用新型带来创造性。\", \"conclusion\": \"最高人民法院二审判决驳回上诉，维持原判，认为材料特征未对产品形状、结构产生影响，未贡献创造性，本专利无效。\", \"amount_involved\": null, \"guiding_points\": \"实用新型专利权的保护对象是由形状、构造或者其结合所构成的技术方案。如果权利要求中非形状构造类特征对产品的形状、构造或者其结合不具有影响，则其通常对于该权利要求的创造性不产生贡献。\", \"claim_amount\": null, \"judgment_amount\": null}, \"legal_provision_elements\": [{\"provision_index\": 0, \"statute\": \"中华人民共和国专利法\", \"article\": \"22\", \"element_type\": \"subject_element\", \"content\": \"适用对象为实用新型专利\", \"applicable_fact_pattern\": \"本专利为实用新型专利\"}, {\"provision_index\": 0, \"statute\": \"中华人民共和国专利法\", \"article\": \"22\", \"element_type\": \"act_element\", \"content\": \"与现有技术相比，该实用新型应具有实质性特点和进步\", \"applicable_fact_pattern\": \"判断权利要求相比现有技术是否具有实质性特点和进步\"}, {\"provision_index\": 0, \"statute\": \"中华人民共和国专利法\", \"article\": \"22\", \"element_type\": \"legal_consequence\", \"content\": \"不具备创造性的实用新型不应授予专利权或应被宣告无效\", \"applicable_fact_pattern\": \"本专利被宣告全部无效\"}]}, \"eval\": {\"row_id\": \"4162\", \"score\": 93.0, \"issues\": [\"guiding_case_number 为空\", \"judges 为空\", \"attorneys 为空\", \"trial_organizations 为空\", \"evidence 为空\"], \"court_case_count\": 2, \"judge_count\": 0, \"attorney_count\": 0, \"provision_count\": 2, \"evidence_count\": 0}}", "3072__v1": "{\"row_id\": \"3072\", \"input\": {\"id\": \"3072\", \"web_name\": \"人民法院案例库\", \"case_type\": \"行政-行政强制措施\", \"storage_no\": \"2023-12-3-002-004\"}, \"output\": {\"guiding_case\": {\"guiding_case_number\": \"\", \"guiding_case_name\": \"某房地产公司诉文山市住房和城乡建设局行政强制措施案\", \"publication_date\": \"2021-07-02\", \"binding_force\": \"persuasive\", \"guiding_points\": \"商品房买卖合同网签备案系统是用于管理房地产企业的商品房预售、现售过程，便于房地产企业在商品房合同签订前、后进行房屋状态的核查，对于房屋已销售、查封、抵押、冻结、已预告登记等状态予以提示，通过信息技术手段，切实保护购房人的合法权益，可以有效遏制一房多卖、违规销售等行为，维护房地产市场运营秩序和健康发展。现行的法律、法规并没有规定及授权给房地产主管部门可以行使冻结房地产企业商品房网签备案系统的权限，房地产主管部门不能因其他因素直接采取冻结措施予以冻结。\", \"key_words\": [\"行政\", \"行政强制措施\", \"实施主体\", \"房地产主管部门\", \"法律、法规规定\", \"行政权限\",
