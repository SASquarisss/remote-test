const RAW_DATA = {"3358": "{\"row_id\": \"3358\", \"input\": {\"id\": \"3358\", \"web_name\": \"人民法院案例库\", \"case_type\": \"行政-商标相关行政案件\", \"storage_no\": \"2023-09-3-029-028\"}, \"output\": {\"guiding_case\": {\"guiding_case_number\": \"\", \"guiding_case_name\": \"法国某某某兄弟股份有限公司等与李某某等商标撤销复审行政纠纷案\", \"publication_date\": \"2011-11-17\", \"binding_force\": \"persuasive\", \"guiding_points\": \"商标法规定注册商标连续3年停止使用撤销制度的立法目的在于激活商标资源，清理闲置商标，撤销只是手段，而不是目的。只要在商业活动中公开、真实地使用了注册商标，且注册商标的使用行为本身没有违反商标法律规定，则注册商标权利人已经尽到法律规定的使用义务。使用争议商标有关的其他经营活动中是否违反其他方面的法律规定，并非商标法第四十四条第四项所要规范和调整的问题。\", \"key_words\": [\"行政\", \"商标撤销复审行政纠纷\", \"连续3年停止使用\", \"真实\", \"善意\", \"撤销\"], \"case_level\": \"typical_case\", \"trial_procedure\": \"再审\", \"storage_no\": \"2023-09-3-029-028\", \"source_url\": \"https://rmfyalk.court.gov.cn\", \"judgment_mean\": \"\"}, \"case_type\": {\"category\": \"administrative\", \"level1\": \"行政\", \"level2\": \"商标相关行政案件\"}, \"court_cases\": [{\"case_number\": \"(2008)一中行初字第40号\", \"filing_date\": \"2008-01-01\", \"judgment_date\": \"2008-04-08\", \"trial_level\": \"first_instance\", \"trial_procedure\": \"一审\", \"court\": {\"name\": \"北京市第一中级人民法院\", \"court_level\": \"intermediate\"}, \"status\": \"effective\", \"cause_of_action\": \"商标撤销复审行政纠纷\", \"dispute_resolution_type\": \"litigation\", \"party_count\": null}, {\"case_number\": \"(2008)高行终字第509号\", \"filing_date\": \"2008-01-01\", \"judgment_date\": \"2008-11-14\", \"trial_level\": \"second_instance\", \"trial_procedure\": \"二审\", \"court\": {\"name\": \"北京市高级人民法院\", \"court_level\": \"high\"}, \"status\": \"effective\", \"cause_of_action\": \"商标撤销复审行政纠纷\", \"dispute_resolution_type\": \"litigation\", \"party_count\": null}, {\"case_number\": \"(2010)知行字第55号\", \"filing_date\": \"2010-01-01\", \"judgment_date\": \"2011-11-17\", \"trial_level\": \"retrial\", \"trial_procedure\": \"再审审查\", \"court\": {\"name\": \"最高人民法院\", \"court_level\": \"supreme\"}, \"status\": \"effective\", \"cause_of_action\": \"商标撤销复审行政纠纷\", \"di : \"3\", \"paragraph\": \"\", \"item\": \"\", \"content\": \"商标法和本条例所称商标的使用，包括将商标用于商品、商品包装或者容器以及商品交易文书上，或者将商标用于广告宣传、展览以及其他商业活动中。\", \"citation_position\": \"judgment_reason\", \"citation_purpose\": \"说理依据\"}, {\"case_number\": \"(2010)知行字第55号\", \"statute\": \"中华人民共和国商标法实施条例\", \"article\": \"39\", \"paragraph\": \"3\", \"item\": \"\", \"content\": \"有商标法第四十四条第（四）项行为的，任何人可以向商标局申请撤销该注册商标，并说明有关情况。\", \"citation_position\": \"judgment_reason\", \"citation_purpose\": \"说理依据\"}], \"evidence\": [{\"content\": \"李某某与某提公司签订的商标使用许可合同，约定某提公司在中国境内在第33类葡萄酒产品上使用争议商标；某提公司销售的某斯特干红葡萄酒增值税发票多张；进口某斯特干红葡萄酒的相关材料。\", \"evidence_type\": \"documentary\", \"submitted_by\": \"李某某\", \"is_key_evidence\": true, \"admission_status\": \"admitted\", \"examination_status\": \"examined\", \"expert_institution\": \"\", \"expert_conclusion\": \"\"}], \"judgment_results\": [{\"result_type\": \"dismissed\", \"specific_judgment\": \"驳回法国某某某兄弟股份有限公司的再审申请。\", \"reasoning\": \"注册商标连续3年停止使用撤销制度的立法目的在于激活商标资源，清理闲置商标，撤销只是手段而非目的。只要在商业活动中公开、真实地使用了注册商标，且使用行为本身没有违反商标法律规定，则权利人已尽到使用义务。本案证据证明某提公司对争议商标进行了公开、真实的使用，故不适用连续3年停止使用的撤销规定。其他经营活动是否违反进出口等法律，不属于商标法第四十四条第四项调整范围。\", \"case_number\": \"(2010)知行字第55号\", \"cost_allocation\": \"\"}], \"case_summary\": {\"key_facts\": \"争议商标于2000年核准注册，后转让给李某某。2005年，法国某公司以连续3年停止使用为由申请撤销。商标局决定撤销，李某某申请复审并提交商标使用许可合同、销售发票等证据，证明其许可某提公司进行商业性使用。商标评审委员会认定使用合法，维持注册。法国某公司不服诉至法院，一、二审均维持评审决定。法国某公司向最高人民法院申请再审。\", \"disputed_issues\": \"争议商标是否属于连续3年停止使用而应予撤销的情形；其他经营活动是否违反法律是否影响商标使用行为的认定。\", \"conclusion\": \"最高人民法院认为，在案证据足以证明争议商标在商业活动中被公开、真实地使用，不构成连续3年停止使用，故驳回再审申请，维持争议商标注册。\", \"amount_involved\": \"\", \"guiding_points\": \"\", \"claim_amount\": \"\", \"judgment_amount\": \"\"}, \"legal_provision_elements\": [{\"provision_index\": 0, \"statute\": \"中华人民共和国商标法\", \"article\": \"44\", \"element_type\": \"act_element\", \"content\": \"注册商标连续3年停止使用\", \"applicable_fact_pattern\": \"权利人未在商业活动中公开、真实地使用注册商标，导致商标闲置。\"}, {\"provision_index\": 0, \"statute\": \"中华人民共和国商标法\", \"article\": \"44\", \"element_type\": \"legal_consequence\", \"content\": \"由商标局责令限期改正或者撤销其注册商标\", \"applicable_fact_pattern\": \"注册商标连续3年停止使用，且无法证明存在正当理由。\"}]}, \"eval\": {\"row_id\": \"3358\", \"score\": 95.0, \"issues\": [\"guiding_case_number 为空\", \"judges 为空\", \"attorneys 为空\", \"trial_organizations 为空\"], \"court_case_count\": 3, \"judge_count\": 0, \"attorney_count\": 0, \"provision_count\": 3, \"evidence_count\": 1}}", "2292": "{\"row_id\": \"2292\", \"input\": {\"id\": \"2292\", \"web_name\": \"人民法院案例库\", \"case_type\": \"行政-不履行XX职责\", \"storage_no\": \"2024-12-3-021-005\"}, \"output\": {\"guiding_case\": {\"guiding_case_number\": \"\", \"guiding_case_name\": \"孟某诉滨海县医疗保险基金管理中心不履行给付基本医疗保险金职责案\", \"publication_date\": \"2022-07-01\", \"binding_force\": \"persuasive\", \"guiding_points\": \"1.规范性文件不得违反上位法的规定。人民法院在审理单独行政行为诉讼案件时，应当对行政行为依据的规范性文件进行合法性审查。经审查认为不合法的，不得作为认定行政行为合法的依据。 2.在不履行给付基本医疗保险金职责之诉中，地方性规范性文件对产生交通事故的责任类型未予区分，突破上位法将不予补偿范围仅限定于应当由第三人负担范围内的规定的，人民法院不应予以参照适用。\", \"key_words\": [\"行政\", \"不履行给付基本医疗保险金职责\", \"上位法规定\", \"地方规范性文件\", \"主动审查\"], \"case_level\": \"typical_case\", \"trial_procedure\": \"再审\", \"storage_no\": \"2024-12-3-021-005\", \"source_url\": \"https://rmfyalk.court.gov.cn\", \"judgment_mean\": \"\"}, \"case_type\": {\"category\": \"administrative\", \"level1\": \"行政\", \"level2\": \"不履行给付基本医疗保险金职责\"}, \"court_cases\": [{\"case_number\": \"(2018)苏0925行初186号\", \"filing_date\": \"2018-01-01\", \"judgment_date\": \"2018-10-31\", \"trial_level\": \"first_instance\", \"trial_procedure\": \"一审\", \"court\": {\"name\": \"江苏省建湖县人民法院\", \"court_level\": \"basic\"}, \"status\": \"appealed\", \"cause_of_action\": \"不履行给付基本医疗保险金职责\", \"dispute_resolution_type\": \"litigation\", \"party_count\": null}, {\"case_number\": \"(2019)苏09行终184号\", \"filing_date\": \"2019-01-01\", \"judgment_date\": \"2019-06-18\", \"trial_level\": \"second_instance\", \"trial_procedure\": \"二审\", \"court\": {\"name\": \"江苏省盐城市中级人民法院\", \"court_level\": \"intermediate\"}, \"status\": \"appealed\", \"cause_of_action\": \"不履行给付基本医疗保险金职责\", \"dispute_resolution_type\": \"litigation\", \"party_count\": null}, {\"case_number\": \"(2021)苏行再30号\", \"filing_date\": \"2021-01-01\", \"judgment_date\": \"2022-07-01\", \"trial_level\": \"retrial\", \"trial_procedure\": \"再审\", \"court\": {\"name\": \"江苏省高级人民法院\", \"court_level\": \"high\"}, \"status\": \"effective\", \"cause_of_action\": \"不履行给付基本医疗保险金职责\", \"dispute_resolution_type\": \"litigation\", \"party_count\": null}], \"legal_subjects\": [{\"name\": \"孟某\", \"subject_type\": \"natural_person\", \"org_type\": \"\", \"credit_code\": null, \"roles\": [{\"role_code\": \"plaintiff\", \"role_name\": \"原告\", \"case_number\": \"(2018)苏0925行初186号\"}, {\"role_code\": \"appellant\", \"role_name\": \"上诉人\", \"case_number\": \"(2019)苏09行终184号\"}, {\"role_code\": \"retrial_applicant\", \"role_name\": \"再审申请人\", \"case_number\": \"(2021)苏行再30号\"}]}, {\"name\": \"滨海县医疗保险基金管理中心\", \"subject_type\": \"organization\", \"org_type\": \"government_agency\", \"credit_code\": null, \"roles\": [{\"role_code\": \"defendant\", \"role_name\": \"被告\", \"case_number\": \"(2018)苏0925行初186号\"}, {\"role_code\": \"appellee\", \"role_name\": \"被上诉人\", \"case_number\": \"(2019)苏09行终184号\"}, {\"role_code\": \"retrial_respondent\", \"role_name\": \"再审被申请人\", \"case_number\": \"(2021)苏行再30号\"}]}], \"attorneys\": [], \"judges\": [], \"prosecutors\": [], \"trial_organizations\": [], \"legal_provisions\": [{\"case_number\": \"\", \"statute\": \"立法法\", \"article\": \"96\", \"paragraph\": \"\", \"item\": \"2\", \"content\": \"地方性法规、规章同宪法、法律、行政法规相抵触的，由有关机关予以改变或者撤销。\", \"citation_position\": \"related_info\", \"citation_purpose\": \"说理依据\"}, {\"case_number\": \"\", \"statute\": \"社会保险法\", \"article\": \"30\", \"paragraph\": \"1\", \"item\": \"\", \"content\": \"下列医疗费用不纳入基本医疗保险基金支付范围：（一）应当从工伤保险基金中支付的；（二）应当由第三人负担的；（三）应当由公共卫生负担的；（四）在境外就医的。医疗费用依法应当由第三人负担，第三人不支付或者无法确定第三人的，由基本医疗保险基金先行支付。基本医疗保险基金先行支付后，有权向第三人追偿。\", \"citation_position\": \"judgment_reason\", \"citation_purpose\": \"适用依据\"}, {\"case_number\": \"\", \"statute\": \"盐城市2015年度新型农村合作医疗实施方案\", \"article\": \"\", \"paragraph\": \"\", \"item\": \"\", \"content\": \"交通事故所发生的医药费用属于不予补偿的范围。\", \"citation_position\": \"basic_facts\", \"citation_purpose\": \"反驳依据\"}, {\"case_number\": \"\", \"statute\": \"2017年滨海县新型农村合作医疗补偿方案\", \"article\": \"\", \"paragraph\": \"\", \"item\": \"\", \"content\": \"交通事故所发生的医药费用属于不予补偿的范围。\", \"citation_position\": \"basic_facts\", \"citation_purpose\": \"反驳依据\"}], \"evidence\": [{\"content\": \"宜兴市交警部门出具的交通事故认定书，认定孟兵负事故全部责任。\", \"evidence_type\": \"documentary\", \"submitted_by\": \"孟某\", \"is_key_evidence\": true, \"admission_status\": \"admitted\", \"examination_status\": \"examined\", \"expert_institution\": \"\", \"expert_conclusion\": \"\"}, {\"content\": \"孟兵提交的多家医院医疗费用票据，共计约40余万元。\", \"evidence_type\": \"documentary\", \"submitted_by\": \"孟某\", \"is_key_evidence\": true, \"admission_status\": \"admitted\", \"examination_status\": \"examined\", \"expert_institution\": \"\", \"expert_conclusion\": \"\"}, {\"content\": \"孟兵于2018年6月初向滨海县医保中心提交的书面申请，请求补偿医疗费用。\", \"evidence_type\": \"documentary\", \"submitted_by\": \"孟某\", \"is_key_evidence\": true, \"admission_status\": \"admitted\", \"examination_status\": \"examined\", \"expert_institution\": \"\", \"expert_conclusion\": \"\"}, {\"content\": \"《盐城市2015年度新型农村合作医疗实施方案》及《2017年滨海县新型农村合作医疗补偿方案》，规定交通事故医药费用不予补偿。\", \"evidence_type\": \"documentary\", \"submitted_by\": \"滨海县医疗保险基金管理中心\", \"is_key_evidence\": true, \"admission_status\": \"admitted\", \"examination_status\": \"examined\", \"expert_institution\": \"\", \"expert_conclusion\": \"\"}], \"judgment_results\": [{\"result_type\": \"liable\", \"specific_judgment\": \"撤销江苏省盐城市中级人民法院（2019）苏09行终184号行政判决；撤销江苏省建湖县人民法院（2018）苏0925行初186号行政判决；判令被申请人滨海县医疗保险基金管理中心在收到本判决书之日起60日内依法对孟兵履行补偿医疗费用的法定职责。\", \"reasoning\": \"法院认为，孟兵因自身原因导致单方交通事故受伤产生的医疗费用，不属于“应当由第三人负担医药费用”的情形，应属于新型农村合作医疗基金补偿范围。《盐城市新农合实施方案》《滨海县新农合补偿方案》将此类费用排除在外，与《社会保险法》《江苏省新型农村合作医疗条例》的规定相冲突，不予参照适用。滨海县医保中心拒绝补偿系适用法律错误，应纠正。\", \"case_number\": \"(2021)苏行再30号\", \"cost_allocation\": \"\"}], \"case_summary\": {\"key_facts\": \"2017年5月22日，孟兵因单方交通事故受伤，负全责，花费医疗费约40余万元。孟兵参加了新型农村合作医疗保险，向滨海县医保中心申请补偿，被以交通事故费用属不予补偿范围为由拒绝。一二审驳回其诉讼请求。\", \"disputed_issues\": \"地方规范性文件将单方交通事故产生的医疗费用排除在补偿范围之外是否违反上位法；滨海县医保中心拒绝补偿是否合法。\", \"conclusion\": \"再审判决撤销一、二审判决，判令滨海县医保中心在60日内履行补偿医疗费用的法定职责。\", \"amount_involved\": \"335049元\", \"guiding_points\": \"\", \"claim_amount\": \"335049元\", \"judgment_amount\": \"待核定\"}, \"legal_provision_elements\": [{\"provision_index\": 0, \"statute\": \"立法法\", \"article\": \"96\", \"element_type\": \"legal_consequence\", \"content\": \"地方性法规、规章与宪法、法律、行政法规相抵触的，由有关机关予以改变或者撤销。\", \"applicable_fact_pattern\": \"当下位法与上位法规定冲突时，下位法无效或被撤销。\"}, {\"provision_index\": 1, \"statute\": \"社会保险法\", \"article\": \"30\", \"element_type\": \"exception_clause\", \"content\": \"应当由第三人负担的医疗费用不纳入基本医疗保险基金支付范围。\", \"applicable_fact_pattern\": \"当医疗费用因第三人侵权产生时，应由第三人负担，医保基金不予支付。\"}]}, \"eval\": {\"row_id\": \"2292\", \"score\": 85.0, \"issues\": [\"guiding_case_number 为空\", \"judges 为空\", \"attorneys 为空\", \"trial_organizations 为空\", \"legal_provisions[2].article 为空\", \"legal_provisions[3].article 为空\"], \"court_case_count\": 3, \"judge_count\": 0, \"attorney_count\": 0, \"provision_count\": 4, \"evidence_count\": 4}}", "5319__v1": "{\"row_id\": \"5319\", \"input\": {\"id\": \"5319\", \"web_name\": \"人民法院案例库\", \"case_type\": \"行政-商标相关行政案件\", \"storage_no\": \"2019-18-3-029-001\"}, \"output\": {\"guiding_case\": {\"guiding_case_number\": \"指导案例113号\", \"guiding_case_name\": \"迈克尔·杰弗里·乔丹与国家工商行政管理总局商标评审委员会、乔丹体育股份有限公司商标争议行政纠纷案\", \"publication_date\": \"2016-12-07\", \"binding_force\": \"mandatory\", \"guiding_points\": \"1.姓名权是自然人对其姓名享有的人身权，姓名权可以构成商标法规定的在先权利。外国自然人外文姓名的中文译名符合条件的，可以依法主张作为特定名称按照姓名权的有关规定予以保护。\\n2.外国自然人就特定名称主张姓名权保护的，该特定名称应当符合以下三项条件：（1）该特定名称在我国具有一定的知名度，为相关公众所知悉；（2）相关公众使用该特定名称指代该自然人；（3）该特定名称已经与该自然人之间建立了稳定的对应关系。\\n3.使用是姓名权人享有的权利内容之一，并非姓名权人主张保护其姓名权的法定前提条件。特定名称按照姓名权受法律保护的，即使自然人并未主动使用，也不影响姓名权人按照商标法关于在先权利的规定主张权利。\\n4.违反诚实信用原则，恶意申请注册商标，侵犯他人现有在先权利的“商标权人”，以该商标的宣传、使用、获奖、被保护等情况形成了“市场秩序”或者“商业成功”为由，主张该注册商标合法有效的，人民法院不予支持。\", \"key_words\": [\"行政\", \"商标争议\", \"姓名权\", \"诚实信用\"], \"case_level\": \"guiding_case\", \"trial_procedure\": \"再审\", \"storage_no\": \"2019-18-3-029-001\", \"source_url\": \"https://rmfyalk.court.gov.cn\", \"judgment_mean\": \"\"}, \"case_type\": {\"category\": \"administrative\", \"level1\": \"行政\", \"level2\": \"商标相关行政案件\"}, \"court_cases\": [{\"case_number\": \"(2016)最高法行再27号\", \"filing_date\": \"2016-01-01\", \"judgment_date\": \"2016-12-07\", \"trial_level\": \"retrial\", \"trial_procedure\": \"再审\", \"court\": {\"name\": \"最高人民法院\", \"court_level\": \"supreme\"}, \"status\": \"effective\", \"cause_of_action\": \"商标争议行政纠纷\", \"dispute_resolution_type\": \"litigation\", \"party_count\": null}], \"legal_subjects\": [{\"name\": \"迈克尔·杰弗里·乔丹\", \"subject_type\": \"natural_person\", \"org_type\": null, \"credit_code\": null, \"roles\": [{\"role_code\": \"retrial_applicant\", \"role_name\": \"再审申请人\", \"case_number\": \"(2016)最高法行再27号\"}]}, {\"name\": \"国家工商行政管理总局商标评审委员会\", \"subject_type\": \"organization\", \"org_type\": \"government_agency\", \"credit_code\": null, \"roles\": [{\"role_code\": \"retrial_respondent\", \"role_name\": \"被申请人\", \"case_number\": \"(2016)最高法行再27号\"}]}, {\"name\": \"乔丹体育股份有限公司\", \"subject_type\": \"organization\", \"org_type\": \"company\", \"credit_code\": null, \"roles\": [{\"role_code\": \"third_party\", \"role_name\": \"一审第三人\", \"case_number\": \"(2016)最高法行再27号\"}]}], \"attorneys\": [], \"judges\": [{\"name\": \"陶凯元\", \"role\": \"presiding_judge\", \"case_number\": \"(2016)最高法行再27号\"}, {\"name\": \"王艳芳\", \"role\": \"judge\", \"case_number\": \"(2016)最高法行再27号\"}, {\"name\": \"杜微科\", \"role\": \"judge\", \"case_number\": \"(2016)最高法行再27号\"}], \"prosecutors\": [], \"trial_organizations\": [{\"case_number\": \"(2016)最高法行再27号\", \"members\": [\"审判长陶凯元\", \"审判员王艳芳\", \"审判员杜微科\"], \"summary\": \"由审判长陶凯元、审判员王艳芳、审判员杜微科组成合议庭\"}], \"legal_provisions\": [{\"case_number\": \"(2016)最高法行再27号\", \"statute\": \"中华人民共和国商标法\", \"article\": \"31\", \"paragraph\": \"\", \"item\": \"\", \"content\": \"申请商标注册不得损害他人现有的在先权利。\", \"citation_position\": \"judgment_reason\", \"citation_purpose\": \"适用依据\"}, {\"case_number\": \"(2016)最高法行再27号\", \"statute\": \"中华人民共和国民法通则\", \"article\": \"4\", \"paragraph\": \"\", \"item\": \"\", \"content\": \"民事活动应当遵循诚实信用原则。\", \"citation_position\": \"judgment_reason\", \"citation_purpose\": \"说理依据\"}, {\"case_number\": \"(2016)最高法行再27号\", \"statute\": \"中华人民共和国民法通则\", \"article\": \"99\", \"paragraph\": \"1\", \"item\": \"\", \"content\": \"公民享有姓名权，有权决定、使用和依照规定改变自己的姓名，禁止他人干涉、盗用、假冒。\", \"citation_position\": \"judgment_reason\", \"citation_purpose\": \"适用依据\"}, {\"case_number\": \"(2016)最高法行再27号\", \"statute\": \"中华人民共和国侵权责任法\", \"article\": \"2\", \"paragraph\": \"2\", \"item\": \"\", \"content\": \"本法所称民事权益，包括……姓名权……等人身、财产权益。\", \"citation_position\": \"judgment_reason\", \"citation_purpose\": \"适用依据\"}, {\"case_number\": \"(2016)最高法行再27号\", \"statute\": \"最高人民法院关于审理不正当竞争民事案件应用法律若干问题的解释\", \"article\": \"6\", \"paragraph\": \"2\", \"item\": \"\", \"content\": \"擅自使用他人的姓名，引人误认为是他人的商品的，构成反不正当竞争法第五条第（三）项规定的不正当竞争行为。\", \"citation_position\": \"judgment_reason\", \"citation_purpose\": \"说理依据\"}, {\"case_number\": \"(2016)最高法行再27号\", \"statute\": \"中华人民共和国民法总则\", \"article\": \"7\", \"paragraph\": \"\", \"item\": \"\", \"content\": \"民事主体从事民事活动，应当遵循诚信原则，秉持诚实，恪守承诺。\", \"citation_position\": \"related_law\", \"citation_purpose\": \"说理依据\"}, {\"case_number\": \"(2016)最高法行再27号\", \"statute\": \"中华人民共和国民法总则\", \"article\": \"110\", \"paragraph\": \"\", \"item\": \"\", \"content\": \"自然人享有生命权、身体权、健康权、姓名权、肖像权、名誉权、荣誉权、隐私权、婚姻自主权等权利。\", \"citation_position\": \"related_law\", \"citation_purpose\": \"说理依据\"}, {\"case_number\": \"(2016)最高法行再27号\", \"statute\": \"中华人民共和国商标法\", \"article\": \"32\", \"paragraph\": \"\", \"item\": \"\", \"content\": \"申请商标注册不得损害他人现有的在先权利，也不得以不正当手段抢先注册他人已经使用并有一定影响的商标。\", \"citation_position\": \"related_law\", \"citation_purpose\": \"适用依据\"}], \"evidence\": [], \"judgment_results\": [{\"result_type\": \"administrative_decision\", \"specific_judgment\": \"一、撤销国家工商行政管理总局商标评审委员会商评字[2014]第052058号关于第6020569号“乔丹”商标争议裁定；二、国家工商行政管理总局商标评审委员会对第6020569号“乔丹”商标重新作出裁定。\", \"reasoning\": \"再审申请人就“乔丹”享有姓名权，其特定名称符合知名度、指代关系和稳定对应三项条件。争议商标的注册容易导致相关公众误认为与再审申请人存在代言、许可等特定联系，损害了再审申请人的在先姓名权。乔丹公司注册争议商标具有明显主观恶意，违反诚实信用原则。其经营状况和商标宣传使用不足以使争议商标注册合法化。因此，争议商标的注册违反商标法第三十一条的规定。\", \"case_number\": \"(2016)最高法行再27号\", \"cost_allocation\": \"\"}], \"case_summary\": {\"key_facts\": \"乔丹公司注册了第6020569号“乔丹”商标，用于体育活动器械。再审申请人迈克尔·乔丹认为该商标含有其英文姓名的中文译名“乔丹”，损害其姓名权，故申请撤销。商标评审委员会裁定维持，再审申请人遂提起行政诉讼。该案经一审、二审，最后进入最高人民法院再审。\", \"disputed_issues\": \"争议商标的注册是否损害了再审申请人就“乔丹”主张的姓名权，违反2001年商标法第三十一条的规定。\", \"conclusion\": \"最高人民法院再审判决撤销商标评审委员会裁定，责令重新作出裁定。认定“乔丹”商标侵害了迈克尔·乔丹的姓名权，乔丹公司恶意注册，违背诚实信用原则。\", \"amount_involved\": \"\", \"guiding_points\": \"1.姓名权是自然人对其姓名享有的人身权，姓名权可以构成商标法规定的在先权利。外国自然人外文姓名的中文译名符合条件的，可以依法主张作为特定名称按照姓名权的有关规定予以保护。\\n2.外国自然人就特定名称主张姓名权保护的，该特定名称应当符合以下三项条件：（1）该特定名称在我国具有一定的知名度，为相关公众所知悉；（2）相关公众使用该特定名称指代该自然人；（3）该特定名称已经与该自然人之间建立了稳定的对应关系。\\n3.使用是姓名权人享有的权利内容之一，并非姓名权人主张保护其姓名权的法定前提条件。特定名称按照姓名权受法律保护的，即使自然人并未主动使用，也不影响姓名权人按照商标法关于在先权利的规定主张权利。\\n4.违反诚实信用原则，恶意申请注册商标，侵犯他人现有在先权利的“商标权人”，以该商标的宣传、使用、获奖、被保护等情况形成了“市场秩序”或者“商业成功”为由，主张该注册商标合法有效的，人民法院不予支持。\", \"claim_amount\": \"\", \"judgment_amount\": \"\"}, \"legal_provision_elements\": [{\"provision_index\": 0, \"statute\": \"中华人民共和国商标法\", \"article\": \"31\", \"element_type\": \"subject_element\", \"content\": \"商标注册申请人\", \"applicable_fact_pattern\": \"任何提出商标注册申请的主体\"}, {\"provision_index\": 0, \"statute\": \"中华人民共和国商标法\", \"article\": \"31\", \"element_type\": \"act_element\", \"content\": \"申请商标注册\", \"applicable_fact_pattern\": \"向商标局提交商标注册申请\"}, {\"provision_index\": 0, \"statute\": \"中华人民共和国商标法\", \"article\": \"31\", \"element_type\": \"result_element\", \"content\": \"损害他人现有的在先权利\", \"applicable_fact_pattern\": \"商标注册可能侵害他人已存在的合法权利，如姓名权\"}, {\"provision_index\": 0, \"statute\": \"中华人民共和国商标法\", \"article\": \"31\", \"element_type\": \"legal_consequence\", \"content\": \"不予注册或禁止使用\", \"applicable_fact_pattern\": \"损害在先权利的商标申请被驳回或宣告无效\"}, {\"provision_index\": 1, \"statute\": \"中华人民共和国民法通则\", \"article\": \"4\", \"element_type\": \"subjective_element\", \"content\": \"民事活动应当遵循诚实信用原则\", \"applicable_fact_pattern\": \"民事主体在从事民事活动时须保持诚实、恪守信用\"}, {\"provision_index\": 2, \"statute\": \"中华人民共和国民法通则\", \"article\": \"99\", \"element_type\": \"subject_element\", \"content\": \"公民\", \"applicable_fact_pattern\": \"自然人主体\"}, {\"provision_index\": 2, \"statute\": \"中华人民共和国民法通则\", \"article\": \"99\", \"element_type\": \"legal_consequence\", \"content\": \"享有姓名权，禁止他人干涉、盗用、假冒\", \"applicable_fact_pattern\": \"未经许可使用他人姓名可能导致侵权\"}, {\"provision_index\": 3, \"statute\": \"中华人民共和国侵权责任法\", \"article\": \"2\", \"element_type\": \"object_element\", \"content\": \"民事权益包括姓名权\", \"applicable_fact_pattern\": \"姓名权属于受保护的民事权益\"}, {\"provision_index\": 4, \"statute\": \"最高人民法院关于审理不正当竞争民事案件应用法律若干问题的解释\", \"article\": \"6\", \"element_type\": \"act_element\", \"content\": \"擅自使用他人的姓名，引人误认为是他人的商品\", \"applicable_fact_pattern\": \"冒用他人姓名导致市场混淆\"}, {\"provision_index\": 4, \"statute\": \"最高人民法院关于审理不正当竞争民事案件应用法律若干问题的解释\", \"article\": \"6\", \"element_type\": \"result_element\", \"content\": \"构成不正当竞争行为\", \"applicable_fact_pattern\": \"造成相关公众误认\"}, {\"provision_index\": 5, \"statute\": \"中华人民共和国民法总则\", \"article\": \"7\", \"element_type\": \"subjective_element\", \"content\": \"民事主体应当遵循诚信原则\", \"applicable_fact_pattern\": \"民事活动中的普遍行为准则\"}, {\"provision_index\": 6, \"statute\": \"中华人民共和国民法总则\", \"article\": \"110\", \"element_type\": \"object_element\", \"content\": \"自然人享有姓名权\", \"applicable_fact_pattern\": \"姓名权是自然人的基本权利\"}, {\"provision_index\": 7, \"statute\": \"中华人民共和国商标法\", \"article\": \"32\", \"element_type\": \"act_element\", \"content\": \"申请商标注册不得损害他人现有的在先权利\", \"applicable_fact_pattern\": \"商标注册申请行为\"}, {\"provision_index\": 7, \"statute\": \"中华人民共和国商标法\", \"article\": \"32\", \"element_type\": \"legal_consequence\", \"content\": \"不予注册\", \"applicable_fact_pattern\": \"损害在先权利的商标申请\"}]}, \"eval\": {\"row_id\": \"5319\", \"score\": 98.0, \"issues\": [\"attorneys 为空\", \"evidence 为空\"], \"court_case_count\": 1, \"judge_count\": 3, \"attorney_count\": 0, \"provision_count\": 8, \"evidence_count\": 0}}", "5319__v2": "{\"row_id\": \"5319\", \"input\": {\"id\": \"5319\", \"web_name\": \"人民法院案例库\", \"case_type\": \"行政-商标相关行政案件\", \"storage_no\": \"2019-18-3-029-001\"}, \"output\": {\"guiding_case\": {\"guiding_case_number\": \"\", \"guiding_case_name\": \"迈克尔·杰弗里·乔丹诉国家工商行政管理总局商标评审委员会商标争议行政纠纷案\", \"publication_date\": \"2016-12-07\", \"binding_force\": \"mandatory\", \"guiding_points\": \"1.姓名权是自然人对其姓名享有的人身权，姓名权可以构成商标法规定的在先权利。外国自然人外文姓名的中文译名符合条件的，可以依法主张作为特定名称按照姓名权的有关规定予以保护。\\n2.外国自然人就特定名称主张姓名权保护的，该特定名称应当符合以下三项条件：（1）该特定名称在我国具有一定的知名度，为相关公众所知悉；（2）相关公众使用该特定名称指代该自然人；（3）该特定名称已经与该自然人之间建立了稳定的对应关系。\\n3.使用是姓名权人享有的权利内容之一，并非姓名权人主张保护其姓名权的法定前提条件。特定名称按照姓名权受法律保护的，即使自然人并未主动使用，也不影响姓名权人按照商标法关于在先权利的规定主张权利。\\n4.违反诚实信用原则，恶意申请注册商标，侵犯他人现有在先权利的“商标权人”，以该商标的宣传、使用、获奖、被保护等情况形成了“市场秩序”或者“商业成功”为由，主张该注册商标合法有效的，人民法院不予支持。\", \"key_words\": [\"行政\", \"商标争议\", \"姓名权\", \"诚实信用\"], \"case_level\": \"guiding_case\", \"trial_procedure\": \"再审\", \"storage_no\": \"2019-18-3-029-001\", \"source_url\": \"https://rmfyalk.court.gov.cn\", \"judgment_mean\": \"\"}, \"case_type\": {\"category\": \"administrative\", \"level1\": \"行政\", \"level2\": \"商标相关行政案件\"}, \"court_cases\": [{\"case_number\": \"(2016)最高法行再27号\", \"filing_date\": \"2016-01-01\", \"judgment_date\": \"2016-12-07\", \"trial_level\": \"retrial\", \"trial_procedure\": \"再审\", \"court\": {\"name\": \"最高人民法院\", \"court_level\": \"supreme\"}, \"status\": \"effective\", \"cause_of_action\": \"商标争议行政纠纷\", \"dispute_resolution_type\": \"litigation\", \"party_count\": null}], \"legal_subjects\": [{\"name\": \"迈克尔·杰弗里·乔丹\", \"subject_type\": \"natural_person\", \"org_type\": null, \"credit_code\": null, \"roles\": [{\"role_code\": \"retrial_applicant\", \"role_name\": \"再审申请人\", \"case_number\": \"(2016)最高法行再27号\"}]}, {\"name\": \"国家工商行政管理总局商标评审委员会\", \"subject_type\": \"organization\", \"org_type\": \"government_agency\", \"credit_code\": null, \"roles\": [{\"role_code\": \"retrial_respondent\", \"role_name\": \"被申请人\", \"case_number\": \"(2016)最高法行再27号\"}]}, {\"name\": \"乔丹体育股份有限公司\", \"subject_type\": \"organization\", \"org_type\": \"company\", \"credit_code\": null, \"roles\": [{\"role_code\": \"third_party\", \"role_name\": \"一审第三人\", \"case_number\": \"(2016)最高法行再27号\"}]}], \"attorneys\": [], \"judges\": [], \"prosecutors\": [], \"trial_organizations\": [], \"legal_provisions\": [{\"case_number\": \"(2016)最高法行再27号\", \"statute\": \"中华人民共和国商标法\", \"article\": \"31\", \"paragraph\": \"\", \"item\": \"\", \"content\": \"申请商标注册不得损害他人现有的在先权利\", \"citation_position\": \"judgment_reason\", \"citation_purpose\": \"适用依据\"}, {\"case_number\": \"(2016)最高法行再27号\", \"statute\": \"中华人民共和国民法通则\", \"article\": \"99\", \"paragraph\": \"1\", \"item\": \"\", \"content\": \"公民享有姓名权，有权决定、使用和依照规定改变自己的姓名，禁止他人干涉、盗用、假冒。\", \"citation_position\": \"judgment_reason\", \"citation_purpose\": \"适用依据\"}, {\"case_number\": \"(2016)最高法行再27号\", \"statute\": \"中华人民共和国民法通则\", \"article\": \"4\", \"paragraph\": \"\", \"item\": \"\", \"content\": \"民事活动应当遵循自愿、公平、等价有偿、诚实信用的原则。\", \"citation_position\": \"judgment_reason\", \"citation_purpose\": \"说理依据\"}, {\"case_number\": \"(2016)最高法行再27号\", \"statute\": \"中华人民共和国侵权责任法\", \"article\": \"2\", \"paragraph\": \"2\", \"item\": \"\", \"content\": \"本法所称民事权益，包括生命权、健康权、姓名权、名誉权、荣誉权、肖像权、隐私权、婚姻自主权、监护权、所有权、用益物权、担保物权、著作权、专利权、商标专用权、发现权、股权、继承权等人身、财产权益。\", \"citation_position\": \"judgment_reason\", \"citation_purpose\": \"适用依据\"}, {\"case_number\": \"(2016)最高法行再27号\", \"statute\": \"最高人民法院关于审理不正当竞争民事案件应用法律若干问题的解释\", \"article\": \"6\", \"paragraph\": \"2\", \"item\": \"\", \"content\": \"具有一定的市场知名度、为相关公众所知悉的自然人的姓名，可以认定为反不正当竞争法规定的“姓名”。\", \"citation_position\": \"judgment_reason\", \"citation_purpose\": \"说理依据\"}, {\"case_number\": \"(2016)最高法行再27号\", \"statute\": \"中华人民共和国商标法\", \"article\": \"32\", \"paragraph\": \"\", \"item\": \"\", \"content\": \"申请商标注册不得损害他人现有的在先权利，也不得以不正当手段抢先注册他人已经使用并有一定影响的商标。\", \"citation_position\": \"related_law\", \"citation_purpose\": \"适用依据\"}, {\"case_number\": \"(2016)最高法行再27号\", \"statute\": \"中华人民共和国民法总则\", \"article\": \"7\", \"paragraph\": \"\", \"item\": \"\", \"content\": \"民事主体从事民事活动，应当遵循诚信原则，秉持诚实，恪守承诺。\", \"citation_position\": \"related_law\", \"citation_purpose\": \"说理依据\"}, {\"case_number\": \"(2016)最高法行再27号\", \"statute\": \"中华人民共和国民法总则\", \"article\": \"110\", \"paragraph\": \"\", \"item\": \"\", \"content\": \"自然人享有生命权、身体权、健康权、姓名权、肖像权、名誉权、荣誉权、隐私权、婚姻自主权等权利。法人、非法人组织享有名称权、名誉权、荣誉权等权利。\", \"citation_position\": \"related_law\", \"citation_purpose\": \"适用依据\"}], \"evidence\": [], \"judgment_results\": [{\"result_type\": \"procedural_ruling\", \"specific_judgment\": \"撤销国家工商行政管理总局商标评审委员会作出的商评字[2014]第052424号关于第6020569号“乔丹”商标争议裁定，并判令商标评审委员会就第6020569号“乔丹”商标重新作出裁定。\", \"reasoning\": \"法院认为，再审申请人就“乔丹”主张的姓名权可以构成商标法第三十一条规定的在先权利。“乔丹”在我国具有较高知名度、为相关公众所知悉，已与再审申请人形成稳定对应关系。乔丹公司注册争议商标具有明显主观恶意，容易导致相关公众误以为其与再审申请人存在代言等特定联系，损害了再审申请人的在先姓名权，违反商标法第三十一条。乔丹公司的经营状况不能使争议商标的注册合法化，其所谓市场秩序建立在相关公众误认基础上。故被诉裁定应予撤销。\", \"case_number\": \"(2016)最高法行再27号\", \"cost_allocation\": \"\"}], \"case_summary\": {\"key_facts\": \"乔丹体育股份有限公司注册了第6020569号“乔丹”商标。迈克尔·杰弗里·乔丹认为该商标损害其姓名权，向商标评审委员会申请撤销。商标评审委员会裁定维持该商标。迈克尔·乔丹不服，提起行政诉讼，经过一审、二审后向最高人民法院申请再审。最高人民法院提审本案。\", \"disputed_issues\": \"争议商标的注册是否损害了再审申请人就“乔丹”主张的姓名权，从而违反2001年修正的商标法第三十一条关于“申请商标注册不得损害他人现有的在先权利”的规定。\", \"conclusion\": \"最高人民法院判决撤销商标评审委员会裁定，判令其重新作出裁定，认定“乔丹”商标的注册损害了迈克尔·乔丹的在先姓名权。\", \"amount_involved\": \"\", \"guiding_points\": \"1.姓名权是自然人对其姓名享有的人身权，姓名权可以构成商标法规定的在先权利。外国自然人外文姓名的中文译名符合条件的，可以依法主张作为特定名称按照姓名权的有关规定予以保护。\\n2.外国自然人就特定名称主张姓名权保护的，该特定名称应当符合以下三项条件：（1）该特定名称在我国具有一定的知名度，为相关公众所知悉；（2）相关公众使用该特定名称指代该自然人；（3）该特定名称已经与该自然人之间建立了稳定的对应关系。\\n3.使用是姓名权人享有的权利内容之一，并非姓名权人主张保护其姓名权的法定前提条件。特定名称按照姓名权受法律保护的，即使自然人并未主动使用，也不影响姓名权人按照商标法关于在先权利的规定主张权利。\\n4.违反诚实信用原则，恶意申请注册商标，侵犯他人现有在先权利的“商标权人”，以该商标的宣传、使用、获奖、被保护等情况形成了“市场秩序”或者“商业成功”为由，主张该注册商标合法有效的，人民法院不予支持。\", \"claim_amount\": \"\", \"judgment_amount\": \"\"}, \"legal_provision_elements\": [{\"provision_index\": 0, \"statute\": \"中华人民共和国商标法\", \"article\": \"31\", \"element_type\": \"act_element\", \"content\": \"申请商标注册不得损害他人现有的在先权利\", \"applicable_fact_pattern\": \"争议商标的注册损害了他人现有的在先姓名权\"}, {\"provision_index\": 0, \"statute\": \"中华人民共和国商标法\", \"article\": \"31\", \"element_type\": \"legal_consequence\", \"content\": \"损害他人现有在先权利的商标注册违反法律规定，应予撤销\", \"applicable_fact_pattern\": \"争议商标的注册被认定损害在先姓名权，故应撤销\"}, {\"provision_index\": 1, \"statute\": \"中华人民共和国民法通则\", \"article\": \"99\", \"element_type\": \"subject_element\", \"content\": \"公民享有姓名权\", \"applicable_fact_pattern\": \"自然人就特定名称主张姓名权，该名称已与其建立稳定对应关系\"}, {\"provision_index\": 4, \"statute\": \"最高人民法院关于审理不正当竞争民事案件应用法律若干问题的解释\", \"article\": \"6\", \"element_type\": \"subject_element\", \"content\": \"具有一定的市场知名度、为相关公众所知悉的自然人的姓名，可以认定为反不正当竞争法规定的“姓名”\", \"applicable_fact_pattern\": \"“乔丹”在我国具有较高知名度，为相关公众所知悉\"}]}, \"eval\": {\"row_id\": \"5319\", \"score\": 93.0, \"issues\": [\"guiding_case_number 为空\", \"judges 为空\", \"attorneys 为空\", \"trial_organizations 为空\", \"evidence 为空\"], \"court_case_count\": 1, \"judge_count\": 0, \"attorney_count\": 0, \"provision_count\": 8, \"evidence_count\": 0}}", "3369": "{\"row_id\": \"3369\", \"input\": {\"id\": \"3369\", \"web_name\": \"人民法院案例库\", \"case_type\": \"行政-行政许可\", \"storage_no\": \"2023-12-3-004-006\"}, \"output\": {\"guiding_case\": {\"guiding_case_number\": \"\", \"guiding_case_name\": \"嘉兴市某某公司诉南湖区行政审批局行政许可案\", \"publication_date\": \"2023-01-01\", \"binding_force\": \"persuasive\", \"guiding_points\": \"行政机关在行政许可审查程序中，利害关系人提出异议的，应当通过听证等程序听取行政许可申请人及利害关系人意见，未经听证程序直接作出不予许可决定，程序违法。对于涉及企业经营资格的重大行政许可，行政机关应当审慎审查。一般情况下，行政机关审查申请人提交的材料是否符合法律法规规定即可作出决定，但在申请人提交材料和利害关系人异议存在冲突，对是否作出许可的关键条件存在争议，特别是涉及社会公共安全等情况下，行政机关不应仅审查书面材料即作出决定，应当对相关关键事实、利害关系人提出的异议是否能够成立等内容主动调查核实，在查明事实的基础上准确作出决定。\", \"key_words\": [\"行政\", \"行政许可\", \"利害关系人\", \"听证\", \"审慎审查\"], \"case_level\": \"typical_case\", \"trial_procedure\": \"二审\", \"storage_no\": \"2023-12-3-004-006\", \"source_url\": \"https://rmfyalk.court.gov.cn\", \"judgment_mean\": \"\"}, \"case_type\": {\"category\": \"administrative\", \"level1\": \"行政\", \"level2\": \"行政许可\"}, \"court_cases\": [{\"case_number\": \"(2021)浙0481行初15号\", \"filing_date\": \"2021-01-01\", \"judgment_date\": \"2021-09-29\", \"trial_level\": \"first_instance\", \"trial_procedure\": \"一审\", \"court\": {\"name\": \"浙江省海宁市人民法院\", \"court_level\": \"basic\"}, \"status\": \"effective\", \"cause_of_action\": \"行政许可纠纷\", \"dispute_resolution_type\": \"litigation\", \"party_count\": null}, {\"case_number\": \"(2021)浙04行终226号\", \"filing_date\": \"2021-01-01\", \"judgment_date\": \"2022-03-11\", \"trial_level\": \"second_instance\", \"trial_procedure\": \"二审\", \"court\": {\"name\": \"浙江省嘉兴市中级人民法院\", \"court_level\": \"intermediate\"}, \"status\": \"terminated\", \"cause_of_action\": \"行政许可纠纷\", \"dispute_resolution_type\": \"litigation\", \"party_count\": null}], \"legal_subjects\": [{\"name\": \"嘉兴市某某公司\", \"subject_type\": \"organization\", \"org_type\": \"company\", \"credit_code\": null, \"roles\": [{\"role_code\": \"plaintiff\", \"role_name\": \"原告\", \"case_number\": \"(2021)浙0481行初15号\"}, {\"role_code\": \"appellant\", \"role_name\": \"上诉人\", \"case_number\": \"(2021)浙04行终226号\"}]}, {\"name\": \"南湖区行政审批局\", \"subject_type\": \"organization\", \"org_type\": \"government_agency\", \"credit_code\": null, \"roles\": [{\"role_code\": \"defendant\", \"role_name\": \"被告\", \"case_number\": \"(2021)浙0481行初15号\"}, {\"role_code\": \"appellee\", \"role_name\": \"被上诉人\", \"case_number\": \"(2021)浙04行终226号\"}]}], \"attorneys\": [], \"judges\": [], \"prosecutors\": [], \"trial_organizations\": [], \"legal_provisions\": [{\"case_number\": \"(2021)浙0481行初15号\", \"statute\": \"中华人民共和国行政许可法\", \"article\": \"34\", \"paragraph\": \"\", \"item\": \"\", \"content\": \"行政机关应当对申请人提交的申请材料进行审查。根据法定条件和程序，需要对申请材料的实质内容进行核实的，行政机关应当指派两名以上工作人员进行核查。\", \"citation_position\": \"related_info\", \"citation_purpose\": \"说理依据\"}, {\"case_number\": \"(2021)浙0481行初15号\", \"statute\": \"中华人民共和国行政许可法\", \"article\": \"36\", \"paragraph\": \"\", \"item\": \"\", \"content\": \"行政机关对行政许可申请进行审查时，发现行政许可事项直接关系他人重大利益的，应当告知该利害关系人。申请人、利害关系人有权进行陈述和申辩。行政机关应当听取申请人、利害关系人的意见。\", \"citation_position\": \"related_info\", \"citation_purpose\": \"说理依据\"}, {\"case_number\": \"(2021)浙0481行初15号\", \"statute\": \"中华人民共和国行政许可法\", \"article\": \"47\", \"paragraph\": \"\", \"item\": \"\", \"content\": \"行政许可直接涉及申请人与他人之间重大利益关系的，行政机关在作出行政许可决定前，应当告知申请人、利害关系人享有要求听证的权利；申请人、利害关系人在被告知听证权利之日起五日内提出听证申请的，行政机关应当在二十日内组织听证。\", \"citation_position\": \"related_info\", \"citation_purpose\": \"说理依据\"}, {\"case_number\": \"(2021)浙0481行初15号\", \"statute\": \"建筑设计防火规范\", \"article\": \"4.4.1\", \"paragraph\": \"\", \"item\": \"\", \"content\": \"总容积大于200立方米小于等于500立方米的液化石油气供应基地全压试储罐（区）与基地外其他民用建筑的防火间距为50米。\", \"citation_position\": \"basic_facts\", \"citation_purpose\": \"适用依据\"}, {\"case_number\": \"(2021)浙0481行初15号\", \"statute\": \"液化石油气供应工程设计规范\", \"article\": \"5.2.8\", \"paragraph\": \"\", \"item\": \"\", \"content\": \"总容积大于200立方米小于等于500立方米的液化石油气供应基地全压试储罐（区）与基地外其他民用建筑的防火间距为50米。\", \"citation_position\": \"basic_facts\", \"citation_purpose\": \"适用依据\"}], \"evidence\": [{\"content\": \"2021年2月5日专家组现场勘查记录，提出“储罐与民用建筑间距不足，实测44米，该民用建筑有人居住，且使用明火”，勘查结论不合格。\", \"evidence_type\": \"documentary\", \"submitted_by\": \"南湖区行政审批局\", \"is_key_evidence\": true, \"admission_status\": \"admitted\", \"examination_status\": \"examined\", \"expert_institution\": \"\", \"expert_conclusion\": \"\"}, {\"content\": \"南湖区住房和城乡建设局《关于嘉兴市某某公司防火间距情况的复函》，认定防火间距应为50米，实测44米不符合要求。\", \"evidence_type\": \"documentary\", \"submitted_by\": \"南湖区行政审批局\", \"is_key_evidence\": true, \"admission_status\": \"admitted\", \"examination_status\": \"examined\", \"expert_institution\": \"\", \"expert_conclusion\": \"\"}, {\"content\": \"杭州设计院《城镇燃气设施安全检查报告书》及《关于嘉兴市某某公司2020年安全检查情况的说明》，指出储罐与村委会办公楼间距约45米，不符合规范，但建议停止该房屋日常使用。\", \"evidence_type\": \"expert_opinion\", \"submitted_by\": \"嘉兴市某某公司\", \"is_key_evidence\": true, \"admission_status\": \"admitted\", \"examination_status\": \"examined\", \"expert_institution\": \"杭州设计院\", \"expert_conclusion\": \"储罐与村委会办公楼防火间距不足，建议停用该房屋\"}, {\"content\": \"嘉兴某投资有限公司征迁办公室《情况说明》，证明原某村村委会办公楼已签订拆迁合同，现堆放垃圾分类，没有住人、使用明火。\", \"evidence_type\": \"documentary\", \"submitted_by\": \"嘉兴市某某公司\", \"is_key_evidence\": true, \"admission_status\": \"admitted\", \"examination_status\": \"examined\", \"expert_institution\": \"\", \"expert_conclusion\": \"\"}, {\"content\": \"南湖区消防救援大队政务服务网回复，确认经现场检查，原某村村委会旧址一层为环卫公司垃圾分拣点，二、三层空置，未发现有住人、烧菜现象。\", \"evidence_type\": \"documentary\", \"submitted_by\": \"嘉兴市某某公司\", \"is_key_evidence\": true, \"admission_status\": \"admitted\", \"examination_status\": \"examined\", \"expert_institution\": \"\", \"expert_conclusion\": \"\"}], \"judgment_results\": [{\"result_type\": \"dismissed\", \"specific_judgment\": \"驳回嘉兴市某某公司的诉讼请求。\", \"reasoning\": \"一审法院认为南湖区行政审批局作出的不予行政许可决定事实清楚、适用法律正确、程序合法，故驳回原告诉讼请求。\", \"case_number\": \"(2021)浙0481行初15号\", \"cost_allocation\": \"\"}, {\"result_type\": \"withdrawn\", \"specific_judgment\": \"准许嘉兴市某某公司撤回上诉。\", \"reasoning\": \"二审期间，经协调，嘉兴市某某公司永久停用7号储气罐以满足50米安全间距要求，南湖区行政审批局自行撤销不予许可决定并重新作出许可决定，行政争议实质化解，上诉人申请撤回上诉，法院裁定准许。\", \"case_number\": \"(2021)浙04行终226号\", \"cost_allocation\": \"\"}], \"case_summary\": {\"key_facts\": \"嘉兴市某某公司原为某集团改制企业，自1987年起经营瓶装燃气充装。公司《燃气经营许可证》于2021年1月31日到期，2020年11月向南湖区住建局申请延续。2021年1月26日，南湖区行政审批局委托专家组现场勘查，结论为不合格，经整改后于2月1日确认合格。2月3日，湘家荡管委会、七星街道办事处反映储罐与周边民用建筑（原某村村委会办公楼）防火间距不符合安全规定。2月5日再次勘查，实测间距44米（要求50米），结论不合格。2月10日，南湖区住建局复函认定防火间距不足。同日，南湖区行政审批局以不符合防火间距要求为由作出不予行政许可决定。原告提起行政诉讼，主张原某村村委会办公楼为非住宅，且建造晚于公司，不应适用相关标准。\", \"disputed_issues\": \"1.原告液化石油气储罐与站外建筑防火间距是否满足行政许可要求；2.利害关系人提出异议后，行政机关未经听证即作出不予许可决定是否程序违法。\", \"conclusion\": \"二审期间，经协调，原告停用争议储气罐，被告撤销不予许可决定并重新颁发许可证，上诉人撤回上诉，争议实质化解。\", \"amount_involved\": \"\", \"guiding_points\": \"行政机关在行政许可审查程序中，利害关系人提出异议的，应当通过听证等程序听取行政许可申请人及利害关系人意见，未经听证程序直接作出不予许可决定，程序违法。对于涉及企业经营资格的重大行政许可，行政机关应当审慎审查。一般情况下，行政机关审查申请人提交的材料是否符合法律法规规定即可作出决定，但在申请人提交材料和利害关系人异议存在冲突，对是否作出许可的关键条件存在争议，特别是涉及社会公共安全等情况下，行政机关不应仅审查书面材料即作出决定，应当对相关关键事实、利害关系人提出的异议是否能够成立等内容主动调查核实，在查明事实的基础上准确作出决定。\", \"claim_amount\": \"\", \"judgment_amount\": \"\"}, \"legal_provision_elements\": [{\"provision_index\": 0, \"statute\": \"中华人民共和国行政许可法\", \"article\": \"34\", \"element_type\": \"act_element\", \"content\": \"行政机关应当对申请材料进行审查，实质内容需要核实的须指派两名以上工作人员核查。\", \"applicable_fact_pattern\": \"行政许可申请审查程序\"}, {\"provision_index\": 1, \"statute\": \"中华人民共和国行政许可法\", \"article\": \"36\", \"element_type\": \"act_element\", \"content\": \"发现行政许可事项直接关系他人重大利益时，应告知利害关系人并听取其意见。\", \"applicable_fact_pattern\": \"利害关系人提出异议，行政机关未告知、未听取意见\"}, {\"provision_index\": 2, \"statute\": \"中华人民共和国行政许可法\", \"article\": \"47\", \"element_type\": \"act_element\", \"content\": \"行政许可直接涉及申请人与他人重大利益关系的，应告知听证权利并依法组织听证。\", \"applicable_fact_pattern\": \"涉及重大利益且有利害关系人异议时，行政机关未告知听证权利\"}, {\"provision_index\": 3, \"statute\": \"建筑设计防火规范\", \"article\": \"4.4.1\", \"element_type\": \"result_element\", \"content\": \"规定液化石油气储罐与站外民用建筑的防火间距，总容积200~500立方米时，间距应不少于50米。\", \"applicable_fact_pattern\": \"储罐实测间距44米，小于50米，不满足规范要求\"}, {\"provision_index\": 4, \"statute\": \"液化石油气供应工程设计规范\", \"article\": \"5.2.8\", \"element_type\": \"result_element\", \"content\": \"与上述规范相同，规定防火间距为50米。\", \"applicable_fact_pattern\": \"防火间距不达标\"}]}, \"eval\": {\"row_id\": \"3369\", \"score\": 95.0, \"issues\": [\"guiding_case_number 为空\", \"judges 为空\", \"attorneys 为空\", \"trial_organizations 为空\"], \"court_case_count\": 2, \"judge_count\": 0, \"attorney_count\": 0, \"provision_count\": 5, \"evidence_count\": 5}}", "5412": "{\"row_id\": \"5412\", \"input\": {\"id\": \"5412\", \"web_name\": \"人民法院案例库\", \"case_type\": \"行政-行政征收或者征用\", \"storage_no\": \"2013-18-3-005-001\"}, \"output\": {\"guiding_case\": {\"guiding_case_number\": \"指导案例18号\", \"guiding_case_name\": \"内蒙古秋实房地产开发有限责任公司诉呼和浩特市人民防空办公室人防行政征收案\", \"publication_date\": \"2013-01-01\", \"binding_force\": \"mandatory\", \"guiding_points\": \"建设单位违反人民防空法及有关规定，应当建设防空地下室而不建的，属于不履行法定义务的违法行为。建设单位应当依法缴纳防空地下室易地建设费的，不适用廉租住房和经济适用住房等保障性住房建设项目关于“免收城市基础设施配套费等各种行政事业性收费”的规定。\", \"key_words\": [\"行政\", \"人防行政征收\", \"防空地下室\", \"易地建设费\"], \"case_level\": \"guiding_case\", \"trial_procedure\": \"二审\", \"storage_no\": \"2013-18-3-005-001\", \"source_url\": \"https://rmfyalk.court.gov.cn\", \"judgment_mean\": \"\"}, \"case_type\": {\"category\": \"administrative\", \"level1\": \"行政\", \"level2\": \"行政征收或者征用\"}, \"court_cases\": [{\"case_number\": \"(2010)呼行终字第55号\", \"filing_date\": \"2010-01-01\", \"judgment_date\": \"2010-04-20\", \"trial_level\": \"second_instance\", \"trial_procedure\": \"二审\", \"court\": {\"name\": \"内蒙古自治区呼和浩特市中级人民法院\", \"court_level\": \"intermediate\"}, \"status\": \"effective\", \"cause_of_action\": \"行政征收\", \"dispute_resolution_type\": \"litigation\", \"party_count\": null}], \"legal_subjects\": [{\"name\": \"内蒙古秋实房地产开发有限责任公司\", \"subject_type\": \"organization\", \"org_type\": \"company\", \"credit_code\": null, \"roles\": [{\"role_code\": \"appellant\", \"role_name\": \"上诉人（原审原告）\", \"case_number\": \"(2010)呼行终字第55号\"}]}, {\"name\": \"呼和浩特市人民防空办公室\", \"subject_type\": \"organization\", \"org_type\": \"government_agency\", \"credit_code\": null, \"roles\": [{\"role_code\": \"appellee\", \"role_name\": \"被上诉人（原审被告）\", \"case_number\": \"(2010)呼行终字第55号\"}]}], \"attorneys\": [], \"judges\": [], \"prosecutors\": [], \"trial_organizations\": [], \"legal_provisions\": [{\"case_number\": \"(2010)呼行终字第55号\", \"statute\": \"中华人民共和国人民防空法\", \"article\": \"22\", \"paragraph\": \"\", \"item\": \"\", \"content\": \"城市新建民用建筑，按照国家有关规定修建战时可用于防空的地下室。\", \"citation_position\": \"basic_facts\", \"citation_purpose\": \"适用依据\"}, {\"case_number\": \"(2010)呼行终字第55号\", \"statute\": \"中华人民共和国人民防空法\", \"article\": \"48\", \"paragraph\": \"\", \"item\": \"\", \"content\": \"城市新建民用建筑，违反国家有关规定不修建战时可用于防空的地下室的，由县级以上人民政府人民防空主管部门对当事人给予警告，并责令限期修建，可以并处十万元以下的罚款。\", \"citation_position\": \"related_info\", \"citation_purpose\": \"适用依据\"}, {\"case_number\": \"(2010)呼行终字第55号\", \"statute\": \"人民防空工程建设管理规定\", \"article\": \"45\", \"paragraph\": \"\", \"item\": \"\", \"content\": \"城市新建民用建筑，按照国家有关规定修建防空地下室。\", \"citation_position\": \"basic_facts\", \"citation_purpose\": \"适用依据\"}, {\"case_number\": \"(2010)呼行终字第55号\", \"statute\": \"人民防空工程建设管理规定\", \"article\": \"47\", \"paragraph\": \"\", \"item\": \"\", \"content\": \"按规定需要修建防空地下室的民用建筑，因地质、地形等原因不宜修建的，或者规定应建面积小于民用建筑地面首层建筑面积的，经人民防空主管部门批准，可以不修建，但必须按照应修建防空地下室面积所需造价缴纳易地建设费。\", \"citation_position\": \"basic_facts\", \"citation_purpose\": \"适用依据\"}, {\"case_number\": \"(2010)呼行终字第55号\", \"statute\": \"人民防空工程建设管理规定\", \"article\": \"48\", \"paragraph\": \"\", \"item\": \"\", \"content\": \"按照规定应当修建防空地下室的民用建筑，因地质、地形等原因不宜修建的，或者规定应建面积小于民用建筑地面首层建筑面积的，经人民防空主管部门批准，可以不修建，但必须按照应修建防空地下室面积所需造价缴纳易地建设费，由人民防空主管部门就近易地修建。\", \"citation_position\": \"judgment_reason\", \"citation_purpose\": \"适用依据\"}, {\"case_number\": \"(2010)呼行终字第55号\", \"statute\": \"国务院关于解决城市低收入家庭住房困难的若干意见\", \"article\": \"16\", \"paragraph\": \"\", \"item\": \"\", \"content\": \"廉租住房和经济适用住房建设、棚户区改造、旧住宅区整治一律免收城市基础设施配套费等各种行政事业性收费和政府性基金。\", \"citation_position\": \"judgment_reason\", \"citation_purpose\": \"说理依据\"}, {\"case_number\": \"(2010)呼行终字第55号\", \"statute\": \"经济适用住房管理办法\", \"article\": \"8\", \"paragraph\": \"\", \"item\": \"\", \"content\": \"经济适用住房建设项目免收城市基础设施配套费等各种行政事业性收费和政府性基金。\", \"citation_position\": \"judgment_reason\", \"citation_purpose\": \"说理依据\"}], \"evidence\": [{\"content\": \"限期办理“结建”审批手续告知书，内容为要求秋实房地产公司办理防空地下室建设审批手续。\", \"evidence_type\": \"documentary\", \"submitted_by\": \"呼和浩特市人民防空办公室\", \"is_key_evidence\": true, \"admission_status\": \"admitted\", \"examination_status\": \"examined\", \"expert_institution\": \"\", \"expert_conclusion\": \"\"}, {\"content\": \"征收防空地下室易地建设费决定书（呼人防征费字（001）号），决定征收秋实房地产公司防空地下室易地建设费172.46万元。\", \"evidence_type\": \"documentary\", \"submitted_by\": \"呼和浩特市人民防空办公室\", \"is_key_evidence\": true, \"admission_status\": \"admitted\", \"examination_status\": \"examined\", \"expert_institution\": \"\", \"expert_conclusion\": \"\"}, {\"content\": \"秋实房地产公司对“秋实第一城”项目应建防空地下室5518平方米而未建无异议的陈述。\", \"evidence_type\": \"party_statement\", \"submitted_by\": \"内蒙古秋实房地产开发有限责任公司\", \"is_key_evidence\": true, \"admission_status\": \"admitted\", \"examination_status\": \"examined\", \"expert_institution\": \"\", \"expert_conclusion\": \"\"}], \"judgment_results\": [{\"result_type\": \"dismissed\", \"specific_judgment\": \"驳回上诉，维持原判\", \"reasoning\": \"法院认为，国务院《关于解决城市低收入家庭住房困难的若干意见》及《经济适用住房管理办法》关于免收行政事业性收费的规定，适用对象是合法建设行为。秋实房地产公司未按规定修建防空地下室，属于不履行法定义务的违法行为，不能适用免缴规定。否则将导致违法成本低于守法成本，违反立法目的，不利于维护国防安全和人民群众利益。\", \"case_number\": \"(2010)呼行终字第55号\", \"cost_allocation\": \"案件受理费由上诉人承担。\"}], \"case_summary\": {\"key_facts\": \"秋实房地产公司建设的经济适用住房“秋实第一城”项目未按规定修建防空地下室。呼和浩特市人防办向其送达告知书后，作出征收防空地下室易地建设费172.46万元的决定。秋实房地产公司对未建地下室及征收决定程序无异议，但认为其项目属于经济适用住房，应免收行政事业性收费，不应缴纳易地建设费。\", \"disputed_issues\": \"秋实房地产公司未修建防空地下室是否属于违法行为，以及能否适用经济适用住房免收行政事业性收费的规定免缴防空地下室易地建设费。\", \"conclusion\": \"法院认为，应当修建而未修建防空地下室属于不履行法定义务的违法行为，免收费用的规定仅针对合法建设行为，不适用于违法行为，故驳回秋实房地产公司的诉讼请求。\", \"amount_involved\": \"172.46万元\", \"guiding_points\": \"建设单位违反人民防空法及有关规定，应当建设防空地下室而不建的，属于不履行法定义务的违法行为。建设单位应当依法缴纳防空地下室易地建设费的，不适用廉租住房和经济适用住房等保障性住房建设项目关于“免收城市基础设施配套费等各种行政事业性收费”的规定。\", \"claim_amount\": \"172.46万元\", \"judgment_amount\": \"172.46万元\"}, \"legal_provision_elements\": [{\"provision_index\": 0, \"statute\": \"中华人民共和国人民防空法\", \"article\": \"22\", \"element_type\": \"act_element\", \"content\": \"城市新建民用建筑，应当按照国家有关规定修建战时可用于防空的地下室。\", \"applicable_fact_pattern\": \"城市新建民用建筑未修建防空地下室\"}, {\"provision_index\": 0, \"statute\": \"中华人民共和国人民防空法\", \"article\": \"22\", \"element_type\": \"legal_consequence\", \"content\": \"未修建则违反法定义务\", \"applicable_fact_pattern\": \"未履行修建义务\"}, {\"provision_index\": 4, \"statute\": \"人民防空工程建设管理规定\", \"article\": \"48\", \"element_type\": \"exception_clause\", \"content\": \"因地质、地形等原因不宜修建或应建面积小于首层面积的，经批准可不建但应缴纳易地建设费\", \"applicable_fact_pattern\": \"符合不宜修建条件且经批准\"}, {\"provision_index\": 5, \"statute\": \"国务院关于解决城市低收入家庭住房困难的若干意见\", \"article\": \"16\", \"element_type\": \"legal_consequence\", \"content\": \"廉租住房和经济适用住房建设等免收各种行政事业性收费\", \"applicable_fact_pattern\": \"合法建设的经济适用住房\"}, {\"provision_index\": 6, \"statute\": \"经济适用住房管理办法\", \"article\": \"8\", \"element_type\": \"legal_consequence\", \"content\": \"经济适用住房建设项目免收行政事业性收费\", \"applicable_fact_pattern\": \"合法的经济适用住房建设项目\"}]}, \"eval\": {\"row_id\": \"5412\", \"score\": 100.0, \"issues\": [\"judges 为空\", \"attorneys 为空\", \"trial_organizations 为空\"], \"court_case_count\": 1, \"judge_count\": 0, \"attorney_count\": 0, \"provision_count\": 7, \"evidence_count\": 3}}", "3926__v1": "{\"row_id\": \"3926\", \"input\": {\"id\": \"3926\", \"web_name\": \"人民法院案例库\", \"case_type\": \"行政-专利相关行政案件\", \"storage_no\": \"2023-13-3-024-047\"}, \"output\": {\"guiding_case\": {\"guiding_case_number\": \"\", \"guiding_case_name\": \"刘某生诉国家知识产权局外观设计专利权无效行政纠纷案\", \"publication_date\": \"2020-11-12\", \"binding_force\": \"persuasive\", \"guiding_points\": \"QQ空间、微信朋友圈等需授权访问的网络空间中的信息是否构成现有设计或者现有技术，应当综合分析该网络空间的主要用途、信息的上传时间及公开情况等因素，以专利申请日前该信息是否处于公众想获得就能够获得的状态为标准作出判断。需授权访问的网络空间以商业用途为主的，可以推定其对所有人公开，但有相反证据证明该网络空间未公开或者仅针对特定人公开的除外。\", \"key_words\": [\"行政\", \"外观设计专利权无效\", \"网络\", \"现有设计\", \"商业用途\"], \"case_level\": \"typical_case\", \"trial_procedure\": \"二审\", \"storage_no\": \"2023-13-3-024-047\", \"source_url\": \"https://rmfyalk.court.gov.cn\", \"judgment_mean\": \"\"}, \"case_type\": {\"category\": \"administrative\", \"level1\": \"行政\", \"level2\": \"专利相关行政案件\"}, \"court_cases\": [{\"case_number\": \"(2018)京73行初7134号\", \"filing_date\": \"2018-01-01\", \"judgment_date\": \"2020-04-28\", \"tria raph\": \"2\", \"item\": \"\", \"content\": \"授予专利权的外观设计与现有设计或者现有设计特征的组合相比，应当具有明显区别。\", \"citation_position\": \"related_law\", \"citation_purpose\": \"适用依据\"}], \"evidence\": [{\"content\": \"第4291*号公证书复印件，证明涉案QQ空间相册中商品照片的上传时间、公开权限（所有人可见）及网友询价记录。\", \"evidence_type\": \"documentary\", \"submitted_by\": \"潮州市某电子科技有限公司\", \"is_key_evidence\": true, \"admission_status\": \"admitted\", \"examination_status\": \"examined\", \"expert_institution\": \"\", \"expert_conclusion\": \"\"}, {\"content\": \"第0801*号公证书，补充证明涉案QQ空间的商业用途，进一步显示相册权限为“所有人可见/允许转载、分享、圈人/显示相机型号、拍摄时间”，并有2015年1月3日的评论。\", \"evidence_type\": \"documentary\", \"submitted_by\": \"潮州市某电子科技有限公司\", \"is_key_evidence\": true, \"admission_status\": \"admitted\", \"examination_status\": \"examined\", \"expert_institution\": \"\", \"expert_conclusion\": \"\"}], \"judgment_results\": [{\"result_type\": \"dismissed\", \"specific_judgment\": \"驳回上诉，维持原判。\", \"reasoning\": \"法院认为，涉案QQ空间主要用于商业用途，相册内容为商品展示，权限为“所有人可见”，且允许转载分享，可以认定该网络空间对不特定公众公开。涉案图片上传时间早于本专利申请日，构成现有设计。被诉决定认定错误，一审法院撤销被诉决定正确。上诉人刘某生的上诉理由不成立。\", \"case_number\": \"(2020)最高法知行终422号\", \"cost_allocation\": \"\"}], \"case_summary\": {\"key_facts\": \"刘某生是“电源支架”外观设计专利的专利权人，申请日为2015年12月4日。潮州市某电子科技有限公司请求宣告该专利无效，提交证据显示涉案QQ空间相册于2015年1月3日上传了铁质支架图片，权限为“所有人可见”，并伴有询价记录。国家知识产权局认为该QQ空间不具有公开性，维持专利有效。潮州市某电子科技有限公司起诉后，一审法院撤销该决定，刘某生上诉。\", \"disputed_issues\": \"涉案QQ空间相册中的图片是否构成现有设计，即该网络空间在专利申请日前是否处于公众想获得就能获得的状态。\", \"conclusion\": \"二审法院认定，涉案QQ空间主要用于商业用途，其相册内容对所有人可见并允许转载分享，应视为公开，图片上传时间早于专利申请日，构成现有设计，驳回上诉，维持一审撤销被诉决定的判决。\", \"amount_involved\": \"\", \"guiding_points\": \"\", \"claim_amount\": \"\", \"judgment_amount\": \"\"}, \"legal_provision_elements\": [{\"provision_index\": 0, \"statute\": \"中华人民共和国专利法\", \"article\": \"23\", \"element_type\": \"act_element\", \"content\": \"授予专利权的外观设计，应当不属于现有设计；也没有任何单位或者个人就同样的外观设计在申请日以前向国务院专利行政部门提出过申请，并记载在申请日以后公告的专利文件中。\", \"applicable_fact_pattern\": \"存在与涉案外观设计相同或近似的设计，且该设计在专利申请日前已为公众所知。\"}]}, \"eval\": {\"row_id\": \"3926\", \"score\": 95.0, \"issues\": [\"guiding_case_number 为空\", \"attorneys 为空\"], \"court_case_count\": 2, \"judge_count\": 1, \"attorney_count\": 0, \"provision_count\": 1, \"evidence_count\": 2}}", "3926__v2": "{\"row_id\": \"3926\", \"input\": {\"id\": \"3926\", \"web_name\": \"人民法院案例库\", \"case_type\": \"行政-专利相关行政案件\", \"storage_no\": \"2023-13-3-024-047\"}, \"output\": {\"guiding_case\": {\"guiding_case_number\": \"\", \"guiding_case_name\": \"刘某生诉国家知识产权局、潮州市某电子科技有限公司外观设计专利权无效行政纠纷案\", \"publication_date\": \"2023-01-01\", \"binding_force\": \"persuasive\", \"guiding_points\": \"QQ空间、微信朋友圈等需授权访问的网络空间中的信息是否构成现有设计或者现有技术，应当综合分析该网络空间的主要用途、信息的上传时间及公开情况等因素，以专利申请日前该信息是否处于公众想获得就能够获得的状态为标准作出判断。需授权访问的网络空间以商业用途为主的，可以推定其对所有人公开，但有相反证据证明该网络空间未公开或者仅针对特定人公开的除外。\", \"key_words\": [\"行政\", \"外观设计专利权无效\", \"网络\", \"现有设计\", \"商业用途\"], \"case_level\": \"typical_case\", \"trial_procedure\": \"二审\", \"storage_no\": \"2023-13-3-024-047\", \"source_url\": \"https://rmfyalk.court.gov.cn\", \"judgment_mean\": \"\"}, \"case_type\": {\"category\": \"administrative\", \"level1\": \"行政\", \"level2\": \"专利相关行政案件\"}, \"court_cases\": [{\"case_number\": \"(2018)京73行初7134号\", \"filing_date\": \"2018-01-01\", \"judgment_date\": \"2020-04-28\", \"trial_level\": \"first_instance\", \"trial_procedure\": \"一审\", \"court\": {\"name\": \"北京知识产权法院\", \"court_level\": \"special\"}, \"status\": \"appealed\", \"cause_of_action\": \"外观设计专利权无效行政纠纷\", \"dispute_resolution_type\": \"litigation\", \"party_count\": null}, {\"case_number\": \"(2020)最高法知行终422号\", \"filing_date\": \"2020-01-01\", \"judgment_date\": \"2020-11-12\", \"trial_level\": \"second_instance\", \"trial_procedure\": \"二审\", \"court\": {\"name\": \"最高人民法院\", \"court_level\": \"supreme\"}, \"status\": \"effective\", \"cause_of_action\": \"外观设计专利权无效行政纠纷\", \"dispute_resolution_type\": \"litigation\", \"party_count\": null}], \"legal_subjects\": [{\"name\": \"刘某生\", \"subject_type\": \"natural_person\", \"org_type\": \"\", \"credit_code\": null, \"roles\": [{\"role_code\": \"third_party\", \"role_name\": \"第三人\", \"case_number\": \"(2018)京73行初7134号\"}, {\"role_code\": \"appellant\", \"role_name\": \"上诉人\", \"case_number\": \"(2020)最高法知行终422号\"}]}, {\"name\": \"潮州市某电子科技有限公司\", \"subject_type\": \"organization\", \"org_type\": \"company\", \"credit_code\": null, \"roles\": [{\"role_code\": \"plaintiff\", \"role_name\": \"原告\", \"case_number\": \"(2018)京73行初7134号\"}, {\"role_code\": \"appellee\", \"role_name\": \"被上诉人\", \"case_number\": \"(2020)最高法知行终422号\"}]}, {\"name\": \"国家知识产权局\", \"subject_type\": \"organization\", \"org_type\": \"government_agency\", \"credit_code\": null, \"roles\": [{\"role_code\": \"defendant\", \"role_name\": \"被告\", \"case_number\": \"(2018)京73行初7134号\"}, {\"role_code\": \"appellee\", \"role_name\": \"被上诉人\", \"case_number\": \"(2020)最高法知行终422号\"}]}], \"attorneys\": [], \"judges\": [], \"prosecutors\": [], \"trial_organizations\": [], \"legal_provisions\": [{\"case_number\": \"(2020)最高法知行终422号\", \"statute\": \"中华人民共和国专利法\", \"article\": \"23\", \"paragraph\": \"2\", \"item\": \"\", \"content\": \"授予专利权的外观设计与现有设计或者现有设计特征的组合相比，应当具有明显区别。\", \"citation_position\": \"judgment_reason\", \"citation_purpose\": \"说理依据\"}], \"evidence\": [{\"content\": \"第4291*号公证书复印件，记载了潮州市某电子科技有限公司的委托代理人进入涉案QQ空间取证的过程，显示空间中存在大量商品相册，其中铁质支架的图片上传时间为2015年1月3日，显示权限为“所有人可见”，并伴有网友的询价记录。\", \"evidence_type\": \"documentary\", \"submitted_by\": \"潮州市某电子科技有限公司\", \"is_key_evidence\": true, \"admission_status\": \"admitted\", \"examination_status\": \"examined\", \"expert_institution\": \"\", \"expert_conclusion\": \"\"}, {\"content\": \"第0801*号公证书，系对证据1的补强证据，进一步证明了涉案QQ空间的商业用途，显示相册权限全部描述为“所有人可见/允许转载、分享、圈人/显示相机型号、拍摄时间”，相册在2015年1月3日创建并更新，该相册下有两条询问商品信息的评论，评论时间为2015年1月3日。\", \"evidence_type\": \"documentary\", \"submitted_by\": \"潮州市某电子科技有限公司\", \"is_key_evidence\": true, \"admission_status\": \"admitted\", \"examination_status\": \"examined\", \"expert_institution\": \"\", \"expert_conclusion\": \"\"}], \"judgment_results\": [{\"result_type\": \"administrative_decision\", \"specific_judgment\": \"撤销原国家知识产权局专利复审委员会作出的第35851号无效宣告请求审查决定；国家知识产权局就潮州市某电子科技有限公司所提无效宣告请求重新作出决定。\", \"reasoning\": \"一审法院认为，涉案QQ空间相册内容显示权限为“所有人可见”，且具有商业用途，上传时间早于专利申请日，应当认定为现有设计，被诉决定认定事实和适用法律错误，故依法撤销并责令重作。\", \"case_number\": \"(2018)京73行初7134号\", \"cost_allocation\": \"\"}, {\"result_type\": \"dismissed\", \"specific_judgment\": \"驳回上诉，维持原判。\", \"reasoning\": \"法院生效裁判认为，对于QQ空间相册内容是否构成现有设计，应综合考虑其主要用途、上传时间、公开情况等。涉案QQ空间相册用于商业推销，权限设置为所有人可见，上传时间早于专利申请日，且没有任何限制添加好友或保密要求，因此处于公众想获得即可获得的状态，构成现有设计。一审判决认定事实清楚，适用法律正确，应予维持。\", \"case_number\": \"(2020)最高法知行终422号\", \"cost_allocation\": \"\"}], \"case_summary\": {\"key_facts\": \"本专利为“电源支架”外观设计，申请日2015年12月4日。潮州市某电子科技有限公司以QQ空间相册中的铁质支架图片上传时间2015年1月3日、权限所有人可见为由，请求宣告本专利无效。国家知识产权局认为该QQ空间不具有公开性，维持专利有效。潮州市某电子科技有限公司不服，向北京知识产权法院提起诉讼。一审法院判决撤销被诉决定，责令重作。刘某生提起上诉。\", \"disputed_issues\": \"涉案QQ空间相册内容是否构成专利法意义上的现有设计，即该信息是否处于公众想获得就能够获得的状态，以及其公开时间是否早于专利申请日。\", \"conclusion\": \"二审法院维持一审判决，认定涉案QQ空间相册具有公开性，其上传时间早于专利申请日，构成现有设计，撤销被诉决定，责令国家知识产权局重新作出审查决定。\", \"amount_involved\": \"\", \"guiding_points\": \"QQ空间、微信朋友圈等需授权访问的网络空间中的信息是否构成现有设计或者现有技术，应当综合分析该网络空间的主要用途、信息的上传时间及公开情况等因素，以专利申请日前该信息是否处于公众想获得就能够获得的状态为标准作出判断。需授权访问的网络空间以商业用途为主的，可以推定其对所有人公开，但有相反证据证明该网络空间未公开或者仅针对特定人公开的除外。\", \"claim_amount\": \"\", \"judgment_amount\": \"\"}, \"legal_provision_elements\": [{\"provision_index\": 0, \"statute\": \"中华人民共和国专利法\", \"article\": \"23\", \"element_type\": \"act_element\", \"content\": \"授予专利权的外观设计与现有设计或者现有设计特征的组合相比，应当具有明显区别。\", \"applicable_fact_pattern\": \"涉案外观设计与申请日前的公开设计相比无明显区别\"}, {\"provision_index\": 0, \"statute\": \"中华人民共和国专利法\", \"article\": \"23\", \"element_type\": \"legal_consequence\", \"content\": \"违反该规定的，不能授予专利权；已经授予的，任何单位或者个人可以请求宣告该专利权无效。\", \"applicable_fact_pattern\": \"当存在现有设计公开，涉案专利与之无明显区别时，应被宣告无效\"}]}, \"eval\": {\"row_id\": \"3926\", \"score\": 95.0, \"issues\": [\"guiding_case_number 为空\", \"judges 为空\", \"attorneys 为空\", \"trial_organizations 为空\"], \"court_case_count\": 2, \"judge_count\": 0, \"attorney_count\": 0, \"provision_count\": 1, \"evidence_count\": 2}}", "699": "{\"row_id\": \"699\", \"input\": {\"id\": \"699\", \"web_name\": \"人民法院案例库\", \"case_type\": \"行政-行政确认\", \"storage_no\": \"2024-12-3-007-019\"}, \"output\": {\"guiding_case\": {\"guiding_case_number\": \"\", \"guiding_case_name\": \"北京某科技发展有限公司诉北京市海淀区人力资源和社会保障局工伤认定案\", \"publication_date\": \"2024-05-27\", \"binding_force\": \"persuasive\", \"guiding_points\": \"1.用人单位聘用的超过法定退休年龄的务工农民，在工作时间内、因工作原因伤亡的，应当适用《工伤保险条例》的有关规定进行工伤认定。\\n2.职工中午回宿舍就餐是正常的生理需求，可以视为与履行工作职责相关以及工作时间的合理延伸。此种情况下员工受到事故伤害，符合《工伤保险条例》第十四条第一项规定的，依法应当认定为工伤。\", \"key_words\": [\"行政\", \"行政确认\", \"工伤保险待遇\", \"工作时间\", \"工作岗位\", \"合理延伸\", \"超过法定退休年龄\"], \"case_level\": \"typical_case\", \"trial_procedure\": \"二审\", \"storage_no\": \"2024-12-3-007-019\", \"source_url\": \"https://rmfyalk.court.gov.cn\", \"judgment_mean\": \"\"}, \"case_type\": {\"category\": \"administrative\", \"level1\": \"行政\", \"level2\": \"行政确认\"}, \"court_cases\": [{\"case_number\": \"(2023)京0108行初711号\", \"filing_date\": \"2023-01-01\", \"judgment_date\": \"2024-02-02\", \"trial_level\": \"first_instance\", \"trial_procedure\": \"一审\", \"court\": {\"name\": \"北京市海淀区人民法院\", \"court_level\": \"basic\"}, \"status\": \"effective\", \"cause_of_action\": \"行政确认\", \"dispute_resolution_type\": \"litigation\", \"party_count\": null}, {\"case_number\": \"(2024)京01行终254号\", \"filing_date\": \"2024-01-01\", \"judgment_date\": \"2024-05-27\", \"trial_level\": \"second_instance\", \"trial_procedure\": \"二审\", \"court\": {\"name\": \"北京市第一中级人民法院\", \"court_level\": \"intermediate\"}, \"status\": \"effective\", \"cause_of_action\": \"行政确认\", \"dispute_resolution_type\": \"litigation\", \"party_count\": null}], \"legal_subjects\": [{\"name\": \"北京某科技发展有限公司\", \"subject_type\": \"organization\", \"org_type\": \"company\", \"credit_code\": null, \"roles\": [{\"role_code\": \"plaintiff\", \"role_name\": \"原告\", \"case_number\": \"(2023)京0108行初711号\"}, {\"role_code\": \"appellant\", \"role_name\": \"上诉人\", \"case_number\": \"(2024)京01行终254号\"}]}, {\"name\": \"北京市海淀区人力资源和社会保障局\", \"subject_type\": \"organization\", \"org_type\": \"government_agency\", \"credit_code\": null, \"roles\": [{\"role_code\": \"defendant\", \"role_name\": \"被告\", \"case_number\": \"(2023)京0108行初711号\"}, {\"role_code\": \"appellee\", \"role_name\": \"被上诉人\", \"case_number\": \"(2024)京01行终254号\"}]}], \"attorneys\": [], \"judges\": [], \"prosecutors\": [], \"trial_organizations\": [], \"legal_provisions\": [{\"case_number\": \"(2024)京01行终254号\", \"statute\": \"最高人民法院行政审判庭关于超过法定退休年龄的进城务工农民因工伤亡的，应否适用〈工伤保险条例〉请示的答复\", \"article\": \"\", \"paragraph\": \"\", \"item\": \"\", \"content\": \"用人单位聘用的超过法定退休年龄的务工农民，在工作时间内、因工作原因伤亡的，应当适用《工伤保险条例》的有关规定进行工伤认定。\", \"citation_position\": \"judgment_reason\", \"citation_purpose\": \"适用依据\"}, {\"case_number\": \"(2024)京01行终254号\", \"statute\": \"工伤保险条例\", \"article\": \"14\", \"paragraph\": \"1\", \"item\": \"\", \"content\": \"在工作时间和工作场所内，因工作原因受到事故伤害的\", \"citation_position\": \"judgment_reason\", \"citation_purpose\": \"适用依据\"}, {\"case_number\": \"(2024)京01行终254号\", \"statute\": \"工伤保险条例\", \"article\": \"19\", \"paragraph\": \"2\", \"item\": \"\", \"content\": \"职工或者其近亲属认为是工伤，用人单位不认为是工伤的，由用人单位承担举证责任。\", \"citation_position\": \"judgment_reason\", \"citation_purpose\": \"说理依据\"}, {\"case_number\": \"(2024)京01行终254号\", \"statute\": \"最高人民法院关于审理工伤保险行政案件若干问题的规定\", \"article\": \"4\", \"paragraph\": \"4\", \"item\": \"\", \"content\": \"社会保险行政部门认定下列情形为工伤的，人民法院应予支持：……其他与履行工作职责相关，在工作时间及合理区域内受到伤害的。\", \"citation_position\": \"judgment_reason\", \"citation_purpose\": \"说理依据\"}, {\"case_number\": \"(2024)京01行终254号\", \"statute\": \"工伤保险条例\", \"article\": \"14\", \"paragraph\": \"1\", \"item\": \"\", \"content\": \"在工作时间和工作场所内，因工作原因受到事故伤害的\", \"citation_position\": \"related_info\", \"citation_purpose\": \"适用依据\"}], \"evidence\": [{\"content\": \"劳务协议，证明席某花与北京某科技公司存在劳务关系，岗位为种植工，综合工时员工。\", \"evidence_type\": \"documentary\", \"submitted_by\": \"北京市海淀区人力资源和社会保障局\", \"is_key_evidence\": true, \"admission_status\": \"admitted\", \"examination_status\": \"examined\", \"expert_institution\": \"\", \"expert_conclusion\": \"\"}, {\"content\": \"交通事故认定书，证明席某花于2022年10月27日发生交通事故，且本人负非主要责任。\", \"evidence_type\": \"documentary\", \"submitted_by\": \"北京市海淀区人力资源和社会保障局\", \"is_key_evidence\": true, \"admission_status\": \"admitted\", \"examination_status\": \"examined\", \"expert_institution\": \"\", \"expert_conclusion\": \"\"}, {\"content\": \"医院抢救记录及死亡证明，证明席某花因交通事故抢救无效死亡。\", \"evidence_type\": \"documentary\", \"submitted_by\": \"北京市海淀区人力资源和社会保障局\", \"is_key_evidence\": true, \"admission_status\": \"admitted\", \"examination_status\": \"examined\", \"expert_institution\": \"\", \"expert_conclusion\": \"\"}, {\"content\": \"单位证明及证人证言，证明席某花工作地点为农庄1号院，单位宿舍为农庄2号院，事发当日中午下班后从工作地点返回宿舍途中发生事故。\", \"evidence_type\": \"documentary\", \"submitted_by\": \"北京市海淀区人力资源和社会保障局\", \"is_key_evidence\": true, \"admission_status\": \"admitted\", \"examination_status\": \"examined\", \"expert_institution\": \"\", \"expert_conclusion\": \"\"}], \"judgment_results\": [{\"result_type\": \"dismissed\", \"specific_judgment\": \"驳回北京某科技公司的诉讼请求。\", \"reasoning\": \"法院认为，海淀区人保局作出的工伤认定决定具有事实和法律依据。席某花虽已超退休年龄，但据最高法答复应适用《工伤保险条例》；中午回宿舍就餐属生理需求，可视为工作时间与工作岗位的合理延伸，符合《工伤保险条例》第十四条第一项；海淀区人保局程序合法，故判决驳回原告诉讼请求。\", \"case_number\": \"(2023)京0108行初711号\", \"cost_allocation\": \"\"}, {\"result_type\": \"dismissed\", \"specific_judgment\": \"驳回上诉，维持原判。\", \"reasoning\": \"二审法院认为，一审判决认定事实清楚，适用法律正确。席某花发生事故时是在工作时间、工作岗位的合理延伸范围内，应认定为工伤。上诉人北京某科技公司的上诉理由不能成立，故驳回上诉，维持原判。\", \"case_number\": \"(2024)京01行终254号\", \"cost_allocation\": \"\"}], \"case_summary\": {\"key_facts\": \"席某花系北京某科技公司退休返聘员工，从事种植工作。2022年10月27日中午，席某花下班后乘坐同事电动三轮摩托车从工作地点返回单位宿舍就餐途中，发生非本人主要责任的交通事故后死亡。其女申请工伤认定，海淀区人保局作出认定工伤决定。公司不服提起行政诉讼，一审法院判决驳回其诉讼请求，公司上诉后二审维持原判。\", \"disputed_issues\": \"1.超过法定退休年龄的席某花是否属于《工伤保险条例》适用范围；2.中午下班返回宿舍就餐途中发生事故是否属于“工作时间和工作场所”的合理延伸。\", \"conclusion\": \"法院认为，超龄务工人员在工作时间内因工作原因伤亡应适用《工伤保险条例》；职工中午回宿舍就餐是正常生理需求，可视为与履行工作职责相关以及工作时间、工作岗位的合理延伸，席某花在途中发生非本人主要责任交通事故应认定为工伤。海淀区人保局作出的工伤认定决定合法，法院予以支持。\", \"amount_involved\": \"\", \"guiding_points\": \"1.用人单位聘用的超过法定退休年龄的务工农民，在工作时间内、因工作原因伤亡的，应当适用《工伤保险条例》的有关规定进行工伤认定。\\n2.职工中午回宿舍就餐是正常的生理需求，可以视为与履行工作职责相关以及工作时间的合理延伸。此种情况下员工受到事故伤害，符合《工伤保险条例》第十四条第一项规定的，依法应当认定为工伤。\", \"claim_amount\": \"\", \"judgment_amount\": \"\"}, \"legal_provision_elements\": [{\"provision_index\": 0, \"statute\": \"最高人民法院行政审判庭关于超过法定退休年龄的进城务工农民因工伤亡的，应否适用〈工伤保险条例〉请示的答复\", \"article\": \"\", \"element_type\": \"subject_element\", \"content\": \"用人单位聘用的超过法定退休年龄的务工农民\", \"applicable_fact_pattern\": \"劳动者达到法定退休年龄后与用人单位建立劳务关系\"}, {\"provision_index\": 0, \"statute\": \"最高人民法院行政审判庭关于超过法定退休年龄的进城务工农民因工伤亡的，应否适用〈工伤保险条例〉请示的答复\", \"article\": \"\", \"element_type\": \"act_element\", \"content\": \"在工作时间内、因工作原因伤亡\", \"applicable_fact_pattern\": \"在单位安排的工作时间和工作场所内，因履行工作职责受到伤害\"}, {\"provision_index\": 0, \"statute\": \"最高人民法院行政审判庭关于超过法定退休年龄的进城务工农民因工伤亡的，应否适用〈工伤保险条例〉请示的答复\", \"article\": \"\", \"element_type\": \"legal_consequence\", \"content\": \"应当适用《工伤保险条例》的有关规定进行工伤认定\", \"applicable_fact_pattern\": \"符合主体和事实条件的伤亡情形\"}, {\"provision_index\": 1, \"statute\": \"工伤保险条例\", \"article\": \"14\", \"element_type\": \"subject_element\", \"content\": \"职工\", \"applicable_fact_pattern\": \"与用人单位存在劳动关系（含事实劳动关系）的人员\"}, {\"provision_index\": 1, \"statute\": \"工伤保险条例\", \"article\": \"14\", \"element_type\": \"act_element\", \"content\": \"在工作时间和工作场所内，因工作原因受到事故伤害\", \"applicable_fact_pattern\": \"在单位规定的上班时间、工作地点，因从事本职工作或与工作相关的活动而受到意外伤害\"}, {\"provision_index\": 1, \"statute\": \"工伤保险条例\", \"article\": \"14\", \"element_type\": \"legal_consequence\", \"content\": \"应当认定为工伤\", \"applicable_fact_pattern\": \"同时满足主体、行为要件的伤害事故\"}, {\"provision_index\": 3, \"statute\": \"最高人民法院关于审理工伤保险行政案件若干问题的规定\", \"article\": \"4\", \"element_type\": \"act_element\", \"content\": \"其他与履行工作职责相关，在工作时间及合理区域内受到伤害的\", \"applicable_fact_pattern\": \"伤害发生在上下班合理路线、合理时间，或从事与工作相关的预备性、收尾性活动\"}]}, \"eval\": {\"row_id\ ": {\"name\": \"最高人民法院\", \"court_level\": \"supreme\"}, \"status\": \"effective\", \"cause_of_action\": \"商标撤销复审行政纠纷\", \"dispute_resolution_type\": \"litigation\", \"party_count\": null}], \"legal_subjects\": [{\"name\": \"伽某（集团）股份有限公司\", \"subject_type\": \"organization\", \"org_type\": \"company\", \"credit_code\": null, \"roles\": [{\"role_code\": \"plaintiff\", \"role_name\": \"原告\", \"case_number\": \"(2018)京73行初6024号\"}, {\"role_code\": \"appellant\", \"role_name\": \"上诉人\", \"case_number\": \"(2019)京行终6715号\"}, {\"role_code\": \"retrial_respondent\", \"role_name\": \"再审被申请人\", \"case_number\": \"(2021)最高法行再31号\"}]}, {\"name\": \"上海丰某工艺品有限公司\", \"subject_type\": \"organization\", \"org_type\": \"company\", \"credit_code\": null, \"roles\": [{\"role_code\": \"third_party\", \"role_name\": \"第三人\", \"case_number\": \"(2018)京73行初6024号\"}, {\"role_code\": \"appellee\", \"role_name\": \"被上诉人\", \"case_number\": \"(2019)京行终6715号\"}, {\"role_code\": \"retrial_applicant\", \"role_name\": \"再审申请人\", \"case_number\": \"(2021)最高法行再31号\"}]}, {\"name\": \"国家知识产权局\", \"subject_type\": \"organization\", \"org_type\": \"government_agency\", \"credit_code\": null, \"roles\": [{\"role_code\": \"defendant\", \"role_name\": \"被告\", \"case_number\": \"(2018)京73行初6024号\"}, {\"role_code\": \"appellee\", \"role_name\": \"被上诉人\", \"case_number\": \"(2019)京行终6715号\"}, {\"role_code\": \"retrial_respondent\", \"role_name\": \"再审被申请人\", \"case_number\": \"(2021)最高法行再31号\"}]}], \"attorneys\": [], \"judges\": [], \"prosecutors\": [], \"trial_organizations\": [], \"legal_provisions\": [{\"case_number\": \"(2021)最高法行再31号\", \"statute\": \"中华人民共和国商标法（2001年修正）\", \"article\": \"44\", \"paragraph\": \"4\", \"item\": \"\", \"content\": \"注册商标连续三年停止使用的，由商标局责令限期改正或者撤销其注册商标。\", \"citation_position\": \"related_law\", \"citation_purpose\": \"适用依据\"}, {\"case_number\": \"(2021)最高法行再31号\", \"statute\": \"中华人民共和国商标法\", \"article\": \"49\", \"paragraph\": \"2\", \"item\": \"\", \"content\": \"注册商标成为其核定使用的商品的通用名称或者没有正当理由连续三年不使用的，任何单位或者个人可以向商标局申请撤销该注册商标。\", \"citation_position\": \"related_law\", \"citation_purpose\": \"说理依据\"}], \"evidence\": [{\"content\": \"伽某公司在二审阶段提交的证据2-9，包括转账收据、款项电汇凭证等，均为单方证据，未提供相应发票或有效转账凭证佐证。\", \"evidence_type\": \"documentary\", \"submitted_by\": \"伽某（集团）股份有限公司\", \"is_key_evidence\": true, \"admission_status\": \"not_admitted\", \"examination_status\": \"examined\", \"expert_institution\": \"\", \"expert_conclusion\": \"\"}, {\"content\": \"伽某公司就证据4中60万元广告费的履行补充提交了转账凭证和收据，但未提交有效发票证明合同实际履行，且未证明转账凭证与广告费的对应关系。\", \"evidence_type\": \"documentary\", \"submitted_by\": \"伽某（集团）股份有限公司\", \"is_key_evidence\": true, \"admission_status\": \"not_admitted\", \"examination_status\": \"examined\", \"expert_institution\": \"\", \"expert_conclusion\": \"\"}, {\"content\": \"证据9中2013年11月21日出库单，送货地址为绵阳城区某经营部，但该经营部工商登记显示该地址系2015年4月27日变更后的新地址，出库单真实性存疑。\", \"evidence_type\": \"documentary\", \"submitted_by\": \"伽某（集团）股份有限公司\", \"is_key_evidence\": true, \"admission_status\": \"not_admitted\", \"examination_status\": \"examined\", \"expert_institution\": \"\", \"expert_conclusion\": \"\"}, {\"content\": \"证据10-14，包括2018年、2019年的产品检测报告、备案报告、采购订单、发票、送货单及专柜销售实景照片等，形成于指定期间后，且销售清单包含大量其他品牌产品，不足以证明诉争商标产品的销售额。\", \"evidence_type\": \"documentary\", \"submitted_by\": \"伽某（集团）股份有限公司\", \"is_key_evidence\": true, \"admission_status\": \"not_admitted\", \"examination_status\": \"examined\", \"expert_institution\": \"\", \"expert_conclusion\": \"\"}], \"judgment_results\": [{\"result_type\": \"dismissed\", \"specific_judgment\": \"驳回原告伽某（集团）股份有限公司的诉讼请求。\", \"reasoning\": \"一审法院经审理认为伽某公司提交的证据不足以证明诉争商标在指定期间内进行了真实、有效的使用，维持商标评审委员会撤销决定。\", \"case_number\": \"(2018)京73行初6024号\", \"cost_allocation\": \"\"}, {\"result_type\": \"partially_upheld\", \"specific_judgment\": \"撤销北京知识产权法院（2018）京73行初6024号行政判决；国家知识产权局重新作出决定。\", \"reasoning\": \"二审法院认为伽某公司在二审中提交的大量指定期间外的销售证据能够证明诉争商标在指定期间后的使用，据此撤销一审判决，责令国家知识产权局重作决定。\", \"case_number\": \"(2019)京行终6715号\", \"cost_allocation\": \"\"}, {\"result_type\": \"dismissed\", \"specific_judgment\": \"一、撤销北京市高级人民法院（2019）京行终6715号行政判决；二、维持北京知识产权法院（2018）京73行初6024号行政判决；三、维持原国家工商行政管理总局商标评审委员会商评字[2018]第66731号决定。\", \"reasoning\": \"最高人民法院再审认为，伽某公司提交的在案证据不足以证明诉争商标在指定期间内进行了公开、真实、有效的使用，二审法院认定事实错误，予以纠正。\", \"case_number\": \"(2021)最高法行再31号\", \"cost_allocation\": \"\"}], \"case_summary\": {\"key_facts\": \"诉争商标系国际注册第61004X号“CHANDOR”，注册人伽某公司。丰某公司提起撤销，商标评审委员会决定予以撤销。伽某公司不服提起行政诉讼，一审驳回其诉讼请求。二审中伽某公司补充证据，北京市高级人民法院撤销一审判决，责令国家知识产权局重作。丰某公司申请再审，最高人民法院提审后认为在案证据不足，撤销二审判决，维持一审判决及撤销决定。\", \"disputed_issues\": \"诉争商标是否在指定期间内（2013年2月4日至2016年2月3日）进行了公开、真实、有效的使用。\", \"conclusion\": \"最高人民法院判决撤销二审判决，维持一审判决和商标评审委员会撤销决定，认定伽某公司提交的证据不足以证明其使用了诉争商标。\", \"amount_involved\": \"\", \"featured\": \"\", \"guiding_points\": \"在“三年不使用”商标撤销案件中，商标权人应提供证据证明诉争商标在指定期间内进行了公开、真实、有效的使用。\", \"claim_amount\": \"\", \"judgment_amount\": \"\"}, \"legal_provision_elements\": [{\"provision_index\": 0, \"statute\": \"中华人民共和国商标法（2001年修正）\", \"article\": \"44\", \"element_type\": \"act_element\", \"content\": \"连续三年停止使用\", \"applicable_fact_pattern\": \"商标权人无正当理由连续三年未实际使用注册商标\"}, {\"provision_index\": 0, \"statute\": \"中华人民共和国商标法（2001年修正）\", \"article\": \"44\", \"element_type\": \"legal_consequence\", \"content\": \"由商标局责令限期改正或者撤销其注册商标\", \"applicable_fact_pattern\": \"满足连续三年停止使用情形\"}, {\"provision_index\": 1, \"statute\": \"中华人民共和国商标法\", \"article\": \"49\", \"element_type\": \"act_element\", \"content\": \"没有正当理由连续三年不使用\", \"applicable_fact_pattern\": \"商标权人无正当理由连续三年未实际使用注册商标\"}, {\"provision_index\": 1, \"statute\": \"中华人民共和国商标法\", \"article\": \"49\", \"element_type\": \"legal_consequence\", \"content\": \"任何单位或者个人可以向商标局申请撤销该注册商标\", \"applicable_fact_pattern\": \"满足连续三年不使用情形\"}]}, \"eval\": {\"row_id\": \"3228\", \"score\": 95.0, \"issues\": [\"guiding_case_number 为空\", \"judges 为空\", \"attorneys 为空\", \"trial_organizations 为空\"], \"court_case_count\": 3, \"judge_count\": 0, \"attorney_count\": 0, \"provision_count\": 2, \"evidence_count\": 4}}", "2654__v1": "{\"row_id\": \"2654\", \"input\": {\"id\": \"2654\", \"web_name\": \"人民法院案例库\", \"case_type\": \"行政-植物新品种相关行政案件\", \"storage_no\": \"2024-13-3-023-001\"}, \"output\": {\"guiding_case\": {\"guiding_case_number\": \"\", \"guiding_case_name\": \"某种业公司诉植物新品种复审委员会植物新品种申请驳回复审行政纠纷案\", \"publication_date\": \"2023-10-23\", \"binding_force\": \"persuasive\", \"guiding_points\": \"植物新品种授权程序中特异性、一致性、稳定性（DUS）测试地点的确定，应当根据说明书中对品种适于生长的区域、环境等的记载，结合品种类型及育种过程和方法综合作出认定，以能够保证品种的性状得到充分表达为标准。\", \"key_words\": [\"行政\", \"植物新品种申请驳回复审\", \"特异性\", \"明显区别\", \"DUS测试\", \"测试机构\", \"测试地点\"], \"case_level\": \"typical_case\", \"trial_procedure\": \"二审\", \"storage_no\": \"2024-13-3-023-001\", \"source_url\": \"https://rmfyalk.court.gov.cn\", \"judgment_mean\": \"\"}, \"case_type\": {\"category\": \"administrative\", \"level1\": \"行政\", \"level2\": \"植物新品种相关行政案件\"}, \"court_cases\": [{\"case_number\": \"(2021)京73行初835号\", \"filing_date\": \"2021-01-01\", \"judgment_date\": \"2022-11-15\", \"trial_level\": \"first_instance\", \"trial_procedure\": \"一审\", \"court\": {\"name\": \"北京知识产权法院\", \"court_level\": \"special\"}, \"status\": \"judged\", \"cause_of_action\": \"植物新品种申请驳回复审行政纠纷\", \"dispute_resolution_type\": \"litigation\", \"party_count\": null}, {\"case_number\": \"(2023)最高法知行终95号\", \"filing_date\": \"2023-01-01\", \"judgment_date\": \"2023-10-23\", \"trial_level\": \"second_instance\", \"trial_procedure\": \"二审\", \"court\": {\"name\": \"最高人民法院\", \"court_level\": \"supreme\"}, \"status\": \"effective\", \"cause_of_action\": \"植物新品种申请驳回复审行政纠纷\", \"dispute_resolution_type\": \"litigation\", \"party_count\": null}], \"legal_subjects\": [{\"name\": \"某种业公司\", \"subject_type\": \"organization\", \"org_type\": \"company\", \"credit_code\": null, \"roles\": [{\"role_code\": \"plaintiff\", \"role_name\": \"原告\", \"case_number\": \"(2021)京73行初835号\"}, {\"role_code\": \"appellee\", \"role_name\": \"被上诉人\", \"case_number\": \"(2023)最高法知行终95号\"}]}, {\"name\": \"植物新品种复审委员会\", \"subject_type\": \"organization\", \"org_type\": \"government_agency\", \"credit_code\": null, \"roles\": [{\"role_code\": \"defendant\", \"role_name\": \"被告\", \"case_number\": \"(2021)京73行初835号\"}, {\"role_code\": \"appellant\", \"role_name\": \"上诉人\", \"case_number\": \"(2023)最高法知行终95号\"}]}], \"attorneys\": [], \"judges\": [], \"prosecutors\": [], \"trial_organizations\": [], \"legal_provisions\": [{\"case_number\": \"(2023)最高法知行终95号\", \"statute\": \"中华人民共和国种子法\", \"article\": \"25\", \"paragraph\": \"\", \"item\": \"\", \"content\": \"国家对主要农作物实行品种审定制度。主要农作物品种在推广前应当通过国家级或者省级审定。申请审定的品种应当符合特异性、一致性、稳定性要求。\", \"citation_position\": \"related_law\", \"citation_purpose\": \"适用依据\"}, {\"case_number\": \"(2023)最高法知行终95号\", \"statute\": \"中华人民共和国种子法\", \"article\": \"92\", \"paragraph\": \"7\", \"item\": \"\", \"content\": \"本法所称植物新品种，是指经过人工培育的或者对发现的野生植物加以开发，具有新颖性、特异性、一致性、稳定性和适当的命名的植物品种。\", \"citation_position\": \"related_law\", \"citation_purpose\": \"说理依据\"}, {\"case_number\": \"(2023)最高法知行终95号\", \"statute\": \"中华人民共和国植物新品种保护条例\", \"article\": \"30\", \"paragraph\": \"\", \"item\": \"\", \"content\": \"审批机关主要依据申请文件和其他有关书面材料进行实质审查。审批机关认为必要时，可以委托指定的测试机构进行测试或者考察业已完成的种植或者其他试验的结果。\", \"citation_position\": \"judgment_reason\", \"citation_purpose\": \"适用依据\"}, {\"case_number\": \"(2023)最高法知行终95号\", \"statute\": \"中华人民共和国植物新品种保护条例实施细则（农业部分）\", \"article\": \"21\", \"paragraph\": \"\", \"item\": \"\", \"content\": \"申请人提交的说明书中应当包括下列内容：（一）申请品种的暂定名称，该名称应当与请求书的名称一致；（二）申请品种所属的属或者种的中文名称和拉丁文名称；（三）育种过程和育种方法，包括系谱、培育过程和所使用的亲本或者其他繁殖材料来源与名称的详细说明；（四）有关销售情况的说明；（五）申请品种的特异性、一致性和稳定性的详细说明；（六）适于生长的区域或者环境以及栽培技术的说明；（七）申请品种与近似品种的性状对比，以及选择的近似品种及理由。\", \"citation_position\": \"judgment_reason\", \"citation_purpose\": \"适用依据\"}], \"evidence\": [{\"content\": \"农业农村部植物新品种测试（南京）分中心出具的“农麦168”植物品种DUS测试报告，测试地点在南京，经过两个完整生长周期，36个测试性状均得到充分表达。\", \"evidence_type\": \"expert_opinion\", \"submitted_by\": \"植物新品种保护办公室\", \"is_key_evidence\": true, \"admission_status\": \"admitted\", \"examination_status\": \"examined\", \"expert_institution\": \"农业农村部植物新品种测试（南京）分中心\", \"expert_conclusion\": \"“农麦168”与近似品种“淮麦21”经测试具备特异性，测试地点选择正确，性状得到充分表达。\"}], \"judgment_results\": [{\"result_type\": \"procedural_ruling\", \"specific_judgment\": \"撤销植物新品种复审委员会作出的复审决定2020年第21号《关于维持＜农麦168品种实质审查驳回决定＞的决定》；植物新品种复审委员会重新作出决定。\", \"reasoning\": \"一审法院认为，南京分中心出具的DUS测试报告因测试地点错误，不具备客观性和科学性，被诉决定据此作出实质审查驳回决定没有事实依据，应予撤销。\", \"case_number\": \"(2021)京73行初835号\", \"cost_allocation\": \"\"}, {\"result_type\": \"dismissed\", \"specific_judgment\": \"撤销北京知识产权法院（2021）京73行初835号行政判决；驳回某种业公司的诉讼请求。\", \"reasoning\": \"二审法院认为，DUS测试地点的确定应当根据说明书中对品种适于生长的区域、环境等的记载，结合品种类型及育种过程和方法综合作出认定，以能够保证品种的性状得到充分表达为标准。涉案申请“农麦168”在南京分中心经过两个完整生长周期测试，性状得到充分表达，测试地点确定并无不当；近似品种“淮麦21”同样在该地点得到充分表达，进一步佐证测试地点选择的合理性。被诉决定认定事实清楚，程序合法，一审判决撤销不当。\", \"case_number\": \"(2023)最高法知行终95号\", \"cost_allocation\": \"\"}], \"case_summary\": {\"key_facts\": \"某种业公司就“农麦168”小麦植物新品种申请被驳回，向植物新品种复审委员会申请复审，复审决定维持驳回决定。某种业公司主张测试地点南京错误，不应作为DUS测试地点，因为申请品种和近似品种适宜生态区为黄淮冬麦南片水地类型区，南京位于长江下游冬麦区。一审法院支持其主张，撤销被诉决定。二审法院查明，“农麦168”在南京分中心经两个完整生长周期测试，36个性状均得到充分表达，且近似品种“淮麦21”同样表现正常，认定测试地点选择无误。\", \"disputed_issues\": \"植物新品种DUS测试地点的选择标准，以及本案中南京分中心作为测试机构是否适当。\", \"conclusion\": \"二审法院撤销一审判决，驳回某种业公司的诉讼请求，认定被诉决定合法，测试地点的确定符合规定，申请品种性状得到充分表达。\", \"amount_involved\": \"\", \"guiding_points\": \"植物新品种授权程序中特异性、一致性、稳定性（DUS）测试地点的确定，应当根据说明书中对品种适于生长的区域、环境等的记载，结合品种类型及育种过程和方法综合作出认定，以能够保证品种的性状得到充分表达为标准。\", \"claim_amount\": \"\", \"judgment_amount\": \"\"}, \"legal_provision_elements\": [{\"provision_index\": 2, \"statute\": \"中华人民共和国植物新品种保护条例\", \"article\": \"30\", \"element_type\": \"act_element\", \"content\": \"审批机关进行实质审查时，可以委托指定的测试机构进行测试。\", \"applicable_fact_pattern\": \"当审批机关认为必要时，可委托测试机构对申请品种进行DUS测试。\"}, {\"provision_index\": 3, \"statute\": \"中华人民共和国植物新品种保护条例实施细则（农业部分）\", \"article\": \"21\", \"element_type\": \"act_element\", \"content\": \"申请人必须在说明书中载明申请品种适于生长的区域或者环境以及栽培技术的说明。\", \"applicable_fact_pattern\": \"申请人在提交品种权申请时，需在说明书中描述适于生长的区域或环境，该记载是确定测试地点的依据。\"}]}, \"eval\": {\"row_id\": \"2654\", \"score\": 95.0,
