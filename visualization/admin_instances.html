\": \"行政强制措施由法律、法规规定的行政机关在法定职权范围内实施。行政强制措施权不得委托。\", \"citation_position\": \"judgment_reason\", \"citation_purpose\": \"说理依据\"}, {\"case_number\": \"(2021)云2601行初8号\", \"statute\": \"中华人民共和国行政诉讼法\", \"article\": \"70\", \"paragraph\": \"\", \"item\": \"4\", \"content\": \"行政行为有下列情形之一的，人民法院判决撤销或者部分撤销：（四）超越职权的；\", \"citation_position\": \"related_law\", \"citation_purpose\": \"适用依据\"}], \"evidence\": [{\"content\": \"原告向文山市委、市政府递交的《文山某房地产公司关于请求暂缓缴纳国有建设用地使用权“外挂资金”的情况汇报》\", \"evidence_type\": \"documentary\", \"submitted_by\": \"原告某房地产公司\", \"is_key_evidence\": true, \"admission_status\": \"admitted\", \"examination_status\": \"examined\", \"expert_institution\": \"\", \"expert_conclusion\": \"\"}, {\"content\": \"文山市不动产登记中心出具的《文山市不动产登记中心关于协助办理文山某典房地产不动产抵押的函》（文不动产函〔2018〕23号）\", \"evidence_type\": \"documentary\", \"submitted_by\": \"被告文山市住房和城乡建设局\", \"is_key_evidence\": true, \"admission_status\": \"admitted\", \"examination_status\": \"examined\", \"expert_institution\": \"\", \"expert_conclusion\": \"\"}, {\"content\": \"被告向原告作出的《文山市住房管理中心关于锁定文山某典房地产公司网签备案系统的函》（2020年12月1日）\", \"evidence_type\": \"documentary\", \"submitted_by\": \"被告文山市住房和城乡建设局\", \"is_key_evidence\": true, \"admission_status\": \"admitted\", \"examination_status\": \"examined\", \"expert_institution\": \"\", \"expert_conclusion\": \"\"}], \"judgment_results\": [{\"result_type\": \"administrative_decision\", \"specific_judgment\": \"撤销被告文山市住房和城乡建设局对原告某房地产公司某泉居一期项目网签备案系统的冻结行政行为。\", \"reasoning\": \"被告冻结原告网签备案系统的行为属于行政强制措施，应遵守《行政强制法》。核心争议是被告是否具有冻结权限。依据《行政强制法》第10、16、17条，行政强制措施须由法律、法规设定并授权法定行政机关实施。现行房地产管理法律法规及规章均未授权房地产主管部门冻结网签备案系统，被告仅凭不动产登记中心的协助函实施冻结，缺乏法律依据，属于超越职权的违法行为，依法应予撤销。\", \"case_number\": \"(2021)云2601行初8号\", \"cost_allocation\": \"\"}], \"case_summary\": {\"key_facts\": \"2018年，原告某房地产公司因资金问题请求暂缓缴纳国有建设用地使用权外挂资金，并自愿以某泉居一期部分商铺作为抵押，承诺一年内缴清，逾期可由政府处置。经文山市不动产登记中心函告，在未缴清前冻结抵押商铺的出售、登记手续。后原告对外销售了部分抵押商铺，被告文山市住建局发现后于2020年6月冻结了原告开发的某泉居一期项目在新建商品房网上签约备案管理系统中的网签备案功能，导致原告无法正常销售。原告申请解冻未果，遂诉请撤销该冻结行为。\", \"disputed_issues\": \"被告文山市住房和城乡建设局是否具有冻结原告网签备案系统的法定权限。\", \"conclusion\": \"判决撤销被告文山市住房和城乡建设局对原告某房地产公司某泉居一期项目网签备案系统的冻结行政行为。\", \"amount_involved\": \"\", \"guiding_points\": \"商品房买卖合同网签备案系统是用于管理房地产企业的商品房预售、现售过程，便于房地产企业在商品房合同签订前、后进行房屋状态的核查，对于房屋已销售、查封、抵押、冻结、已预告登记等状态予以提示，通过信息技术手段，切实保护购房人的合法权益，可以有效遏制一房多卖、违规销售等行为，维护房地产市场运营秩序和健康发展。现行的法律、法规并没有规定及授权给房地产主管部门可以行使冻结房地产企业商品房网签备案系统的权限，房地产主管部门不能因其他因素直接采取冻结措施予以冻结。\", \"claim_amount\": \"\", \"judgment_amount\": \"\"}, \"legal_provision_elements\": []}, \"eval\": {\"row_id\": \"3072\", \"score\": 95.0, \"issues\": [\"guiding_case_number 为空\", \"judges 为空\", \"attorneys 为空\", \"trial_organizations 为空\"], \"court_case_count\": 1, \"judge_count\": 0, \"attorney_count\": 0, \"provision_count\": 4, \"evidence_count\": 3}}", "3072__v2": "{\"row_id\": \"3072\", \"input\": {\"id\": \"3072\", \"web_name\": \"人民法院案例库\", \"case_type\": \"行政-行政强制措施\", \"storage_no\": \"2023-12-3-002-004\"}, \"output\": {\"guiding_case\": {\"guiding_case_number\": \"\", \"guiding_case_name\": \"某房地产公司诉文山市住房和城乡建设局行政强制措施案\", \"publication_date\": \"2021-07-02\", \"binding_force\": \"persuasive\", \"guiding_points\": \"商品房买卖合同网签备案系统是用于管理房地产企业的商品房预售、现售过程，便于房地产企业在商品房合同签订前、后进行房屋状态的核查，对于房屋已销售、查封、抵押、冻结、已预告登记等状态予以提示，通过信息技术手段，切实保护购房人的合法权益，可以有效遏制一房多卖、违规销售等行为，维护房地产市场运营秩序和健康发展。现行的法律、法规并没有规定及授权给房地产主管部门可以行使冻结房地产企业商品房网签备案系统的权限，房地产主管部门不能因其他因素直接采取冻结措施予以冻结。\", \"key_words\": [\"行政\", \"行政强制措施\", \"实施主体\", \"房地产主管部门\", \"法律、法规规定\", \"行政权限\", \"授权\"], \"case_level\": \"typical_case\", \"trial_procedure\": \"一审\", \"storage_no\": \"2023-12-3-002-004\", \"source_url\": \"https://rmfyalk.court.gov.cn\", \"judgment_mean\": \"\"}, \"case_type\": {\"category\": \"administrative\", \"level1\": \"行政\", \"level2\": \"行政强制措施\"}, \"court_cases\": [{\"case_number\": \"(2021)云2601行初8号\", \"filing_date\": \"2021-01-01\", \"judgment_date\": \"2021-07-02\", \"trial_level\": \"first_instance\", \"trial_procedure\": \"一审\", \"court\": {\"name\": \"文山市人民法院\", \"court_level\": \"basic\"}, \"status\": \"effective\", \"cause_of_action\": \"行政强制措施纠纷\", \"dispute_resolution_type\": \"litigation\", \"party_count\": null}], \"legal_subjects\": [{\"name\": \"某房地产公司\", \"subject_type\": \"organization\", \"org_type\": \"company\", \"credit_code\": null, \"roles\": [{\"role_code\": \"plaintiff\", \"role_name\": \"原告\", \"case_number\": \"(2021)云2601行初8号\"}]}, {\"name\": \"文山市住房和城乡建设局\", \"subject_type\": \"organization\", \"org_type\": \"government_agency\", \"credit_code\": null, \"roles\": [{\"role_code\": \"defendant\", \"role_name\": \"被告\", \"case_number\": \"(2021)云2601行初8号\"}]}], \"attorneys\": [], \"judges\": [], \"prosecutors\": [], \"trial_organizations\": [], \"legal_provisions\": [{\"case_number\": \"(2021)云2601行初8号\", \"statute\": \"中华人民共和国行政强制法\", \"article\": \"10\", \"paragraph\": \"\", \"item\": \"\", \"content\": \"行政强制措施由法律设定。尚未制定法律，且属于国务院行政管理职权事项的，行政法规可以设定除本法第九条第一项、第四项和应当由法律规定的行政强制措施以外的其他行政强制措施。尚未制定法律、行政法规，且属于地方性事务的，地方性法规可以设定本法第九条第二项、第三项的行政强制措施。\", \"citation_position\": \"judgment_reason\", \"citation_purpose\": \"适用依据\"}, {\"case_number\": \"(2021)云2601行初8号\", \"statute\": \"中华人民共和国行政强制法\", \"article\": \"16\", \"paragraph\": \"1\", \"item\": \"\", \"content\": \"行政机关履行行政管理职责，依照法律、法规的规定，实施行政强制措施。\", \"citation_position\": \"judgment_reason\", \"citation_purpose\": \"适用依据\"}, {\"case_number\": \"(2021)云2601行初8号\", \"statute\": \"中华人民共和国行政强制法\", \"article\": \"17\", \"paragraph\": \"1\", \"item\": \"\", \"content\": \"行政强制措施由法律、法规规定的行政机关在法定职权范围内实施。行政强制措施权不得委托。\", \"citation_position\": \"judgment_reason\", \"citation_purpose\": \"适用依据\"}, {\"case_number\": \"(2021)云2601行初8号\", \"statute\": \"中华人民共和国行政诉讼法\", \"article\": \"70\", \"paragraph\": \"\", \"item\": \"4\", \"content\": \"行政行为有下列情形之一的，人民法院判决撤销或者部分撤销，并可以判决被告重新作出行政行为：（四）超越职权的。\", \"citation_position\": \"related_law\", \"citation_purpose\": \"适用依据\"}], \"evidence\": [{\"content\": \"原告提交的《解冻申请》，请求解除对其网签系统的冻结。\", \"evidence_type\": \"documentary\", \"submitted_by\": \"原告\", \"is_key_evidence\": true, \"admission_status\": \"admitted\", \"examination_status\": \"examined\", \"expert_institution\": \"\", \"expert_conclusion\": \"\"}, {\"content\": \"被告作出的《文山市住房管理中心关于锁定文山某典房地产公司网签备案系统的函》，告知原告因未按期缴纳外挂资金及擅自出售抵押商铺，对该楼盘予以锁定。\", \"evidence_type\": \"documentary\", \"submitted_by\": \"被告\", \"is_key_evidence\": true, \"admission_status\": \"admitted\", \"examination_status\": \"examined\", \"expert_institution\": \"\", \"expert_conclusion\": \"\"}], \"judgment_results\": [{\"result_type\": \"dismissed\", \"specific_judgment\": \"撤销被告文山市住房和城乡建设局对原告某房地产公司某泉居一期项目网签备案系统的冻结行政行为。\", \"reasoning\": \"法院认为，冻结网签备案系统属于行政强制措施，应遵守行政强制法的规定。行政强制措施须由法律、法规设定，实施机关须有法定授权。现行法律、法规未授权房地产主管部门冻结网签备案系统。被告仅依据文山市不动产登记中心的协助函实施冻结，缺乏法律依据，超越职权，故行政行为违法，应予撤销。\", \"case_number\": \"(2021)云2601行初8号\", \"cost_allocation\": \"\"}], \"case_summary\": {\"key_facts\": \"2018年7月，原告某房地产公司为暂缓缴纳国有建设用地使用权外挂资金，承诺以某泉居一期商铺抵押并在一年内缴清。后原告继续销售已承诺抵押的商铺。被告文山市住建局于2020年冻结了原告开发的某泉居一期项目的商品房网签备案系统，限制其销售。原告申请解冻被拒，遂提起诉讼。\", \"disputed_issues\": \"被告文山市住建局是否有权冻结原告的网签备案系统，即该行政强制措施是否具有法律、法规授权。\", \"conclusion\": \"法院认为冻结行为属于行政强制措施，但现行法律、法规未授权房地产主管部门行使该措施，被告超越职权，判决撤销冻结行为。\", \"amount_involved\": \"\", \"guiding_points\": \"商品房买卖合同网签备案系统是用于管理房地产企业的商品房预售、现售过程，便于房地产企业在商品房合同签订前、后进行房屋状态的核查，对于房屋已销售、查封、抵押、冻结、已预告登记等状态予以提示，通过信息技术手段，切实保护购房人的合法权益，可以有效遏制一房多卖、违规销售等行为，维护房地产市场运营秩序和健康发展。现行的法律、法规并没有规定及授权给房地产主管部门可以行使冻结房地产企业商品房网签备案系统的权限，房地产主管部门不能因其他因素直接采取冻结措施予以冻结。\", \"claim_amount\": \"\", \"judgment_amount\": \"\"}, \"legal_provision_elements\": [{\"provision_index\": 0, \"statute\": \"中华人民共和国行政强制法\", \"article\": \"10\", \"element_type\": \"act_element\", \"content\": \"行政强制措施由法律设定。尚未制定法律，行政法规可以设定除限制人身自由、冻结存款汇款以外的行政强制措施。地方性法规只能设定查封、扣押的行政强制措施。\", \"applicable_fact_pattern\": \"行政机关以地方文件或函件为依据实施强制措施，而不基于法律、法规设定的情形。\"}, {\"provision_index\": 1, \"statute\": \"中华人民共和国行政强制法\", \"article\": \"16\", \"element_type\": \"act_element\", \"content\": \"行政机关履行行政管理职责，依照法律、法规的规定，实施行政强制措施。\", \"applicable_fact_pattern\": \"行政机关实施强制措施时，行为无法律、法规依据。\"}, {\"provision_index\": 2, \"statute\": \"中华人民共和国行政强制法\", \"article\": \"17\", \"element_type\": \"subject_element\", \"content\": \"行政强制措施由法律、法规规定的行政机关在法定职权范围内实施。行政强制措施权不得委托。\", \"applicable_fact_pattern\": \"实施强制措施的行政机关并非法律、法规规定的有权限的机关，而是其他机关。\"}, {\"provision_index\": 3, \"statute\": \"中华人民共和国行政诉讼法\", \"article\": \"70\", \"element_type\": \"legal_consequence\", \"content\": \"行政行为超越职权的，人民法院判决撤销或者部分撤销。\", \"applicable_fact_pattern\": \"法院认定行政行为超越职权时，应适用此条撤销。\"}]}, \"eval\": {\"row_id\": \"3072\", \"score\": 95.0, \"issues\": [\"guiding_case_number 为空\", \"judges 为空\", \"attorneys 为空\", \"trial_organizations 为空\"], \"court_case_count\": 1, \"judge_count\": 0, \"attorney_count\": 0, \"provision_count\": 4, \"evidence_count\": 2}}", "692__v1": "{\"row_id\": \"692\", \"input\": {\"id\": \"692\", \"web_name\": \"人民法院案例库\", \"case_type\": \"行政-行政协议\", \"storage_no\": \"2024-12-3-018-005\"}, \"output\": {\"guiding_case\": {\"guiding_case_number\": \"\", \"guiding_case_name\": \"潍坊某置业公司诉安丘市人民政府行政协议案\", \"publication_date\": \"2019-05-22\", \"binding_force\": \"persuasive\", \"guiding_points\": \"1.行政优益权的行使必须符合法律规定，非因公共利益需要或国家法律政策发生重大调整，行政机关不得行使行政优益权单方变更、解除合同。对合同条款作限缩解释，减损相对人合同利益，属于不当行使行政优益权。2.地方政府在地方建设开发和招商引资领域的优惠政策应保持持续性和连贯性，以保护相对人的信赖利益及其他合法权益。涉及地方财政收入的税款返还条款，地方政府享有自主支配权，不违反法律规定，亦应为有效约定。\", \"key_words\": [\"行政\", \"行政协议\", \"行政优益权\", \"合同效力\", \"税收优惠\"], \"case_level\": \"typical_case\", \"trial_procedure\": \"再审\", \"storage_no\": \"2024-12-3-018-005\", \"source_url\": \"https://rmfyalk.court.gov.cn\", \"judgment_mean\": \"\"}, \"case_type\": {\"category\": \"administrative\", \"level1\": \"行政\", \"level2\": \"行政协议\"}, \"court_cases\": [{\"case_number\": \"(2015)潍行初字第35号\", \"filing_date\": \"2015-01-01\", \"judgment_date\": \"2016-11-02\", \"trial_level\": \"first_instance\", \"trial_procedure\": \"一审\", \"court\": {\"name\": \"山东省潍坊市中级人民法院\", \"court_level\": \"intermediate\"}, \"status\": \"appealed\", \"cause_of_action\": \"行政协议纠纷\", \"dispute_resolution_type\": \"litigation\", \"party_count\": null}, {\"case_number\": \"(2017)鲁行终495号\", \"filing_date\": \"2017-01-01\", \"judgment_date\": \"2017-07-18\", \"trial_level\": \"second_instance\", \"trial_procedure\": \"二审\", \"court\": {\"name\": \"山东省高级人民法院\", \"court_level\": \"high\"}, \"status\": \"effective\", \"cause_of_action\": \"行政协议纠纷\", \"dispute_resolution_type\": \"litigation\", \"party_count\": null}, {\"case_number\": \"(2017)最高法行申7679号\", \"filing_date\": \"2017-01-01\", \"judgment_date\": \"2019-05-22\", \"trial_level\": \"retrial\", \"trial_procedure\": \"再审\", \"court\": {\"name\": \"最高人民法院\", \"court_level\": \"supreme\"}, \"status\": \"judged\", \"cause_of_action\": \"行政协议纠纷\", \"dispute_resolution_type\": \"litigation\", \"party_count\": null}], \"legal_subjects\": [{\"name\": \"潍坊某置业公司\", \"subject_type\": \"organization\", \"org_type\": \"company\", \"credit_code\": null, \"roles\": [{\"role_code\": \"plaintiff\", \"role_name\": \"原告\", \"case_number\": \"(2015)潍行初字第35号\"}, {\"role_code\": \"appellant\", \"role_name\": \"上诉人\", \"case_number\": \"(2017)鲁行终495号\"}, {\"role_code\": \"retrial_applicant\", \"role_name\": \"再审申请人\", \"case_number\": \"(2017)最高法行申7679号\"}]}, {\"name\": \"安丘市人民政府\", \"subject_type\": \"organization\", \"org_type\": \"government_agency\", \"credit_code\": null, \"roles\": [{\"role_code\": \"defendant\", \"role_name\": \"被告\", \"case_number\": \"(2015)潍行初字第35号\"}, {\"role_code\": \"appellee\", \"role_name\": \"被上诉人\", \"case_number\": \"(2017)鲁行终495号\"}, {\"role_code\": \"retrial_applicant\", \"role_name\": \"再审申请人\", \"case_number\": \"(2017)最高法行申7679号\"}]}], \"attorneys\": [], \"judges\": [], \"prosecutors\": [], \"trial_organizations\": [], \"legal_provisions\": [{\"case_number\": \"(2017)最高法行申7679号\", \"statute\": \"中华人民共和国行政诉讼法\", \"article\": \"75\", \"paragraph\": \"\", \"item\": \"\", \"content\": \"行政行为有实施主体不具有行政主体资格或者没有依据等重大且明显违法情形，原告申请确认行政行为无效的，人民法院判决确认无效。\", \"citation_position\": \"judgment_reason\", \"citation_purpose\": \"适用依据\"}, {\"case_number\": \"(2017)最高法行申7679号\", \"statute\": \"最高人民法院关于适用《中华人民共和国行政诉讼法》的解释\", \"article\": \"99\", \"paragraph\": \"\", \"item\": \"\", \"content\": \"有下列情形之一的，属于行政诉讼法第七十五条规定的“重大且明显违法”：（一）行政行为实施主体不具有行政主体资格；（二）减损权利或者增加义务的行政行为没有法律规范依据；（三）行政行为的内容客观上不可能实施；（四）其他重大且明显违法的情形。\", \"citation_position\": \"judgment_reason\", \"citation_purpose\": \"适用依据\"}, {\"case_number\": \"(2017)最高法行申7679号\", \"statute\": \"国务院关于税收等优惠政策相关事项的通知\", \"article\": \"3\", \"paragraph\": \"\", \"item\": \"\", \"content\": \"各地与企业已签订合同中的优惠政策，继续有效；对已兑现的部分，不溯及既往。\", \"citation_position\": \"judgment_reason\", \"citation_purpose\": \"说理依据\"}], \"evidence\": [{\"content\": \"潍坊某置业公司提供的税单，证明其已缴纳土地增值税、土地使用税、营业税、教育附加费等多项税款。\", \"evidence_type\": \"documentary\", \"submitted_by\": \"原告潍坊某置业公司\", \"is_key_evidence\": true, \"admission_status\": \"admitted\", \"examination_status\": \"examined\", \"expert_institution\": \"\", \"expert_conclusion\": \"\"}, {\"content\": \"某钢铁公司出具的书面证明材料，确认《合同书》由潍坊某置业公司履行，某钢铁公司不再享有或履行该合同的权利和义务。\", \"evidence_type\": \"documentary\", \"submitted_by\": \"原告潍坊某置业公司\", \"is_key_evidence\": true, \"admission_status\": \"admitted\", \"examination_status\": \"examined\", \"expert_institution\": \"\", \"expert_conclusion\": \"\"}, {\"content\": \"安丘市人民政府批复及国有土地使用权出让合同，证明原告取得长安路两侧土地的使用权。\", \"evidence_type\": \"documentary\", \"submitted_by\": \"原告潍坊某置业公司\", \"is_key_evidence\": true, \"admission_status\": \"admitted\", \"examination_status\": \"examined\", \"expert_institution\": \"\", \"expert_conclusion\": \"\"}], \"judgment_results\": [{\"result_type\": \"liable\", \"specific_judgment\": \"一、确认《安丘市长安路改造及沿街房屋开发建设项目合同书》第四条第3项有效；二、安丘市人民政府返还营业税、教育附加费、所得税地方留成部分4556125.78元，并赔偿相应银行同期贷款利息损失；三、驳回潍坊某置业发展有限公司的其他诉讼请求。\", \"reasoning\": \"一审法院认为合同书第四条第2项约定超越法定权限，违反税收征收管理法强制性规定，但认可第3项有效，并部分支持返还请求。\", \"case_number\": \"(2015)潍行初字第35号\", \"cost_allocation\": \"\"}, {\"result_type\": \"partially_upheld\", \"specific_judgment\": \"一、维持一审判决第一项、第三项；二、变更一审判决第二项为：安丘市人民政府返还潍坊某置业发展有限公司缴纳的营业税、教育附加费、所得税地方留成部分共计11160072.08元，并按照中国人民银行同期贷款利率计算利息（利息自2015年5月18日起计算至本判决履行之日止）。\", \"reasoning\": \"二审法院认为合同书第四条第2项不违反法律强制性规定，应为有效；第3项属于地方财政自主支配，亦有效。纠正一审错误，提高返还金额。\", \"case_number\": \"(2017)鲁行终495号\", \"cost_allocation\": \"\"}, {\"result_type\": \"dismissed\", \"specific_judgment\": \"驳回再审申请人安丘市人民政府、潍坊某置业公司的再审申请。\", \"reasoning\": \"再审法院认为：行政协议效力判断应同时适用行政诉讼法关于无效行政行为的规定及民事法律关于合同无效的规定；安丘市政府主张合同整体无效的理由不成立；税收优惠条款符合国务院通知，有效；税款返还属于地方财政自主支配，不违反强制性规定；安丘市政府不当行使行政优益权不予支持。\", \"case_number\": \"(2017)最高法行申7679号\", \"cost_allocation\": \"\"}], \"case_summary\": {\"key_facts\": \"2005年，安丘市政府与某钢铁公司签订合同，约定长安路改造及沿街房屋开发项目，并给予税收优惠。后某钢铁公司注册成立潍坊某置业公司实际履行合同。项目完成后，潍坊某置业公司就缴纳的税款请求返还，安丘市政府未完全返还。潍坊某置业公司提起诉讼，请求确认合同有效、确认政府不履行部分条款违法、并返还税款及利息。一审确认部分条款有效并部分支持返还；二审提高返还金额。双方均申请再审，最高人民法院驳回。\", \"disputed_issues\": \"涉案合同书的效力；合同中税收优惠条款是否有效；安丘市政府是否应当返还相关税款。\", \"conclusion\": \"最高人民法院驳回再审申请，维持二审判决，认定合同有效，税收优惠条款不违反法律强制性规定，安丘市政府应返还营业税、教育附加费、所得税地方留成部分等。\", \"amount_involved\": \"17155718.85元\", \"claim_amount\": \"17155718.85元\", \"judgment_amount\": \"11160072.08元\", \"guiding_points\": \"1.行政优益权的行使必须符合法律规定，非因公共利益需要或国家法律政策发生重大调整，行政机关不得行使行政优益权单方变更、解除合同。对合同条款作限缩解释，减损相对人合同利益，属于不当行使行政优益权。2.地方政府在地方建设开发和招商引资领域的优惠政策应保持持续性和连贯性，以保护相对人的信赖利益及其他合法权益。涉及地方财政收入的税款返还条款，地方政府享有自主支配权，不违反法律规定，亦应为有效约定。\"}, \"legal_provision_elements\": [{\"provision_index\": 0, \"statute\": \"中华人民共和国行政诉讼法\", \"article\": \"75\", \"element_type\": \"act_element\", \"content\": \"行政行为有实施主体不具有行政主体资格或者没有依据等重大且明显违法情形。\", \"applicable_fact_pattern\": \"当行政协议存在重大且明显违法时，如签订协议的行政机关超越权限或者协议内容明显缺乏法律依据。\"}, {\"provision_index\": 0, \"statute\": \"中华人民共和国行政诉讼法\", \"article\": \"75\", \"element_type\": \"legal_consequence\", \"content\": \"人民法院判决确认无效。\", \"applicable_fact_pattern\": \"原告申请确认行政协议无效，且法院认定符合重大且明显违法标准。\"}, {\"provision_index\": 1, \"statute\": \"最高人民法院关于适用《中华人民共和国行政诉讼法》的解释\", \"article\": \"99\", \"element_type\": \"act_element\", \"content\": \"（一）行政行为实施主体不具有行政主体资格；（二）减损权利或者增加义务的行政行为没有法律规范依据；（三）行政行为的内容客观上不可能实施；（四）其他重大且明显违法的情形。\", \"applicable_fact_pattern\": \"判断行政行为是否存在重大且明显违法的具体情形。\"}, {\"provision_index\": 2, \"statute\": \"国务院关于税收等优惠政策相关事项的通知\", \"article\": \"3\", \"element_type\": \"legal_consequence\", \"content\": \"各地与企业已签订合同中的优惠政策，继续有效；对已兑现的部分，不溯及既往。\", \"applicable_fact_pattern\": \"地方政府与企业在合同中约定的税收优惠条款，只要不违反法律强制性规定，应继续有效。\"}]}, \"eval\": {\"row_id\": \"692\", \"score\": 95.0, \"issues\": [\"guiding_case_number 为空\", \"judges 为空\", \"attorneys 为空\", \"trial_organizations 为空\"], \"court_case_count\": 3, \"judge_count\": 0, \"attorney_count\": 0, \"provision_count\": 3, \"evidence_count\": 3}}", "692__v2": "{\"row_id\": \"692\", \"input\": {\"id\": \"692\", \"web_name\": \"人民法院案例库\", \"case_type\": \"行政-行政协议\", \"storage_no\": \"2024-12-3-018-005\"}, \"output\": {\"guiding_case\": {\"guiding_case_number\": \"\", \"guiding_case_name\": \"潍坊某置业发展有限公司诉安丘市人民政府行政协议案\", \"publication_date\": \"2019-05-22\", \"binding_force\": \"persuasive\", \"guiding_points\": \"1.行政优益权的行使必须符合法律规定，非因公共利益需要或国家法律政策发生重大调整，行政机关不得行使行政优益权单方变更、解除合同。对合同条款作限缩解释，减损相对人合同利益，属于不当行使行政优益权。\\n2.地方政府在地方建设开发和招商引资领域的优惠政策应保持持续性和连贯性，以保护相对人的信赖利益及其他合法权益。涉及地方财政收入的税款返还条款，地方政府享有自主支配权，不违反法律规定，亦应为有效约定。\", \"key_words\": [\"行政\", \"行政协议\", \"行政优益权\", \"合同效力\", \"税收优惠\"], \"case_level\": \"typical_case\", \"trial_procedure\": \"再审\", \"storage_no\": \"2024-12-3-018-005\", \"source_url\": \"https://rmfyalk.court.gov.cn\", \"judgment_mean\": \"\"}, \"case_type\": {\"category\": \"administrative\", \"level1\": \"行政\", \"level2\": \"行政协议\"}, \"court_cases\": [{\"case_number\": \"(2015)潍行初字第35号\", \"filing_date\": \"2015-01-01\", \"judgment_date\": \"2016-11-02\", \"trial_level\": \"first_instance\", \"trial_procedure\": \"一审\", \"court\": {\"name\": \"山东省潍坊市中级人民法院\", \"court_level\": \"intermediate\"}, \"status\": \"effective\", \"cause_of_action\": \"行政协议纠纷\", \"dispute_resolution_type\": \"litigation\", \"party_count\": null}, {\"case_number\": \"(2017)鲁行终495号\", \"filing_date\": \"2017-01-01\", \"judgment_date\": \"2017-07-18\", \"trial_level\": \"second_instance\", \"trial_procedure\": \"二审\", \"court\": {\"name\": \"山东省高级人民法院\", \"court_level\": \"high\"}, \"status\": \"effective\", \"cause_of_action\": \"行政协议纠纷\", \"dispute_resolution_type\": \"litigation\", \"party_count\": null}, {\"case_number\": \"(2017)最高法行申7679号\", \"filing_date\": \"2017-01-01\", \"judgment_date\": \"2019-05-22\", \"trial_level\": \"retrial\", \"trial_procedure\": \"再审\", \"court\": {\"name\": \"最高人民法院\", \"court_level\": \"supreme\"}, \"status\": \"effective\", \"cause_of_action\": \"行政协议纠纷\", \"dispute_resolution_type\": \"litigation\", \"party_count\": null}], \"legal_subjects\": [{\"name\": \"潍坊某置业发展有限公司\", \"subject_type\": \"organization\", \"org_type\": \"company\", \"credit_code\": null, \"roles\": [{\"role_code\": \"plaintiff\", \"role_name\": \"原告\", \"case_number\": \"(2015)潍行初字第35号\"}, {\"role_code\": \"appellant\", \"role_name\": \"上诉人\", \"case_number\": \"(2017)鲁行终495号\"}, {\"role_code\": \"retrial_applicant\", \"role_name\": \"再审申请人\", \"case_number\": \"(2017)最高法行申7679号\"}]}, {\"name\": \"安丘市人民政府\", \"subject_type\": \"organization\", \"org_type\": \"government_agency\", \"credit_code\": null, \"roles\": [{\"role_code\": \"defendant\", \"role_name\": \"被告\", \"case_number\": \"(2015)潍行初字第35号\"}, {\"role_code\": \"appellee\", \"role_name\": \"被上诉人\", \"case_number\": \"(2017)鲁行终495号\"}, {\"role_code\": \"retrial_applicant\", \"role_name\": \"再审申请人\", \"case_number\": \"(2017)最高法行申7679号\"}]}], \"attorneys\": [], \"judges\": [], \"prosecutors\": [], \"trial_organizations\": [], \"legal_provisions\": [{\"case_number\": \"(2017)最高法行申7679号\", \"statute\": \"中华人民共和国行政诉讼法\", \"article\": \"75\", \"paragraph\": \"\", \"item\": \"\", \"content\": \"行政行为有实施主体不具有行政主体资格或者没有依据等重大且明显违法情形，原告申请确认行政行为无效的，人民法院判决确认无效。\", \"citation_position\": \"judgment_reason\", \"citation_purpose\": \"说理依据\"}, {\"case_number\": \"(2017)最高法行申7679号\", \"statute\": \"最高人民法院关于适用〈中华人民共和国行政诉讼法〉的解释\", \"article\": \"99\", \"paragraph\": \"\", \"item\": \"\", \"content\": \"有下列情形之一的，属于行政诉讼法第七十五条规定的“重大且明显违法”：（一）行政行为实施主体不具有行政主体资格；（二）减损权利或者增加义务的行政行为没有法律规范依据；（三）行政行为的内容客观上不可能实施；（四）其他重大且明显违法的情形。\", \"citation_position\": \"judgment_reason\", \"citation_purpose\": \"说理依据\"}, {\"case_number\": \"(2017)最高法行申7679号\", \"statute\": \"国务院关于税收等优惠政策相关事项的通知\", \"article\": \"3\", \"paragraph\": \"\", \"item\": \"\", \"content\": \"各地与企业已签订合同中的优惠政策，继续有效；对已兑现的部分，不溯及既往。\", \"citation_position\": \"judgment_reason\", \"citation_purpose\": \"说理依据\"}], \"evidence\": [{\"content\": \"潍坊某置业公司提供的税单，显示其缴纳了土地增值税、土地使用税、营业税、教育附加费等多项税款。\", \"evidence_type\": \"documentary\", \"submitted_by\": \"潍坊某置业发展有限公司\", \"is_key_evidence\": true, \"admission_status\": \"admitted\", \"examination_status\": \"examined\", \"expert_institution\": \"\", \"expert_conclusion\": \"\"}, {\"content\": \"某钢铁公司出具的书面证明材料，确认《安丘市长安路改造及沿街房屋开发建设项目合同书》由潍坊某置业公司履行，某钢铁公司不再享有或履行该合同的权利和义务，也不参与诉讼。\", \"evidence_type\": \"documentary\", \"submitted_by\": \"莱芜某钢铁有限公司\", \"is_key_evidence\": true, \"admission_status\": \"admitted\", \"examination_status\": \"examined\", \"expert_institution\": \"\", \"expert_conclusion\": \"\"}, {\"content\": \"安丘市政府2006年6月27日批复，向潍坊某置业公司出让位于安丘市永安路以东、长安路两侧的土地55987平方米，以及双方签订的国有土地使用权出让合同。\", \"evidence_type\": \"documentary\", \"submitted_by\": \"潍坊某置业发展有限公司\", \"is_key_evidence\": true, \"admission_status\": \"admitted\", \"examination_status\": \"examined\", \"expert_institution\": \"\", \"expert_conclusion\": \"\"}], \"judgment_results\": [{\"result_type\": \"partially_upheld\", \"specific_judgment\": \"一、确认《合同书》第四条第3项有效；二、安丘市人民政府返还营业税、教育附加费、所得税地方留成部分4556125.78元及相应利息；三、驳回其他诉讼请求。\", \"reasoning\": \"一审法院认为合同书第四条第3项有效，第2项因超越法定权限而无效，并据此判决安丘市政府返还部分税收款项。\", \"case_number\": \"(2015)潍行初字第35号\", \"cost_allocation\": \"\"}, {\"result_type\": \"partially_upheld\", \"specific_judgment\": \"一、维持一审判决第一、三项；二、变更返还金额为11160072.08元及利息（自2015年5月18日起计算）。\", \"reasoning\": \"二审法院认为合同书第四条第2项并不违反法律强制性规定，应为有效；重新核定应返还的税款金额；安丘市政府应当履行合同义务。\", \"case_number\": \"(2017)鲁行终495号\", \"cost_allocation\": \"\"}, {\"result_type\": \"dismissed\", \"specific_judgment\": \"驳回潍坊某置业发展有限公司、安丘市人民政府的再审申请。\", \"reasoning\": \"行政协议效力的判断应优先适用行政诉讼法关于无效行政行为的规定，严格依照“重大且明显违法”标准。安丘市政府主张合同无效的理由不成立。合同书第四条第2项税收优惠约定属于对价补偿，不违反法律强制性规定；第3项涉及地方财政收入返还，安丘市政府有自主支配权，亦属有效。行政机关非因公共利益或法律政策重大调整不得行使优益权单方变更解除合同，安丘市政府限缩解释合同条款属于不当行使优益权。潍坊某置业公司要求返还已通过稽查缴纳的土地增值税、土地使用税超出合同约定，可另行主张。据此，再审申请均不能成立。\", \"case_number\": \"(2017)最高法行申7679号\", \"cost_allocation\": \"\"}], \"case_summary\": {\"key_facts\": \"2005年，安丘市政府与某钢铁公司签订合同，约定由钢铁公司负责长安路改造及沿街房屋开发，安丘市政府给予税收优惠等政策。后潍坊某置业公司成立并实际履行合同，完成建设与拆迁安置。潍坊某置业公司缴纳多项税款后请求安丘市政府按约返还，遭拒绝，遂起诉请求确认合同部分条款有效、判令返还税款及利息。\", \"disputed_issues\": \"涉案合同书是否无效或部分条款无效；安丘市政府应否按约定返还税款。\", \"conclusion\": \"二审判决确认合同书第四条第2、3项有效，安丘市政府应返还营业税、教育附加费、所得税地方留成部分11160072.08元及相应利息，驳回其他诉讼请求。最高人民法院驳回再审申请，维持二审判决。\", \"amount_involved\": \"11160072.08元\", \"guiding_points\": \"1.行政优益权的行使必须符合法律规定，非因公共利益需要或国家法律政策发生重大调整，行政机关不得行使行政优益权单方变更、解除合同。对合同条款作限缩解释，减损相对人合同利益，属于不当行使行政优益权。\\n2.地方政府在地方建设开发和招商引资领域的优惠政策应保持持续性和连贯性，以保护相对人的信赖利益及其他合法权益。涉及地方财政收入的税款返还条款，地方政府享有自主支配权，不违反法律规定，亦应为有效约定。\", \"claim_amount\": \"17155718.85元\", \"judgment_amount\": \"11160072.08元\"}, \"legal_provision_elements\": [{\"provision_index\": 0, \"statute\": \"中华人民共和国行政诉讼法\", \"article\": \"75\", \"element_type\": \"subject_element\", \"content\": \"实施行政行为的主体不具有行政主体资格\", \"applicable_fact_pattern\": \"行政机关越权或主体不适格的情形\"}, {\"provision_index\": 0, \"statute\": \"中华人民共和国行政诉讼法\", \"article\": \"75\", \"element_type\": \"act_element\", \"content\": \"行政行为没有依据\", \"applicable_fact_pattern\": \"行政行为缺乏法律规范依据\"}, {\"provision_index\": 1, \"statute\": \"最高人民法院关于适用〈中华人民共和国行政诉讼法〉的解释\", \"article\": \"99\", \"element_type\": \"result_element\", \"content\": \"行政行为的内容客观上不可能实施\", \"applicable_fact_pattern\": \"行政行为事实上无法履行的情形\"}, {\"provision_index\": 2, \"statute\": \"国务院关于税收等优惠政策相关事项的通知\", \"article\": \"3\", \"element_type\": \"legal_consequence\", \"content\": \"已签订合同中的优惠政策继续有效，已兑现的部分不溯及既往\", \"applicable_fact_pattern\": \"地方政府与企业签订有税收优惠条款的合同，企业要求继续履行\"}]}, \"eval\": {\"row_id\": \"692\", \"score\": 95.0, \"issues\": [\"guiding_case_number 为空\", \"judges 为空\", \"attorneys 为空\", \"trial_organizations 为空\"], \"court_case_count\": 3, \"judge_count\": 0, \"attorney_count\": 0, \"provision_count\": 3, \"evidence_count\": 3}}", "5629__v1": "{\"row_id\": \"5629\", \"input\": {\"id\": \"5629\", \"web_name\": \"人民法院案例库\", \"case_type\": \"行政-专利相关行政案件\", \"storage_no\": \"2025-13-3-024-008\"}, \"output\": {\"guiding_case\": {\"guiding_case_number\": \"\", \"guiding_case_name\": \"宁波某工贸公司诉宁波市知识产权局专利行政裁决案\", \"publication_date\": \"2019-11-21\", \"binding_force\": \"persuasive\", \"guiding_points\": \"使用环境特征一般应当理解为，被保护的对象可以使用于该种环境即可，不要求其必须用于该种环境。但如果本领域技术人员在阅读专利权利要求书、说明书后，可以明确而合理地确定被保护对象必须用于该使用环境，则此时使用环境特征的理解亦应当遵循本领域技术人员的认知。\", \"key_words\": [\"行政\", \"专利相关行政案件\", \"专利行政裁决\", \"使用环境特征\", \"开放式权利要求\"], \"case_level\": \"typical_case\", \"trial_procedure\": \"一审\", \"storage_no\": \"2025-13-3-024-008\", \"source_url\": \"https://rmfyalk.court.gov.cn\", \"judgment_mean\": \"\"}, \"case_type\": {\"category\": \"administrative\", \"level1\": \"行政\", \"level2\": \"专利相关行政案件\"}, \"court_cases\": [{\"case_number\": \"(2018)浙02行初43号\", \"filing_date\": \"2018-01-01\", \"judgment_date\": \"2019-11-21\", \"trial_level\": \"first_instance\", \"trial_procedure\": \"一审\", \"court\": {\"name\": \"浙江省宁波市中级人民法院\", \"court_level\": \"intermediate\"}, \"status\": \"effective\", \"cause_of_action\": \"专利行政裁决纠纷\", \"dispute_resolution_type\": \"litigation\", \"party_count\": null}], \"legal_subjects\": [{\"name\": \"宁波某工贸公司\", \"subject_type\": \"organization\", \"org_type\": \"company\", \"credit_code\": null, \"roles\": [{\"role_code\": \"plaintiff\", \"role_name\": \"原告\", \"case_number\": \"(2018)浙02行初43号\"}]}, {\"name\": \"宁波市知识产权局\", \"subject_type\": \"organization\", \"org_type\": \"government_agency\", \"credit_code\": null, \"roles\": [{\"role_code\": \"defendant\", \"role_name\": \"被告\", \"case_number\": \"(2018)浙02行初43号\"}]}, {\"name\": \"美国某公司\", \"subject_type\": \"organization\", \"org_type\": \"company\", \"credit_code\": null, \"roles\": [{\"role_code\": \"third_party\", \"role_name\": \"第三人\", \"case_number\": \"(2018)浙02行初43号\"}]}], \"attorneys\": [], \"judges\": [], \"prosecutors\": [], \"trial_organizations\": [], \"legal_provisions\": [{\"case_number\": \"(2018)浙02行初43号\", \"statute\": \"中华人民共和国专利法\", \"article\": \"59\", \"paragraph\": \"1\", \"item\": \"\", \"content\": \"发明或者实用新型专利权的保护范围以其权利要求的内容为准，说明书及附图可以用于解释权利要求的内容。\", \"citation_position\": \"related_info\", \"citation_purpose\": \"适用依据\"}, {\"case_number\": \"(2018)浙02行初43号\", \"statute\": \"中华人民共和国专利法\", \"article\": \"60\", \"paragraph\": \"\", \"item\": \"\", \"content\": \"未经专利权人许可，实施其专利，即侵犯其专利权；管理专利工作的部门处理时，认定侵权行为成立的，可以责令侵权人立即停止侵权行为。\", \"citation_position\": \"basic_facts\", \"citation_purpose\": \"适用依据\"}, {\"case_number\": \"(2018)浙02行初43号\", \"statute\": \"专利行政执法办法\", \"article\": \"17\", \"paragraph\": \"\", \"item\": \"\", \"content\": \"管理专利工作的部门应当在立案之日起3个月内作出处理决定。\", \"citation_position\": \"basic_facts\", \"citation_purpose\": \"适用依据\"}, {\"case_number\": \"(2018)浙02行初43号\", \"statute\": \"中华人民共和国行政诉讼法\", \"article\": \"69\", \"paragraph\": \"\", \"item\": \"\", \"content\": \"行政行为证据确凿，适用法律、法规正确，符合法定程序的，或者原告申请被告履行法定职责或者给付义务理由不成立的，人民法院判决驳回原告的诉讼请求。\", \"citation_position\": \"related_info\", \"citation_purpose\": \"适用依据\"}], \"evidence\": [], \"judgment_results\": [{\"result_type\": \"dismissed\", \"specific_judgment\": \"驳回宁波某工贸公司的诉讼请求。\", \"reasoning\": \"法院认为，使用环境特征一般应理解为被保护对象可以使用于该种环境即可，而非必须用于该种环境。被诉侵权产品具备涉案专利权利要求1的使用环境特征；关于柔性材料条带数量，涉案专利权利要求1的保护范围覆盖了“两条柔性材料条带”，因此被诉侵权产品的技术方案落入涉案专利的权利保护范围。宁波市知识产权局认定侵权行为成立并无不当，故驳回诉讼请求。\", \"case_number\": \"(2018)浙02行初43号\", \"cost_allocation\": \"\"}], \"case_summary\": {\"key_facts\": \"宁波市知识产权局作出[2015]甬知案字34号决定，认定宁波某工贸公司许诺销售的产品落入第三人美国某公司发明专利保护范围，构成侵权。宁波某工贸公司不服，诉至法院，主张涉案产品未落入保护范围，理由包括柔性材料条带数量和使用环境特征不同。\", \"disputed_issues\": \"1. 使用环境特征应如何理解，被诉侵权产品是否具备涉案专利权利要求1的使用环境 : \"发明或者实用新型专利权的保护范围以其权利要求的内容为准，说明书及附图可以用于解释权利要求的内容。\", \"citation_position\": \"related_law\", \"citation_purpose\": \"适用依据\"}, {\"case_number\": \"(2018)浙02行初43号\", \"statute\": \"中华人民共和国专利法\", \"article\": \"60\", \"paragraph\": \"\", \"item\": \"\", \"content\": \"未经专利权人许可，实施其专利，即侵犯其专利权，引起纠纷的，由当事人协商解决；不愿协商或者协商不成的，专利权人或者利害关系人可以向人民法院起诉，也可以请求管理专利工作的部门处理。管理专利工作的部门处理时，认定侵权行为成立的，可以责令侵权人立即停止侵权行为，当事人不服的，可以自收到处理通知之日起十五日内依照《中华人民共和国行政诉讼法》向人民法院起诉。\", \"citation_position\": \"basic_facts\", \"citation_purpose\": \"适用依据\"}, {\"case_number\": \"(2018)浙02行初43号\", \"statute\": \"中华人民共和国专利法\", \"article\": \"60\", \"paragraph\": \"\", \"item\": \"\", \"content\": \"未经专利权人许可，实施其专利，即侵犯其专利权，引起纠纷的，由当事人协商解决；不愿协商或者协商不成的，专利权人或者利害关系人可以向人民法院起诉，也可以请求管理专利工作的部门处理。管理专利工作的部门处理时，认定侵权行为成立的，可以责令侵权人立即停止侵权行为。\", \"citation_position\": \"related_law\", \"citation_purpose\": \"适用依据\"}, {\"case_number\": \"(2018)浙02行初43号\", \"statute\": \"专利行政执法办法\", \"article\": \"17\", \"paragraph\": \"\", \"item\": \"\", \"content\": \"管理专利工作的部门处理专利侵权纠纷，应当制作处理决定书，载明下列事项：（一）当事人的姓名或者名称、地址；（二）当事人陈述的事实和理由；（三）认定侵权行为是否成立的理由和依据；（四）处理决定认定侵权行为成立并需要责令侵权人立即停止侵权行为的，应当明确写明责令被请求人立即停止侵害行为；认定侵权行为不成立的，应当驳回请求人的请求；（五）不服处理决定提起行政诉讼的途径和期限。处理决定书应当加盖管理专利工作的部门的公章。\", \"citation_position\": \"basic_facts\", \"citation_purpose\": \"适用依据\"}, {\"case_number\": \"(2018)浙02行初43号\", \"statute\": \"中华人民共和国行政诉讼法\", \"article\": \"69\", \"paragraph\": \"\", \"item\": \"\", \"content\": \"行政行为证据确凿，适用法律、法规正确，符合法定程序的，人民法院判决驳回原告的诉讼请求。\", \"citation_position\": \"related_law\", \"citation_purpose\": \"适用依据\"}], \"evidence\": [{\"content\": \"涉案发明专利的专利证书、权利要求书、说明书及附图，用以确定专利保护范围。\", \"evidence_type\": \"documentary\", \"submitted_by\": \"美国某公司\", \"is_key_evidence\": true, \"admission_status\": \"admitted\", \"examination_status\": \"examined\", \"expert_institution\": \"\", \"expert_conclusion\": \"\"}, {\"content\": \"被诉侵权产品实物或照片，用以确定被诉侵权产品的技术方案。\", \"evidence_type\": \"physical\", \"submitted_by\": \"宁波市知识产权局\", \"is_key_evidence\": true, \"admission_status\": \"admitted\", \"examination_status\": \"examined\", \"expert_institution\": \"\", \"expert_conclusion\": \"\"}, {\"content\": \"[2015]甬知案字34号《专利侵权纠纷处理决定书》，用以证明被诉具体行政行为的内容。\", \"evidence_type\": \"documentary\", \"submitted_by\": \"宁波市知识产权局\", \"is_key_evidence\": true, \"admission_status\": \"admitted\", \"examination_status\": \"examined\", \"expert_institution\": \"\", \"expert_conclusion\": \"\"}], \"judgment_results\": [{\"result_type\": \"dismissed\", \"specific_judgment\": \"驳回宁波某工贸公司的诉讼请求。\", \"reasoning\": \"法院认为，涉案专利权利要求1的使用环境特征应理解为被保护对象可以使用于该种环境即可，不要求必须用于该种环境，被诉侵权产品具备该使用环境特征。关于柔性材料条带数量，权利要求1采取了开放式表述，不限于一根柔性材料条带，故被诉侵权产品的两根条带落入保护范围。宁波市知识产权局认定侵权成立并无不当。\", \"case_number\": \"(2018)浙02行初43号\", \"cost_allocation\": \"\"}], \"case_summary\": {\"key_facts\": \"宁波市知识产权局作出专利侵权纠纷处理决定，认定宁波某工贸公司许诺销售的固定夹链产品落入第三人美国某公司9719****.X号发明专利的保护范围，但鉴于专利已过保护期，仅认定侵权行为成立。宁波某工贸公司不服，提起行政诉讼。\", \"disputed_issues\": \"1. 专利权利要求中的使用环境特征应如何理解，被诉侵权产品是否具备该使用环境特征；2. 专利权利要求中“一根单独的柔性材料条带”是否应解释为数量限定，被诉侵权产品具有两根条带是否落入保护范围。\", \"conclusion\": \"法院判决驳回原告诉讼请求，认定被诉侵权产品具备使用环境特征且柔性材料条带数量的差异不影响侵权认定，宁波市知识产权局的决定合法。\", \"amount_involved\": \"\", \"guiding_points\": \"使用环境特征一般应当理解为，被保护的对象可以使用于该种环境即可，不要求其必须用于该种环境。但如果本领域技术人员在阅读专利权利要求书、说明书后，可以明确而合理地确定被保护对象必须用于该使用环境，则此时使用环境特征的理解亦应当遵循本领域技术人员的认知。\", \"claim_amount\": \"\", \"judgment_amount\": \"\"}, \"legal_provision_elements\": [{\"provision_index\": 0, \"statute\": \"中华人民共和国专利法\", \"article\": \"59\", \"element_type\": \"act_element\", \"content\": \"发明或者实用新型专利权的保护范围以其权利要求的内容为准，说明书及附图可以用于解释权利要求的内容。\", \"applicable_fact_pattern\": \"专利侵权判定中，需要确定权利要求保护范围时，应当依据该规定解释权利要求中的技术特征。\"}, {\"provision_index\": 2, \"statute\": \"中华人民共和国专利法\", \"article\": \"60\", \"element_type\": \"act_element\", \"content\": \"管理专利工作的部门有权处理专利侵权纠纷，认定侵权行为成立的，可以责令停止侵权行为。\", \"applicable_fact_pattern\": \"行政裁决程序中，作为认定侵权并作出处理决定的职权依据。\"}, {\"provision_index\": 5, \"statute\": \"中华人民共和国行政诉讼法\", \"article\": \"69\", \"element_type\": \"legal_consequence\", \"content\": \"行政行为证据确凿，适用法律、法规 \", \"content\": \"人民法院审理上诉案件，原审判决认定事实清楚，适用法律、法规正确的，判决驳回上诉，维持原判决。\", \"citation_position\": \"related_law\", \"citation_purpose\": \"适用依据\"}], \"evidence\": [{\"content\": \"罗某母亲与A公司签订的《货物车辆代管协议》《危险货物运输车辆承包经营合同》，约定乙方每年交纳管理费，车辆使用A公司营运资质，驾驶员安全责任由乙方负责。\", \"evidence_type\": \"documentary\", \"submitted_by\": \"A公司或罗某\", \"is_key_evidence\": true, \"admission_status\": \"admitted\", \"examination_status\": \"examined\", \"expert_institution\": \"\", \"expert_conclusion\": \"\"}, {\"content\": \"六盘水市人社局作出的100036号认定工伤决定书及100692号认定工伤决定书，认定周某所受伤害为工伤。\", \"evidence_type\": \"documentary\", \"submitted_by\": \"项某\", \"is_key_evidence\": true, \"admission_status\": \"admitted\", \"examination_status\": \"examined\", \"expert_institution\": \"\", \"expert_conclusion\": \"\"}, {\"content\": \"六盘水市政府作出的4号及16号行政复议决定书，撤销了上述工伤认定。\", \"evidence_type\": \"documentary\", \"submitted_by\": \"项某或A公司\", \"is_key_evidence\": true, \"admission_status\": \"admitted\", \"examination_status\": \"examined\", \"expert_institution\": \"\", \"expert_conclusion\": \"\"}], \"judgment_results\": [{\"result_type\": \"dismissed\", \"specific_judgment\": \"驳回上诉，维持原判。\", \"reasoning\": \"法院认为，罗某与A公司之间实际形成了挂靠关系。依照《最高人民法院关于审理工伤保险行政案件若干问题的规定》第三条第一款第五项，个人挂靠其他单位对外经营，其聘用的人员因工伤亡的，被挂靠单位为承担工伤保险责任的单位，该条款不以存在劳动关系为前提。工伤保险制度强调对工伤劳动者及其家人的基本生活保障，被挂靠人收取挂靠费，应共同承担经营风险。故A公司的上诉理由不能成立。\", \"case_number\": \"(2021)黔行终304号\", \"cost_allocation\": \"\"}], \"case_summary\": {\"key_facts\": \"项某之夫周某受罗某聘请驾驶油罐车，车辆挂靠在A公司名下。2019年11月19日，周某因操作不当发生事故当场死亡。项某申请工伤认定，六盘水市人社局两次认定工伤，但均被六盘水市政府行政复议撤销。项某不服最后的复议决定，提起行政诉讼。一审法院撤销复议决定，恢复工伤认定效力。A公司不服上诉。\", \"disputed_issues\": \"1. 罗某与A公司之间是否形成挂靠关系；2. 认定工伤是否需要以周某与A公司存在劳动关系为前提。\", \"conclusion\": \"二审法院维持原判，认定挂靠关系成立，被挂靠单位承担工伤保险责任不以劳动关系为前提，驳回A公司上诉。\", \"amount_involved\": \"\", \"guiding_points\": \"\", \"claim_amount\": \"\", \"judgment_amount\": \"\"}, \"legal_provision_elements\": [{\"provision_index\": 0, \"statute\": \"中华人民共和国道路运输条例\", \"article\": \"23\", \"element_type\": \"subject_element\", \" 料。\", \"citation_position\": \"judgment_reason\", \"citation_purpose\": \"说理依据\"}, {\"case_number\": \"(2020)黔02行初135号\", \"statute\": \"最高人民法院关于审理工伤保险行政案件若干问题的规定\", \"article\": \"3\", \"paragraph\": \"1\", \"item\": \"5\", \"content\": \"个人挂靠其他单位对外经营，其聘用的人员因工伤亡的，被挂靠单位为承担工伤保险责任的单位。\", \"citation_position\": \"judgment_reason\", \"citation_purpose\": \"适用依据\"}, {\"case_number\": \"(2020)黔02行初135号\", \"statute\": \"工伤保险条例\", \"article\": \"19\", \"paragraph\": \"\", \"item\": \"\", \"content\": \"社会保险行政部门受理工伤认定申请后，根据审核需要可以对事故伤害进行调查核实，用人单位、职工、工会组织、医疗机构以及有关部门应当予以协助。\", \"citation_position\": \"related_info\", \"citation_purpose\": \"说理依据\"}, {\"case_number\": \"(2020)黔02行初135号\", \"statute\": \"最高人民法院关于适用《中华人民共和国行政诉讼法》的解释\", \"article\": \"89\", \"paragraph\": \"\", \"item\": \"\", \"content\": \"复议决定改变原行政行为错误，人民法院判决撤销复议决定时，可以同时判决恢复原行政行为的法律效力。\", \"citation_position\": \"related_info\", \"citation_purpose\": \"适用依据\"}], \"evidence\": [{\"content\": \"《货物车辆代管协议》及《危险货物运输车辆承包经营合同》，约定罗某将车辆挂靠在A公司名下经营，A公司收取管理费。\", \"evidence_type\": \"documentary\", \"submitted_by\": \"原告\", \"is_key_evidence\": true, \"admission_status\": \"admitted\", \"examination_status\": \"examined\", \"expert_institution\": \"\", \"expert_conclusion\": \"\"}, {\"content\": \"六盘水市人社局作出的100692号认定工伤决定书，认定周某所受伤害为工伤。\", \"evidence_type\": \"documentary\", \"submitted_by\": \"原告\", \"is_key_evidence\": true, \"admission_status\": \"admitted\", \"examination_status\": \"examined\", \"expert_institution\": \"\", \"expert_conclusion\": \"\"}, {\"content\": \"六盘水市人民政府作出的16号复议决定书，撤销100692号认定工伤决定。\", \"evidence_type\": \"documentary\", \"submitted_by\": \"被告\", \"is_key_evidence\": true, \"admission_status\": \"admitted\", \"examination_status\": \"examined\", \"expert_institution\": \"\", \"expert_conclusion\": \"\"}], \"judgment_results\": [{\"result_type\": \"liable\", \"specific_judgment\": \"一、撤销六盘水市人民政府作出的16号复议决定；二、恢复六盘水市人社局作出的100692号认定工伤决定的法律效力。\", \"reasoning\": \"罗某与A公司之间实际形成挂靠关系。根据《最高人民法院关于审理工伤保险行政案件若干问题的规定》第三条第一款第五项，个人挂靠其他单位对外经营，其聘用的人员因工伤亡的，被挂靠单位为承担工伤保险责任的单位，不以存在劳动关系为前提。六盘水市人民政府的复议决定认定事实不清、适用法律错误，应予撤销，同时恢复认定工伤决定的法律效力。\", \"case_number\": \"(2020)黔02行初135号\", \"cost_allocation\": \"\"}, {\"result_type\": \"dismissed\", \"specific_judgment\": \"驳回上诉，维持原判。\", \"reasoning\": \"二审法院认为，一审判决认定事实清楚，适用法律正确。罗某与A公司之间的挂靠关系成立，周某的工伤认定依法不应以劳动关系为前提，A公司的上诉理由不能成立，故驳回上诉，维持原判。\", \"case_number\": \"(2021)黔行终304号\", \"cost_allocation\": \"\"}], \"case_summary\": {\"key_facts\": \"项某系周某妻子。周某受罗某雇佣驾驶登记在A公司名下的油罐车，罗某与A公司存在挂靠关系。2019年11月19日周某因操作不当发生事故死亡。项某申请工伤认定，六盘水市人社局认定工伤。A公司不服申请行政复议，六盘水市政府先后两次撤销工伤认定决定。项某不服第二次复议决定，提起行政诉讼，一审法院撤销复议决定并恢复工伤认定效力，二审维持。\", \"disputed_issues\": \"1.罗某与A公司是否形成挂靠关系；2.六盘水市人社局认定工伤是否需以周某与A公司具有劳动关系为前提。\", \"conclusion\": \"法院认定罗某与A公司形成挂靠关系，依据《最高人民法院关于审理工伤保险行政案件若干问题的规定》第三条第一款第五项，被挂靠单位承担工伤保险责任不以劳动关系为前提，遂撤销复议决定，恢复工伤认定法律效力，二审驳回A公司上诉。\", \"amount_involved\": \"\", \"guiding_points\": \"在车辆挂靠关系中，对驾驶员劳动权益的保护应采取劳动者倾斜保护原则。被挂靠人向挂靠人收取挂靠费，应与挂靠人共同承担经营运输风险，仅以协议约定不能免除其作为被挂靠人应承担的风险和责任。个人挂靠其他单位对外经营，其聘用的人员因工伤亡，被挂靠单位以不存在劳动关系为由，主张不承担工伤保险责任的，人民法院不予支持。\", \"claim_amount\": \"\", \"judgment_amount\": \"\"}, \"legal_provision_elements\": [{\"provision_index\": 0, \"statute\": \"中华人民共和国道路运输条例\", \"article\": \"23\", \"element_type\": \"subject_element\", \"content\": \"申请从事危险货物运输经营\", \"applicable_fact_pattern\": \"当事人意图从事危险货物运输，但缺乏相应条件，采取挂靠方式利用有资质单位名义经营。\"}, {\"provision_index\": 0, \"statute\": \"中华人民共和国道路运输条例\", \"article\": \"23\", \"element_type\": \"act_element\", \"content\": \"具备5辆以上经检测合格的危险货物运输专用车辆、设备等条件\", \"applicable_fact_pattern\": \"申请经营危险货物运输，须具备法定车辆和设备条件，否则无法取得经营许可。\"}, {\"provision_index\": 2, \"statute\": \"最高人民法院关于审理工伤保险行政案件若干问题的规定\", \"article\": \"3\", \"element_type\": \"subject_element\", \"content\": \"个人挂靠其他单位对外经营，其聘用的人员\", \"applicable_fact_pattern\": \"存在个人挂靠单位从事经营，且聘用人员为其提供劳动的情形。\"}, {\"provision_index\": 2, \"statute\": \"最高人民法院关于审理工伤保险行政案件若干问题的规定\", \"article\": \"3\", \"element_type\": \"result_element\", \"content\": \"因工伤亡\", \"applicable_fact_pattern\": \"聘用人员在从事与经营相关的工作中受到事故伤害并导致死亡。\"}, {\"provision_index\": 2, \"statute\": \"最高人民法院关于审理工伤保险行政案件若干问题的规定\", \"article\": \"3\", \"element_type\": \"legal_consequence\", \"content\": \"被挂靠单位为承担工伤保险责任的单位\", \"applicable_fact_pattern\": \"被挂靠单位无论是否与伤亡人员存在劳动关系，均应依法承担工伤保险责任。\"}]}, \"eval\": {\"row_id\": \"2819\", \"score\": 95.0, \"issues\": [\"guiding_case_number 为空\", \"judges 为空\", \"attorneys 为空\", \"trial_organizations 为空\"], \"court_case_count\": 2, \"judge_count\": 0, \"attorney_count\": 0, \"provision_count\": 5, \"evidence_count\": 3}}", "1433__v1": "{\"row_id\": \"1433\", \"input\": {\"id\": \"1433\", \"web_name\": \"人民法院案例库\", \"case_type\": \"行政-行政强制执行\", \"storage_no\": \"2024-12-3-003-002\"}, \"output\": {\"guiding_case\": {\"guiding_case_number\": \"\", \"guiding_case_name\": \"田某诉北京市东城区永定门外街道办事处行政强制执行案\", \"publication_date\": \"2021-11-03\", \"binding_force\": \"persuasive\", \"guiding_points\": \"在对建成时间较早、存续期间规划等管理规范发生变化的建筑物或构筑物的性质进行认定时，人民法院应当充分考虑建筑物或构筑物的形成年代、法律规范变更情况、行政管理状况、实际使用状况等因素，不能简单以审批手续不全为由，一律认定为违法建筑。\", \"key_words\": [\"行政\", \"行政强制执行\", \"强制拆除房屋\", \"责令限期拆除\", \"违法性继承\", \"实质审查\"], \"case_level\": \"typical_case\", \"trial_procedure\": \"二审\", \"storage_no\": \"2024-12-3-003-002\", \"source_url\": \"https://rmfyalk.court.gov.cn\", \"judgment_mean\": \"\"}, \"case_type\": {\"category\": \"administrative\", \"level1\": \"行政\", \"level2\": \"行政强制执行\"}, \"court_cases\": [{\"case_number\": \"(2021)京0101行初19号\", \"filing_date\": \"2021-01-01\", \"judgment_date\": \"2021-07-05\", \"trial_level\": \"first_instance\", \"trial_procedure\": \"一审\", \"court\": {\"name\": \"北京市东城区人民法院\", \"court_level\": \"basic\"}, \"status\": \"appealed\", \"cause_of_action\": \"行政强制拆除纠纷\", \"dispute_resolution_type\": \"litigation\", \"party_count\": null}, {\"case_number\": \"(2021)京02行终1224号\", \"filing_date\": \"2021-01-01\", \"judgment_date\": \"2021-11-03\", \"trial_level\": \"second_instance\", \"trial_procedure\": \"二审\", \"court\": {\"name\": \"北京市第二中级人民法院\", \"court_level\": \"intermediate\"}, \"status\": \"effective\", \"cause_of_action\": \"行政强制拆除纠纷\", \"dispute_resolution_type\": \"litigation\", \"party_count\": null}], \"legal_subjects\": [{\"name\": \"田某\", \"subject_type\": \"natural_person\", \"org_type\": null, \"credit_code\": null, \"roles\": [{\"role_code\": \"plaintiff\", \"role_name\": \"原告\", \"case_number\": \"(2021)京0101行初19号\"}, {\"role_code\": \"appellant\", \"role_name\": \"上诉人\", \"case_number\": \"(2021)京02行终1224号\"}]}, {\"name\": \"北京市东城区永定门外街道办事处\", \"subject_type\": \"organization\", \"org_type\": \"government_agency\", \"credit_code\": null, \"roles\": [{\"role_code\": \"defendant\", \"role_name\": \"被告\", \"case_number\": \"(2021)京0101行初19号\"}, {\"role_code\": \"appellee\", \"role_name\": \"被上诉人\", \"case_number\": \"(2021)京02行终1224号\"}]}], \"attorneys\": [], \"judges\": [], \"prosecutors\": [], \"trial_organizations\": [], \"legal_provisions\": [{\"case_number\": \"(2021)京02行终1224号\", \"statute\": \"中华人民共和国行政诉讼法\", \"article\": \"6\", \"paragraph\": \"\", \"item\": \"\", \"content\": \"人民法院审理行政案件，对行政行为是否合法进行审查。\", \"citation_position\": \"related_info\", \"citation_purpose\": \"适用依据\"}, {\"case_number\": \"(2021)京02行终1224号\", \"statute\": \"中华人民共和国行政强制法\", \"article\": \"44\", \"paragraph\": \"\", \"item\": \"\", \"content\": \"对违法的建筑物、构筑物、设施等需要强制拆除的，应当由行政机关予以公告，限期当事人自行拆除。当事人在法定期限内不申请行政复议或者提起行政诉讼，又不拆除的，行政机关可以依法强制拆除。\", \"citation_position\": \"related_info\", \"citation_purpose\": \"适用依据\"}], \"evidence\": [{\"content\": \"《城市房地产税交款书》，证明涉案房屋建成于1984年前\", \"evidence_type\": \"documentary\", \"submitted_by\": \"田某\", \"is_key_evidence\": true, \"admission_status\": \"admitted\", \"examination_status\": \"examined\", \"expert_institution\": \"\", \"expert_conclusion\": \"\"}, {\"content\": \"北京市规划和自然资源委员会东城分局出具的规划复函，认定涉案房屋未取得建设工程规划许可证\", \"evidence_type\": \"documentary\", \"submitted_by\": \"北京市东城区永定门外街道办事处\", \"is_key_evidence\": true, \"admission_status\": \"admitted\", \"examination_status\": \"examined\", \"expert_institution\": \"\", \"expert_conclusion\": \"\"}], \"judgment_results\": [{\"result_type\": \"partially_upheld\", \"specific_judgment\": \"一、确认永定门外街道办事处于2020年7月10日对田某使用的位于北京市东城区某号院内北房西数第1间（1间）房屋实施强制拆除的行为违法；二、驳回田某的其他诉讼请求。\", \"reasoning\": \"法院认为，永定门外街道办事处认定涉案房屋为违法建设仅依据规划复函，未调查房屋形成年代、法律规范变更、行政管理状况及实际使用状况等因素，亦未考虑责令补办手续等替代处理方式，属于事实认定不清、法律依据不足。同时，在强制拆除前未直接向田某等相关人员送达责令改正决定、限期拆除决定或强制拆除决定，仅在现场张贴内容不明确的公告，违反法定程序。因此，被诉强制拆除行为违法。\", \"case_number\": \"(2021)京0101行初19号\", \"cost_allocation\": \"\"}, {\"result_type\": \"dismissed\", \"specific_judgment\": \"驳回上诉，维持原判。\", \"reasoning\": \"二审法院经审理，认为一审判决认定事实清楚、适用法律正确，田某的上诉理由不能成立，故判决驳回上诉，维持原判。\", \"case_number\": \"(2021)京02行终1224号\", \"cost_allocation\": \"\"}], \"case_summary\": {\"key_facts\": \"田某居住的北京市东城区某号院内房屋由田某之父于1984年前建成。2020年6月，永定门外街道办事处致函规划部门询问规划许可情况，规划部门复函称涉案房屋未取得建设工程规划许可证。7月6日，永定门外街道办事处在涉案房屋门上张贴《限拆告知书》，要求7月9日前自行拆除，田某等人未拆除。7月10日，永定门外街道办事处对涉案房屋实施强制拆除，拆除前由公证处清点并封存物品。田某提起行政诉讼，请求确认强制拆除全部房屋行为违法。\", \"disputed_issues\": \"永定门外街道办事处认定涉案房屋为违法建设并实施强制拆除的行为是否合法，包括事实认定是否清楚、程序是否合法。\", \"conclusion\": \"一、二审法院均认定被诉强制拆除行为违法，但仅确认拆除田某实际居住使用的一间房屋的行为违法，驳回田某关于确认拆除全部房屋违法的请求。行政机关仅凭未取得规划许可即认定违法建设，未考虑历史因素，且未履行法定程序，故确认违法。\", \"amount_involved\": \"\", \"guiding_points\": \"在对建成时间较早、存续期间规划等管理规范发生变化的建筑物或构筑物的性质进行认定时，人民法院应当充分考虑建筑物或构筑物的形成年代、法律规范变更情况、行政管理状况、实际使用状况等因素，不能简单以审批手续不全为由，一律认定为违法建筑。\", \"claim_amount\": \"\", \"judgment_amount\": \"\"}, \"legal_provision_elements\": [{\"provision_index\": 0, \"statute\": \"中华人民共和国行政诉讼法\", \"article\": \"6\", \"element_type\": \"act_element\", \"content\": \"人民法院审理行政案件，对行政行为是否合法进行审查。\", \"applicable_fact_pattern\": \"任何行政诉讼案件，法院须审查被诉行政行为的合法性，包括事实认定、法律适用和程序是否合法。\"}, {\"provision_index\": 1, \"statute\": \"中华人民共和国行政强制法\", \"article\": \"44\", \"element_type\": \"act_element\", \"content\": \"对违法的建筑物、构筑物、设施等需要强制拆除的，应当由行政机关予以公告，限期当事人自行拆除。\", \"applicable_fact_pattern\": \"行政机关拟强制拆除违法建筑物时，必须先进行公告并设定限期自行拆除的义务。\"}, {\"provision_index\": 1, \"statute\": \"中华人民共和国行政强制法\", \"article\": \"44\", \"element_type\": \"subjective_element\", \"content\": \"当事人在法定期限内不申请行政复议或者提起行政诉讼，又不拆除的。\", \"applicable_fact_pattern\": \"当事人在公告后既不提起救济程序，也不履行拆除义务。\"}, {\"provision_index\": 1, \"statute\": \"中华人民共和国行政强制法\", \"article\": \"44\", \"element_type\": \"legal_consequence\", \"content\": \"行政机关可以依法强制拆除。\", \"applicable_fact_pattern\": \"满足前置程序要件后，行政机关获得强制拆除的执行权限。\"}]}, \"eval\": {\"row_id\": \"1433\", \"score\": 95.0, \"issues\": [\"guiding_case_number 为空\", \"judges 为空\", \"attorneys 为空\", \"trial_organizations 为空\"], \"court_case_count\": 2, \"judge_count\": 0, \"attorney_count\": 0, \"provision_count\": 2, \"evidence_count\": 2}}", "1433__v2": "{\"row_id\": \"1433\", \"input\": {\"id\": \"1433\", \"web_name\": \"人民法院案例库\", \"case_type\": \"行政-行政强制执行\", \"storage_no\": \"2024-12-3-003-002\"}, \"output\": {\"guiding_case\": {\"guiding_case_number\": \"\", \"guiding_case_name\": \"田某诉北京市东城区永定门外街道办事处行政强制执行案\", \"publication_date\": \"2021-11-03\", \"binding_force\": \"persuasive\", \"guiding_points\": \"在对建成时间较早、存续期间规划等管理规范发生变化的建筑物或构筑物的性质进行认定时，人民法院应当充分考虑建筑物或构筑物的形成年代、法律规范变更情况、行政管理状况、实际使用状况等因素，不能简单以审批手续不全为由，一律认定为违法建筑。\", \"key_words\": [\"行政\", \"行政强制执行\", \"强制拆除房屋\", \"责令限期拆除\", \"违法性继承\", \"实质审查\"], \"case_level\": \"typical_case\", \"trial_procedure\": \"二审\", \"storage_no\": \"2024-12-3-003-002\", \"source_url\": \"https://rmfyalk.court.gov.cn\", \"judgment_mean\": \"在对建成时间较早、存续期间规划等管理规范发生变化的建筑物或构筑物的性质进行认定时，人民法院应当充分考虑建筑物或构筑物的形成年代、法律规范变更情况、行政管理状况、实际使用状况等因素，不能简单以审批手续不全为由，一律认定为违法建筑。\"}, \"case_type\": {\"category\": \"administrative\", \"level1\": \"行政\", \"level2\": \"行政强制执行\"}, \"court_cases\": [{\"case_number\": \"(2021)京0101行初19号\", \"filing_date\": \"2021-01-01\", \"judgment_date\": \"2021-07-05\", \"trial_level\": \"first_instance\", \"trial_procedure\": \"一审\", \"court\": {\"name\": \"北京市东城区人民法院\", \"court_level\": \"basic\"}, \"status\": \"judged\", \"cause_of_action\": \"行政强制执行\", \"dispute_resolution_type\": \"litigation\", \"party_count\": null}, {\"case_number\": \"(2021)京02行终1224号\", \"filing_date\": \"2021-07-06\", \"judgment_date\": \"2021-11-03\", \"trial_level\": \"second_instance\", \"trial_procedure\": \"二审\", \"court\": {\"name\": \"北京市第二中级人民法院\", \"court_level\": \"intermediate\"}, \"status\": \"judged\", \"cause_of_action\": \"行政强制执行\", \"dispute_resolution_type\": \"litigation\", \"party_count\": null}], \"legal_subjects\": [{\"name\": \"田某\", \"subject_type\": \"natural_person\", \"org_type\": \"\", \"credit_code\": null, \"roles\": [{\"role_code\": \"plaintiff\", \"role_name\": \"原告\", \"case_number\": \"(2021)京0101行初19号\"}, {\"role_code\": \"appellant\", \"role_name\": \"上诉人\", \"case_number\": \"(2021)京02行终1224号\"}]}, {\"name\": \"北京市东城区永定门外街道办事处\", \"subject_type\": \"organization\", \"org_type\": \"government_agency\", \"credit_code\": null, \"roles\": [{\"role_code\": \"defendant\", \"role_name\": \"被告\", \"case_number\": \"(2021)京0101行初19号\"}, {\"role_code\": \"appellee\", \"role_name\": \"被上诉人\", \"case_number\": \"(2021)京02行终1224号\"}]}], \"attorneys\": [], \"judges\": [], \"prosecutors\": [], \"trial_organizations\": [], \"legal_provisions\": [{\"case_number\": \"(2021)京02行终1224号\", \"statute\": \"中华人民共和国行政诉讼法\", \"article\": \"6\", \"paragraph\": \"\", \"item\": \"\", \"content\": \"人民法院审理行政案件，对行政行为是否合法进行审查。\", \"citation_position\": \"related_law\", \"citation_purpose\": \"适用依据\"}, {\"case_number\": \"(2021)京02行终1224号\", \"statute\": \"中华人民共和国行政强制法\", \"article\": \"44\", \"paragraph\": \"\", \"item\": \"\", \"content\": \"对违法的建筑物、构筑物、设施等需要强制拆除的，应当由行政机关予以公告，限期当事人自行拆除。当事人在法定期限内不申请行政复议或者提起行政诉讼，又不拆除的，行政机关可以依法强制拆除。\", \"citation_position\": \"related_law\", \"citation_purpose\": \"适用依据\"}], \"evidence\": [{\"content\": \"北京市规划和自然资源委员会东城分局2020年6月15日出具的规划复函，认定涉案房屋未取得建设工程规划许可证\", \"evidence_type\": \"documentary\", \"submitted_by\": \"永定门外街道办事处\", \"is_key_evidence\": true, \"admission_status\": \"admitted\", \"examination_status\": \"examined\", \"expert_institution\": \"\", \"expert_conclusion\": \"\"}, {\"content\": \"田某提交的《城市房地产税交款书》，用以证明涉案房屋建于1984年前\", \"evidence_type\": \"documentary\", \"submitted_by\": \"田某\", \"is_key_evidence\": true, \"admission_status\": \"admitted\", \"examination_status\": \"examined\", \"expert_institution\": \"\", \"expert_conclusion\": \"\"}, {\"content\": \"某公证处2020年7月10日进行现场公证的记录，对房屋内物品进行清点、封存及搬运\", \"evidence_type\": \"documentary\", \"submitted_by\": \"永定门外街道办事处\", \"is_key_evidence\": true, \"admission_status\": \"admitted\", \"examination_status\": \"examined\", \"expert_institution\": \"\", \"expert_conclusion\": \"\"}], \"judgment_results\": [{\"result_type\": \"partially_upheld\", \"specific_judgment\": \"一、确认永定门外街道办事处于2020年7月10日对田某使用的位于北京市东城区某号院内北房西数第1间（1间）房屋实施强制拆除的行为违法；二、驳回田某的其他诉讼请求。\", \"reasoning\": \"永定门外街道办事处仅依据规划复函认定涉案房屋属于违法建设，未对房屋形成年代、法律规范变更、行政管理状况、实际使用状况等因素进行调查，也未考虑能否采取补办手续、限期改正等替代措施，属于事实认定不清、法律依据不足。同时，强制拆除前未向田某等直接送达相关认定通知、责令改正决定或强制拆除决定，现场公告内容不明确，未通知清理物品，违反法定程序。\", \"case_number\": \"(2021)京0101行初19号\", \"cost_allocation\": \"\"}, {\"result_type\": \"dismissed\", \"specific_judgment\": \"驳回上诉，维持原判。\", \"reasoning\": \"一审判决认定事实清楚，适用法律正确，审判程序合法。永定门外街道办事处实施的强制拆除行为主要证据不足、违反法定程序，因已不具备可撤销内容，应确认违法。上诉人的上诉请求不成立。\", \"case_number\": \"(2021)京02行终1224号\", \"cost_allocation\": \"\"}], \"case_summary\": {\"key_facts\": \"2020年6月，永定门外街道办向规自委东城分局征询田某位于东城区某号院内5间房屋的规划许可情况，获复函称未取得规划许可。7月6日，街道办张贴《限拆告知书》，要求7月9日前自行拆除。田某及居住人未拆除，7月10日街道办对房屋实施强制拆除，公证处对物品清点搬运。田某不服，起诉请求确认强制拆除全部房屋行为违法。涉案房屋由田某之父于1984年前建成，田某使用其中一间。\", \"disputed_issues\": \"涉案房屋是否属于违法建设；强制拆除行为认定事实是否清楚、程序是否合法；应否确认全部拆除行为违法。\", \"conclusion\": \"一审判决确认强制拆除田某使用的一间房屋行为违法，驳回其他诉讼请求。二审维持原判。法院认为街道办仅凭规划复函认定违法建筑，未考虑历史因素，事实不清；未履行直接送达、公告不明等程序，程序违法。\", \"amount_involved\": \"\", \"guiding_points\": \"对建成时间较早、存续期间规划管理规范发生变化的建筑物，应综合考虑形成年代、法律变更、行政管理、实际使用等因素，不能简单以未取得规划许可为由一律认定为违法建筑。\", \"claim_amount\": \"\", \"judgment_amount\": \"\"}, \"legal_provision_elements\": [{\"provision_index\": 0, \"statute\": \"中华人民共和国行政诉讼法\", \"article\": \"6\", \"element_type\": \"legal_consequence\", \"content\": \"人民法院审理行政案件，应对行政行为的合法性进行全面审查，包括职权依据、认定事实、适用法律和程序。\", \"applicable_fact_pattern\": \"行政机关作出行政行为时未全面调查收集证据，或未履行法定程序，影响实体合法性判断。\"}, {\"provision_index\": 1, \"statute\": \"中华人民共和国行政强制法\", \"article\": \"44\", \"element_type\": \"act_element\", \"content\": \"强制拆除违法建筑物前，行政机关应当公告限期拆除，并在当事人不复议、不诉讼又不拆除后，方可依法强制拆除。\", \"applicable_fact_pattern\": \"行政机关未依法公告或未等待法定期限届满即实施强制拆除。\"}]}, \"eval\": {\"row_id\": \"1433\", \"score\": 95.0, \"issues\": [\"guiding_case_number 为空\", \"judges 为空\", \"attorneys 为空\", \"trial_organizations 为空\"], \"court_case_count\": 2, \"judge_count\": 0, \"attorney_count\": 0, \"provision_count\": 2, \"evidence_count\": 3}}", "2504__v1": "{\"row_id\": \"2504\", \"input\": {\"id\": \"2504\", \"web_name\": \"人民法院案例库\", \"case_type\": \"行政-行政处罚\", \"storage_no\": \"2024-12-3-001-010\"}, \"output\": {\"guiding_case\": {\"guiding_case_number\": \"\", \"guiding_case_name\": \"王某诉旬阳市交通运输局行政处罚案\", \"publication_date\": \"2022-05-16\", \"binding_force\": \"persuasive\", \"guiding_points\": \"对于“擅自从事道路旅客运输经营”行为的认定，应综合运送目的、运送周期、费用标准、人员关系等因素予以判定：1.运送目的：行为人以运送为手段，以赚取利润、营利为目的。行为人的主观目的必须结合其客观行为进行判断，营利的目的必然以有偿交易方式实现，但收取费用的客观行为只能认定该行为是有偿的，并不能因此认定行为人主观上就具有营利目的；2.运送周期：周期性、持续性开展经营，是商业活动的必然要求。道路旅客运输行业的经营时间主要表现为一定时间范围内持续、经常性提供服务；3.费用标准：出于营利目的，行为人会在合理成本之外加价收取客观利润；4.人员关系：行为人通常为不特定社会对象提供运送服务以此获取利益。邻里互助型“有偿拼车”因不具有经营性特征，不应认定为擅自从事道路旅客运输经营。\", \"key_words\": [\"行政\", \"行政处罚\", \"罚款\", \"道路旅客运输经营\", \"社会主义核心价值观\"], \"case_level\": \"typical_case\", \"trial_procedure\": \"一审\", \"storage_no\": \"2024-12-3-001-010\", \"source_url\": \"https://rmfyalk.court.gov.cn\", \"judgment_mean\": \"\"}, \"case_type\": {\"category\": \"administrative\", \"level1\": \"行政\", \"level2\": \"行政处罚\"}, \"court_cases\": [{\"case_number\": \"(2022)陕7101行初68号\", \"filing_date\": \"2022-01-01\", \"judgment_date\": \"2022-05-16\", \"trial_level\": \"first_instance\", \"trial_procedure\": \"一审\", \"court\": {\"name\": \"安康铁路运输法院\", \"court_level\": \"special\"}, \"status\": \"effective\", \"cause_of_action\": \"行政处罚纠纷\", \"dispute_resolution_type\": \"litigation\", \"party_count\": null}], \"legal_subjects\": [{\"name\": \"王某\", \"subject_type\": \"natural_person\", \"org_type\": null, \"credit_code\": null, \"roles\": [{\"role_code\": \"plaintiff\", \"role_name\": \"原告\", \"case_number\": \"(2022)陕7101行初68号\"}]}, {\"name\": \"旬阳市交通运输局\", \"subject_type\": \"organization\", \"org_type\": \"government_agency\", \"credit_code\": null, \"roles\": [{\"role_code\": \"defendant\", \"role_name\": \"被告\", \"case_number\": \"(2022)陕7101行初68号\"}]}], \"attorneys\": [], \"judges\": [], \"prosecutors\": [], \"trial_organizations\": [], \"legal_provisions\": [{\"case_number\": \"(2022)陕7101行初68号\", \"statute\": \"中华人民共和国道路运输条例\", \"article\": \"63\", \"paragraph\": \"\", \"item\": \"\", \"content\": \"违反本条例的规定，未取得道路运输经营许可，擅自从事道路运输经营的，县级以上地方人民政府交通运输主管部门可以责令停止经营，没收违法所得并给予罚款处罚。\", \"citation_position\": \"judgment_reason\", \"citation_purpose\": \"适用依据\"}, {\"case_number\": \"(2022)陕7101行初68号\", \"statute\": \"道路旅客运输及客运站管理规定\", \"article\": \"3\", \"paragraph\": \"\", \"item\": \"\", \"content\": \"道路客运经营是指使用客车运送旅客、为社会公众提供服务、具有商业性质的道路客运活动。\", \"citation_position\": \"judgment_reason\", \"citation_purpose\": \"说理依据\"}, {\"case_number\": \"(2022)陕7101行初68号\", \"statute\": \"中华人民共和国行政诉讼法\", \"article\": \"70\", \"paragraph\": \"\", \"item\": \"1\", \"content\": \"行政行为主要证据不足的，人民法院判决撤销或者部分撤销，并可以判决被告重新作出行政行为。\", \"citation_position\": \"related_law\", \"citation_purpose\": \"适用依据\"}, {\"case_number\": \"(2022)陕7101行初68号\", \"statute\": \"中华人民共和国行政诉讼法\", \"article\": \"70\", \"paragraph\": \"\", \"item\": \"2\", \"content\": \"行政行为适用法律、法规错误的，人民法院判决撤销或者部分撤销，并可以判决被告重新作出行政行为。\", \"citation_position\": \"related_law\", \"citation_purpose\": \"适用依据\"}, {\"case_number\": \"(2022)陕7101行初68号\", \"statute\": \"中华人民共和国行政诉讼法\", \"article\": \"70\", \"paragraph\": \"\", \"item\": \"3\", \"content\": \"行政行为违反法定程序的，人民法院判决撤销或者部分撤销，并可以判决被告重新作出行政行为。\", \"citation_position\": \"related_law\", \"citation_purpose\": \"适用依据\"}, {\"case_number\": \"(2022)陕7101行初68号\", \"statute\": \"中华人民共和国道路运输条例\", \"article\": \"10\", \"paragraph\": \"\", \"item\": \"\", \"content\": \"申请从事客运经营的，应当依法向工商行政管理机关办理有关登记手续后，按照下列规定提出申请：（一）从事县级行政区域内客运经营的，向县级道路运输管理机构提出申请；（二）从事省、自治区、直辖市行政区域内跨2个县级以上行政区域客运经营的，向其共同的上一级道路运输管理机构提出申请；（三）从事跨省、自治区、直辖市行政区域客运经营的，向所在地的省、自治区、直辖市道路运输管理机构提出申请。\", \"citation_position\": \"related_law\", \"citation_purpose\": \"适用依据\"}], \"evidence\": [{\"content\": \"王某陈述：其受亲友邻里委托接送学生上下学，收取费用仅用于补偿燃油、过路费等成本，无营利目的。\", \"evidence_type\": \"party_statement\", \"submitted_by\": \"原告\", \"is_key_evidence\": true, \"admission_status\": \"admitted\", \"examination_status\": \"examined\", \"expert_institution\": \"\", \"expert_conclusion\": \"\"}, {\"content\": \"旬阳市交通运输局现场检查记录、询问笔录：记载王某未取得道路运输经营许可拉载六名学生并收取费用的事实。\", \"evidence_type\": \"documentary\", \"submitted_by\": \"被告\", \"is_key_evidence\": true, \"admission_status\": \"admitted\", \"examination_status\": \"examined\", \"expert_institution\": \"\", \"expert_conclusion\": \"\"}], \"judgment_results\": [{\"result_type\": \"dismissed\", \"specific_judgment\": \"撤销被告旬阳市交通运输局作出的旬交综执罚［2021］110号《行政处罚决定书》。\", \"reasoning\": \"法院认为，王某的运送行为不具有营利目的，未向社会不特定对象提供服务，属于邻里互助行为，不构成擅自从事道路旅客运输经营。旬阳市交通运输局据此作出的行政处罚决定主要证据不足、适用法律错误，且行政处罚程序违法（未依法告知陈述、申辩和听证权利），有违社会主义核心价值观和行政执法谦抑性要求，应予撤销。\", \"case_number\": \"(2022)陕7101行初68号\", \"cost_allocation\": \"\"}], \"case_summary\": {\"key_facts\": \"2021年10月，因疫情防控公共交通不便，王某受亲友邻里委托，每周五和周日驾驶自家车辆接送其子女上下学。亲友邻里每次每人主动支付50元至80元不等费用，用于补偿车费、文具、零食等支出，王某偶尔未收费。2021年12月31日，旬阳市交通运输局现场检查发现王某拉载六名学生，因其未取得道路运输证和经营许可证，予以立案调查。2022年1月5日立案，1月10日拟处罚款三万元，但未在处罚前送达《违法行为通知书》，3月4日送达《行政处罚决定书》。\", \"disputed_issues\": \"1.王某运送学生的行为是否构成擅自从事道路旅客运输经营；2.行政处罚程序是否合法。\", \"conclusion\": \"法院判决撤销旬阳市交通运输局作出的行政处罚决定，认定王某的行为属邻里互助，不具有经营性，行政处罚主要证据不足、适用法律错误且程序违法。\", \"amount_involved\": \"30000元\", \"guiding_points\": \"对于“擅自从事道路旅客运输经营”行为的认定，应综合运送目的、运送周期、费用标准、人员关系等因素予以判定：1.运送目的：行为人以运送为手段，以赚取利润、营利为目的。行为人的主观目的必须结合其客观行为进行判断，营利的目的必然以有偿交易方式实现，但收取费用的客观行为只能认定该行为是有偿的，并不能因此认定行为人主观上就具有营利目的；2.运送周期：周期性、持续性开展经营，是商业活动的必然要求。道路旅客运输行业的经营时间主要表现为一定时间范围内持续、经常性提供服务；3.费用标准：出于营利目的，行为人会在合理成本之外加价收取客观利润；4.人员关系：行为人通常为不特定社会对象提供运送服务以此获取利益。邻里互助型“有偿拼车”因不具有经营性特征，不应认定为擅自从事道路旅客运输经营。\", \"claim_amount\": \"30000元\", \"judgment_amount\": \"\"}, \"legal_provision_elements\": [{\"provision_index\": 0, \"statute\": \"中华人民共和国道路运输条例\", \"article\": \"63\", \"element_type\": \"act_element\", \"content\": \"未取得道路运输经营许可，擅自从事道路运输经营\", \"applicable_fact_pattern\": \"以营利为目的，为不特定对象提供道路运输服务，且未取得相应许可\"}, {\"provision_index\": 0, \"statute\": \"中华人民共和国道路运输条例\", \"article\": \"63\", \"element_type\": \"legal_consequence\", \"content\": \"责令停止经营，没收违法所得，并处罚款\", \"applicable_fact_pattern\": \"构成擅自从事道路运输经营的行为\"}, {\"provision_index\": 1, \"statute\": \"道路旅客运输及客运站管理规定\", \"article\": \"3\", \"element_type\": \"act_element\", \"content\": \"使用客车运送旅客\", \"applicable_fact_pattern\": \"行为人使用客车进行运送活动\"}, {\"provision_index\": 1, \"statute\": \"道路旅客运输及客运站管理规定\", \"article\": \"3\", \"element_type\": \"object_element\", \"content\": \"为社会公众提供服务\", \"applicable_fact_pattern\": \"运送对象为社会不特定公众\"}, {\"provision_index\": 1, \"statute\": \"道路旅客运输及客运站管理规定\", \"article\": \"3\", \"element_type\": \"subjective_element\", \"content\": \"具有商业性质的道路客运活动\", \"applicable_fact_pattern\": \"以营利为目的的经营行为\"}]}, \"eval\": {\"row_id\": \"2504\", \"score\": 95.0, \"issues\": [\"guiding_case_number 为空\", \"judges 为空\", \"attorneys 为空\", \"trial_organizations 为空\"], \"court_case_count\": 1, \"judge_count\": 0, \"attorney_count\": 0, \"provision_count\": 6, \"evidence_count\": 2}}", "2504__v2": "{\"row_id\": \"2504\", \"input\": {\"id\": \"2504\", \"web_name\": \"人民法院案例库\", \"case_type\": \"行政-行政处罚\", \"storage_no\": \"2024-12-3-001-010\"}, \"output\": {\"guiding_case\": {\"guiding_case_number\": \"\", \"guiding_case_name\": \"王某诉旬阳市交通运输局行政处罚案\", \"publication_date\": \"2022-05-16\", \"binding_force\": \"persuasive\", \"guiding_points\": \"对于“擅自从事道路旅客运输经营”行为的认定，应综合运送目的、运送周期、费用标准、人员关系等因素予以判定：1.运送目的：行为人以运送为手段，以赚取利润、营利为目的。行为人的主观目的必须结合其客观行为进行判断，营利的目的必然以有偿交易方式实现，但收取费用的客观行为只能认定该行为是有偿的，并不能因此认定行为人主观上就具有营利目的；2.运送周期：周期性、持续性开展经营，是商业活动的必然要求。道路旅客运输行业的经营时间主要表现为一定时间范围内持续、经常性提供服务；3.费用标准：出于营利目的，行为人会在合理成本之外加价收取客观利润；4.人员关系：行为人通常为不特定社会对象提供运送服务以此获取利益。邻里互助型“有偿拼车”因不具有经营性特征，不应认定为擅自从事道路旅客运输经营。\", \"key_words\": [\"行政\", \"行政处罚\", \"罚款\", \"道路旅客运输经营\", \"社会主义核心价值观\"], \"case_level\": \"typical_case\", \"trial_procedure\": \"一审\", \"storage_no\": \"2024-12-3-001-010\", \"source_url\": \"https://rmfyalk.court.gov.cn\", \"judgment_mean\": \"\"}, \"case_type\": {\"category\": \"administrative\", \"level1\": \"行政\", \"level2\": \"行政处罚\"}, \"court_cases\": [{\"case_number\": \"(2022)陕7101行初68号\", \"filing_date\": \"2022-01-05\", \"judgment_date\": \"2022-05-16\", \"trial_level\": \"first_instance\", \"trial_procedure\": \"一审\", \"court\": {\"name\": \"安康铁路运输法院\", \"court_level\": \"basic\"}, \"status\": \"effective\", \"cause_of_action\": \"行政处罚纠纷\", \"dispute_resolution_type\": \"litigation\", \"party_count\": null}], \"legal_subjects\": [{\"name\": \"王某\", \"subject_type\": \"natural_person\", \"org_type\": null, \"credit_code\": null, \"roles\": [{\"role_code\": \"plaintiff\", \"role_name\": \"原告\", \"case_number\": \"(2022)陕7101行初68号\"}]}, {\"name\": \"旬阳市交通运输局\", \"subject_type\": \"organization\", \"org_type\": \"government_agency\", \"credit_code\": null, \"roles\": [{\"role_code\": \"defendant\", \"role_name\": \"被告\", \"case_number\": \"(2022)陕7101行初68号\"}]}], \"attorneys\": [], \"judges\": [{\"name\": \"\", \"role\": \"presiding_judge\", \"case_number\": \"(2022)陕7101行初68号\"}], \"prosecutors\": [], \"trial_organizations\": [{\"case_number\": \"(2022)陕7101行初68号\", \"members\": [], \"summary\": \"合议庭审理，具体成员不详\"}], \"legal_provisions\": [{\"case_number\": \"(2022)陕7101行初68号\", \"statute\": \"中华人民共和国道路运输条例\", \"article\": \"63\", \"paragraph\": \"\", \"item\": \"\", \"content\": \"违反本条例的规定，未取得道路运输经营许可，擅自从事道路运输经营的，县级以上地方人民政府交通运输主管部门可以责令停止经营，没收违法所得并给予罚款处罚。\", \"citation_position\": \"judgment_reason\", \"citation_purpose\": \"适用依据\"}, {\"case_number\": \"(2022)陕7101行初68号\", \"statute\": \"道路旅客运输及客运站管理规定\", \"article\": \"3\", \"paragraph\": \"\", \"item\": \"\", \"content\": \"道路客运经营是指使用客车运送旅客、为社会公众提供服务、具有商业性质的道路客运活动\", \"citation_position\": \"judgment_reason\", \"citation_purpose\": \"说理依据\"}, {\"case_number\": \"(2022)陕7101行初68号\", \"statute\": \"中华人民共和国行政诉讼法\", \"article\": \"70\", \"paragraph\": \"\", \"item\": \"1\", \"content\": \"行政行为有下列情形之一的，人民法院判决撤销或者部分撤销，并可以判决被告重新作出行政行为：（一）主要证据不足的；（二）适用法律、法规错误的；（三）违反法定程序的；\", \"citation_position\": \"related_law\", \"citation_purpose\": \"适用依据\"}, {\"case_number\": \"(2022)陕7101行初68号\", \"statute\": \"中华人民共和国道路运输条例\", \"article\": \"10\", \"paragraph\": \"\", \"item\": \"\", \"content\": \"申请从事客运经营的，应当依法向市场监督管理部门办理有关登记手续后，按照下列规定提出申请并提交符合本条例第八条规定条件的相关材料：（一）从事县级行政区域内和毗邻县行政区域间客运经营的，向县级人民政府交通运输主管部门提出申请；（二）从事省际、市际、县际（除毗邻县行政区域间外）客运经营的，向所在地设区的市级人民政府交通运输主管部门提出申请。\", \"citation_position\": \"related_law\", \"citation_purpose\": \"适用依据\"}], \"evidence\": [{\"content\": \"现场检查发现王某驾驶面包车拉载六名学生，未取得道路运输证和经营许可证，执法人员将相关人员带往疫情防控卡点调查询问。\", \"evidence_type\": \"documentary\", \"submitted_by\": \"被告旬阳市交通运输局\", \"is_key_evidence\": true, \"admission_status\": \"admitted\", \"examination_status\": \"examined\", \"expert_institution\": \"\", \"expert_conclusion\": \"\"}, {\"content\": \"王某的陈述说明其受亲友邻里所托接送学生，费用仅用于车费、文具、零食等，偶尔未收费。\", \"evidence_type\": \"party_statement\", \"submitted_by\": \"原告王某\", \"is_key_evidence\": true, \"admission_status\": \"admitted\", \"examination_status\": \"examined\", \"expert_institution\": \"\", \"expert_conclusion\": \"\"}, {\"content\": \"被告制作的《案件处理意见书》《违法行为通知书》《行政处罚决定书》，其中《违法行为通知书》未在处罚前送达。\", \"evidence_type\": \"documentary\", \"submitted_by\": \"被告旬阳市交通运输局\", \"is_key_evidence\": true, \"admission_status\": \"admitted\", \"examination_status\": \"examined\", \"expert_institution\": \"\", \"expert_conclusion\": \"\"}], \"judgment_results\": [{\"result_type\": \"dismissed\", \"specific_judgment\": \"撤销被告旬阳市交通运输局作出的旬交综执罚［2021］110号《行政处罚决定书》。\", \"reasoning\": \"法院认定王某运送行为不具有营利目的，未向社会不特定对象提供服务，属于邻里互助行为，不构成擅自从事道路旅客运输经营。被告作出的行政处罚决定主要证据不足、适用法律错误，且行政处罚程序违法（未依法告知陈述、申辩和听证权），有违社会主义核心价值观和行政执法谦抑性要求，故依法撤销。\", \"case_number\": \"(2022)陕7101行初68号\", \"cost_allocation\": \"\"}], \"case_summary\": {\"key_facts\": \"2021年10月因疫情防控公共交通不便，王某受托接送亲友邻里子女上下学，每周五和周日驾驶自家车辆，亲友邻里每次每人支付50-80元，用于车费、文具、零食等。12月31日被查获，2022年1月5日立案，拟罚款三万元，但未在处罚前送达违法行为通知书，3月4日送达处罚决定。\", \"disputed_issues\": \"王某的行为是否构成擅自从事道路旅客运输经营；行政处罚程序是否合法。\", \"conclusion\": \"法院判决撤销行政处罚决定，认定王某的行为不构成擅自从事道路运输经营，且处罚程序违法。\", \"amount_involved\": \"罚款三万元\", \"guiding_points\": \"对于“擅自从事道路旅客运输经营”行为的认定，应综合运送目的、运送周期、费用标准、人员关系等因素予以判定。邻里互助型“有偿拼车”因不具有经营性特征，不应认定为擅自从事道路旅客运输经营。\", \"claim_amount\": \"撤销行政处罚\", \"judgment_amount\": \"撤销行政处罚\"}, \"legal_provision_elements\": [{\"provision_index\": 0, \"statute\": \"中华人民共和国道路运输条例\", \"article\": \"63\", \"element_type\": \"subject_element\", \"content\": \"未取得道路运输经营许可，擅自从事道路运输经营\", \"applicable_fact_pattern\": \"未取得道路运输证和经营许可证，从事道路旅客运输\"}, {\"provision_index\": 0, \"statute\": \"中华人民共和国道路运输条例\", \"article\": \"63\", \"element_type\": \"legal_consequence\", \"content\": \"县级以上地方人民政府交通运输主管部门可以责令停止经营，没收违法所得并给予罚款处罚\", \"applicable_fact_pattern\": \"查实构成擅自从事道路运输经营，由交通运输主管部门进行处罚\"}, {\"provision_index\": 1, \"statute\": \"道路旅客运输及客运站管理规定\", \"article\": \"3\", \"element_type\": \"act_element\", \"content\": \"道路客运经营是指使用客车运送旅客、为社会公众提供服务、具有商业性质的道路客运活动\", \"applicable_fact_pattern\": \"向社会不特定对象提供运送服务并营利\"}, {\"provision_index\": 2, \"statute\": \"中华人民共和国行政诉讼法\", \"article\": \"70\", \"element_type\": \"legal_consequence\", \"content\": \"主要证据不足、适用法律错误或违反法定程序的，撤销行政行为\", \"applicable_fact_pattern\": \"行政处罚决定主要证据不足、适用法律错误、程序违法\"}]}, \"eval\": {\"row_id\": \"2504\", \"score\": 95.0, \"issues\": [\"guiding_case_number 为空\", \"attorneys 为空\"], \"court_case_count\": 1, \"judge_count\": 1, \"attorney_count\": 0, \"provision_count\": 4, \"evidence_count\": 3}}", "3966__v1": "{\"row_id\": \"3966\", \"input\": {\"id\": \"3966\", \"web_name\": \"人民法院案例库\", \"case_type\": \"行政-不履行XX职责\", \"storage_no\": \"2023-12-3-021-006\"}, \"output\": {\"guiding_case\": {\"guiding_case_number\": \"\", \"guiding_case_name\": \"开平某茶馆与开平市政府不履行法定职责案\", \"publication_date\": \"2020-08-31\", \"binding_force\": \"persuasive\", \"guiding_points\": \"在房屋征收补偿案件中，一般而言，只有房屋所有权人才与征收行为和补偿行为有利害关系，可以针对征收行为或者补偿行为提起行政诉讼。房屋的市场化承租人通常并不与补偿行为有利害关系，其可以通过民事诉讼解决其与房屋所有权人之间的房屋租赁合同纠纷，并按照法律规定和租赁合同的约定来解决所租赁房屋上的添附以及因征收而造成的停产停业损失的补偿或赔偿问题。但是，补偿义务主体在知道或者应当知道存在房屋承租人且承租人具有独立的补偿利益后，既不在其与房屋所有权人签订的安置补偿协议或者作出的补偿决定中给付上述独立的补偿利益，也不另行与承租人签订安置补偿协议或者作出补偿决定解决上述独立的补偿利益问题，则房屋承租人有权以自己名义主张上述独立的补偿利益。\", \"key_words\": [\"行政\", \"不履行法定职责\", \"行政补偿\", \"房屋征收补偿\", \"承租人\", \"原告资格\"], \"case_level\": \"typical_case\", \"trial_procedure\": \"再审\", \"storage_no\": \"2023-12-3-021-006\", \"source_url\": \"https://rmfyalk.court.gov.cn\", \"judgment_mean\": \"\"}, \"case_type\": {\"category\": \"administrative\", \"level1\": \"行政\", \"level2\": \"不履行法定职责\"}, \"court_cases\": [{\"case_number\": \"(2017)粤07行初44号\", \"filing_date\": \"2017-10-18\", \"judgment_date\": \"2018-01-29\", \"trial_level\": \"first_instance\", \"trial_procedure\": \"一审\", \"court\": {\"name\": \"广东省江门市中级人民法院\", \"court_level\": \"intermediate\"}, \"status\": \"judged\", \"cause_of_action\": \"行政补偿\", \"dispute_resolution_type\": \"litigation\", \"party_count\": null}, {\"case_number\": \"(2018)粤行终641号\", \"filing_date\": \"2018-01-29\", \"judgment_date\": \"2018-10-18\", \"trial_level\": \"second_instance\", \"trial_procedure\": \"二审\", \"court\": {\"name\": \"广东省高级人民法院\", \"court_level\": \"high\"}, \"status\": \"judged\", \"cause_of_action\": \"行政补偿\", \"dispute_resolution_type\": \"litigation\", \"party_count\": null}, {\"case_number\": \"(2020)最高法行再110号\", \"filing_date\": \"2020-01-01\", \"judgment_date\": \"2020-08-31\", \"trial_level\": \"retrial\", \"trial_procedure\": \"再审\", \"court\": {\"name\": \"最高人民法院\", \"court_level\": \"supreme\"}, \"status\": \"judged\", \"cause_of_action\": \"行政补偿\", \"dispute_resolution_type\": \"litigation\", \"party_count\": null}, {\"case_number\": \"(2021)粤07行初49号\", \"filing_date\": \"2021-01-01\", \"judgment_date\": \"2022-04-12\", \"trial_level\": \"first_instance\", \"trial_procedure\": \"一审\", \"court\": {\"name\": \"广东省江门市中级人民法院\", \"court_level\": \"intermediate\"}, \"status\": \"terminated\", \"cause_of_action\": \"行政补偿\", \"dispute_resolution_type\": \"mediation\", \"party_count\": null}], \"legal_subjects\": [{\"name\": \"某茶馆\", \"subject_type\": \"organization\", \"org_type\": \"individual_business\", \"credit_code\": null, \"roles\": [{\"role_code\": \"plaintiff\", \"role_name\": \"原告\", \"case_number\": \"(2017)粤07行初44号\"}, {\"role_code\": \"appellant\", \"role_name\": \"上诉人\", \"case_number\": \"(2018)粤行终641号\"}, {\"role_code\": \"retrial_applicant\", \"role_name\": \"再审申请人\", \"case_number\": \"(2020)最高法行再110号\"}, {\"role_code\": \"plaintiff\", \"role_name\": \"原告\", \"case_number\": \"(2021)粤07行初49号\"}]}, {\"name\": \"开平市政府\", \"subject_type\": \"organization\", \"org_type\": \"government_agency\", \"credit_code\": null, \"roles\": [{\"role_code\": \"defendant\", \"role_name\": \"被告\", \"case_number\": \"(2017)粤07行初44号\"}, {\"role_code\": \"appellee\", \"role_name\": \"被上诉人\", \"case_number\": \"(2018)粤行终641号\"}, {\"role_code\": \"retrial_respondent\", \"role_name\": \"再审被申请人\", \"case_number\": \"(2020)最高法行再110号\"}, {\"role_code\": \"defendant\", \"role_name\": \"被告\", \"case_number\": \"(2021)粤07行初49号\"}]}], \"attorneys\": [], \"judges\": [], \"prosecutors\": [], \"trial_organizations\": [{\"case_number\": \"(2017)粤07行初44号\", \"members\": [], \"summary\": \"合议庭审理\"}, {\"case_number\": \"(2018)粤行终641号\", \"members\": [], \"summary\": \"合议庭审理\"}, {\"case_number\": \"(2020)最高法行再110号\", \"members\": [], \"summary\": \"合议庭审理\"}, {\"case_number\": \"(2021)粤07行初49号\", \"members\": [], \"summary\": \"合议庭审理\"}], \"legal_provisions\": [{\"case_number\": \"(2020)最高法行再110号\", \"statute\": \"中华人民共和国行政诉讼法\", \"article\": \"25\", \"paragraph\": \"1\", \"item\": \"\", \"content\": \"行政行为的相对人以及其他与行政行为有利害关系的公民、法人或者其他组织，有权提起诉讼。\", \"citation_position\": \"judgment_reason\", \"citation_purpose\": \"适用依据\"}], \"evidence\": [{\"content\": \"2014年12月31日某图书馆与厉某签订的《房屋租赁协议书》，约定租赁涉案房屋，租期十年，并约定如遇政府征收，双方共同协商补偿。\", \"evidence_type\": \"documentary\", \"submitted_by\": \"某茶馆\", \"is_key_evidence\": true, \"admission_status\": \"admitted\", \"examination_status\": \"examined\", \"expert_institution\": \"\", \"expert_conclusion\": \"\"}, {\"content\": \"开府征决字[2017]1号《开平市人民政府房屋征收决定书》，决定征收包括涉案房屋在内的区域。\", \"evidence_type\": \"documentary\", \"submitted_by\": \"某茶馆\", \"is_key_evidence\": true, \"admission_status\": \"admitted\", \"examination_status\": \"examined\", \"expert_institution\": \"\", \"expert_conclusion\": \"\"}, {\"content\": \"某图书馆与开平市赤坎镇人民政府签订的产权置换补偿协议，未涉及某茶馆的补偿。\", \"evidence_type\": \"documentary\", \"submitted_by\": \"某茶馆\", \"is_key_evidence\": true, \"admission_status\": \"admitted\", \"examination_status\": \"examined\", \"expert_institution\": \"\", \"expert_conclusion\": \"\"}], \"judgment_results\": [{\"result_type\": \"dismissed\", \"specific_judgment\": \"驳回某茶馆的起诉\", \"reasoning\": \"一审法院认为某茶馆不具有直接向征收人提出补偿请求的权利，故其不具有原告主体资格。\", \"case_number\": \"(2017)粤07行初44号\", \"cost_allocation\": \"\"}, {\"result_type\": \"dismissed\", \"specific_judgment\": \"驳回上诉，维持原裁定\", \"reasoning\": \"二审法院认为某茶馆未通过涉案房屋所有权人、被征收人向房屋征收机构提出相关的补偿要求，故其不具有原告资格。\", \"case_number\": \"(2018)粤行终641号\", \"cost_allocation\": \"\"}, {\"result_type\": \"remanded\", \"specific_judgment\": \"一、撤销广东省江门市中级人民法院（2017）粤07行初44号行政裁定和广东省高级人民法院（2018）粤行终641号行政裁定；二、指令广东省江门市中级人民法院继续审理本案。\", \"reasoning\": \"补偿义务主体在知道或者应当知道存在房屋承租人且承租人具有独立的补偿利益后，既不在其与房屋所有权人签订的安置补偿协议或者作出的补偿决定中给付上述独立的补偿利益，也不另行与承租人签订安置补偿协议或者作出补偿决定解决上述独立的补偿利益问题，则房屋承租人有权以自己名义主张上述独立的补偿利益。本案中，开平市政府明知厉某的独立补偿利益，却径行与房屋所有权人签订协议且未对某茶馆作出补偿决定，存在侵犯其补偿利益的可能性。原审裁定错误理解《中华人民共和国行政诉讼法》第二十五条第一款的规定，应予纠正。\", \"case_number\": \"(2020)最高法行再110号\", \"cost_allocation\": \"\"}, {\"result_type\": \"mediation_agreement\", \"specific_judgment\": \"以调解方式结案\", \"reasoning\": \"\", \"case_number\": \"(2021)粤07行初49号\", \"cost_allocation\": \"\"}], \"case_summary\": {\"key_facts\": \"2014年12月31日，某茶馆与某图书馆签订租赁协议，租用涉案房屋。2017年3月31日，开平市政府征收该房屋所在区域。开平市政府与房屋所有权人签订补偿协议，但未对承租人某茶馆的添附和停产停业损失等进行补偿。某茶馆提起行政诉讼，请求判令开平市政府履行补偿职责。\", \"disputed_issues\": \"房屋征收补偿案件中，承租人是否具有直接向征收人主张独立补偿利益的原告主体资格。\", \"conclusion\": \"最高人民法院再审认为，征收人明知存在承租人且其具有独立补偿利益而未予补偿时，承租人有权以自己名义主张独立补偿利益。故撤销原驳回起诉裁定，指令继续审理。后续案件以调解方式结案。\", \"amount_involved\": \"\", \"guiding_points\": \"在房屋征收补偿案件中，一般而言，只有房屋所有权人才与征收行为和补偿行为有利害关系，可以针对征收行为或者补偿行为提起行政诉讼。房屋的市场化承租人通常并不与补偿行为有利害关系，其可以通过民事诉讼解决其与房屋所有权人之间的房屋租赁合同纠纷，并按照法律规定和租赁合同的约定来解决所租赁房屋上的添附以及因征收而造成的停产停业损失的补偿或赔偿问题。但是，补偿义务主体在知道或者应当知道存在房屋承租人且承租人具有独立的补偿利益后，既不在其与房屋所有权人签订的安置补偿协议或者作出的补偿决定中给付上述独立的补偿利益，也不另行与承租人签订安置补偿协议或者作出补偿决定解决上述独立的补偿利益问题，则房屋承租人有权以自己名义主张上述独立的补偿利益。\", \"claim_amount\": \"5754303\", \"judgment_amount\": \"\"}, \"legal_provision_elements\": [{\"provision_index\": 0, \"statute\": \"中华人民共和国行政诉讼法\", \"article\": \"25\", \"element_type\": \"subject_element\", \"content\": \"行政行为的相对人以及其他与行政行为有利害关系的公民、法人或者其他组织\", \"applicable_fact_pattern\": \"征收补偿行为可能对起诉人权利义务造成区别于其他人的特别损害或者不利影响，且起诉人无法通过其他有效方式寻求救济\"}, {\"provision_index\": 0, \"statute\": \"中华人民共和国行政诉讼法\", \"article\": \"25\", \"element_type\": \"act_element\", \"content\": \"被诉行政行为有可能对起诉人的权利义务造成区别于其他人的特别损害或者不利影响\", \"applicable_fact_pattern\": \"补偿义务主体明知承租人独立补偿利益而未予补偿，使得承租人权益受损\"}, {\"provision_index\": 0, \"statute\": \"中华人民共和国行政诉讼法\", \"article\": \"25\", \"element_type\": \"legal_consequence\", \"content\": \"有权提起诉讼\", \"applicable_fact_pattern\": \"符合上述利害关系条件的承租人，可以作为原告提起行政诉讼\"}]}, \"eval\": {\"row_id\": \"3966\", \"score\": 95.0, \"issues\": [\"guiding_case_number 为空\", \"judges 为空\", \"attorneys 为空\"], \"court_case_count\": 4, \"judge_count\": 0, \"attorney_count\": 0, \"provision_count\": 1, \"evidence_count\": 3}}", "3966__v2": "{\"row_id\": \"3966\", \"input\": {\"id\": \"3966\", \"web_name\": \"人民法院案例库\", \"case_type\": \"行政-不履行XX职责\", \"storage_no\": \"2023-12-3-021-006\"}, \"output\": {\"guiding_case\": {\"guiding_case_number\": \"\", \"guiding_case_name\": \"某茶馆诉开平市人民政府不履行补偿职责案\", \"publication_date\": \"2020-08-31\", \"binding_force\": \"persuasive\", \"guiding_points\": \"在房屋征收补偿案件中，一般而言，只有房屋所有权人才与征收行为和补偿行为有利害关系，可以针对征收行为或者补偿行为提起行政诉讼。房屋的市场化承租人通常并不与补偿行为有利害关系，其可以通过民事诉讼解决其与房屋所有权人之间的房屋租赁合同纠纷，并按照法律规定和租赁合同的约定来解决所租赁房屋上的添附以及因征收而造成的停产停业损失的补偿或赔偿问题。但是，补偿义务主体在知道或者应当知道存在房屋承租人且承租人具有独立的补偿利益后，既不在其与房屋所有权人签订的安置补偿协议或者作出的补偿决定中给付上述独立的补偿利益，也不另行与承租人签订安置补偿协议或者作出补偿决定解决上述独立的补偿利益问题，则房屋承租人有权以自己名义主张上述独立的补偿利益。\", \"key_words\": [\"行政\", \"不履行法定职责\", \"行政补偿\", \"房屋征收补偿\", \"承租人\", \"原告资格\"], \"case_level\": \"typical_case\", \"trial_procedure\": \"再审\", \"storage_no\": \"2023-12-3-021-006\", \"source_url\": \"https://rmfyalk.court.gov.cn\", \"judgment_mean\": \"\"}, \"case_type\": {\"category\": \"administrative\", \"level1\": \"行政\", \"level2\": \"不履行法定职责\"}, \"court_cases\": [{\"case_number\": \"(2017)粤07行初44号\", \"filing_date\": \"2017-10-18\", \"judgment_date\": \"2018-01-29\", \"trial_level\": \"first_instance\", \"trial_procedure\": \"一审\", \"court\": {\"name\": \"广东省江门市中级人民法院\", \"court_level\": \"intermediate\"}, \"status\": \"appealed\", \"cause_of_action\": \"不履行法定职责\", \"dispute_resolution_type\": \"litigation\", \"party_count\": null}, {\"case_number\": \"(2018)粤行终641号\", \"filing_date\": \"2018-02-01\", \"judgment_date\": \"2018-10-18\", \"trial_level\": \"second_instance\", \"trial_procedure\": \"二审\", \"court\": {\"name\": \"广东省高级人民法院\", \"court_level\": \"high\"}, \"status\": \"retried\", \"cause_of_action\": \"不履行法定职责\", \"dispute_resolution_type\": \"litigation\", \"party_count\": null}, {\"case_number\": \"(2020)最高法行再110号\", \"filing_date\": \"2020-01-01\", \"judgment_date\": \"2020-08-31\", \"trial_level\": \"retrial\", \"trial_procedure\": \"再审\", \"court\": {\"name\": \"最高人民法院\", \"court_level\": \"supreme\"}, \"status\": \"judged\", \"cause_of_action\": \"不履行法定职责\", \"dispute_resolution_type\": \"litigation\", \"party_count\": null}, {\"case_number\": \"(2021)粤07行初49号\", \"filing_date\": \"2021-01-01\", \"judgment_date\": \"2022-04-12\", \"trial_level\": \"first_instance\", \"trial_procedure\": \"一审\", \"court\": {\"name\": \"广东省江门市中级人民法院\", \"court_level\": \"intermediate\"}, \"status\": \"terminated\", \"cause_of_action\": \"不履行法定职责\", \"dispute_resolution_type\": \"litigation\", \"party_count\": null}], \"legal_subjects\": [{\"name\": \"某茶馆\", \"subject_type\": \"organization\", \"org_type\": \"individual_business\", \"credit_code\": null, \"roles\": [{\"role_code\": \"plaintiff\", \"role_name\": \"原告\", \"case_number\": \"(2017)粤07行初44号\"}, {\"role_code\": \"appellant\", \"role_name\": \"上诉人\", \"case_number\": \"(2018)粤行终641号\"}, {\"role_code\": \"retrial_applicant\", \"role_name\": \"再审申请人\", \"case_number\": \"(2020)最高法行再110号\"}, {\"role_code\": \"plaintiff\", \"role_name\": \"原告\", \"case_number\": \"(2021)粤07行初49号\"}]}, {\"name\": \"开平市人民政府\", \"subject_type\": \"organization\", \"org_type\": \"government_agency\", \"credit_code\": null, \"roles\": [{\"role_code\": \"defendant\", \"role_name\": \"被告\", \"case_number\": \"(2017)粤07行初44号\"}, {\"role_code\": \"appellee\", \"role_name\": \"被上诉人\", \"case_number\": \"(2018)粤行终641号\"}, {\"role_code\": \"retrial_respondent\", \"role_name\": \"再审被申请人\", \"case_number\": \"(2020)最高法行再110号\"}, {\"role_code\": \"defendant\", \"role_name\": \"被告\", \"case_number\": \"(2021)粤07行初49号\"}]}], \"attorneys\": [], \"judges\": [], \"prosecutors\": [], \"trial_organizations\": [], \"legal_provisions\": [{\"case_number\": \"(2020)最高法行再110号\", \"statute\": \"中华人民共和国行政诉讼法\", \"article\": \"25\", \"paragraph\": \"1\", \"item\": \"\", \"content\": \"行政行为的相对人以及其他与行政行为有利害关系的公民、法人或者其他组织，有权提起诉讼。\", \"citation_position\": \"judgment_reason\", \"citation_purpose\": \"说理依据\"}], \"evidence\": [{\"content\": \"2014年12月31日，赤坎某图书馆与厉某签订《房屋租赁协议书》，约定租期十年，并约定如遇政府政策行为双方共同协商解决等。\", \"evidence_type\": \"documentary\", \"submitted_by\": \"某茶馆\", \"is_key_evidence\": true, \"admission_status\": \"admitted\", \"examination_status\": \"examined\", \"expert_institution\": \"\", \"expert_conclusion\": \"\"}, {\"content\": \"2017年3月31日，开平市政府作出的开府征决字[2017]1号《开平市人民政府房屋征收决定书》，决定征收赤坎镇圩镇范围内的3981户房屋。\", \"evidence_type\": \"documentary\", \"submitted_by\": \"开平市人民政府\", \"is_key_evidence\": true, \"admission_status\": \"admitted\", \"examination_status\": \"examined\", \"expert_institution\": \"\", \"expert_conclusion\": \"\"}, {\"content\": \"2017年8月30日，赤坎某图书馆与开平市赤坎镇人民政府针对堤西路15号建筑达成的产权置换补偿协议，该协议未涉及某茶馆的补偿。\", \"evidence_type\": \"documentary\", \"submitted_by\": \"某茶馆\", \"is_key_evidence\": true, \"admission_status\": \"admitted\", \"examination_status\": \"examined\", \"expert_institution\": \"\", \"expert_conclusion\": \"\"}], \"judgment_results\": [{\"result_type\": \"dismissed\", \"specific_judgment\": \"驳回某茶馆的起诉。\", \"reasoning\": \"一审法院认为某茶馆不具有直接向征收人提出补偿请求的权利，故不具有原告主体资格。\", \"case_number\": \"(2017)粤07行初44号\", \"cost_allocation\": \"\"}, {\"result_type\": \"dismissed\", \"specific_judgment\": \"驳回上诉，维持一审裁定。\", \"reasoning\": \"二审法院认为某茶馆未通过房屋所有权人、被征收人向房屋征收机构提出相关的补偿要求，故不具有原告主体资格。\", \"case_number\": \"(2018)粤行终641号\", \"cost_allocation\": \"\"}, {\"result_type\": \"remanded\", \"specific_judgment\": \"1.撤销广东省江门市中级人民法院（2017）粤07行初44号行政裁定和广东省高级人民法院（2018）粤行终641号行政裁定；2.指令广东省江门市中级人民法院继续审理本案。\", \"reasoning\": \"最高人民法院认为，补偿义务主体明知承租人具有独立的补偿利益，却未在补偿协议或补偿决定中处理该利益，承租人有权以自己名义提起诉讼。一、二审裁定错误理解行政诉讼法相关规定，应予纠正。\", \"case_number\": \"(2020)最高法行再110号\", \"cost_allocation\": \"\"}, {\"result_type\": \"mediation_agreement\", \"specific_judgment\": \"以调解方式结案。\", \"reasoning\": \"\", \"case_number\": \"(2021)粤07行初49号\", \"cost_allocation\": \"\"}], \"case_summary\": {\"key_facts\": \"厉某经营某茶馆，租赁赤坎某图书馆房屋，租期十年。2017年开平市政府征收包括该房屋在内的区域，并与图书馆签订产权置换补偿协议，但未对某茶馆的添附和停产停业损失进行补偿。厉某多次要求补偿未果，遂提起行政诉讼，请求开平市政府履行补偿职责。一二审法院均驳回起诉，认为承租人无直接原告资格。再审最高人民法院撤销原裁定，指令继续审理，最终以调解结案。\", \"disputed_issues\": \"房屋征收补偿案件中，承租人是否具有直接向征收人提起履行补偿职责
