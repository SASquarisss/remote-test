  panelBody.innerHTML = html;
}

})();
</script>

<div id="parseTerminal">
  <!-- Collapsed bar -->
  <div class="collapsed-bar" onclick="toggleParseTerminal()" title="点击展开解析终端">
    📋 法律文本解析终端 | 点击展开
  </div>
  <!-- Expanded panel -->
  <div class="terminal-panel">
    <div class="term-header">
      <span>📋 法律文本解析终端</span>
      <button class="term-close" onclick="toggleParseTerminal()" title="收起终端">▼ 收起</button>
    </div>
    <div class="term-body">
      <!-- Left: Input -->
      <div class="term-col term-col-left">
        <div class="term-input-area">
          <textarea id="termInput" placeholder="在此粘贴法律文本（原始案件信息、裁判文书等任意文本）&#10;&#10;例如：&#10;人民法院案例库入库编号: 2023-09-3-029-028&#10;案例名称: 某某公司诉某某局行政纠纷案&#10;案由: 行政-商标相关行政案件&#10;基本案情: ……&#10;裁判理由: ……&#10;相关法条: 《中华人民共和国商标法》第四十四条"></textarea>
          <div class="term-btn-row">
            <button class="btn-parse" id="btnParse" onclick="doParse()">⚡ 一键解析</button>
            <span class="term-status" id="termStatus">就绪</span>
          </div>
        </div>
      </div>
      <!-- Middle: JSON Result -->
      <div class="term-col term-col-middle">
        <div class="term-json-area" id="termJsonArea">
          <div class="term-json-placeholder" id="termJsonPlaceholder">等待解析结果...</div>
          <pre id="termJsonPre" style="display:none;"></pre>
        </div>
      </div>
      <!-- Right: vis-network -->
      <div class="term-col term-col-right">
        <div class="term-vis-area" id="termVisArea">
          <div id="termVisContainer"></div>
          <div class="term-vis-placeholder" id="termVisPlaceholder">等待解析结果</div>
        </div>
      </div>
    </div>
    <!-- Footer -->
    <div class="term-footer" id="termFooter">
      <button class="btn-save" id="btnSave" onclick="doSave()" disabled>💾 保存</button>
      <span id="termScore"></span>
      <span id="termIssues"></span>
    </div>
  </div>
</div>

<script>
// ── Terminal State ─────────────────────────────────────────────────────────
var termExpanded = false;
var termLastResult = null;  // last parse result
var termVisNetwork = null;

function toggleParseTerminal() {
  termExpanded = !termExpanded;
  var panel = document.getElementById('parseTerminal');
  panel.classList.toggle('expanded', termExpanded);

  // Adjust #mynetwork height when terminal opens/closes
  var network = document.getElementById('mynetwork');
  if (termExpanded) {
    network.style.height = 'calc(100vh - 44px - 55vh - 32px)';
  } else {
    network.style.height = 'calc(100vh - 44px)';
  }

  // If expanding and we have a previous network, fit it
  if (termExpanded && termVisNetwork) {
    setTimeout(function() { termVisNetwork.fit({ animation: true }); }, 350);
  }
}

// ── Parse ──────────────────────────────────────────────────────────────────
function doParse() {
  var textarea = document.getElementById('termInput');
  var text = textarea.value.trim();
  if (!text) {
    setTermStatus('请先输入文本', '#e74c3c');
    return;
  }

  var btn = document.getElementById('btnParse');
  btn.disabled = true;
  btn.classList.add('loading');
  setTermStatus('正在解析...', '#2980b9');

  fetch('/api/parse', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ text: text }),
  })
  .then(function(r) { return r.json(); })
  .then(function(result) {
    if (result.error) {
      setTermStatus('解析失败: ' + result.error, '#e74c3c');
      return;
    }
    termLastResult = result;
    displayResult(result);
    setTermStatus('解析完成', '#27ae60');
    document.getElementById('btnSave').disabled = false;
  })
  .catch(function(err) {
    setTermStatus('请求失败: ' + err.message, '#e74c3c');
  })
  .finally(function() {
    btn.disabled = false;
    btn.classList.remove('loading');
  });
}

function setTermStatus(msg, color) {
  var el = document.getElementById('termStatus');
  el.textContent = msg;
  el.style.color = color || '#999';
}

// ── Display Result ─────────────────────────────────────────────────────────
function displayResult(result) {
  // Middle: formatted JSON
  var jsonStr = JSON.stringify(result.json_result, null, 2);
  var pre = document.getElementById('termJsonPre');
  pre.textContent = jsonStr;
  pre.style.display = 'block';
  document.getElementById('termJsonPlaceholder').style.display = 'none';

  // Footer: score + issues
  var scoreEl = document.getElementById('termScore');
  var issuesEl = document.getElementById('termIssues');
  scoreEl.textContent = '得分: ' + result.score + '/100';
  scoreEl.className = 'term-footer-score';
  if (result.issues && result.issues.length > 0) {
    issuesEl.className = 'term-footer-issues';
    issuesEl.textContent = '⚠ ' + result.issues.slice(0, 3).join('; ');
  }

  // Right: vis-network
  renderTermVis(result.nodes, result.edges);
}

// ── vis-network (Right) ────────────────────────────────────────────────────
function renderTermVis(nodes, edges) {
  if (!nodes || nodes.length === 0) {
    document.getElementById('termVisPlaceholder').textContent = '无节点可渲染';
    return;
  }

  // Prepare vis data
  var visNodes = new vis.DataSet(nodes.map(function(n) {
    var nc = ROOT_COLORS[n.group] || { bg: '#7f8c8d', border: '#5d6d7e' };
    return {
      id: n.id,
      label: n.label,
      title: n.title || '',
      shape: ADMIN_SHAPES[n.nodeType] || 'ellipse',
      size: n.size || 20,
      color: { background: nc.bg, border: nc.border },
      font: { color: n.font && n.font.color ? n.font.color : '#fff', size: (n.font && n.font.size) || 12 },
      borderWidth: 2,
      group: n.group,
    };
  }));
  var visEdges = new vis.DataSet(edges.map(function(e) {
    return {
      from: e.from, to: e.to, label: e.label,
      color: { color: '#7f8c8d', highlight: '#333', opacity: 0.7 },
      font: { size: 10, color: '#555', strokeWidth: 2, strokeColor: '#fff' },
      width: 1.5, smooth: { type: 'continuous' },
      arrows: { to: { enabled: true, scaleFactor: 0.6 } },
    };
  }));

  var container = document.getElementById('termVisContainer');
  container.innerHTML = '';  // clear any previous
  document.getElementById('termVisPlaceholder').style.display = 'none';

  var data = { nodes: visNodes, edges: visEdges };
  var options = {
    physics: {
      enabled: true, solver: 'forceAtlas2Based',
      forceAtlas2Based: { gravitationalConstant: -40, centralGravity: 0.005, springLength: 180, springConstant: 0.08, damping: 0.4 },
      stabilization: { iterations: 150, fit: true },
      minVelocity: 0.5,
    },
    interaction: { hover: true, tooltipDelay: 100, navigationButtons: true, keyboard: true, zoomView: true, dragView: true },
    edges: { smooth: { type: 'continuous' }, font: { size: 10, color: '#555' } },
    nodes: { font: { face: 'Microsoft YaHei, PingFang SC, sans-serif' }, borderWidth: 2, shadow: { enabled: true, size: 3 } },
    layout: { improvedLayout: false, randomSeed: 42 },
  };

  termVisNetwork = new vis.Network(container, data, options);
  termVisNetwork.on('stabilizationIterationsDone', function() {
    termVisNetwork.setOptions({ physics: { enabled: false } });
    termVisNetwork.fit({ animation: true });
  });
}

// ── Save ───────────────────────────────────────────────────────────────────
function doSave() {
  if (!termLastResult) return;
  var btn = document.getElementById('btnSave');
  btn.disabled = true;
  btn.textContent = '保存中...';

  fetch('/api/save', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      row_id: termLastResult.row_id,
      json_result: termLastResult.json_result,
      case_name: termLastResult.case_name,
      score: termLastResult.score,
      issues: termLastResult.issues,
    }),
  })
  .then(function(r) { return r.json(); })
  .then(function(result) {
    if (result.status === 'ok') {
      btn.textContent = '✅ 已保存';
      setTermStatus('保存成功 (' + result.row_id + ')', '#27ae60');
    } else {
      btn.textContent = '💾 保存';
      setTermStatus('保存失败', '#e74c3c');
    }
  })
  .catch(function(err) {
    btn.textContent = '💾 保存';
    setTermStatus('保存失败: ' + err.message, '#e74c3c');
  });
}
</script>
