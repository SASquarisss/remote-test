<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>塔罗占卜 Demo</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="starfield" aria-hidden="true"></div>
    <div id="app" class="app-shell">
        <header class="hero">
            <div class="hero-copy">
                <p class="eyebrow">Mystic Reading Demo</p>
                <h1>塔罗占卜</h1>
                <p class="subtitle">选择牌阵，探索内心的智慧</p>
            </div>
            <div class="hero-actions">
                <span id="apiStatus" class="status-badge status-pending">正在连接占卜之门...</span>
                <button id="restartBtn" class="ghost-button" type="button">新的占卜</button>
            </div>
        </header>

        <main class="page-container">
            <section id="homePage" class="page active">
                <div class="panel intro-panel">
                    <h2>请输入您的占卜问题</h2>
                    <p class="panel-tip">详细的问题将帮助获得更精准的解读</p>
                    <label class="question-field">
                        <span class="sr-only">占卜问题</span>
                        <textarea id="questionInput" maxlength="120" placeholder="例如：我应该如何处理当前的工作困境？我的感情发展会如何？"></textarea>
                    </label>
                    <div class="field-meta">
                        <span id="questionHint">建议聚焦一个核心问题，字数 6-120 字。</span>
                        <span id="questionCount">0 / 120</span>
                    </div>
                </div>

                <section class="spread-section">
                    <div class="section-heading">
                        <h2>选择牌阵</h2>
                        <p>点击任意牌阵，即可带着你的问题进入抽牌流程。</p>
                    </div>
                    <div id="spreadList" class="spread-grid"></div>
                </section>
            </section>

            <section id="drawPage" class="page">
                <div class="section-heading draw-heading">
                    <div>
                        <h2>抽取卡牌</h2>
                        <p id="drawSubtitle">点击下方任意卡牌，命运将揭示下一张答案。</p>
                    </div>
                    <button id="backHomeBtn" class="ghost-button" type="button">返回首页</button>
                </div>

                <div class="session-summary">
                    <div class="summary-card">
                        <span class="summary-label">你的问题</span>
                        <p id="drawQuestion"></p>
                    </div>
                    <div class="summary-card compact">
                        <span class="summary-label">当前牌阵</span>
                        <p id="drawSpreadName"></p>
                    </div>
                    <div class="summary-card compact">
                        <span class="summary-label">剩余卡牌</span>
                        <p id="remainingCount">0</p>
                    </div>
                </div>

                <div id="positionList" class="position-grid"></div>

                <div class="deck-panel panel">
                    <div class="deck-header">
                        <div>
                            <h3>命运牌堆</h3>
                            <p>每点击一张牌背，系统会为当前牌位随机抽出一张塔罗牌。</p>
                        </div>
                        <button id="generateReadingBtn" class="primary-button" type="button" disabled>开始解读</button>
                    </div>
                    <div id="deckGrid" class="deck-grid"></div>
                </div>
            </section>

            <section id="resultPage" class="page">
                <div class="section-heading result-heading">
                    <div>
                        <h2>塔罗解读</h2>
                        <p>卡牌的智慧指引</p>
                    </div>
                    <button id="resultRestartBtn" class="primary-button" type="button">新的占卜</button>
                </div>

                <div class="question-echo panel">
                    <span class="summary-label">你的问题</span>
                    <p id="resultQuestion"></p>
                </div>

                <div class="reading-opening panel">
                    <h3 id="readingTitle"></h3>
                    <p id="openingMessage"></p>
                </div>

                <div id="readingCards" class="reading-card-grid"></div>

                <div class="analysis-grid">
                    <article class="analysis-panel panel">
                        <h3>综合分析</h3>
                        <p id="overallAnalysis"></p>
                    </article>
                    <article class="analysis-panel panel">
                        <h3>能量流动</h3>
                        <p id="energyFlow"></p>
                    </article>
                    <article class="analysis-panel panel">
                        <h3>冲突与和谐</h3>
                        <p id="conflictHarmony"></p>
                    </article>
                    <article class="analysis-panel panel">
                        <h3>时机提示</h3>
                        <p id="timingHint"></p>
                    </article>
                </div>

                <div class="advice-stack">
                    <article class="advice-panel panel">
                        <h3>行动建议</h3>
                        <p id="actionAdvice"></p>
                    </article>
                    <article class="advice-panel panel">
                        <h3>长期建议</h3>
                        <p id="longTermAdvice"></p>
                    </article>
                </div>
            </section>
        </main>
    </div>

    <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
    <div id="loadingMask" class="loading-mask hidden">
        <div class="loading-card">
            <div class="spinner"></div>
            <p id="loadingText">群星正在为你排列答案...</p>
        </div>
    </div>

    <script type="module" src="/static/app.js"></script>
</body>
</html>
