# 生产级法律本体 v2.0
# 支撑类案预判、判决推理、增量知识图谱
# 变更：新增 CaseSummary/SentencingStandard/LegalProvisionVersion，扩展 GuidingCase/CourtCase/Organization

types:
  # ==================== 顶层父类 ====================
  LegalNorm:
    required: [id, name, source, desensitize, create_time, update_time]
    description: "法律规范顶层类"

  JudicialEntity:
    required: [id, name, source, desensitize, create_time, update_time]
    description: "司法实体顶层类"

  LegalSubject:
    required: [id, name, source, desensitize, create_time, update_time]
    description: "法律主体顶层类"

  # ==================== 规范层 ====================
  Law:
    is_a: LegalNorm
    required: [name, law_level, document_number, status, enactment_date, effective_date]
    optional: [legislative_purpose, repealed_date]
    law_level_enum: [constitution, basic_law, ordinary_law, administrative_regulation, local_regulation, self_governing_regulation, military_regulation, judicial_interpretation, department_rule, normative_document]
    status_enum: [effective, amended, repealed]
    description: "法律"

  LegalProvision:
    is_a: LegalNorm
    required: [article]
    optional: [law_id, paragraph, item, content, status, legislative_purpose, related_provisions, repealed_date, references]
    status_enum: [effective, amended, repealed]
    description: "法律条文（当前生效版本）"

  LegalProvisionVersion:
    is_a: LegalNorm
    optional: [provision_id, version_date, content, status, superseded_by_version_id, amendment_reason]
    status_enum: [effective, amended, repealed]
    description: "法律条文历史版本"

  CaseType:
    is_a: LegalNorm
    required: [code, category, level1, level2]
    optional: [description, typical_provision_ids]
    category_enum: [civil, criminal, administrative, ip, execution, state_compensation]
    description: "案由类型"

  GuidingCase:
    is_a: LegalNorm
    required: [guiding_case_number, issuing_court_id, publication_date, guiding_points, binding_force]
    optional: [guiding_points_vector, related_case_type_ids]
    binding_force_enum: [mandatory, persuasive, reference]
    description: "指导性案例"

  SentencingStandard:
    is_a: LegalNorm
    required: [case_type_id, applicable_provision_id, standard_type, sentence_range_min, sentence_range_max, sentence_unit]
    optional: [circumstance_levels, measurement_formula, region_id, valid_from, valid_to]
    standard_type_enum: [criminal_sentence, civil_compensation, administrative_penalty]
    sentence_unit_enum: [month, year, yuan, percent]
    description: "量刑/赔偿标准"
    
    constraints:
      - "sentence_range_min <= sentence_range_max"

  # ==================== 案由法条映射层关系 ====================
  typically_applies:
    from: CaseType
    to: LegalProvision
    cardinality: many_to_many
    attributes: [applicability_score, is_primary, effective_from, effective_to, source]
    description: "案由典型适用的法律条文（用于法条补提和类案推荐）"

  # ==================== 主体层 ====================
  Person:
    description: "自然人（跨案件不消歧，每个案件独立节点）"

  Judge:
    is_a: Person
    required: [court_id, position]
    optional: [judge_level, appointment_date]
    description: "法官"

  Attorney:
    is_a: Person
    required: [license_number, law_firm_id]
    optional: [specialization, bar_association]
    description: "律师"

  Clerk:
    is_a: Person
    required: [court_id]
    optional: [position]
    description: "书记员"

  Prosecutor:
    is_a: Person
    required: [procuratorate_id, position]
    description: "检察官"

  Organization:
    is_a: LegalSubject
    required: [org_type]
    optional: [credit_code, legal_representative, registered_capital, business_scope, legal_name_alias]
    org_type_enum: [company, government_agency, ngo, law_firm, expert_institution, court, procuratorate, individual_business, partnership, sole_proprietorship]
    description: "组织机构（企业用credit_code跨案件全局关联，包含法人实体、个体工商户、合伙企业、个人独资企业）"

  Court:
    is_a: Organization
    required: [court_level, district_id]
    optional: [chambers, jurisdiction_area]
    court_level_enum: [supreme, high, intermediate, basic, special]
    description: "法院"

  Procuratorate:
    is_a: Organization
    required: [procuratorate_level, district_id]
    optional: [departments]
    procuratorate_level_enum: [supreme, provincial, municipal, district]
    description: "检察院"

  LawFirm:
    is_a: Organization
    required: [firm_type, license_number]
    optional: [partners, practice_areas]
    firm_type_enum: [partnership, limited_liability, sole_practitioner]
    description: "律师事务所"

  ExpertInstitution:
    is_a: Organization
    required: [expertise_fields, accreditation_number]
    optional: [accreditation_authority, validity_period]
    description: "鉴定机构"

  District:
    is_a: JudicialEntity
    required: [name, code]
    optional: [administrative_level, parent_district_id]
    description: "辖区"

  LegalRole:
    is_a: JudicialEntity
    required: [name, code]
    optional: [description, permissions]
    role_enum: [plaintiff, defendant, third_party, witness, agent, expert_witness, interpreter, prosecutor, applicant, respondent, relator, appellant, appellee, retrial_applicant, retrial_respondent, mediator, arbitrator, beneficiary, victim, criminal_defendant, enforcement_applicant, enforcement_respondent, judicial_review_applicant, insolvency_debtor, surety, class_representative, insurer]
    description: "法律角色（2026.05.v2.2新增insurer——保险人角色，用于标注保险公司在案件中的身份）"

  # ==================== 裁判尺度与量刑层 ====================
  SentencingCircumstance:
    is_a: JudicialEntity
    required: [case_id, circumstance_type, content]
    optional: [subject_id, subject_name]
    circumstance_type_enum: [statutory_mitigating, statutory_aggravating, discretionary_mitigating, discretionary_aggravating]
    description: "量刑情节/酌定情节（法定从宽、法定从严、酌定从宽、酌定从严）"

  LegalInterpretation:
    is_a: JudicialEntity
    required: [case_id, content]
    optional: [provision_element_id]
    description: "法庭对特定法条元素或法律概念的司法适用解释"

  # ==================== 证据网络扩展 ====================
  EvidenceChain:
    is_a: JudicialEntity
    required: [case_id, name]
    optional: [description, proved_fact_ids]
    description: "证据链（多个相互印证的证据聚合体）"

  # ==================== 案件层 ====================
  CourtCase:
    is_a: JudicialEntity
    required: [case_type_id, filing_date, court_id, status, trial_level]
    optional: [case_number, claim_amount, cause_of_action, summary, related_cases, first_instance_case_number, source_text_hash, source_text_path, dispute_resolution_type, party_count]
    trial_level_enum: [first_instance, second_instance, retrial]
    status_enum: [filing, trial, judged, effective, appealed, retried, executing, terminated]
    dispute_resolution_type_enum: [litigation, mediation, arbitration, judicial_aid, administrative_review]
    description: "法院案件（精简节点，全文存ES。v2.2新增party_count——群体性案件当事人人数，dispute_resolution_type强制标注）"

  CaseSummary:
    is_a: JudicialEntity
    required: [case_id]
    optional: [key_facts, disputed_issues, conclusion, fact_vector, issue_tags, amount_involved, sentencing_referral_id, claim_amount, judgment_amount]
    description: "案件结构化摘要（用于热层类案相似度计算。v2.2新增claim_amount/judgment_amount——诉请金额/判决金额区分）"

  TrialOrganization:
    is_a: JudicialEntity
    required: [organization_type, case_id]
    optional: [judge_ids, presiding_judge_id, clerk_id]
    organization_type_enum: [sole_judge, collegiate_bench, judicial_committee]
    description: "审判组织"

  JudgmentResult:
    is_a: JudicialEntity
    required: [case_id, result_type]
    optional: [judgment_date, effective_date, sentence_term, compensation_amount, reasoning, sentencing_standard_id, cost_allocation]
    result_type_enum: [guilty, not_guilty, liable, not_liable, dismissed, withdrawn, partially_upheld, remanded, punitive_damages, procedural_ruling, bankruptcy_declared, mediation_agreement, arbitration_award, administrative_decision]
    description: "裁判结果（v2.2新增cost_allocation——诉讼费/案件受理费分担信息）"

  ExecutionInfo:
    is_a: JudicialEntity
    optional: [case_id, execution_status, execution_court_id, execution_amount, execution_measures, completion_date]
    execution_status_enum: [pending, in_progress, completed, terminated]
    description: "执行信息"

  LegalDocument:
    is_a: JudicialEntity
    optional: [document_type, case_id, creation_date, signed_by_judge_id, issuing_court_id, document_number, content_hash, file_path, content]
    document_type_enum: [judgment, ruling, mediation, order, notice, indictment, petition]
    description: "法律文书"

  Evidence:
    is_a: JudicialEntity
    optional: [evidence_type, case_id, submitter_id, submission_date, examination_status, admission_status, description, file_path, chain_of_custody, expert_institution, expert_conclusion]
    evidence_type_enum: [documentary, physical, audio_visual, electronic_data, witness_testimony, party_statement, expert_opinion, inspection_record]
    examination_status_enum: [not_examined, examined]
    admission_status_enum: [admitted, not_admitted]
    probative_force_enum: [valid, invalid]
    description: "证据（v2.2新增expert_institution/expert_conclusion——鉴定机构名称和鉴定结论摘要）"

  DisputeFocus:
    is_a: JudicialEntity
    optional: [case_id, content, focus_category_id, canonical_template_id, resolved_by_provision_ids, resolution_logic]
    description: "案件争议焦点（v2.1新增：resolved_by_provision_ids关联法律条文，resolution_logic法院解决逻辑）"

  LegalProvisionElement:
    required: [provision_id, element_type]
    optional: [content, applicable_fact_pattern]
    element_type_enum: [subject_element, object_element, act_element, result_element, causality_element, subjective_element, legal_consequence, exception_clause]
    description: "法条构成要件要素（主体/行为/结果/因果关系/主观要件等结构化分解，用于事实→法条匹配推理）"

  Fact:
    is_a: JudicialEntity
    optional: [case_id, content, fact_type, proven_by_evidence_ids]
    fact_type_enum: [undisputed, disputed, to_be_proven]
    description: "案件事实"

  LitigationClaim:
    is_a: JudicialEntity
    required: [case_id, claim_text]
    optional: [case_number, subject_id, subject_name, role_code, claim_type, requested_outcome, amount, target_subject_id, target_subject_name, legal_basis_summary]
    claim_type_enum: [appeal_claim, defense_claim, prosecution_claim, civil_claim, counterclaim, procedural_request, sentencing_request, compensation_request, other]
    description: "各方明确提出的诉求/请求（如上诉请求、辩护请求、赔偿请求、程序性申请）"

  ProceduralOpinion:
    is_a: JudicialEntity
    required: [case_id, content]
    optional: [case_number, subject_id, subject_name, role_code, opinion_type, stance, related_claim_ids]
    opinion_type_enum: [appeal_opinion, defense_opinion, agent_opinion, prosecution_opinion, objection_opinion, procedural_opinion, other]
    stance_enum: [support, oppose, partial_support, neutral, unknown]
    description: "围绕诉求提出的意见表达（如上诉意见、辩护意见、代理意见、答辩意见）"

  ArgumentPoint:
    is_a: JudicialEntity
    required: [case_id, argument_text]
    optional: [case_number, subject_id, subject_name, role_code, argument_basis_type, supports_claim_id, supports_opinion_id, related_fact_ids, related_provision_ids]
    argument_basis_type_enum: [fact_based, evidence_based, legal_based, procedural_based, policy_based, sentencing_based, mixed, other]
    description: "支撑诉求/意见的理由点（事实理由、证据理由、法律理由、程序理由等）"

  JudicialAssessment:
    is_a: JudicialEntity
    required: [case_id, assessment_text]
    optional: [case_number, issue_type, assessment_outcome, responds_to_claim_ids, responds_to_opinion_ids, responds_to_argument_ids, based_on_fact_ids, based_on_provision_ids, supports_judgment_result_ids]
    issue_type_enum: [claim, opinion, argument, fact, evidence, provision, sentencing, procedure, mixed]
    assessment_outcome_enum: [adopted, rejected, partially_adopted, not_addressed, unclear]
    description: "法院对诉求、意见、理由的回应与综合评判"

  CaseParticipant:
    is_a: JudicialEntity
    required: [case_id, role_code]
    optional: [subject_id, trial_level, is_primary, role_name]
    role_code_enum: [plaintiff, defendant, third_party, witness, agent, expert_witness, interpreter, prosecutor, applicant, respondent, relator, appellant, appellee, retrial_applicant, retrial_respondent, mediator, arbitrator, beneficiary, victim, criminal_defendant, enforcement_applicant, enforcement_respondent, judicial_review_applicant, insolvency_debtor, surety, class_representative]
    description: "案件参与人（含审级角色变更）"

relations:
  # 规范层关系
  belongs_to:
    from: LegalProvision
    to: Law
    cardinality: many_to_one
    description: "法律条文归属法律"

  has_version:
    from: LegalProvision
    to: LegalProvisionVersion
    cardinality: one_to_many
    description: "法条具有历史版本"

  superseded_by:
    from: LegalProvisionVersion
    to: LegalProvisionVersion
    cardinality: one_to_one
    description: "旧版本被新版本替代"

  guides_case_type:
    from: GuidingCase
    to: CaseType
    cardinality: one_to_many
    description: "指导性案例指导案由适用"

  cites_guiding_case:
    from: CourtCase
    to: GuidingCase
    cardinality: many_to_many
    optional_attributes: [citation_purpose, similarity_score]
    description: "案件引用指导性案例"

  applies_standard:
    from: CourtCase
    to: SentencingStandard
    cardinality: many_to_many
    description: "案件适用量刑/赔偿标准"

  # 案件层关系
  has_summary:
    from: CourtCase
    to: CaseSummary
    cardinality: one_to_one
    description: "案件具有结构化摘要"

  tried_by:
    from: CourtCase
    to: TrialOrganization
    cardinality: one_to_one
    description: "案件由审判组织审理"

  undertakes:
    from: Judge
    to: CourtCase
    cardinality: one_to_many
    description: "法官承办案件"

  plays_role:
    from: LegalSubject
    to: LegalRole
    cardinality: many_to_many
    attributes: [case_id, start_time, end_time, role_description]
    description: "主体在案件中担任角色"

  has_jurisdiction_over:
    from: Court
    to: District
    cardinality: one_to_one
    description: "法院管辖辖区"

  prosecutes:
    from: Procuratorate
    to: CourtCase
    cardinality: one_to_many
    description: "检察院公诉案件"

  based_on:
    from: ExecutionInfo
    to: JudgmentResult
    cardinality: one_to_one
    description: "执行依据裁判结果"

  signed_by:
    from: LegalDocument
    to: Judge
    cardinality: many_to_one
    description: "文书由法官签署"

  has_case_type:
    from: CourtCase
    to: CaseType
    cardinality: one_to_many
    description: "案件具有案由类型"

  cites:
    from: CourtCase
    to: LegalProvision
    cardinality: many_to_many
    attributes: [citation_position, citation_purpose, context]
    description: "案件引用法律条文"

  judgment_cites:
    from: JudgmentResult
    to: LegalProvision
    cardinality: many_to_many
    description: "裁判结果依据法律条文"

  represents:
    from: Attorney
    to: LegalSubject
    cardinality: many_to_many
    attributes: [case_id, authorization_scope, authorization_period_start, authorization_period_end]
    description: "律师代理当事人"

  employs:
    from: Procuratorate
    to: Prosecutor
    cardinality: one_to_many
    description: "检察院雇佣检察官"

  employs_attorney:
    from: LawFirm
    to: Attorney
    cardinality: one_to_many
    description: "律所雇佣律师"

  submitted_for:
    from: Evidence
    to: CourtCase
    cardinality: many_to_one
    description: "证据提交给案件"

  proves_fact:
    from: Evidence
    to: [Fact, DisputeFocus]
    cardinality: many_to_many
    description: "证据证明案件事实/争议焦点"

  includes:
    from: TrialOrganization
    to: Judge
    cardinality: one_to_many
    attributes: [is_presiding]
    description: "审判组织包含法官（is_presiding=true 表示审判长）"

  includes_clerk:
    from: TrialOrganization
    to: Clerk
    cardinality: one_to_one
    description: "审判组织配备书记员"

  appeals_to:
    from: CourtCase
    to: CourtCase
    cardinality: one_to_one
    acyclic: true
    description: "二审案件上诉一审案件"

  retries_from:
    from: CourtCase
    to: CourtCase
    cardinality: one_to_one
    acyclic: true
    description: "再审案件源自原审案件"

  has_dispute_focus:
    from: CourtCase
    to: DisputeFocus
    cardinality: one_to_many
    description: "案件具有争议焦点"

  has_fact:
    from: CourtCase
    to: Fact
    cardinality: one_to_many
    description: "案件具有事实"

  participates_in_case:
    from: LegalSubject
    to: CourtCase
    cardinality: many_to_many
    description: "主体作为案件参与方进入特定案件上下文"

  relates_to_fact:
    from: LegalSubject
    to: Fact
    cardinality: many_to_many
    description: "主体参与、经历或关联某一案件事实"

  raises_claim:
    from: LegalSubject
    to: LitigationClaim
    cardinality: many_to_many
    description: "主体提出某项诉求/请求"

  expresses_opinion:
    from: LegalSubject
    to: ProceduralOpinion
    cardinality: many_to_many
    description: "主体发表某项意见（上诉意见、辩护意见、代理意见等）"

  supports_claim:
    from: ArgumentPoint
    to: LitigationClaim
    cardinality: many_to_many
    description: "理由点支撑某项诉求/请求"

  supports_opinion:
    from: ArgumentPoint
    to: ProceduralOpinion
    cardinality: many_to_many
    description: "理由点支撑某项意见表达"

  targets_subject:
    from: LitigationClaim
    to: LegalSubject
    cardinality: many_to_many
    description: "诉求直接针对的主体对象"

  claims_focus:
    from: LitigationClaim
    to: DisputeFocus
    cardinality: many_to_many
    description: "诉求对应某一争议焦点"

  opines_on_focus:
    from: ProceduralOpinion
    to: DisputeFocus
    cardinality: many_to_many
    description: "意见围绕某一争议焦点展开"

  assesses_focus:
    from: JudicialAssessment
    to: DisputeFocus
    cardinality: many_to_many
    description: "法院评判直接回应某一争议焦点"

  responds_to_claim:
    from: JudicialAssessment
    to: LitigationClaim
    cardinality: many_to_many
    description: "法院评判回应某项诉求/请求"

  responds_to_opinion:
    from: JudicialAssessment
    to: ProceduralOpinion
    cardinality: many_to_many
    description: "法院评判回应某项意见"

  evaluates_argument:
    from: JudicialAssessment
    to: ArgumentPoint
    cardinality: many_to_many
    description: "法院评判评价某个理由点"

  based_on_fact:
    from: [LitigationClaim, ProceduralOpinion, ArgumentPoint, JudicialAssessment]
    to: Fact
    cardinality: many_to_many
    description: "诉求/意见/理由/评判以案件事实为基础"

  based_on_provision:
    from: [LitigationClaim, ArgumentPoint, JudicialAssessment]
    to: LegalProvision
    cardinality: many_to_many
    description: "诉求/理由/法院评判援引或依托法律条文"

  supports_result:
    from: JudicialAssessment
    to: JudgmentResult
    cardinality: many_to_many
    description: "法院评判支撑最终裁判结果"

  concerns_focus:
    from: LegalSubject
    to: DisputeFocus
    cardinality: many_to_many
    description: "主体与某一争议焦点存在直接对应、主张或被评价关系"

  receives_judgment:
    from: LegalSubject
    to: JudgmentResult
    cardinality: many_to_many
    description: "主体对应某一裁判结果、处理结果或责任结果"

  matches_element:
    from: Fact
    to: LegalProvisionElement
    cardinality: many_to_many
    attributes: [match_score, match_reasoning]
    description: "案件事实匹配法条构成要件要素（三段论推理的小前提→大前提匹配）"

  resolved_by:
    from: DisputeFocus
    to: LegalProvision
    cardinality: many_to_many
    description: "争议焦点由法律条文解决（争议焦点→法条映射）"

  leads_to:
    from: [Fact, DisputeFocus]
    to: JudgmentResult
    cardinality: many_to_many
    description: "事实/争议焦点推导出裁判结果（三段论推理的结论链路）"

  # ==================== 证据网络层关系扩展 ====================
  corroborates:
    from: Evidence
    to: Evidence
    cardinality: many_to_many
    description: "证据之间相互印证"

  contradicts:
    from: Evidence
    to: Evidence
    cardinality: many_to_many
    description: "证据之间相互矛盾"

  forms_chain:
    from: Evidence
    to: EvidenceChain
    cardinality: many_to_many
    description: "证据构成证据链"

  # ==================== 裁判尺度与解释层关系扩展 ====================
  mitigates:
    from: SentencingCircumstance
    to: JudgmentResult
    cardinality: many_to_many
    description: "量刑情节从轻/减轻处罚"

  aggravates:
    from: SentencingCircumstance
    to: JudgmentResult
    cardinality: many_to_many
    description: "量刑情节从重处罚"

  interprets:
    from: JudicialAssessment
    to: [LegalProvisionElement, LegalInterpretation]
    cardinality: many_to_many
    description: "法庭评判对法条元素进行法律解释"

constraints:
  # 1. 官方案号正则
  - type: CourtCase
    rule: "case_number =~ /^\\(\\d{4}\\)[\\u4e00-\\u9fa5]{1,5}\\d+([民刑行执])\\d+第\\d+号$/"
    enforcement: block
    description: "民/刑/行/执案号统一校验"

  # 2. 统一社会信用代码（企业跨案件关联核心键）
  - type: Organization
    rule: "credit_code =~ /^[0-9A-HJ-NPQRTUWXY]{2}\\d{6}[0-9A-HJ-NPQRTUWXY]{10}$/"
    enforcement: block
    description: "统一社会信用代码18位校验"

  # 3. 时序约束
  - type: CourtCase
    rule: "filing_date < judgment_date AND judgment_date < effective_date"
    enforcement: block
    description: "立案<裁判<生效"

  # 4. 二审约束
  - type: CourtCase
    rule: "trial_level == 'second_instance' IMPLIES first_instance_case_number IS NOT NULL"
    enforcement: block
    description: "二审必须有一审案号"

  # 5. 证据约束
  - type: Evidence
    rule: "admission_status == 'admitted' IMPLIES examination_status == 'examined'"
    enforcement: block
    description: "证据未经质证不得采信"

  # 6. 脱敏约束
  - global: true
    rule: "desensitized_id_number =~ /^\\d{6}\\*{8}\\d{4}$/; phone =~ /^\\d{3}\\*{4}\\d{4}$/"
    enforcement: block
    description: "个保法分级脱敏"

  # 7. 法条有效性
  - type: CourtCase
    rule: "ALL x IN cites WHERE x.status == 'effective'"
    enforcement: soft
    description: "仅引用有效法条（软约束：允许历史案件引用当时有效现已废止的法条）"

  # 8. 最高院管辖约束
  - type: CourtCase
    rule: "Court.id == court_id AND Court.court_level == 'supreme' AND trial_level != 'first_instance' IMPLIES trial_level != 'second_instance'"
    enforcement: soft
    description: "最高院判决不得上诉（最高院一审案件可上诉，二审/再审判决不可再次上诉）"

  # 9. 量刑标准区间约束
  - type: SentencingStandard
    rule: "sentence_range_min <= sentence_range_max"
    enforcement: block
    description: "量刑下限不得高于上限"

engineering:
  unique_identifier_pattern: "^[a-z]+_[0-9]{4}_[a-z_]+$"
  foreign_key_mapping:
    - law_id: Law.id
    - provision_id: LegalProvision.id
    - case_type_id: CaseType.id
    - court_id: Court.id
    - district_id: District.id
    - procuratorate_id: Procuratorate.id
    - law_firm_id: LawFirm.id
    - judge_id: Judge.id
    - attorney_id: Attorney.id
    - clerk_id: Clerk.id
    - prosecutor_id: Prosecutor.id
    - case_id: CourtCase.id
    - sentencing_standard_id: SentencingStandard.id
    - issuing_court_id: Court.id
    - execution_court_id: Court.id
    - superseded_by_version_id: LegalProvisionVersion.id
  entity_disambiguation:
    Court: "name + district.code"
    Person: "name + case_id（每个案件内独立）"
    Organization: "credit_code（全局唯一，跨案件关联）"
  data_version: "2026.06.v2.3"
  incremental_update: true
  graph_storage:
    node_prefix: "LEGAL_"
    relation_prefix: "REL_"
  index_enabled: true
  hot_layer_criteria: "filing_date >= 2023-01-01 OR case_type.category IN ['civil', 'criminal']"
