constraints:  # constraints（约束）
  # 1. 官方案号正则
  - type: CourtCase  # type（类型）
    rule: "case_number =~ /^\\(\\d{4}\\)[\\u4e00-\\u9fa5]{1,5}\\d+([民刑行执])\\d+第\\d+号$/"  # rule（规则）; case_number（案号）
    enforcement: block  # enforcement（强制程度）; block（强制阻止）
    description: "民/刑/行/执案号统一校验"  # description（描述）

  # 2. 统一社会信用代码（企业跨案件关联核心键）
  - type: Organization  # type（类型）
    rule: "credit_code =~ /^[0-9A-HJ-NPQRTUWXY]{2}\\d{6}[0-9A-HJ-NPQRTUWXY]{10}$/"  # rule（规则）; credit_code（统一社会信用代码）
    enforcement: block  # enforcement（强制程度）; block（强制阻止）
    description: "统一社会信用代码18位校验"  # description（描述）

  # 3. 时序约束
  - type: CourtCase  # type（类型）
    rule: "filing_date < judgment_date AND judgment_date < effective_date"  # rule（规则）; filing_date（立案日期）; judgment_date（裁判日期）; effective_date（生效日期）
    enforcement: block  # enforcement（强制程度）; block（强制阻止）
    description: "立案<裁判<生效"  # description（描述）

  # 4. 二审约束
  - type: CourtCase  # type（类型）
    rule: "trial_level == 'second_instance' IMPLIES first_instance_case_number IS NOT NULL"  # rule（规则）; trial_level（审级）; second_instance（二审）; first_instance_case_number（一审案号）
    enforcement: block  # enforcement（强制程度）; block（强制阻止）
    description: "二审必须有一审案号"  # description（描述）

  # 5. 证据约束
  - type: Evidence  # type（类型）
    rule: "admission_status == 'admitted' IMPLIES examination_status == 'examined'"  # rule（规则）; admission_status（采信状态）; admitted（已采信）; examination_status（质证状态）; examined（已质证）
    enforcement: block  # enforcement（强制程度）; block（强制阻止）
    description: "证据未经质证不得采信"  # description（描述）

  # 6. 脱敏约束
  - global: true  # global（全局）
    rule: "desensitized_id_number =~ /^\\d{6}\\*{8}\\d{4}$/; phone =~ /^\\d{3}\\*{4}\\d{4}$/"  # rule（规则）
    enforcement: block  # enforcement（强制程度）; block（强制阻止）
    description: "个保法分级脱敏"  # description（描述）

  # 7. 法条有效性
  - type: CourtCase  # type（类型）
    rule: "ALL x IN cites WHERE x.status == 'effective'"  # rule（规则）; cites（引用）; status（状态）; effective（有效/生效）
    enforcement: soft  # enforcement（强制程度）; soft（软约束（警告））
    description: "仅引用有效法条（软约束：允许历史案件引用当时有效现已废止的法条）"  # description（描述）

  # 8. 最高院管辖约束
  - type: CourtCase  # type（类型）
    rule: "Court.id == court_id AND Court.court_level == 'supreme' AND trial_level != 'first_instance' IMPLIES trial_level != 'second_instance'"  # rule（规则）; id（唯一标识）; court_id（法院标识）; court_level（法院级别）; supreme（最高）; trial_level（审级）; first_instance（一审）; second_instance（二审）
    enforcement: soft  # enforcement（强制程度）; soft（软约束（警告））
    description: "最高院判决不得上诉（最高院一审案件可上诉，二审/再审判决不可再次上诉）"  # description（描述）

  # 9. 量刑标准区间约束
  - type: SentencingStandard  # type（类型）
    rule: "sentence_range_min <= sentence_range_max"  # rule（规则）; sentence_range_min（量刑下限）; sentence_range_max（量刑上限）
    enforcement: block  # enforcement（强制程度）; block（强制阻止）
    description: "量刑下限不得高于上限"  # description（描述）

engineering:  # engineering（工程配置）
  unique_identifier_pattern: "^[a-z]+_[0-9]{4}_[a-z_]+$"  # unique_identifier_pattern（唯一标识模式）
  foreign_key_mapping:  # foreign_key_mapping（外键映射）
    - law_id: Law.id  # id（唯一标识）
    - provision_id: LegalProvision.id  # provision_id（条文标识）; id（唯一标识）
    - case_type_id: CaseType.id  # case_type_id（案由标识）; id（唯一标识）
    - court_id: Court.id  # court_id（法院标识）; id（唯一标识）
    - district_id: District.id  # district_id（辖区标识）; id（唯一标识）
    - procuratorate_id: Procuratorate.id  # procuratorate_id（检察院标识）; id（唯一标识）
    - law_firm_id: LawFirm.id  # law_firm_id（律所标识）; id（唯一标识）
    - judge_id: Judge.id  # id（唯一标识）
    - attorney_id: Attorney.id  # id（唯一标识）
    - clerk_id: Clerk.id  # clerk_id（书记员标识）; id（唯一标识）
    - prosecutor_id: Prosecutor.id  # id（唯一标识）
    - case_id: CourtCase.id  # id（唯一标识）
    - sentencing_standard_id: SentencingStandard.id  # sentencing_standard_id（量刑标准标识）; id（唯一标识）
    - issuing_court_id: Court.id  # issuing_court_id（发布法院标识）; id（唯一标识）
    - execution_court_id: Court.id  # execution_court_id（执行法院标识）; id（唯一标识）
    - superseded_by_version_id: LegalProvisionVersion.id  # superseded_by_version_id（被替代版本标识）; id（唯一标识）
  entity_disambiguation:  # entity_disambiguation（实体消歧）
    Court: "name + district.code"  # name（名称）; district（区级）; code（编码）
    Person: "name + case_id（每个案件内独立）"  # name（名称）
    Organization: "credit_code（全局唯一，跨案件关联）"  # credit_code（统一社会信用代码）
  data_version: "2026.05.v2.2"  # data_version（数据版本）
  incremental_update: true  # incremental_update（增量更新）
  graph_storage:  # graph_storage（图存储）
    node_prefix: "LEGAL_"  # node_prefix（节点前缀）
    relation_prefix: "REL_"  # relation_prefix（关系前缀）
  index_enabled: true  # index_enabled（启用索引）
  hot_layer_criteria: "filing_date >= 2023-01-01 OR case_type.category IN ['civil', 'criminal']"  # hot_layer_criteria（热层条件）; filing_date（立案日期）; category（大类）; civil（民事）; criminal（刑事）
