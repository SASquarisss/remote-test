# 生产级法律本体 - 工业标准实现（修复版）
# 严格按照司法实务和本体工程原则重构，已修复所有致命/严重缺陷

types:
  # 🔴 修正：顶层属性统一、无冲突、继承完整
  LegalNorm:
    required: [id, name, source, desensitize, create_time, update_time]
    description: "法律规范顶层类"
  
  JudicialEntity:
    required: [id, name, source, desensitize, create_time, update_time] # 补name，子类继承
    description: "司法实体顶层类"
  
  LegalSubject:
    required: [id, name, source, desensitize, create_time, update_time]
    description: "法律主体顶层类"

  # 🔴 规范层：显性 is-a 继承，仅保留专属属性
  Law:
    is_a: LegalNorm
    required: [title, law_level, document_number, status, enactment_date, effective_date]
    optional: [legislative_purpose, repealed_date]
    law_level_enum: [constitution, basic_law, ordinary_law, administrative_regulation, local_regulation, self_governing_regulation, military_regulation]
    status_enum: [effective, amended, repealed]
    description: "法律"
  
  LegalProvision:
    is_a: LegalNorm
    required: [law_id, article, paragraph, item, content, status]
    optional: [legislative_purpose, related_provisions, repealed_date]
    status_enum: [effective, amended, repealed]
    description: "法律条文"
  
  CaseType:
    is_a: LegalNorm
    required: [code, name, category, level1, level2]
    optional: [description]
    category_enum: [civil, criminal, administrative, ip, execution, state_compensation]
    description: "案件类型（对齐最高法《民事案件案由规定》）"
  
  # 🔴 新增：指导性案例，生产级必备
  GuidingCase:
    is_a: LegalNorm
    required: [guiding_case_number, issuing_court, publication_date, guiding_points]
    description: "最高法指导性案例"

  # 🔴 主体层：修正自然人/法人分类，删除冗余，补全核心实体
  Person:
    is_a: LegalSubject
    required: [name] # 仅自然人，删除legal_person，彻底修正分类
    optional: [gender, birth_date, nationality, id_number, address, phone]
    description: "自然人（唯一主体，法人归属Organization）"
  
  Judge:
    is_a: Person
    required: [court_id, position]
    optional: [judge_level, appointment_date]
    description: "法官（自然人子类）"
  
  Attorney:
    is_a: Person
    required: [license_number, law_firm_id]
    optional: [specialization, bar_association]
    description: "律师（自然人子类）"
  
  Clerk:
    is_a: Person
    required: [court_id]
    optional: [position]
    description: "书记员（自然人子类）"
  
  # 🔴 新增：检察官，司法核心
  Prosecutor:
    is_a: Person
    required: [procuratorate_id, position]
    description: "检察官"
  
  Organization:
    is_a: LegalSubject
    required: [org_type, credit_code]
    optional: [legal_representative, registered_capital, business_scope]
    org_type_enum: [company, government_agency, ngo] # 删除court等，子类独立继承
    description: "组织机构（法人/非法人组织）"
  
  Court:
    is_a: Organization
    required: [court_level, district]
    optional: [chambers, jurisdiction_area]
    court_level_enum: [supreme, high, intermediate, basic, special]
    description: "法院（机构子类）"
  
  Procuratorate:
    is_a: Organization
    required: [procuratorate_level, district]
    optional: [departments]
    procuratorate_level_enum: [supreme, provincial, municipal, district]
    description: "检察院（机构子类）"
  
  LawFirm:
    is_a: Organization
    required: [firm_type, license_number]
    optional: [partners, practice_areas]
    firm_type_enum: [partnership, limited_liability, sole_practitioner]
    description: "律师事务所（机构子类）"
  
  ExpertInstitution:
    is_a: Organization
    required: [expertise_fields, accreditation_number]
    optional: [accreditation_authority, validity_period]
    description: "鉴定机构（机构子类，修复命名错误）"
  
  District:
    is_a: JudicialEntity
    required: [name, code]
    optional: [administrative_level, parent_district]
    description: "辖区（新增实体）"
  
  LegalRole:
    is_a: JudicialEntity
    required: [name, code]
    optional: [description, permissions]
    role_enum: [plaintiff, defendant, third_party, witness, agent, expert_witness, interpreter, prosecutor, applicant, respondent, retailigator]
    description: "法律角色（新增实体，分离角色与主体）"

  # 🔴 案件层：补全法定属性，删除冗余
  CourtCase:
    is_a: JudicialEntity
    required: [case_number, case_type_id, filing_date, court_id, status, trial_level] # 补审级
    optional: [claim_amount, cause_of_action, summary, related_cases, first_instance_case_number] # 补一审案号
    trial_level_enum: [first_instance, second_instance, retrial] # 法定审级
    description: "法院案件"
  
  TrialOrganization:
    is_a: JudicialEntity
    required: [organization_type, case_id]
    optional: [members, presiding_judge_id]
    organization_type_enum: [sole_judge, collegiate_bench, judicial_committee]
    description: "审判组织"
  
  JudgmentResult:
    is_a: JudicialEntity
    required: [case_id, result_type, judgment_date, effective_date]
    optional: [sentence_term, compensation_amount, reasoning]
    result_type_enum: [guilty, not_guilty, liable, not_liable, dismissed, withdrawn]
    description: "裁判结果"
  
  ExecutionInfo:
    is_a: JudicialEntity
    required: [case_id, execution_status, execution_court_id]
    optional: [execution_amount, execution_measures, completion_date]
    execution_status_enum: [pending, in_progress, completed, terminated]
    description: "执行信息"
  
  LegalDocument:
    is_a: JudicialEntity
    required: [document_type, case_id, creation_date, signed_by_judge_id, issuing_court_id]
    optional: [document_number, content_hash, file_path, content]
    document_type_enum: [judgment, ruling, mediation, order, notice]
    description: "法律文书"
  
  Evidence:
    is_a: JudicialEntity
    required: [evidence_type, case_id, submitter_id, submission_date, examination_status, admission_status] # 补质证/采信
    optional: [description, file_path, chain_of_custody]
    evidence_type_enum: [document, physical, digital, testimony, expert_opinion]
    examination_status_enum: [not_examined, examined]
    admission_status_enum: [admitted, not_admitted]
    probative_force_enum: [valid, invalid]
    description: "证据"
  
  # 🔴 新增：争议焦点、案件事实
  DisputeFocus:
    is_a: JudicialEntity
    required: [case_id, content]
    description: "案件争议焦点"
  
  Fact:
    is_a: JudicialEntity
    required: [case_id, content]
    description: "案件事实"

relations:
  # 🔴 修正：基数错误
  tried_by:
    from: CourtCase
    to: TrialOrganization
    cardinality: one_to_one
    description: "案件由审判组织审理（修正语义）"
  
  presides_over:
    from: Judge
    to: TrialOrganization
    cardinality: one_to_one # 修正：1审判组织1审判长
    description: "法官主持审判组织"
  
  undertakes:
    from: Judge
    to: CourtCase
    cardinality: one_to_many
    description: "法官承办案件（修正语义）"
  
  # 🔴 主体-角色关系（核心修复）
  plays_role:
    from: LegalSubject
    to: LegalRole
    cardinality: many_to_many
    attributes: [case_id, start_time, end_time, role_description]
    description: "主体在案件中担任角色（新增关系属性）"
  
  # 🔴 管辖关系
  has_jurisdiction_over:
    from: Court
    to: District
    cardinality: one_to_one
    description: "法院管辖辖区（修正方向）"
  
  # 🔴 公诉关系
  prosecutes:
    from: Procuratorate
    to: CourtCase
    cardinality: one_to_many
    description: "检察院公诉案件（新增核心关系）"
  
  # 🔴 执行关系
  based_on:
    from: ExecutionInfo
    to: JudgmentResult
    cardinality: one_to_one
    description: "执行依据裁判结果（新增核心关系）"
  
  # 🔴 文书签署关系
  signed_by:
    from: LegalDocument
    to: Judge
    cardinality: many_to_one
    description: "文书由法官签署（新增核心关系）"
  
  # 🔴 案由关系
  has_case_type:
    from: CourtCase
    to: CaseType
    cardinality: one_to_many
    description: "案件具有案由类型"
  
  # 🔴 法律适用关系
  cites:
    from: CourtCase
    to: LegalProvision
    cardinality: many_to_many
    attributes: [citation_position, citation_purpose, context]
    description: "案件引用法律条文（新增关系属性）"
  
  # 🔴 代理关系
  represents:
    from: Attorney
    to: LegalSubject
    cardinality: many_to_many
    attributes: [case_id, authorization_scope, authorization_period_start, authorization_period_end]
    description: "律师代理当事人（新增关系属性）"
  
  # 🔴 证据关系
  submitted_for:
    from: Evidence
    to: CourtCase
    cardinality: many_to_one
    description: "证据提交给案件"
  
  proves_fact:
    from: Evidence
    to: [Fact, DisputeFocus] # 精准指向，而非泛化JudicialEntity
    cardinality: many_to_many
    description: "证据证明案件事实/争议焦点"
  
  # 🔴 组织成员关系
  includes:
    from: TrialOrganization
    to: Judge
    cardinality: one_to_many
    description: "审判组织包含法官（新增核心关系）"
  
  # 🔴 指导性案例关系
  guides:
    from: GuidingCase # 修正：指导性案例指导案由
    to: CaseType
    cardinality: one_to_many
    description: "指导性案例指导案由适用（新增核心关系）"
  
  # 🔴 补全：核心司法关系
  belongs_to: # 法条隶属于法律
    from: LegalProvision
    to: Law
    cardinality: many_to_one
    description: "法律条文归属法律"
  
  appeals_to: # 案件上诉
    from: CourtCase
    to: CourtCase
    cardinality: one_to_one
    acyclic: true
    description: "二审案件上诉一审案件"
  
  retries_from: # 案件再审
    from: CourtCase
    to: CourtCase
    cardinality: one_to_one
    acyclic: true
    description: "再审案件源自原审案件"
  
  includes_clerk: # 审判组织含书记员
    from: TrialOrganization
    to: Clerk
    cardinality: one_to_one
    description: "审判组织配备书记员"
  
  judgment_cites: # 裁判结果引用法条
    from: JudgmentResult
    to: LegalProvision
    cardinality: many_to_many
    description: "裁判结果依据法律条文"
  
  employs: # 检察院雇佣检察官
    from: Procuratorate
    to: Prosecutor
    cardinality: one_to_many
    description: "检察院雇佣检察官"

constraints:
  # 🔴 修正：语法错误、字段存在、引擎兼容
  # 1. 案号正则（修复语法，兼容全类型）
  - type: CourtCase
    rule: "case_number =~ /^\\(\\d{4}\\)[\\u4e00-\\u9fa5]{1,5}\\d+([民刑行执])\\d+第\\d+号$/"
    enforcement: block
    description: "民/刑/行/执案号统一校验"
  
  # 2. 统一社会信用代码校验
  - type: Organization
    rule: "credit_code =~ /^[0-9A-HJ-NPQRTUWXY]{2}\\d{6}[0-9A-HJ-NPQRTUWXY]{10}$/"
    enforcement: block
    description: "统一社会信用代码18位校验"
  
  # 3. 时序约束（修复语法）
  - type: CourtCase
    rule: "filing_date < judgment_date AND judgment_date < effective_date"
    enforcement: block
    description: "立案<裁判<生效"
  
  # 4. 审级约束（修复字段存在）
  - type: CourtCase
    rule: "trial_level == 'second_instance' IMPLIES first_instance_case_number IS NOT NULL"
    enforcement: block
    description: "二审必须有一审案号"
  
  # 5. 文书类型约束
  - type: LegalDocument
    rule: "(document_type == 'ruling' IMPLIES judgment_result_id IS NULL) AND (document_type == 'mediation' IMPLIES appeal_allowed == false)"
    enforcement: block
    description: "裁定书无裁判结果、调解书不得上诉"
  
  # 6. 证据约束（法定规则）
  - type: Evidence
    rule: "admission_status == 'admitted' IMPLIES examination_status == 'examined'"
    enforcement: block
    description: "证据未经质证不得采信"
  
  # 7. 脱敏正则（修复转义错误）
  - global: true
    rule: "id_number =~ /^\\d{6}\\*{8}\\d{4}$/; phone =~ /^\\d{3}\\*{4}\\d{4}$/; address =~ /^[\\u4e00-\\u9fa5]{2,4}省[\\u4e00-\\u9fa5]{2,4}市.*\\*{4}$/"
    enforcement: block
    description: "个保法分级脱敏"
  
  # 8. 法条有效性（兼容Neo4j语法）
  - type: CourtCase
    rule: "NOT EXISTS (cites WHERE status != 'effective')"
    enforcement: block
    description: "仅引用有效法条"
  
  # 9. 最高院判决不得上诉
  - type: CourtCase
    rule: "court_level == 'supreme' IMPLIES trial_level != 'second_instance'"
    enforcement: block
    description: "最高院判决不得上诉"

# 🔴 工程化落地（可直接部署）
engineering:
  unique_identifier_pattern: "^[a-z]+_[0-9]{4}_[a-z_]+$" # 如：law_2020_civil_code_001
  foreign_key_mapping: # 具体外键映射，引擎直接执行
    - law_id: Law.id
    - case_type_id: CaseType.id
    - court_id: Court.id
    - procuratorate_id: Procuratorate.id
    - judge_id: Judge.id
    - attorney_id: Attorney.id
    - clerk_id: Clerk.id
    - prosecutor_id: Prosecutor.id
  entity_disambiguation: # 补全字段，可自动化执行
    Court: "name + district.code"
    Person: "name + id_number(desensitized) + case_number"
    Organization: "name + credit_code"
  data_version: "2026.01" # 正式版本
  incremental_update: true # 支持新法/新案件增量更新
  graph_storage: # Neo4j存储标签，直接对接
    node_prefix: "LEGAL_"
    relation_prefix: "REL_"
  audit_logging: true
  access_control: true