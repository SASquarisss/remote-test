# 生产级法律本体 - 工业标准实现
# 严格按照司法实务和本体工程原则重构

types:
  # 🔴 顶层父类：显性继承 + 全局通用属性
  LegalNorm:
    required: [id, name, source, desensitize, create_time, update_time]
    description: "法律规范顶层类"
  
  JudicialEntity:
    required: [id, source, desensitize, create_time, update_time]
    description: "司法实体顶层类"
  
  LegalSubject:
    required: [id, name, source, desensitize, create_time, update_time]
    description: "法律主体顶层类"

  # 🔴 规范层：显性 is-a 继承，仅保留专属属性
  Law:
    is_a: LegalNorm
    required: [title, law_level, document_number, status, enactment_date, effective_date]
    optional: [legislative_purpose, repealed_date]
    law_level_enum: [constitution, basic_law, ordinary_law, administrative_regulation, local_regulation, self_governing_regulation, military_regulation]
    status_enum: [effective, amended, repealed]
    description: "法律"
  
  LegalProvision:
    is_a: LegalNorm
    required: [law_id, article, paragraph, item, content, status]
    optional: [legislative_purpose, related_provisions]
    status_enum: [effective, amended, repealed]
    description: "法律条文"
  
  CaseType:
    is_a: LegalNorm
    required: [code, name, category, level1, level2]
    optional: [description]
    category_enum: [civil, criminal, administrative, ip]
    description: "案件类型（对齐最高法《民事案件案由规定》）"

  # 🔴 主体层：正确继承 + 角色分离
  Person:
    is_a: LegalSubject
    required: [name, type]
    optional: [gender, birth_date, nationality, id_number, address, phone]
    type_enum: [natural_person, legal_person]
    description: "自然人/法人"
  
  Judge:
    is_a: Person
    required: [court_id, position]
    optional: [judge_level, appointment_date]
    description: "法官（自然人子类）"
  
  Attorney:
    is_a: Person
    required: [license_number, law_firm_id]
    optional: [specialization, bar_association]
    description: "律师（自然人子类）"
  
  Clerk:
    is_a: Person
    required: [court_id]
    optional: [position]
    description: "书记员（自然人子类）"
  
  Organization:
    is_a: LegalSubject
    required: [org_type, credit_code]
    optional: [legal_representative, registered_capital, business_scope]
    org_type_enum: [court, procuratorate, law_firm, expert_institution, company, government_agency]
    description: "组织机构"
  
  Court:
    is_a: Organization
    required: [court_level, district]
    optional: [chambers, jurisdiction_area]
    court_level_enum: [supreme, high, intermediate, basic, special]
    description: "法院（机构子类）"
  
  Procuratorate:
    is_a: Organization
    required: [procuratorate_level, district]
    optional: [departments]
    procuratorate_level_enum: [supreme, provincial, municipal, district]
    description: "检察院（机构子类）"
  
  LawFirm:
    is_a: Organization
    required: [firm_type, license_number]
    optional: [partners, practice_areas]
    firm_type_enum: [partnership, limited_liability, sole_practitioner]
    description: "律师事务所（机构子类）"
  
  ExpertInstitution:
    is_a: Organization
    required: [expertise_fields, accreditation_number]
    optional: [accreditation_authority, validity_period]
    description: "鉴定机构（机构子类，修复命名错误）"
  
  District:
    is_a: JudicialEntity
    required: [name, code]
    optional: [administrative_level, parent_district]
    description: "辖区（新增实体）"
  
  LegalRole:
    is_a: JudicialEntity
    required: [name, code]
    optional: [description, permissions]
    role_enum: [plaintiff, defendant, third_party, witness, agent, expert_witness, interpreter]
    description: "法律角色（新增实体，分离角色与主体）"

  # 🔴 案件层
  CourtCase:
    is_a: JudicialEntity
    required: [case_number, case_type_id, filing_date, court_id, status]
    optional: [claim_amount, cause_of_action, summary, related_cases]
    description: "法院案件"
  
  TrialOrganization:
    is_a: JudicialEntity
    required: [organization_type, case_id]
    optional: [members, presiding_judge_id]
    organization_type_enum: [sole_judge, collegiate_bench, judicial_committee]
    description: "审判组织"
  
  JudgmentResult:
    is_a: JudicialEntity
    required: [case_id, result_type, judgment_date, effective_date]
    optional: [sentence_term, compensation_amount, reasoning]
    result_type_enum: [guilty, not_guilty, liable, not_liable, dismissed, withdrawn]
    description: "裁判结果"
  
  ExecutionInfo:
    is_a: JudicialEntity
    required: [case_id, execution_status, execution_court_id]
    optional: [execution_amount, execution_measures, completion_date]
    execution_status_enum: [pending, in_progress, completed, terminated]
    description: "执行信息"
  
  LegalDocument:
    is_a: JudicialEntity
    required: [document_type, case_id, creation_date, signed_by_judge_id]
    optional: [document_number, content_hash, file_path]
    document_type_enum: [judgment, ruling, mediation, order, notice]
    description: "法律文书"
  
  Evidence:
    is_a: JudicialEntity
    required: [evidence_type, case_id, submitter_id, submission_date]
    optional: [description, file_path, chain_of_custody]
    evidence_type_enum: [document, physical, digital, testimony, expert_opinion]
    probative_force_enum: [valid, invalid]  # 修复：仅保留法定证明力分类
    description: "证据"

relations:
  # 🔴 核心关系：语义修正 + 基数修正 + 新增缺失关系
  
  # 案件审理关系
  tried_by:
    from: CourtCase
    to: TrialOrganization
    cardinality: one_to_one
    description: "案件由审判组织审理（修正语义）"
  
  presides_over:
    from: Judge
    to: TrialOrganization
    cardinality: one_to_many
    description: "法官主持审判组织"
  
  undertakes:
    from: Judge
    to: CourtCase
    cardinality: one_to_many
    description: "法官承办案件（修正语义）"
  
  # 主体-角色关系（核心修复）
  plays_role:
    from: LegalSubject
    to: LegalRole
    cardinality: many_to_many
    attributes: [case_id, start_time, end_time, role_description]
    description: "主体在案件中担任角色（新增关系属性）"
  
  # 管辖关系
  has_jurisdiction_over:
    from: Court
    to: District
    cardinality: one_to_one
    description: "法院管辖辖区（修正方向）"
  
  # 公诉关系
  prosecutes:
    from: Procuratorate
    to: CourtCase
    cardinality: one_to_many
    description: "检察院公诉案件（新增核心关系）"
  
  # 执行关系
  based_on:
    from: ExecutionInfo
    to: JudgmentResult
    cardinality: one_to_one
    description: "执行依据裁判结果（新增核心关系）"
  
  # 文书签署关系
  signed_by:
    from: LegalDocument
    to: Judge
    cardinality: many_to_one
    description: "文书由法官签署（新增核心关系）"
  
  # 案由关系
  has_case_type:
    from: CourtCase
    to: CaseType
    cardinality: one_to_many  # 修正：一个案件可有多个案由
    description: "案件具有案由类型"
  
  # 法律适用关系
  cites:
    from: CourtCase
    to: LegalProvision
    cardinality: many_to_many
    attributes: [citation_position, citation_purpose, context]
    description: "案件引用法律条文（新增关系属性）"
  
  # 代理关系
  represents:
    from: Attorney
    to: LegalSubject
    cardinality: many_to_many
    attributes: [case_id, authorization_scope, authorization_period_start, authorization_period_end]
    description: "律师代理当事人（新增关系属性）"
  
  # 证据关系
  submitted_for:
    from: Evidence
    to: CourtCase
    cardinality: many_to_one
    description: "证据提交给案件"
  
  proves_fact:
    from: Evidence
    to: JudicialEntity  # 可证明案件事实、争议焦点等
    cardinality: many_to_many
    description: "证据证明司法实体（修正语义，不直接证明构成要件）"
  
  # 组织成员关系
  includes:
    from: TrialOrganization
    to: Judge
    cardinality: one_to_many
    description: "审判组织包含法官（新增核心关系）"
  
  # 指导性案例关系
  guides:
    from: CourtCase  # 指导性案例
    to: CaseType
    cardinality: one_to_many
    description: "指导性案例指导案由适用（新增核心关系）"

constraints:
  # 🔴 机器可执行约束（生产级必备）
  
  # 官方案号正则约束
  - type: CourtCase
    rule: "case_number =~ /^\\(\\d{4}\\)[\\u4e00-\\u9fa5]{1,5}\\d+民\\d+第\\d+号$/ || case_number =~ /^\\(\\d{4}\\)[\\u4e00-\\u9fa5]{1,5}\\d+刑\\d+第\\d+号$/ || case_number =~ /^\\(\\d{4}\\)[\\u4e00-\\u9fa5]{1,5}\\d+行\\d+第\\d+号$/"
    enforcement: block
    description: "案号必须符合官方格式"
  
  # 统一社会信用代码校验
  - type: Organization
    rule: "credit_code =~ /^[0-9A-HJ-NPQRTUWXY]{2}\\d{6}[0-9A-HJ-NPQRTUWXY]{10}$/"
    enforcement: block
    description: "统一社会信用代码18位校验"
  
  # 时序强约束
  - type: CourtCase
    rule: "filing_date < judgment_date AND judgment_date < effective_date"
    enforcement: block
    description: "立案日期 < 裁判日期 < 生效日期"
  
  # 审级约束
  - type: CourtCase
    rule: "case_type.category == 'appeal' IMPLIES EXISTS(first_instance_case_number)"
    enforcement: block
    description: "二审案件必须有一审案号"
  
  # 文书类型约束
  - type: LegalDocument
    rule: "(document_type == 'ruling' IMPLIES judgment_result_id IS NULL) AND (document_type == 'mediation' IMPLIES appeal_allowed == false)"
    enforcement: block
    description: "裁定书无裁判结果、调解书不得上诉"
  
  # 法条有效性约束
  - type: CourtCase
    rule: "FORALL cited_provision IN cites: cited_provision.status == 'effective'"
    enforcement: block
    description: "仅可引用有效法条"
  
  # 全局脱敏约束（个保法合规）
  - global: true
    rule: "id_number: regexp=^\\d{6}\\*{8}\\d{4}$; phone: regexp=^\\d{3}\\*{4}\\d{4}$; address: regexp=^[\\u4e00-\\u9fa5]{2,4}省[\\u4e00-\\u9fa5]{2,4}市.*\\*{4}$"
    enforcement: block
    description: "敏感字段分级脱敏规则"

# 🔴 工程化增强配置
engineering:
  unique_identifier_pattern: "uuid + business_code"  # 如: law_2020_civil_code_001
  foreign_key_constraints: true  # 所有*_id强制外键约束
  field_mapping:
    standard: "中国裁判文书网138个标准字段"
    version: "2026"
  entity_disambiguation:
    court: "name + district"
    person: "name + desensitized_id + case_number"
  data_versioning: true
  audit_logging: true
  access_control: true